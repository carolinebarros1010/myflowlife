<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro MyFlowLife</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #335953;
      --terracota: #CC6A5A;
      --pessego: #EFBDA6;
      --fundo: linear-gradient(160deg, var(--verde), var(--terracota), var(--pessego));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--fundo);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1rem;
    }

    .container {
      background: rgba(0,0,0,0.35);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      color: #333;
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      background: linear-gradient(90deg, var(--terracota), var(--pessego));
      border: none;
      color: #1E2B26;
      padding: 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .logo {
      width: 160px;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .msg {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      text-align: center;
      opacity: 0.8;
    }

    /* ====== Responsividade ====== */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .container {
        padding: 1.5rem;
      }

      h2 {
        font-size: 1.3rem;
      }

      .logo {
        width: 120px;
      }

      input, button {
        font-size: 0.95rem;
        padding: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <img src="../ebooks/logomyflowlife.png" class="logo" alt="MyFlowLife Logo">
  <div class="container">
    <h2>Cadastre-se para continuar</h2>
    <p class="msg" id="mensagem">Estamos preparando sua experiência MyFlowLife...</p>
    <form id="formCadastro">
      <input type="text" id="nome" placeholder="Nome completo" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="tel" id="telefone" placeholder="Telefone (WhatsApp)" required>
      <button type="submit">Continuar</button>
    </form>
  </div>

  <footer>© MyFlowLife — Energia em Movimento</footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const origem = params.get('origem');
    const msg = document.getElementById('mensagem');

    if (origem?.includes('femflow')) msg.textContent = "Complete seu cadastro para acessar o FemFlow.";
    else if (origem?.includes('maleflow')) msg.textContent = "Complete seu cadastro para continuar no MaleFlow.";
    else if (origem?.includes('ebook')) msg.textContent = "Complete seu cadastro para baixar seu eBook gratuito.";
    else msg.textContent = "Faça seu cadastro para acessar os conteúdos MyFlowLife.";

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const telefone = document.getElementById('telefone').value;

      try {
        await fetch("https://script.google.com/macros/s/AKfycbzoLP8uwomZSPBLo6mmcD71POBA7GByedp5wHtdZpvzYyxeB_P-F7BsUYIC1hVsBg9f/exec", {
          method: "POST",
          body: JSON.stringify({ nome, email, telefone, origem })
        });

        if (origem === 'femflow-premium' || origem === 'maleflow-premium') {
          window.location.href = 'https://automacao.chatideal.com.br/meu-typebot-z4uzbgk';
        } else if (origem === 'femflow-strong' || origem === 'maleflow-strong') {
          window.location.href = 'https://pay.hotmart.com/T102397575W';
        } else if (origem === 'ebook-epoc') {
          window.location.href = '../downloads/efeito_epoc.pdf';
        } else if (origem === 'ebook-nutricao') {
          window.location.href = '../downloads/nutricao_ciclo_hormonal.pdf';
        } else {
          window.location.href = 'https://chat.whatsapp.com/FPNeAa1OvaZEThWBKdYOQZ?mode=wwc';
        }
      } catch (error) {
        alert("Erro ao enviar cadastro. Tente novamente mais tarde.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
