<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cabine Verde - Gestão e Histórico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        :root { 
            --primary-verde: #1b5e20; 
            --secondary-verde: #2e7d32; 
            --danger: #d32f2f; 
            --edit: #0277bd;
            --bg: #f4f7f6; 
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: #333; scroll-behavior: smooth; }
        
        .main-header { 
            background: linear-gradient(135deg, var(--primary-verde) 0%, #0a330c 100%); 
            color: white; padding: 40px 20px; border-radius: 12px; text-align: center; 
            margin-bottom: 25px; border-bottom: 6px solid #fbc02d; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .main-header h1 { margin: 0 0 10px 0; font-size: 2.2em; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        .main-header p { margin: 0; font-size: 1em; letter-spacing: 1.5px; opacity: 0.9; font-weight: bold; text-transform: uppercase; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stats-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-around; }
        .stat-val { font-size: 2.2em; font-weight: bold; display: block; line-height: 1; }
        .stat-lab { font-size: 0.7em; text-transform: uppercase; color: #666; font-weight: bold; }

        .form-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; border-top: 5px solid var(--secondary-verde); }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .section-header { 
            grid-column: span 4; background: #e8f5e9; color: var(--secondary-verde); 
            padding: 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; 
            font-size: 0.85em; border-left: 6px solid var(--secondary-verde); margin-top: 15px;
        }
        
        label { font-size: 0.75em; font-weight: bold; color: #444; display: block; margin-bottom: 4px; line-height: 1.3; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 0.9em; box-sizing: border-box; }
        .full { grid-column: span 4; }
        .double { grid-column: span 2; }
        .talao-destaque { background: #fffde7; border: 1px solid #fbc02d; font-weight: bold; }

        .btn-submit { background: var(--secondary-verde); color: white; border: none; padding: 20px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 1.1em; text-transform: uppercase; transition: 0.3s; }
        .btn-submit.mode-edit { background: var(--edit); }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-top: 8px solid var(--danger); transition: 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-photo { width: 100%; height: 320px; background: #222; object-fit: contain; }
        .card-body { padding: 20px; font-size: 0.85em; }
        
        #search-bar { width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 8px; border: 2px solid var(--secondary-verde); font-size: 1.1em; box-sizing: border-box; }
        .btn-action { border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; text-transform: uppercase; }
        .btn-word { background: #2b5797; color: white; }
        .btn-quest { background: #43a047; color: white; }
        .btn-loc { background: #ff8f00; color: white; }
        .btn-edit-card { background: var(--edit); color: white; }
        .btn-delete { background: #616161; color: white; margin-top: 15px; font-size: 0.7em; }

        .backup-zone { background: #e8f5e9; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 2px dashed var(--secondary-verde); display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .condicional { display: none; }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>Cabine Verde - Inteligência e Busca</h1>
        <p>SISTEMA DE MONITORAMENTO INTEGRADO DE PESSOAS DESAPARECIDAS</p>
    </header>

    <div class="dashboard">
        <div class="stats-card">
            <div style="text-align: center;"><span class="stat-lab">🚨 Em Busca</span><span id="countDesap" class="stat-val" style="color:var(--danger)">0</span></div>
            <div style="text-align: center;"><span class="stat-lab">✅ Resolvidos</span><span id="countLoc" class="stat-val" style="color:var(--secondary-verde)">0</span></div>
            <div style="width: 120px;"><canvas id="chartStatus"></canvas></div>
        </div>
        <div class="backup-zone">
            <span style="font-weight: bold; color: var(--primary-verde);">GERENCIAMENTO DA BASE E RELATÓRIOS GERAIS:</span>
            <div class="btn-group">
                <button onclick="exportarBackup()" style="background:#1976d2; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">GERAR BACKUP</button>
                <button onclick="document.getElementById('fileIn').click()" style="background:#ffa000; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">RESTAURAR BASE</button>
                <button onclick="gerarRelatorioMassa('desap')" style="background:var(--danger); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">📄 RELATÓRIO TODOS DESAPARECIDOS</button>
                <button onclick="gerarRelatorioMassa('loc')" style="background:var(--secondary-verde); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;">📄 RELATÓRIO TODOS LOCALIZADOS</button>
            </div>
            <input type="file" id="fileIn" style="display:none" onchange="importarBackup(event)">
        </div>
    </div>

    <div class="form-container">
        <form id="masterForm">
            <input type="hidden" id="edit_id" value="">
            <div class="form-grid">
                <div class="section-header">📑 Registro de Ocorrência</div>
                <div class="double">
                    <label>TALÃO DE OCORRÊNCIA</label>
                    <input type="text" id="talao" class="talao-destaque" placeholder="Nº do Talão" required>
                </div>
                <div class="double"></div>

                <div class="section-header">🔹 Questionário de Identificação Padronizado</div>
                <div class="double"><label>01. Qual o nome da pessoa desaparecida?</label><input type="text" id="q1" required></div>
                <div><label>02. Qual o sexo ou gênero?</label><input type="text" id="q2"></div>
                <div><label>03. Qual a idade?</label><input type="number" id="q3" oninput="verificarFiltrosIdade()"></div>
                
                <div class="double"><label>04. Você tem os dados de identificação da pessoa desaparecida (CPF, RG, CNH, nome de mãe e data de nascimento)?</label><textarea id="q4" rows="2"></textarea></div>
                <div class="double"><label>05. Essa pessoa estava a pé, de carro ou algum outro meio de transporte?</label><input type="text" id="q5"></div>
                
                <div class="double"><label>06. Quais as características desse meio de transporte (qual a placa, modelo, cor, sinais de batida, adesivo entre outros)?</label><input type="text" id="q6"></div>
                <div class="double"><label>07. Qual são as características físicas (cor da pele, altura, gordo, magro, calvo, cor de cabelo entre outros)</label><textarea id="q7" rows="2"></textarea></div>
                
                <div class="double"><label>08. Qual foi o dia e horário que a pessoa foi vista pela última vez?</label><input type="text" id="q8"></div>
                <div class="double"><label>09. Onde ela estava da última vez que foi vista?</label><input type="text" id="q9"></div>
                
                <div class="double"><label>10. Qual a roupa dela da última vez que foi vista?</label><input type="text" id="q10"></div>
                <div class="double"><label>11. Essa pessoa é seu parente ou amigo?</label><input type="text" id="q11"></div>
                
                <div class="double"><label>12. A pessoa quando desapareceu estava acompanhada? Qual o contexto?</label><input type="text" id="q12"></div>
                <div class="double"><label>13. Onde ela estuda ou trabalha?</label><input type="text" id="q13"></div>
                
                <div class="double"><label>14. Essa pessoa tem um cuidador ou um responsável?</label><input type="text" id="q14"></div>
                
                <div class="double condicional" id="box_q15">
                    <label>15. Ha guarda compartilhada para essa criança ou adolescente desaparecido?</label>
                    <input type="text" id="q15">
                </div>

                <div class="double"><label>16. Essa pessoa chegou a comentar alguma vez que pretendia fugir ou desaparecer?</label><input type="text" id="q16"></div>
                <div class="double"><label>17. Ela mencionou algum lugar para onde queria fugir ou desaparecer?</label><input type="text" id="q17"></div>
                <div class="double"><label>18. Essa pessoa teve algum tipo de desavença que possa ter feito ela fugir e não queira ser encontrada?</label><input type="text" id="q18"></div>
                <div class="double"><label>19. Essa pessoa já desapareceu alguma vez? Se sim, como e onde foi encontrada?</label><input type="text" id="q19"></div>
                
                <div class="double condicional" id="box_q40">
                    <label>20. Essa pessoa possui alguma doença psicológica? (Ex: TEA - Transtorno do Espectro Autista, entre outros)</label>
                    <input type="text" id="q40">
                </div>
                <div class="double condicional" id="box_q20">
                    <label>20. Essa pessoa possui alguma doença psicológica? (Ex: Alzheimer, TEA entre outros)</label>
                    <input type="text" id="q20">
                </div>

                <div class="double"><label>21. Essa pessoa possui algum problema físico? (ex: manca, não enxerga, não ouve, não fala entre outros).</label><input type="text" id="q21"></div>
                
                <div class="double condicional" id="box_q22">
                    <label>22. Essa pessoa faz uso de droga? Qual droga?</label>
                    <input type="text" id="q22">
                </div>

                <div class="double"><label>23. Essa pessoa possui alguma cicatriz, tatuagem ou outro sinal característico marcante?</label><input type="text" id="q23"></div>
                <div class="double"><label>24. Essa pessoa usava alguma bolsa, mochila, boné, joia entre outros?</label><input type="text" id="q24"></div>
                
                <div class="double"><label>25. Essa pessoa está com celular ou tablet? Sabe informar o número?</label><input type="text" id="q25"></div>
                <div class="double"><label>26. Alguém já tentou contato? Qual foi o resultado?</label><input type="text" id="q26"></div>
                
                <div class="double"><label>27. Alguém já tentou procurar essa pessoa desaparecida?</label><input type="text" id="q27"></div>
                <div class="double"><label>28. Já procurou em todos os cômodos da casa ou do apartamento?</label><input type="text" id="q29"></div>
                
                <div class="double"><label>29. Essa pessoa tem alguma rotina fixa? Qual, onde e em qual horário?</label><input type="text" id="q30"></div>
                <div class="double"><label>30. Quais os locais que essa pessoa costuma frequentar?</label><input type="text" id="q31"></div>
                
                <div class="double"><label>31. Quais os contatos da(s) pessoa(s) que procurara(m)?</label><input type="text" id="q32"></div>
                <div class="double"><label>32. Há quanto tempo essa pessoa está desaparecida?</label><input type="text" id="q33"></div>
                
                <div class="double"><label>33. Locais de vínculo emocional (antigo trabalho, antiga casa, escola)?</label><textarea id="q34" rows="2"></textarea></div>
                <div class="double"><label>34. Câmeras de monitoramento na casa?</label><input type="text" id="q35"></div>
                
                <div class="double"><label>35. Câmeras no último lugar vista?</label><input type="text" id="q36"></div>
                <div class="double"><label>36. Acredita em sequestro?</label><input type="text" id="q37"></div>
                
                <div class="double"><label>37. Possui foto digital?</label><input type="text" id="q38"></div>
                <div class="double"><label>38. Registro em Delegacia Local ou Virtual?</label><input type="text" id="q39"></div>
                
                <div class="double"><label>39. Qual o Município do desaparecimento?</label><input type="text" id="q_municipio" required></div>
                <div class="double"><label>40. Foto da Pessoa (Obrigatório)</label><input type="file" id="foto" accept="image/*"></div>

                <div class="section-header">🛡️ Validação Técnica - Cabine Verde</div>
                <div class="double"><label>Responsável pelo Registro</label><input type="text" id="cv_resp" required></div>
                <div><label>Data Registro</label><input type="date" id="cv_data" required></div>
                <div><label>Equipe</label><input type="text" id="cv_equipe" required></div>
                <div class="full"><label>Observações Cabine Verde</label><input type="text" id="cv_obs"></div>
            </div>
            <button type="submit" id="btnMain" class="btn-submit">FINALIZAR CADASTRO</button>
        </form>
    </div>

    <input type="text" id="search-bar" placeholder="🔍 Pesquisar por Nome, Talão, Documento ou Município..." onkeyup="render()">
    <div id="card-list" class="card-grid"></div>

    <script>
        const DB_KEY = 'cabine_verde_vFinal_db';
        let chartS;

        const PERGUNTAS_MAP = {
            q1: "Nome", q2: "Gênero", q3: "Idade", q4: "Documentos/Mãe", q5: "Transporte",
            q6: "Detalhes Transporte", q7: "Físico", q8: "Última vez visto (Data/Hora)", q9: "Último local",
            q10: "Roupas", q11: "Parente/Amigo", q12: "Acompanhado?", q13: "Trabalho/Estudo",
            q14: "Cuidador", q15: "Guarda", q16: "Comentou fuga?", q17: "Destino citado?",
            q18: "Desavença?", q19: "Já sumiu antes?", q20: "Psicológico (Idoso)", q40: "Psicológico (Geral)",
            q21: "Problema Físico", q22: "Drogas", q23: "Cicatriz/Tatuagem", q24: "Acessórios",
            q25: "Celular/Tablet", q26: "Contatos feitos?", q27: "Buscas iniciadas?", q29: "Cômodos verificados?",
            q30: "Rotina", q31: "Locais freqüentes", q32: "Contatos de quem busca", q33: "Tempo sumido",
            q34: "Vínculo emocional", q35: "Câmeras Casa", q36: "Câmeras Local", q37: "Sequestro?",
            q38: "Foto Digital?", q39: "Registro Delegacia?"
        };

        function formatarDataBR(dataISO) {
            if(!dataISO) return "---";
            const partes = dataISO.split("-");
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataISO;
        }

        function verificarFiltrosIdade() {
            const idade = parseInt(document.getElementById('q3').value);
            const boxDrogas = document.getElementById('box_q22'), boxIdoso = document.getElementById('box_q20'), boxGeral = document.getElementById('box_q40'), boxGuarda = document.getElementById('box_q15');
            if (isNaN(idade)) { [boxDrogas, boxIdoso, boxGeral, boxGuarda].forEach(b => b.style.display = 'none'); return; }
            boxGuarda.style.display = (idade < 18) ? 'block' : 'none';
            boxDrogas.style.display = (idade >= 10) ? 'block' : 'none';
            if (idade >= 60) { boxIdoso.style.display = 'block'; boxGeral.style.display = 'none'; } 
            else { boxIdoso.style.display = 'none'; boxGeral.style.display = 'block'; }
        }

        document.getElementById('masterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit_id').value;
            const f = document.getElementById('foto').files[0];
            const processar = (imgBase64 = null) => {
                let db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
                const getDados = () => {
                    let r = { q_municipio: document.getElementById('q_municipio').value };
                    for(let i=1; i<=40; i++) { const el = document.getElementById('q'+i); if(el) r['q'+i] = el.value; }
                    return r;
                };
                if(editId) {
                    const idx = db.findIndex(x => String(x.id) === String(editId));
                    db[idx].talao = document.getElementById('talao').value;
                    if(imgBase64) db[idx].foto = imgBase64;
                    db[idx].cv = { resp: document.getElementById('cv_resp').value, data: document.getElementById('cv_data').value, equipe: document.getElementById('cv_equipe').value, obs: document.getElementById('cv_obs').value };
                    db[idx].respostas = getDados();
                } else {
                    if(!imgBase64) { alert("Foto obrigatória!"); return; }
                    db.push({ id: Date.now(), status: 'desap', talao: document.getElementById('talao').value, foto: imgBase64, respostas: getDados(), cv: { resp: document.getElementById('cv_resp').value, data: document.getElementById('cv_data').value, equipe: document.getElementById('cv_equipe').value, obs: document.getElementById('cv_obs').value } });
                }
                localStorage.setItem(DB_KEY, JSON.stringify(db)); cancelarEdicao(); update();
            };
            if(f) { const r = new FileReader(); r.onload = () => processar(r.result); r.readAsDataURL(f); } else { processar(); }
        });

        function prepararEdicao(id) {
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const i = db.find(x => String(x.id) === String(id));
            document.getElementById('edit_id').value = i.id;
            document.getElementById('talao').value = i.talao;
            document.getElementById('cv_resp').value = i.cv.resp;
           document.getElementById('cv_data').value = i.cv.data;
            document.getElementById('cv_equipe').value = i.cv.equipe;
            document.getElementById('cv_obs').value = i.cv.obs;
            document.getElementById('q_municipio').value = i.respostas.q_municipio;
            for(let q=1; q<=40; q++) { const el = document.getElementById('q'+q); if(el) el.value = i.respostas['q'+q] || ''; }
            verificarFiltrosIdade();
            document.getElementById('btnMain').innerText = "ATUALIZAR REGISTRO";
            document.getElementById('btnMain').classList.add('mode-edit');
            window.scrollTo(0,0);
        }

        function cancelarEdicao() {
            document.getElementById('masterForm').reset();
            document.getElementById('edit_id').value = "";
            document.getElementById('btnMain').innerText = "FINALIZAR CADASTRO";
            document.getElementById('btnMain').classList.remove('mode-edit');
            verificarFiltrosIdade();
        }

        async function exportarQuestionarioWord(id) {
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const i = db.find(x => String(x.id) === String(id));
            if(!i) return;
            const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;
            const paragrafosQuest = [];
            Object.keys(PERGUNTAS_MAP).forEach((key) => {
                const resposta = i.respostas[key];
                if (resposta && resposta.trim() !== "") {
                    paragrafosQuest.push(new Paragraph({ spacing: { before: 120 }, children: [new TextRun({ text: `${PERGUNTAS_MAP[key]}:`, bold: true, size: 22 }), new TextRun({ text: ` ${resposta}`, size: 22 })] }));
                }
            });
            const doc = new Document({ sections: [{ children: [new Paragraph({ text: "CABINE VERDE - QUESTIONÁRIO COMPLETO", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }), new Paragraph({ text: `NOME: ${i.respostas.q1.toUpperCase()} | TALÃO: ${i.talao}`, alignment: AlignmentType.CENTER, spacing: { after: 300 } }), ...paragrafosQuest] }] });
            Packer.toBlob(doc).then(blob => saveAs(blob, `QUEST_COMPLETO_${i.respostas.q1}.docx`));
        }

        async function gerarRelatorio(id) {
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const i = db.find(x => String(x.id) === String(id));
            const { Document, Packer, Paragraph, TextRun, ImageRun, AlignmentType, HeadingLevel } = docx;
            const imageBuffer = new Uint8Array(atob(i.foto.split(',')[1]).split('').map(c => c.charCodeAt(0)));
           const doc = new Document({
                sections: [{
                    children: [
                        new Paragraph({ text: "CABINE VERDE - RELATÓRIO TÉCNICO", heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }),
                        new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: `TALÃO: ${i.talao}`, bold: true, color: "FF0000", size: 32 })] }),
                        new Paragraph({ alignment: AlignmentType.CENTER, spacing:{before:100, after:100}, children: [new TextRun({ text: i.respostas.q1.toUpperCase(), bold: true, size: 28 })] }),
                        new Paragraph({ alignment: AlignmentType.CENTER, children: [new ImageRun({ data: imageBuffer, transformation: { width: 320, height: 350 } })] }),
                        new Paragraph({ text: "DADOS DO DESAPARECIMENTO", heading: HeadingLevel.HEADING_2, spacing: {before: 300} }),
                        new Paragraph({ children: [new TextRun({ text: "Município: ", bold: true }), new TextRun(i.respostas.q_municipio)] }),
                        new Paragraph({ children: [new TextRun({ text: "Características Físicas: ", bold: true }), new TextRun(i.respostas.q7)] }),
                        new Paragraph({ text: "VALIDAÇÃO CABINE VERDE", heading: HeadingLevel.HEADING_2, spacing: {before: 300} }),
                        new Paragraph({ children: [new TextRun({ text: "Responsável: ", bold: true }), new TextRun(i.cv.resp)] }),
                        new Paragraph({ children: [new TextRun({ text: "Equipe: ", bold: true }), new TextRun(i.cv.equipe)] }),
                        new Paragraph({ children: [new TextRun({ text: "Data Registro: ", bold: true }), new TextRun(formatarDataBR(i.cv.data))] }),
                        new Paragraph({ children: [new TextRun({ text: "Observações: ", bold: true }), new TextRun(i.cv.obs || "Nenhuma")] })
                    ]
                }]
            });
            Packer.toBlob(doc).then(blob => saveAs(blob, `RELATORIO_CABINE_${i.respostas.q1}.docx`));
        }

        async function gerarRelatorioMassa(statusFiltro) {
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const lista = db.filter(x => x.status === statusFiltro);
            if(lista.length === 0) { alert("Nenhum registro encontrado para este relatório."); return; }

            const { Document, Packer, Paragraph, TextRun, ImageRun, AlignmentType, HeadingLevel, PageBreak } = docx;
            const conteudo = [
                new Paragraph({ text: `CABINE VERDE - RELATÓRIO GERAL: ${statusFiltro === 'desap' ? 'DESAPARECIDOS' : 'LOCALIZADOS'}`, heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 400 } })
            ];

            lista.forEach((i, index) => {
                const imageBuffer = new Uint8Array(atob(i.foto.split(',')[1]).split('').map(c => c.charCodeAt(0)));
                conteudo.push(
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: `TALÃO: ${i.talao} | ${i.respostas.q1.toUpperCase()}`, bold: true, size: 26 })] }),
                    new Paragraph({ alignment: AlignmentType.CENTER, children: [new ImageRun({ data: imageBuffer, transformation: { width: 200, height: 220 } })] }),
                    new Paragraph({ children: [new TextRun({ text: "Município: ", bold: true }), new TextRun(i.respostas.q_municipio), new TextRun({ text: " | Responsável: ", bold: true }), new TextRun(i.cv.resp)] }),
                    new Paragraph({ children: [new TextRun({ text: "Data Registro: ", bold: true }), new TextRun(formatarDataBR(i.cv.data))] }),
                    new Paragraph({ children: [new TextRun({ text: "Características: ", bold: true }), new TextRun(i.respostas.q7)], spacing: { after: 400 } })
                );
                if(index < lista.length - 1) conteudo.push(new Paragraph({ children: [new PageBreak()] }));
            });

            const doc = new Document({ sections: [{ children: conteudo }] });
            const nomeArquivo = statusFiltro === 'desap' ? 'GERAL_DESAPARECIDOS.docx' : 'GERAL_LOCALIZADOS.docx';
            Packer.toBlob(doc).then(blob => saveAs(blob, nomeArquivo));
        }

        function render() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const cont = document.getElementById('card-list'); cont.innerHTML = '';
            db.filter(x => {
                const match = (x.respostas.q1||"").toLowerCase().includes(query) || (x.talao||"").toLowerCase().includes(query) || (x.respostas.q_municipio||"").toLowerCase().includes(query);
                return query.length > 0 ? match : x.status === 'desap';
            }).forEach(i => {
                const isLoc = i.status === 'loc';
                cont.innerHTML += `
                    <div class="card" style="border-top-color: ${isLoc ? 'var(--secondary-verde)' : 'var(--danger)'}">
                        <img src="${i.foto}" class="card-photo">
                        <div class="card-body">
                            <div style="background:#fffde7; padding:5px; text-align:center; font-weight:bold; margin-bottom:10px;">${isLoc ? 'LOCALIZADO(A)' : `TALÃO: ${i.talao}`}</div>
                            <h2 style="margin:0; color:var(--primary-verde)">${i.respostas.q1}</h2>
                            <p><b>Município:</b> ${i.respostas.q_municipio} | <b>Idade:</b> ${i.respostas.q3}</p>
                            <button class="btn-action btn-edit-card" onclick="prepararEdicao('${i.id}')">✏️ EDITAR DADOS</button>
                            <button class="btn-action btn-word" onclick="gerarRelatorio('${i.id}')">📄 RELATÓRIO COM FOTO</button>
                            <button class="btn-action btn-quest" onclick="exportarQuestionarioWord('${i.id}')">📝 EXPORTAR TODAS PERGUNTAS</button>
                            ${!isLoc ? `<button class="btn-action btn-loc" onclick="loc('${i.id}')">✅ MARCAR LOCALIZADO</button>` : ''}
                            <button class="btn-action btn-delete" onclick="excluir('${i.id}')">❌ EXCLUIR</button>
                        </div>
                    </div>
                `;
            });
        }

        function loc(id) { if(confirm("Mover para localizados?")) { let db = JSON.parse(localStorage.getItem(DB_KEY)); const idx = db.findIndex(x => String(x.id) === String(id)); db[idx].status = 'loc'; localStorage.setItem(DB_KEY, JSON.stringify(db)); update(); } }
        function excluir(id) { if(confirm("Excluir definitivamente?")) { let db = JSON.parse(localStorage.getItem(DB_KEY)); db = db.filter(x => String(x.id) !== String(id)); localStorage.setItem(DB_KEY, JSON.stringify(db)); update(); } }
        function stats() {
            const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            const d = db.filter(x => x.status === 'desap').length, l = db.filter(x => x.status === 'loc').length;
            document.getElementById('countDesap').innerText = d; document.getElementById('countLoc').innerText = l;
            if(chartS) chartS.destroy();
            chartS = new Chart(document.getElementById('chartStatus'), { type: 'pie', data: { labels: ['Desap', 'Loc'], datasets: [{ data: [d, l], backgroundColor: ['#d32f2f', '#2e7d32'] }] }, options: { plugins: { legend: { display: false } }, maintainAspectRatio: false } });
        }
        function exportarBackup() { saveAs(new Blob([localStorage.getItem(DB_KEY)], {type: 'application/json'}), `BACKUP_CABINE_VERDE.json`); }
        function importarBackup(e) { const r = new FileReader(); r.onload = (ev) => { localStorage.setItem(DB_KEY, ev.target.result); update(); alert("Base restaurada!"); }; r.readAsText(e.target.files[0]); }
        function update() { render(); stats(); }
        window.onload = update;
    </script>
</body>
</html>
