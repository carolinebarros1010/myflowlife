<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Gerador de Corrida • MyFlowLife (V24)</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Libs (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/dayjs.min.js" defer></script>
</head>
<body>
  <!-- Splash animado com som -->
  <div id="splash" class="splash">
    <svg class="splash-logo" viewBox="0 0 120 120" aria-label="MyFlowLife">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0%" stop-color="#14b8a6"/>
          <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="50" fill="none" stroke="url(#g)" stroke-width="6"/>
      <path d="M20,70 C35,35 85,35 100,70" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <p class="splash-txt">carregando…</p>
  </div>

  <!-- Topbar fixa com Premium -->
  <header class="topbar">
    <div class="brand">MyFlowLife</div>
    <nav class="top-actions">
      <button id="btnPremium" class="btn premium">Assinar Premium</button>
    </nav>
  </header>

  <!-- Conteúdo -->
  <main class="container">
    <section class="panel">
      <h1>Gerador de Corrida (microciclo) — V24</h1>
      <p class="muted">Página “estilo Netflix”: cards, grid responsiva, tema auto e PWA.</p>

      <!-- Form -->
      <form id="form" class="grid">
        <label>
          Prova-alvo
          <select id="prova">
            <option value="5">5 km</option>
            <option value="10" selected>10 km</option>
            <option value="21.1">Meia (21,1 km)</option>
            <option value="42.2">Maratona (42,2 km)</option>
          </select>
        </label>

        <label>
          Nível
          <select id="nivel">
            <option value="iniciante">Iniciante (1,5× volume)</option>
            <option value="intermediario" selected>Intermediário (2× volume)</option>
            <option value="avancado">Avançado (2–3× volume)</option>
          </select>
        </label>

        <label>
          Treinos/semana
          <input id="semanal" type="number" min="2" max="10" step="1" value="4">
        </label>

        <label>
          Ritmo base (min:seg/km)
          <input id="ritmoBase" type="text" placeholder="5:30" value="5:30" />
        </label>

        <label>
          Esforço do último treino (1–10)
          <input id="esforco" type="number" min="1" max="10" step="1" value="7">
        </label>

        <label>
          Dias disponíveis (ex.: seg,qua,sex,dom)
          <input id="dias" type="text" value="ter,qui,sab,dom">
        </label>

        <label>
          Início do ciclo (data)
          <input id="inicio" type="date">
        </label>
      </form>

      <!-- Ações -->
      <div class="actions">
        <button id="btnGerar" class="btn primary">Gerar plano da semana</button>
        <button id="btnTestes" class="btn">Rodar testes</button>
        <button id="btnCards" class="btn">Gerar cards</button>
        <button id="btnPDF" class="btn">Exportar PDF</button>
        <button id="btnReset" class="btn danger">Reset</button>
      </div>
    </section>

    <!-- Grid tipo Netflix -->
    <section>
      <h2>Treinos da semana</h2>
      <div id="grid" class="grid-cards"></div>
    </section>

    <!-- Gráfico -->
    <section class="panel">
      <h2>Carga (distância) × dias</h2>
      <canvas id="chart" aria-label="Gráfico de carga semanal"></canvas>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- JS da app -->
  <script src="app.js" defer></script>
</body>
</html>
