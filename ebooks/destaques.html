<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destaques MyFlowLife</title>
  <style>
    :root {
      --texto: #335953;
      --vidro: rgba(255,255,255,0.6);
      --borda: rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Inter', sans-serif;
      color: var(--texto);
      overflow-x: hidden;
    }

    /* ====== FAIXA NETFLIX ====== */
    .faixa-ebooks {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 1rem;
      scrollbar-width: none;
    }
    .faixa-ebooks::-webkit-scrollbar {
      display: none;
    }

    /* ====== CARD DE EBOOK ====== */
    .card {
      flex: 0 0 auto;
      width: 180px;
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(8px);
      border: 1px solid var(--borda);
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s ease forwards;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .meta {
      padding: 0.8rem;
      text-align: center;
    }

    .price {
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .cta {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 0.4rem 0.8rem;
      text-decoration: none;
      color: var(--texto);
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .cta:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    /* ====== ANIMAÇÃO DE ENTRADA ====== */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      60% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Delay progressivo para efeito Netflix */
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }
    .card:nth-child(5) { animation-delay: 0.5s; }
    .card:nth-child(6) { animation-delay: 0.6s; }
    .card:nth-child(7) { animation-delay: 0.7s; }

    /* ====== RESPONSIVO ====== */
    @media (max-width: 600px) {
      .card { width: 140px; }
      .meta { padding: 0.6rem; }
      .price { font-size: 0.85rem; }
      .cta { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
    }
  </style>
</head>

<body>
  <div class="faixa-ebooks" id="destaque">

    <article class="card">
      <div class="cover"><img src="./capahipopressivos.png" alt="Exercícios Hipopressivos"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 19,90</div>
        <a class="cta" href="#" onclick="return goCadastro('https://pay.hotmart.com/N102180089S','hipopressivos','premium')">Comprar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./capafemflow15.png" alt="FemFlow 15 Dias"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 39,90</div>
        <a class="cta" href="#" onclick="return goCadastro('https://pay.hotmart.com/O102103923F','femflow15','premium')">Comprar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./capatpmzem.png" alt="Protocolo Respiração Consciente TPM"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 0,00</div>
        <a class="cta" href="#" onclick="return goCadastro('downloads/protocolo_tpm_zen.pdf','tpmzen','download')">Baixar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./capaaguaequilibrio.png" alt="Guia Essencial Hidratação"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 9,90</div>
        <a class="cta" href="#" onclick="return goCadastro('https://pay.hotmart.com/E102161861P','aguaequilibrio','premium')">Comprar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./capafemflow4semanas.png" alt="FemFlow 4 Semanas"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 99,90</div>
        <a class="cta" href="#" onclick="return goCadastro('https://pay.hotmart.com/T102397575W','femflow4','premium')">Comprar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./capaefeitoEPOC.png" alt="Efeito EPOC"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 0,00</div>
        <a class="cta" href="#" onclick="return goCadastro('downloads/efeito_epoc.pdf','epoc','download')">Baixar</a>
      </div>
    </article>

    <article class="card">
      <div class="cover"><img src="./placeholder.png" alt="Nutrição alinhada com o ciclo hormonal"></div>
      <div class="meta">
        <div class="price"><small>R$</small> 0,00</div>
        <a class="cta" href="#" onclick="return goCadastro('downloads/nutricao_ciclo_hormonal.pdf','nutricao','download')">Baixar</a>
      </div>
    </article>

  </div>

  <script>
    function goCadastro(url, ebook, tipo) {
      localStorage.setItem('ebook', ebook);
      localStorage.setItem('tipo', tipo);
      window.open(url, '_blank');
      return false;
    }
  </script>
</body>
</html>
