<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FemFlow • Anamnese</title>
  <style>
    :root{
      --terracota:#CC6A5A; --pessego:#F4A386; --teal:#335953; --bege:#FBF6F0;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(180deg,#F4E1D7 0%, #EFBDA6 100%);
      font-family: "Lato", system-ui, -apple-system, Arial, sans-serif; color:var(--teal);
      padding:16px;
    }
    .card{
      width:100%; max-width:420px; background:#fff; border-radius:20px; padding:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.12); text-align:center;
    }
    .logo{width:120px; margin:0 auto 10px; display:block}
    h1{font-family:"Playfair Display", serif; color:var(--terracota); font-size:1.5rem; margin:6px 0 2px}
    .sub{font-size:.92rem; opacity:.9; margin:0 0 14px}
    .progress{height:6px; background:#eee; border-radius:6px; overflow:hidden; margin:12px 0 18px}
    .bar{height:6px; width:0; background:var(--terracota); transition:width .3s ease}
    .q-title{font-weight:700; font-size:1.05rem; margin:6px 0 12px}
    .grid{display:grid; gap:12px; grid-template-columns:repeat(2,1fr);}
    .choice{
      border:2px solid rgba(0,0,0,.06); border-radius:16px; padding:10px;
      cursor:pointer; transition:.2s; background:#fff;
    }
    .choice:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
    .choice.sel{border-color:var(--terracota); box-shadow:0 4px 14px rgba(204,106,90,.25)}
    .gif{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; background:#f6f6f6; display:block}
    .lbl{margin-top:8px; font-weight:700}
    .btn{
      margin-top:14px; width:100%; padding:12px 16px; border:0; border-radius:14px;
      background: linear-gradient(135deg,var(--teal), var(--terracota)); color:#fff;
      font-weight:800; letter-spacing:.2px; cursor:pointer; transition:.2s;
    }
    .btn:disabled{opacity:.45; cursor:not-allowed}
    .input-group{margin:10px 0; text-align:left}
    input{
      width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:10px;
      font-size:1rem; color:#335953; font-family:"Lato";
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../assets/logofemflowterracota.png" alt="FemFlow" />
    <h1>Seu perfil FemFlow</h1>
    <p class="sub">Antes de começar, conte um pouquinho sobre você 🌸</p>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div id="stage"></div>
    <button class="btn" id="btnNext" disabled>Próxima</button>
    <p style="font-size:0.9rem;margin-top:12px;opacity:.85;" id="helper"></p>
  </div>

  <script src="scripts/femflow-core.js"></script>
  <script>
  if(typeof FEMFLOW === "undefined"){
    window.FEMFLOW = {
      SCRIPT_URL: "https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec",
      toast: (m)=>alert(m)
    };
  }

  // ---------- perguntas ----------
  let estaTreinando = null;
  const Q = [
    {type:"info", q:"Seu nome completo", field:"nome", placeholder:"Ex: Maria Oliveira"},
    {type:"info", q:"Seu e-mail (para login futuro)", field:"email", placeholder:"Ex: maria@email.com"},
    {type:"info", q:"Seu telefone com DDD", field:"telefone", placeholder:"Ex: (11) 99999-0000"},
    {
      type:"gif-pick",
      q:"Você está treinando atualmente ou está parada?",
      opts:[
        {label:"Estou treinando", gif:"../assets/gifs/treinando.gif", emoji:"💪", v:3, treino:true},
        {label:"Estou parada",   gif:"../assets/gifs/parada.gif",    emoji:"😔", v:1, treino:false}
      ],
      helper:"Isso nos ajuda a ajustar a carga inicial."
    },
    { type:"choice", q:"Você menstrua regularmente?", opts:["Sim","Não"], v:[2,1] },
    { type:"choice", q:"Usa anticoncepcional hormonal?", opts:["Sim","Não"], v:[1,2] },
    { type:"choice", q:"Há quanto tempo treina com regularidade?", opts:["❌ Não treino atualmente","< 3 meses","3–12 meses","> 1 ano"], v:[0,1,2,3] },
    { type:"choice", q:"Quantos dias por semana costuma treinar?", opts:["1–2","3–4","5+"], v:[1,2,3] },
    { type:"choice", q:"Quanto dura sua sessão média?", opts:["< 40 min","40–70 min","> 70 min"], v:[1,2,3] },
    { type:"choice", q:"Faz mobilidade/alongamento regularmente?", opts:["Sim","Não"], v:[2,0] },
    { type:"choice", q:"Como avalia sua força hoje?", opts:["Baixa","Média","Alta"], v:[1,2,3] },
    { type:"choice", q:"Dores menstruais nos últimos ciclos?", opts:["Fortes","Moderadas","Leves/Não"], v:[0,1,2] },
    { type:"choice", q:"Pratica outro esporte além da musculação?", opts:["Não","Ocasionalmente","Com frequência"], v:[1,2,3] }
  ];

  let idx = 0, score = 0, answers = [], currentPicked = null;
  const stage = document.getElementById("stage");
  const bar = document.getElementById("bar");
  const next = document.getElementById("btnNext");
  const helper = document.getElementById("helper");

  function perc(){ return Math.round((idx/Q.length)*100); }
  function setBar(){ bar.style.width = perc()+"%"; }

  function render(){
    setBar();
    next.disabled = true;
    currentPicked = null;
    const item = Q[idx];
    helper.textContent = item.helper || "";
    stage.innerHTML = "";

    // 1️⃣ Etapas de informação pessoal
    if(item.type === "info"){
      const label = document.createElement("div");
      label.className = "q-title";
      label.textContent = item.q;
      const input = document.createElement("input");
      input.type = (item.field === "email") ? "email" : "text";
      input.id = item.field;
      input.placeholder = item.placeholder;
      input.addEventListener("input",()=>{ next.disabled = !input.value.trim(); });
      stage.appendChild(label);
      stage.appendChild(input);
      return;
    }

    // 2️⃣ Etapa GIF
    if(item.type === "gif-pick"){
      const title = document.createElement("div");
      title.className = "q-title";
      title.textContent = item.q;
      const grid = document.createElement("div");
      grid.className = "grid";
      item.opts.forEach(o=>{
        const card = document.createElement("div");
        card.className = "choice";
        const img = document.createElement("img");
        img.className = "gif";
        img.src = o.gif;
        img.onerror = ()=>{ img.replaceWith(Object.assign(document.createElement("div"),{textContent:o.emoji, style:"font-size:64px;"})); };
        const lbl = document.createElement("div");
        lbl.className = "lbl"; lbl.textContent = o.label;
        card.appendChild(img); card.appendChild(lbl);
        card.onclick = ()=>{
          document.querySelectorAll(".choice").forEach(c=>c.classList.remove("sel"));
          card.classList.add("sel");
          currentPicked = {label:o.label,v:o.v};
          estaTreinando = o.treino;
          next.disabled = false;
        };
        grid.appendChild(card);
      });
      stage.appendChild(title); stage.appendChild(grid);
      return;
    }

    // 3️⃣ Etapas de escolha
    const title = document.createElement("div");
    title.className = "q-title";
    title.textContent = item.q;
    const grid = document.createElement("div");
    grid.className = "grid";
    item.opts.forEach((label, i)=>{
      const b = document.createElement("div");
      b.className = "choice";
      b.innerHTML = `<div class="lbl">${label}</div>`;
      b.onclick = ()=>{
        document.querySelectorAll(".choice").forEach(c=>c.classList.remove("sel"));
        b.classList.add("sel");
        currentPicked = {label, v:item.v[i]};
        next.disabled = false;
      };
      grid.appendChild(b);
    });
    stage.appendChild(title); stage.appendChild(grid);

    // se está parada, já marca "não treino" e pula perguntas de frequência/duração
    if(!estaTreinando){
      if(item.q.includes("Há quanto tempo treina")){
        const first = grid.children[0];
        first.classList.add("sel");
        currentPicked = {label:"❌ Não treino atualmente",v:0};
        next.disabled = false;
      }
      if(item.q.includes("Quantos dias") || item.q.includes("Quanto dura")){
        next.click();
        return;
      }
    }
  }

  async function finish(){
    const media = score / Q.length;
    let nivel = "iniciante";
    if(media >= 2.2 && media < 2.7) nivel = "intermediaria";
    if(media >= 2.7) nivel = "avancada";

    const nome = document.getElementById("nome")?.value.trim() || localStorage.getItem("femflow_nome");
    const email = document.getElementById("email")?.value.trim() || localStorage.getItem("femflow_email");
    const telefone = document.getElementById("telefone")?.value.trim() || "";

    if(!nome || !email){
      FEMFLOW.toast("Preencha nome e e-mail para concluir.");
      return;
    }

    const payload = {
      action: "loginOuCadastro",
      nome, email,
      telefone,
      perfil: nivel,
      pontuacao: score,
      anamnese: JSON.stringify(answers)
    };

    try{
      const resp = await fetch(FEMFLOW.SCRIPT_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if(data.status==="ok"||data.status==="created"){
        localStorage.setItem("femflow_nome",nome);
        localStorage.setItem("femflow_email",email);
        FEMFLOW.toast("🌸 Cadastro criado! Faça login para começar.");
        setTimeout(()=>window.location.href="login.html",1400);
      }else FEMFLOW.toast("⚠️ Erro ao cadastrar. Tente novamente.");
    }catch(err){
      console.error(err);
      FEMFLOW.toast("❌ Falha de conexão. Verifique a internet.");
    }
  }

  next.onclick = ()=>{
    const item = Q[idx];
    if(item.type==="info"){
      const input=document.getElementById(item.field);
      const val=input.value.trim();
      if(val){ localStorage.setItem("femflow_"+item.field,val); answers.push(val); }
    }else if(currentPicked){
      score += Number(currentPicked.v||0);
      answers.push(currentPicked.label);
    }
    idx++;
    if(idx<Q.length) render(); else finish();
  };

  render();
  </script>
</body>
</html>
