<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Anamnese • FemFlow Deluxe</title>
  <style>
    :root{--terracota:#cc6a5a;--teal:#335953;--pessego:#efbda6;--bege:#f4e1d7;}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:"Lato",sans-serif;background:linear-gradient(180deg,var(--bege) 0%,var(--pessego) 100%);color:var(--teal);
      padding:16px;overflow-x:hidden;-webkit-font-smoothing:antialiased;
    }
    .card{
      width:100%;max-width:440px;background:rgba(255,255,255,.94);border-radius:24px;padding:1.8rem;
      box-shadow:0 10px 28px rgba(0,0,0,.12);text-align:center;position:relative;overflow:hidden;animation:fadeIn .6s ease;
    }
    .logo{width:120px;margin-bottom:.4rem}
    h1{font-family:"Playfair Display",serif;font-size:1.6rem;color:var(--terracota);margin:.2rem 0}
    .sub{font-size:.95rem;opacity:.92;margin-bottom:1rem}
    .progress{height:6px;background:#eee;border-radius:6px;margin:10px 0 14px;overflow:hidden}
    .bar{height:6px;width:0;background:var(--terracota);transition:width .3s ease}
    #stage{position:relative;min-height:300px}
    .slide{
      position:absolute;top:0;left:0;width:100%;opacity:0;transform:translateX(22px);
      transition:opacity .35s ease,transform .35s ease; padding-bottom:.6rem;
    }
    .slide.active{opacity:1;transform:translateX(0);position:relative}
    .q-media{width:100%;aspect-ratio:16/9;border-radius:16px;object-fit:cover;background:#f7f7f7;margin-bottom:.7rem}
    .q-title{font-weight:800;font-size:1.05rem;margin:6px 0 10px}
    .grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
    .choice{
      border:2px solid rgba(0,0,0,.06);border-radius:16px;padding:12px;background:#fff;cursor:pointer;transition:.22s;
      display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px
    }
    .choice span{display:block;font-size:1.9rem;line-height:1;margin-bottom:4px}
    .choice small{font-weight:700}
    .choice.sel{border-color:var(--terracota);box-shadow:0 6px 18px rgba(204,106,90,.22);transform:translateY(-2px)}
    input{
      width:100%;padding:.85rem;border:1px solid #ddd;border-radius:12px;font-size:1rem;color:var(--teal);
      outline:none;transition:border-color .2s,box-shadow .2s
    }
    input:focus{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(204,106,90,.2)}
    .warn{font-size:.85rem;margin-top:6px}.ok{color:#2e7d32}.err{color:var(--terracota)}
    .btn{
      width:100%;margin-top:12px;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--terracota));
      color:#fff;font-weight:800;cursor:pointer;transition:.22s
    }
    .btn:disabled{opacity:.5;cursor:not-allowed}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:420px){.card{padding:1.4rem}.logo{width:100px}h1{font-size:1.36rem}.sub{font-size:.9rem}}
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/logoterracotaebege.jpg" class="logo" alt="FemFlow"/>
    <h1>Seu Perfil FemFlow</h1>
    <p class="sub">Questionário leve e rápido — estilo app 🌿</p>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div id="stage"></div>
    <button class="btn" id="btnNext" disabled>Próxima</button>
  </div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby1OydWK-Akw0zx0QqKJfZS7tc28ziSfpIN8lF4thtEEifWaLUTKKtBBAy1q_nhy3ot/exec";

/** Perguntas — com emojis e GIF ilustrado (substitua os src pelos seus arquivos ilustrados) */
const Q=[
  {type:"info",    q:"👩 Seu nome completo", field:"nome", placeholder:"Ex: Maria Oliveira", gif:"../assets/gifs/wellness_profile.webp"},
  {type:"email",   q:"✉️ Seu e-mail (para login)", field:"email", placeholder:"Ex: maria@email.com", gif:"../assets/gifs/mail_card.webp"},
  {type:"telefone",q:"📱 Telefone com DDD", field:"telefone", placeholder:"Ex: (11) 99999-0000", gif:"../assets/gifs/phone_hand.webp"},
  {type:"senha",   q:"🔒 Crie uma senha (6+)", field:"senha", gif:"../assets/gifs/lock_shield.webp"},

  {type:"choice", q:"💪 Você está treinando atualmente?", gif:"../assets/gifs/training_illustration.webp",
    opts:[
      {emoji:"🏃‍♀️",label:"Sim, com frequência",v:2},
      {emoji:"🧘‍♀️",label:"Não, estou parada",v:1}
    ]
  },
  {type:"choice", q:"🩸 Menstruação regular?", gif:"../assets/gifs/cycle_flow.webp",
    opts:[
      {emoji:"✅",label:"Sim",v:2},
      {emoji:"⚠️",label:"Não",v:1}
    ]
  },
  {type:"choice", q:"💊 Usa anticoncepcional hormonal?", gif:"../assets/gifs/pills_box.webp",
    opts:[
      {emoji:"✔️",label:"Sim",v:1},
      {emoji:"❌",label:"Não",v:2}
    ]
  },
  {type:"choice", q:"⏱️ Tempo de treino contínuo", gif:"../assets/gifs/timer_board.webp",
    opts:[
      {emoji:"🚫",label:"Não treino",v:0},
      {emoji:"🌱",label:"< 3 meses",v:1},
      {emoji:"🌿",label:"3–12 meses",v:2},
      {emoji:"🌳",label:"> 1 ano",v:3}
    ]
  },
  {type:"choice", q:"📆 Dias de treino/semana", gif:"../assets/gifs/calendar_days.webp",
    opts:[
      {emoji:"2️⃣",label:"1–2",v:1},
      {emoji:"4️⃣",label:"3–4",v:2},
      {emoji:"5️⃣",label:"5+",v:3}
    ]
  },
  {type:"choice", q:"🧘‍♀️ Faz mobilidade/alongamento?", gif:"../assets/gifs/stretch_flow.webp",
    opts:[
      {emoji:"✅",label:"Sim",v:2},
      {emoji:"❌",label:"Não",v:0}
    ]
  },
  {type:"choice", q:"🏋️ Força hoje — como se sente?", gif:"../assets/gifs/strength_meter.webp",
    opts:[
      {emoji:"🥄",label:"Baixa",v:1},
      {emoji:"⚖️",label:"Média",v:2},
      {emoji:"🔥",label:"Alta",v:3}
    ]
  },
  {type:"choice", q:"🌙 Dores menstruais nos últimos ciclos?", gif:"../assets/gifs/moon_cycle.webp",
    opts:[
      {emoji:"🌶️",label:"Fortes",v:0},
      {emoji:"🫖",label:"Moderadas",v:1},
      {emoji:"🍃",label:"Leves/Não",v:2}
    ]
  },
  {type:"choice", q:"🎯 Outro esporte além da musculação?", gif:"../assets/gifs/multi_sport.webp",
    opts:[
      {emoji:"🚫",label:"Não",v:1},
      {emoji:"🎳",label:"Ocasionalmente",v:2},
      {emoji:"🏊",label:"Com frequência",v:3}
    ]
  }
];

let idx=0,score=0,answers=[],dados={},picked=null;
const stage=document.getElementById("stage"), bar=document.getElementById("bar"), next=document.getElementById("btnNext");

function setBar(){ bar.style.width = Math.round((idx/Q.length)*100)+"%"; }
function maskTel(v){ const d=v.replace(/\D/g,"").slice(0,11); return d.length<=10?d.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3"):d.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3"); }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(e); }

async function verificarEmail(email,warn){
  try{
    const r=await fetch(`${SCRIPT_URL}?action=validar&email=${encodeURIComponent(email)}`);
    const data=await r.json();
    if(data.status==="ok"){
      warn.textContent="⚠️ Já existe cadastro com este e-mail. Faça login."; warn.className="warn err";
      next.disabled=true; setTimeout(()=>location.href="login.html",2400); return false;
    }
    warn.textContent="✔️ E-mail disponível"; warn.className="warn ok"; next.disabled=false; return true;
  }catch{
    warn.textContent="Erro ao validar e-mail"; warn.className="warn err"; return false;
  }
}

function slideEl(inner){
  const el=document.createElement("div"); el.className="slide active"; el.innerHTML=inner; return el;
}

function render(){
  setBar(); next.disabled=true; picked=null; stage.innerHTML="";
  const item=Q[idx];

  if(["info","email","telefone","senha"].includes(item.type)){
    const inner=`
      <img class="q-media" src="${item.gif}" alt="gif"/>
      <div class="q-title">${item.q}</div>
      <input id="${item.field}" placeholder="${item.placeholder||""}" ${item.type==="senha"?'type="password"':''}/>
      <div class="warn"></div>`;
    const s=slideEl(inner); stage.append(s);

    const input=s.querySelector("input"), warn=s.querySelector(".warn");
    input.addEventListener("input", async ()=>{
      const v=input.value.trim(); let ok=false;
      if(item.type==="info"){ ok=v.length>2; dados.nome=v; }
      if(item.type==="email"){ ok=validEmail(v); if(ok){ ok=await verificarEmail(v,warn); } dados.email=v; }
      if(item.type==="telefone"){ input.value=maskTel(v); ok=input.value.length>=13; dados.telefone=v; }
      if(item.type==="senha"){ ok=v.length>=6; dados.senha=v; }
      if(ok){ warn.textContent="✔️ Válido"; warn.className="warn ok"; next.disabled=false; }
      else if(!warn.textContent.includes("cadastro")){ warn.textContent="❌ Inválido"; warn.className="warn err"; next.disabled=true; }
    });
    return;
  }

  const choicesHtml = item.opts.map(o => `
    <div class="choice">
      <span>${o.emoji}</span>
      <small>${o.label}</small>
    </div>`).join("");
  const inner=`
    <img class="q-media" src="${item.gif}" alt="gif"/>
    <div class="q-title">${item.q}</div>
    <div class="grid">${choicesHtml}</div>`;
  const s=slideEl(inner); stage.append(s);

  s.querySelectorAll(".choice").forEach((c,i)=>{
    c.onclick=()=>{
      s.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel"); picked={label:item.opts[i].label, v:item.opts[i].v}; next.disabled=false;
    };
  });
}

async function finish(){
  const media = score/Q.length; let nivel="iniciante"; if(media>=2.2&&media<2.7)nivel="intermediaria"; if(media>=2.7)nivel="avancada";
  const payload = {
    action:"loginOuCadastro",
    nome:dados.nome, email:dados.email, telefone:dados.telefone, senha:dados.senha,
    perfil:nivel, pontuacao:score, anamnese:JSON.stringify(answers)
  };
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await r.json();
    if(data.status==="ok"||data.status==="created"){
      stage.innerHTML=`
        <div class="slide active">
          <img class="q-media" src="../assets/gifs/success_flow.webp" alt="ok"/>
          <div class="q-title">Cadastro concluído 💫</div>
          <p>Bem-vinda, <b>${dados.nome.split(" ")[0]}</b>!</p>
          <p>Seu ID FemFlow: <b>${data.id}</b></p>
          <p style="opacity:.85">Você será redirecionada para o login...</p>
        </div>`;
      document.getElementById("btnNext").style.display="none";
      bar.style.width="100%";
      setTimeout(()=>location.href="login.html",4000);
    } else {
      alert("Erro no cadastro. Tente novamente.");
    }
  }catch(e){ alert("Falha de conexão."); }
}

document.getElementById("btnNext").onclick=()=>{
  const active=document.querySelector(".slide.active");
  if(active){ active.classList.remove("active"); active.style.opacity=0; active.style.transform="translateX(-26px)"; }

  const item=Q[idx];
  if(["info","email","telefone","senha"].includes(item.type)){
    const val=document.getElementById(item.field)?.value.trim(); if(val) answers.push(val);
  } else if(picked){ score+=Number(picked.v||0); answers.push(picked.label); }

  idx++; if(idx<Q.length){ setTimeout(()=>render(),280); } else { finish(); }
};

document.addEventListener("DOMContentLoaded",()=>render());
</script>
</body>
</html>
