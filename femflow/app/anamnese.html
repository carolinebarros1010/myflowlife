<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FemFlow • Anamnese</title>
  <style>
    :root{
      --terracota:#CC6A5A; --pessego:#F4A386; --teal:#335953; --bege:#FBF6F0;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(180deg,#F4E1D7 0%, #EFBDA6 100%);
      font-family:"Lato",system-ui,-apple-system,Arial,sans-serif; color:var(--teal);
      padding:16px;
    }
    .card{
      width:100%; max-width:420px; background:#fff; border-radius:20px; padding:22px;
      box-shadow:0 10px 28px rgba(0,0,0,.12); text-align:center; position:relative; overflow:hidden;
    }
    .logo{width:120px; margin:0 auto 10px; display:block}
    h1{font-family:"Playfair Display",serif; color:var(--terracota); font-size:1.5rem; margin:6px 0 2px}
    .sub{font-size:.92rem; opacity:.9; margin:0 0 14px}
    .progress{height:6px; background:#eee; border-radius:6px; overflow:hidden; margin:12px 0 18px}
    .bar{height:6px; width:0; background:var(--terracota); transition:width .3s ease}
    .q-title{font-weight:700; font-size:1.05rem; margin:6px 0 12px}
    .grid{display:grid; gap:12px; grid-template-columns:repeat(2,1fr);}
    .choice{border:2px solid rgba(0,0,0,.06); border-radius:16px; padding:10px; cursor:pointer; transition:.2s; background:#fff;}
    .choice:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
    .choice.sel{border-color:var(--terracota); box-shadow:0 4px 14px rgba(204,106,90,.25)}
    .gif{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; background:#f6f6f6; display:block}
    .lbl{margin-top:8px; font-weight:700}
    .btn{
      margin-top:14px; width:100%; padding:12px 16px; border:0; border-radius:14px;
      background:linear-gradient(135deg,var(--teal),var(--terracota)); color:#fff;
      font-weight:800; letter-spacing:.2px; cursor:pointer; transition:.2s;
    }
    .btn:disabled{opacity:.45; cursor:not-allowed}
    input{
      width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:10px;
      font-size:1rem; color:#335953; font-family:"Lato";
    }
    .warn{font-size:0.85rem; margin-top:4px;}
    .warn.ok{color:#2e7d32;}
    .warn.err{color:#CC6A5A;}
    .fade{
      position:absolute; top:0; left:0; width:100%; height:100%; background:#fff;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      animation:fadeIn .5s ease forwards;
    }
    @keyframes fadeIn{
      from{opacity:0;} to{opacity:1;}
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <img class="logo" src="../assets/logoterracotaebege.jpg" alt="FemFlow" />
    <h1>Seu perfil FemFlow</h1>
    <p class="sub">Antes de começar, conte um pouquinho sobre você 🌸</p>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div id="stage"></div>
    <button class="btn" id="btnNext" disabled>Próxima</button>
  </div>

<script src="scripts/femflow-core.js"></script>
<script>
if (typeof FEMFLOW === "undefined" || !FEMFLOW.SCRIPT_URL) {
  window.FEMFLOW = {
    SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxblNEoTTf7YLHZQMJBmVPK26VIJreOGgRblQYlBNP2JO4lyQblLLA9PtHeE32MTtY/exec",
    toast: (m) => alert(m)
  };
}

const DEBUG_MODE = true;
function debugLog(...args){ if (DEBUG_MODE) console.log("📡 FEMFLOW DEBUG:", ...args); }

const Q=[
  {type:"info", q:"Seu nome completo", field:"nome", placeholder:"Ex: Maria Oliveira"},
  {type:"email", q:"Seu e-mail (para login futuro)", field:"email", placeholder:"Ex: maria@email.com"},
  {type:"telefone", q:"Seu telefone com DDD", field:"telefone", placeholder:"Ex: (11) 99999-0000"},
  {type:"senha", q:"Crie uma senha para seu acesso", field:"senha"},
  {
    type:"choice",
    q:"Você está treinando atualmente?",
    opts:["Sim, treino com frequência","Não, estou parada"],
    v:[2,1]
  },
  {type:"choice",q:"Você menstrua regularmente?",opts:["Sim","Não"],v:[2,1]},
  {type:"choice",q:"Usa anticoncepcional hormonal?",opts:["Sim","Não"],v:[1,2]},
  {type:"choice",q:"Há quanto tempo treina com regularidade?",opts:["❌ Não treino","< 3 meses","3–12 meses","> 1 ano"],v:[0,1,2,3]},
  {type:"choice",q:"Quantos dias por semana costuma treinar?",opts:["1–2","3–4","5+"],v:[1,2,3]},
  {type:"choice",q:"Faz mobilidade/alongamento regularmente?",opts:["Sim","Não"],v:[2,0]},
  {type:"choice",q:"Como avalia sua força hoje?",opts:["Baixa","Média","Alta"],v:[1,2,3]},
  {type:"choice",q:"Dores menstruais nos últimos ciclos?",opts:["Fortes","Moderadas","Leves/Não"],v:[0,1,2]},
  {type:"choice",q:"Pratica outro esporte além da musculação?",opts:["Não","Ocasionalmente","Com frequência"],v:[1,2,3]}
];

let idx=0,score=0,answers=[],dadosBase={},currentPicked=null;
const stage=document.getElementById("stage");
const bar=document.getElementById("bar");
const next=document.getElementById("btnNext");

function perc(){return Math.round((idx/Q.length)*100);}
function setBar(){bar.style.width=perc()+"%";}

function validarEmail(v){return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/i.test(v);}
function validarTelefone(v){const d=v.replace(/\\D/g,"");return d.length>=10&&d.length<=11;}
function mascaraTelefone(v){const d=v.replace(/\\D/g,"").slice(0,11);if(d.length<=10)return d.replace(/(\\d{2})(\\d{4})(\\d{0,4})/,"($1) $2-$3");return d.replace(/(\\d{2})(\\d{5})(\\d{0,4})/,"($1) $2-$3");}

async function verificarEmail(email, warn){
  try{
    const resp=await fetch(`${FEMFLOW.SCRIPT_URL}?action=validar&email=${encodeURIComponent(email)}`);
    const data=await resp.json();
    if(data.status==="ok"){
      warn.textContent="⚠️ Este e-mail já possui cadastro. Vá para o login.";
      warn.className="warn err";
      next.disabled=true;
      setTimeout(()=>window.location.href="login.html",2500);
      return false;
    }
    warn.textContent="✔️ E-mail disponível";
    warn.className="warn ok";
    next.disabled=false;
    return true;
  }catch(err){
    warn.textContent="Erro ao validar e-mail";
    warn.className="warn err";
    return false;
  }
}

function render(){
  setBar(); next.disabled=true; currentPicked=null;
  const item=Q[idx]; stage.innerHTML="";

  if(["info","email","telefone","senha"].includes(item.type)){
    const label=document.createElement("div"); label.className="q-title"; label.textContent=item.q;
    const input=document.createElement("input"); input.id=item.field; input.placeholder=item.placeholder||"";
    if(item.type==="email") input.type="email";
    if(item.type==="senha") input.type="password";
    const warn=document.createElement("div"); warn.className="warn";

    input.addEventListener("input",async()=>{
      const val=input.value.trim();
      let ok=false;
      if(item.type==="info"){ok=val.length>2; dadosBase.nome=val;}
      if(item.type==="email"){ok=validarEmail(val); if(ok){ok=await verificarEmail(val,warn);} dadosBase.email=val;}
      if(item.type==="telefone"){input.value=mascaraTelefone(val); ok=validarTelefone(val); dadosBase.telefone=val;}
      if(item.type==="senha"){ok=val.length>=6; dadosBase.senha=val;}
      if(ok){warn.textContent="✔️ Válido"; warn.className="warn ok"; next.disabled=false;}
      else if(!warn.textContent.includes("⚠️")){warn.textContent="❌ Formato inválido"; warn.className="warn err"; next.disabled=true;}
    });
    stage.append(label,input,warn);
    return;
  }

  const title=document.createElement("div"); title.className="q-title"; title.textContent=item.q;
  const grid=document.createElement("div"); grid.className="grid";
  item.opts.forEach((label,i)=>{
    const b=document.createElement("div"); b.className="choice"; b.innerHTML=`<div class="lbl">${label}</div>`;
    b.onclick=()=>{
      document.querySelectorAll(".choice").forEach(c=>c.classList.remove("sel"));
      b.classList.add("sel"); currentPicked={label,v:item.v[i]}; next.disabled=false;
    };
    grid.appendChild(b);
  });
  stage.append(title,grid);
}

async function finish(){
  const media=score/Q.length;
  let nivel="iniciante"; if(media>=2.2&&media<2.7)nivel="intermediaria"; if(media>=2.7)nivel="avancada";

  const payload={
    action:"loginOuCadastro",
    nome:dadosBase.nome,
    email:dadosBase.email,
    telefone:dadosBase.telefone,
    senha:dadosBase.senha,
    perfil:nivel,
    pontuacao:score,
    anamnese:JSON.stringify(answers)
  };
  debugLog("🚀 Enviando anamnese:",payload);

  try{
    const resp=await fetch(FEMFLOW.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await resp.json();
    if(data.status==="ok"||data.status==="created"){
      showSuccess(dadosBase.nome,data.id);
    }else FEMFLOW.toast("Erro ao cadastrar. Tente novamente.");
  }catch(err){
    console.error(err); FEMFLOW.toast("Falha de conexão com o servidor.");
  }
}

function showSuccess(nome,idFemflow){
  const card=document.getElementById("card");
  card.innerHTML=`
    <div class="fade">
      <img class="logo" src="../assets/logoterracotaebege.jpg" style="width:100px;margin-bottom:10px">
      <h2 style="color:#335953;">Cadastro concluído 💫</h2>
      <p style="font-size:0.95rem;color:#555;">Bem-vinda, <strong>${nome.split(" ")[0]}</strong>!</p>
      <p style="font-size:0.9rem;color:#335953;">Seu ID FemFlow é:<br><strong>${idFemflow}</strong></p>
      <p style="font-size:0.9rem;color:#777;">Você será redirecionada para o login...</p>
    </div>`;
  setTimeout(()=>window.location.href="login.html",4000);
}

next.onclick=()=>{
  const item=Q[idx];
  if(["info","email","telefone","senha"].includes(item.type)){
    const val=document.getElementById(item.field)?.value.trim();
    if(val)answers.push(val);
  }else if(currentPicked){score+=Number(currentPicked.v||0);answers.push(currentPicked.label);}
  idx++;
  if(idx<Q.length){render();}
  else finish();
};

document.addEventListener("DOMContentLoaded",()=>render());
</script>
</body>
</html>
