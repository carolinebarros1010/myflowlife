<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Redefinir senha • FemFlow</title>

  <link rel="stylesheet" href="css/style.css"/>

  <style>
    :root{--terracota:#cc6a5a;--teal:#335953;--pessego:#efbda6;--bege:#f4e1d7;}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:"Lato",sans-serif;background:linear-gradient(180deg,var(--bege) 0%,var(--pessego) 100%);color:var(--teal);
      -webkit-font-smoothing:antialiased;
    }
    .card{
      width:90%;max-width:420px;padding:2rem;border-radius:18px;
      background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
      box-shadow:0 8px 20px rgba(0,0,0,.12);text-align:center;animation:fadeIn .4s ease;
    }
    .card img.logo{width:130px;margin-bottom:1rem}
    h2{margin:0;font-size:1.5rem;color:var(--terracota);font-family:"Playfair Display",serif}
    .subtitle{font-size:.95rem;margin:.35rem 0 1.2rem;color:var(--teal)}
    .form-group{margin-bottom:.9rem;text-align:left}
    input{
      width:100%;padding:.85rem .95rem;border:1px solid #ddd;border-radius:12px;
      font-size:1rem;color:var(--teal);background:#fff;outline:none;
      transition:border-color .2s,box-shadow .2s
    }
    input:focus{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(204,106,90,.25)}
    button{
      width:100%;padding:.95rem;margin-top:.35rem;border:none;border-radius:14px;font-weight:700;font-size:1rem;
      color:#fff;background:linear-gradient(135deg,var(--teal),var(--terracota));cursor:pointer;transition:transform .25s ease
    }
    button:hover{transform:scale(1.02)}
    .message{margin-top:1rem;min-height:1.4rem;font-size:.95rem}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/logofemflowterracotasf.png" alt="FemFlow" class="logo"/>
    <h2>Redefinir senha</h2>
    <p class="subtitle">Informe sua nova senha para continuar 💫</p>

    <div class="form-group">
      <label for="email" style="font-weight:700;font-size:.9rem">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com"/>
    </div>
    <div class="form-group">
      <label for="senha1" style="font-weight:700;font-size:.9rem">Nova senha</label>
      <input type="password" id="senha1" placeholder="Crie uma senha"/>
    </div>
    <div class="form-group">
      <label for="senha2" style="font-weight:700;font-size:.9rem">Confirme a nova senha</label>
      <input type="password" id="senha2" placeholder="Repita a senha"/>
    </div>

    <button id="btnSalvar">Salvar nova senha</button>
    <p id="mensagem" class="message"></p>
  </div>

  <!-- Core primeiro (usa FEMFLOW.SCRIPT_URL) -->
  <script src="./femflow-core.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const msg = $("#mensagem");

    // Pré-preenche e-mail vindo do link
    (function init(){
      const p = new URLSearchParams(location.search);
      const e = p.get('email');
      if(e) $("#email").value = decodeURIComponent(e);
    })();

    function setMsg(t, ok=false){ msg.textContent=t; msg.style.color= ok? "#2e7d32" : "#335953"; }
    function setErr(t){ msg.textContent=t; msg.style.color="#cc6a5a"; }

    async function postGAS(payload, {retries=2, initialDelay=1200} = {}){
      const doFetch = () => fetch(FEMFLOW.SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      let attempt=0, delay=initialDelay;
      while(true){
        const r = await doFetch().catch(()=>null);
        if(r && r.ok){
          const ct=(r.headers.get("content-type")||"").toLowerCase();
          return ct.includes("application/json")? r.json(): JSON.parse(await r.text());
        }
        const st = r? r.status:0;
        if((st===429||st===503) && attempt<retries){ await new Promise(res=>setTimeout(res,delay)); attempt++; delay*=2; continue; }
        throw new Error(st?`HTTP ${st}`:'Falha de rede');
      }
    }

    async function salvar(){
      const email = $("#email").value.trim().toLowerCase();
      const s1 = $("#senha1").value.trim();
      const s2 = $("#senha2").value.trim();
      if(!email || !s1 || !s2){ setErr("Preencha todos os campos."); return; }
      if(s1.length < 6){ setErr("A senha deve ter ao menos 6 caracteres."); return; }
      if(s1 !== s2){ setErr("As senhas não coincidem."); return; }

      setMsg("Atualizando senha…");
      $("#btnSalvar").disabled = true;

      try{
        const data = await postGAS({ action:"resetsenha", email, novaSenha:s1 });
        if(data.status === "ok"){
          setMsg("✔️ Senha atualizada! Voltando ao login…", true);
          setTimeout(()=> location.href="login.html", 1200);
        }else if(data.status === "notfound"){
          setErr("E-mail não encontrado.");
          $("#btnSalvar").disabled = false;
        }else{
          setErr(data.msg || "Não foi possível atualizar a senha.");
          $("#btnSalvar").disabled = false;
        }
      }catch(e){
        setErr(String(e.message).includes("429") ? "⏳ Tente novamente em instantes." : "❌ Falha de rede.");
        $("#btnSalvar").disabled = false;
      }
    }

    $("#btnSalvar").addEventListener("click", salvar);
    $("#senha2").addEventListener("keydown", e=>{ if(e.key==="Enter") salvar(); });
  </script>
</body>
</html>
