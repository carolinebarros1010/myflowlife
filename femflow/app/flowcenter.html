<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/flowcenter.css">
</head>

<body>

  <h1 id="tituloApp">FemFlow</h1>

  <!-- 🔥 Agora personalizado -->
  <h3 id="tituloFlow">Fase Hormonal</h3>
  <p class="subtitle" id="subFlow">Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

  <!-- ================================
       CÍRCULO HORMONAL
  ================================= -->
  <div class="phase-wrapper">
    <div class="phase-svg">
      <svg viewBox="0 0 300 300" width="260" height="260">
        <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>

        <g stroke="#fff5ef" stroke-width="3">
          <path id="seg-menstrual"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z" fill="#f9e0d8"></path>
          <path id="seg-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
          <path id="seg-ovulatory"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z" fill="#f9e0d8"></path>
          <path id="seg-luteal"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z" fill="#f9e0d8"></path>
        </g>

        <circle cx="150" cy="150" r="65" fill="none" stroke="#fff5ef" stroke-width="2"></circle>
        <circle cx="150" cy="150" r="63" fill="#cc6a5a"></circle>

        <!-- Labels -->
        <text id="lbl-menstrual"  x="215" y="95"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(45,215,95)">Menstrual</text>
        <text id="lbl-follicular" x="215" y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(135,215,215)">Folicular</text>
        <text id="lbl-ovulatory"  x="85"  y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(225,85,215)">Ovulatória</text>
        <text id="lbl-luteal"     x="85"  y="85"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(315,85,85)">Lútea</text>

        <text id="centerPhase"
              x="150" y="155"
              text-anchor="middle"
              font-family="Playfair Display"
              font-size="18"
              font-weight="700"
              fill="#fff">—</text>
      </svg>
    </div>
  </div>

  <div class="current-phase" id="t_current">Fase atual: —</div>

  <!-- NAV -->
  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração</button>
    <button class="tool" id="toTrain">🏃 Treino</button>
    <button class="tool" id="toEvolution">📈 Evolução</button>
  </div>

 
<script src="femflow-core.js"></script>
<script>
  
  function ffHideLoading() {
  const box = document.getElementById("ff-loading");
  if (box) box.classList.add("hidden");
}

document.addEventListener("DOMContentLoaded", async () => {

  FEMFLOW.inserirHeaderApp();
  FEMFLOW.inserirMenuLateral();

  /* =========================================================
     1) SINCRONIZAR COM BACKEND
  ========================================================= */
  const perfil = await FEMFLOW.carregarCicloBackend();

  if (!perfil) {
    FEMFLOW.toast("Erro ao carregar ciclo.");
    ffHideLoading();
    return;
  }

  /* backend → localStorage já está atualizado */
  const fase     = perfil.fase;
  const mapaFase = {
  lutea: "luteal",
  lútea: "luteal",
  luteal: "luteal",

  folicular: "follicular",
  follicular: "follicular",

  ovulatoria: "ovulatory",
  ovulatório: "ovulatory",
  ovulatory: "ovulatory",

  menstrual: "menstrual"
};

// Fase normalizada
const faseNorm = mapaFase[fase?.toLowerCase()] || "follicular";

  const diaCiclo = perfil.diaCiclo;
  const nome     = perfil.nome || "Aluna";
  const first    = nome.split(" ")[0];

  /* =========================================================
     2) TEXTOS
  ========================================================= */
  document.getElementById("tituloFlow").textContent =
    `${first}, sua fase hormonal`;

  document.getElementById("subFlow").textContent =
    "Seu corpo tem um ritmo único. Vamos acompanhar juntas.";

  /* =========================================================
     3) LABELS
  ========================================================= */
  const lang = localStorage.getItem("femflow_lang") || "pt";
  const T = {
    pt: {
      faseAtual: "Fase atual:",
      fases: {
        menstrual: "Menstrual",
        follicular: "Folicular",
        ovulatory: "Ovulatória",
        luteal: "Lútea"
      }
    }
  };
  const L = T[lang];

  /* =========================================================
     4) PINTAR CÍRCULO
  ========================================================= */
  document.getElementById("centerPhase").textContent = L.fases[faseNorm]

  document.getElementById("t_current").textContent =
    `${L.faseAtual} ${L.fases[faseNorm]}`;

  ["menstrual", "follicular", "ovulatory", "luteal"].forEach(s => {
    document.getElementById(`seg-${s}`).classList.toggle("path-active", s === faseNorm
);
    document.getElementById(`lbl-${s}`).classList.toggle("label-active", s === faseNorm
);
  });
  // 🔥 Somente agora esconde o loading
  ffHideLoading();

  /* =========================================================
     5) NAV
  ========================================================= */
  const toBreath    = document.getElementById("toBreath");
  const toTrain     = document.getElementById("toTrain");
  const toEvolution = document.getElementById("toEvolution");

  toBreath.onclick    = () => FEMFLOW.router("respiracao.html");
  toTrain.onclick     = () => FEMFLOW.router("treino.html");
  toEvolution.onclick = () => FEMFLOW.router("evolucao.html");

});
</script>

<div id="ff-loading" class="ff-loading">
  <div class="ff-loading-box">
    <div class="ff-spinner"></div>
    <p>Carregando sua fase hormonal…</p>
  </div>
</div>

</body>
</html>
