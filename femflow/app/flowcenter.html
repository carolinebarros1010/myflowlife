<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow - Flow Center</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      --terracota: #CC6A5A;
      --bege: #F6E9E1;
    }

    body {
      font-family: 'Lato', sans-serif;
      background-color: var(--bege);
      color: #5A4032;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0 10px;
    }
    .logo-img {
      width: 130px;
      opacity: 0.95;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 1.8em;
      margin-bottom: 5px;
    }

    p.sub {
      font-size: 1em;
      color: #7C6058;
      margin: 0 0 20px;
    }

    /* ====== CÍRCULO DAS FASES ====== */
    .circle-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto;
    }
    svg#circleFases {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .fase-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Playfair Display', serif;
      font-size: 1.2em;
      color: var(--terracota);
    }
    .phase-name {
      font-weight: 600;
      color: #5A4032;
    }

    /* ====== BOTÕES ====== */
    .btn {
      display: block;
      width: 85%;
      max-width: 320px;
      margin: 18px auto;
      padding: 14px 20px;
      border: none;
      border-radius: 25px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover { transform: scale(1.03); }

    #btnRespiracao {
      background: var(--terracota);
      color: #fff;
    }
    #btnTreino {
      background: #fff;
      border: 2px solid var(--terracota);
      color: var(--terracota);
    }

    .fase-atual {
      margin-top: 25px;
      font-size: 1.05em;
      font-weight: 500;
      color: #7C6058;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #A87E72;
    }
  </style>
</head>

<body>
  <!-- LOGO -->
  <div class="logo-container">
    <img src="../../assets/logofemflowterracota.png" alt="FemFlow Logo" class="logo-img" />
  </div>

  <h1>FemFlow</h1>
  <p class="sub">Centro do seu ciclo</p>

  <!-- ====== CÍRCULO DAS FASES ====== -->
  <div class="circle-wrapper">
    <svg id="circleFases" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#E8C7BB" stroke-width="22" />
      <circle id="arcFase" cx="100" cy="100" r="90" fill="none"
              stroke="var(--terracota)" stroke-width="22"
              stroke-dasharray="565" stroke-dashoffset="565"
              stroke-linecap="round" />
    </svg>
    <div class="fase-text">
      <div id="faseLabel" class="phase-name">Fase —</div>
    </div>
  </div>

  <p class="fase-atual" id="faseDescricao">Identificando sua fase...</p>

  <!-- ====== BOTÕES ====== -->
  <button id="btnRespiracao" class="btn" onclick="location.href='respiracao.html'">🧘 Respiração Diária</button>
  <button id="btnTreino" class="btn" onclick="iniciarTreino()">🏃 Iniciar Treino</button>

  <p class="footer">🌸 Conecte-se com seu ritmo natural</p>

  <script src="../scripts/femflow-core.js"></script>

  <script>
    // 🌿 Atualiza círculo conforme a fase
    function atualizarFaseVisual(fase) {
      const faseLabel = document.getElementById('faseLabel');
      const faseDescricao = document.getElementById('faseDescricao');
      const arc = document.getElementById('arcFase');

      const fases = {
        menstrual: { cor: '#CC6A5A', angulo: 0, texto: 'Fase Menstrual', desc: 'Período de recolhimento e renovação.' },
        folicular: { cor: '#E8C7BB', angulo: 140, texto: 'Fase Folicular', desc: 'Momento de energia crescente e foco.' },
        ovulatoria: { cor: '#B55A4C', angulo: 280, texto: 'Fase Ovulatória', desc: 'Pico de vitalidade e expressão.' },
        lutea: { cor: '#8E4C40', angulo: 420, texto: 'Fase Lútea', desc: 'Reflexão e preparação para o novo ciclo.' }
      };

      const f = fases[fase] || fases.folicular;
      faseLabel.textContent = f.texto;
      faseDescricao.textContent = f.desc;

      arc.style.stroke = f.cor;
      arc.style.strokeDashoffset = 565 - (f.angulo / 360) * 565;
    }

    // 🩷 Buscar fase pelo ID FemFlow
    document.addEventListener('DOMContentLoaded', async () => {
      const id = localStorage.getItem('femflow_id');
      if (!id) {
        document.getElementById('faseDescricao').textContent = 'Faça login ou cadastre-se.';
        return;
      }

      try {
        const resp = await fetch(`${FEMFLOW.SCRIPT_URL}?action=validar&id=${id}`);
        const data = await resp.json();

        if (data?.nivel) {
          const fase = localStorage.getItem('fase_sugerida') || data.fase || 'folicular';
          atualizarFaseVisual(fase.toLowerCase());
        }
      } catch (err) {
        console.error('Erro ao carregar fase:', err);
        document.getElementById('faseDescricao').textContent = 'Não foi possível carregar sua fase.';
      }
    });

    // 🚀 Iniciar treino
    function iniciarTreino() {
      FEMFLOW.toast('Iniciando treino do dia 🌸');
      setTimeout(() => {
        window.location.href = 'treino.html';
      }, 1200);
    }
  </script>
</body>
</html>
