<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bege: #fff5ef;
      --terracota: #cc6a5a;
      --terracota-light: #f0c5b6;
      --terracota-lighter: #f6d7cc;
      --texto: #5b4f49;
    }

    body {
      margin: 0;
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      text-align: center;
      padding-top: 70px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 2rem;
      margin: 0;
    }

    p {
      margin: 8px 0 20px;
      color: var(--texto);
    }

    .phase-svg {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
    }

    svg {
      display: block;
      margin: 0 auto;
    }

    .current-phase {
      margin-top: 25px;
      font-weight: 700;
      color: var(--terracota);
    }

    .dual-lang {
      font-size: 0.9rem;
      color: #7a6c66;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 25px 0;
    }

    .tool {
      border: 1px solid rgba(204,106,90,0.25);
      background: #fff;
      color: var(--terracota);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: "Lato", sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .tool:hover {
      background: var(--terracota);
      color: #fff;
      transform: scale(1.03);
      transition: all .3s ease;
    }

    /* ✨ animação do brilho pulsante */
    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(204,106,90,0.8)); }
      100% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
    }

    .active-glow {
      animation: pulseGlow 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
</head>

<body>
  <h1>FemFlow</h1>
  <h3>Fase Hormonal</h3>
  <p>Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

  <div class="phase-svg">
    <svg id="svgCiclo" viewBox="0 0 300 300" width="260" height="260">
      <!-- Base -->
      <circle cx="150" cy="150" r="120" fill="#f8ece7" />

      <!-- Fatias -->
      <path id="arc-menstrual" d="M150,150 L150,30 A120,120 0 0,1 270,150 Z" fill="#f6d7cc"></path>
      <path id="arc-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f6d7cc"></path>
      <path id="arc-ovulatory" d="M150,150 L150,270 A120,120 0 0,1 30,150 Z" fill="#f6d7cc"></path>
      <path id="arc-luteal" d="M150,150 L30,150 A120,120 0 0,1 150,30 Z" fill="#f6d7cc"></path>

      <!-- Caminhos para textos -->
      <path id="path-menstrual" d="M185,60 A100,100 0 0,1 240,120" fill="none" />
      <path id="path-follicular" d="M240,180 A100,100 0 0,1 185,240" fill="none" />
      <path id="path-ovulatory" d="M115,240 A100,100 0 0,1 60,180" fill="none" />
      <path id="path-luteal" d="M60,120 A100,100 0 0,1 115,60" fill="none" />

      <!-- Textos curvados (PT apenas) -->
      <text font-family="Playfair Display" font-size="12" font-weight="700">
        <textPath href="#path-menstrual" startOffset="0%" fill="#cc6a5a">Menstrual</textPath>
      </text>
      <text font-family="Playfair Display" font-size="12" font-weight="700">
        <textPath href="#path-follicular" startOffset="0%" fill="#cc6a5a">Folicular</textPath>
      </text>
      <text font-family="Playfair Display" font-size="12" font-weight="700">
        <textPath href="#path-ovulatory" startOffset="0%" fill="#cc6a5a">Ovulatória</textPath>
      </text>
      <text font-family="Playfair Display" font-size="12" font-weight="700">
        <textPath href="#path-luteal" startOffset="0%" fill="#cc6a5a">Lútea</textPath>
      </text>

      <!-- Centro -->
      <circle cx="150" cy="150" r="80" fill="#cc6a5a"></circle>
      <text id="centerPhase" x="150" y="156" text-anchor="middle"
        font-family="Playfair Display" font-size="18" font-weight="700" fill="#fff">—</text>
    </svg>
  </div>

  <div class="current-phase" id="t_current">Fase atual: —</div>
  <div class="dual-lang" id="t_current_en">Current phase: —</div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração / <i>Breath</i></button>
    <button class="tool" id="toTrain">🏃 Treino / <i>Training</i></button>
  </div>

  <script src="./femflow-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FEMFLOW.inserirHeaderApp();

      const ciclo = parseInt(localStorage.getItem('femflow_cycleLength') || 28);
      const inicio = new Date(localStorage.getItem('femflow_startDate') || new Date());
      const diff = Math.floor((new Date() - inicio) / (1000*60*60*24));
      const dia = (diff % ciclo) + 1;

      function faseAtual(d) {
        if (d <= 5) return 'menstrual';
        if (d <= 13) return 'follicular';
        if (d <= 17) return 'ovulatory';
        return 'luteal';
      }

      const fase = faseAtual(dia);
      const nomes = {
        menstrual: ['Menstrual', 'Menstrual'],
        follicular: ['Folicular', 'Follicular'],
        ovulatory: ['Ovulatória', 'Ovulatory'],
        luteal: ['Lútea', 'Luteal']
      };

      // Resetar fatias
      document.querySelectorAll('[id^="arc-"]').forEach(el => {
        el.setAttribute('fill', '#f6d7cc');
        el.classList.remove('active-glow');
      });

      // Ativar a fase correta
      const ativa = document.getElementById('arc-' + fase);
      ativa.setAttribute('fill', '#cc6a5a');
      ativa.classList.add('active-glow');

      // Atualizar textos centrais
      document.getElementById('centerPhase').textContent = nomes[fase][0];
      document.getElementById('t_current').textContent = `Fase atual: ${nomes[fase][0]}`;
      document.getElementById('t_current_en').textContent = `Current phase: ${nomes[fase][1]}`;

      // Botões
      document.getElementById('toBreath').onclick = () => FEMFLOW.router('respiracao');
      document.getElementById('toTrain').onclick = () => FEMFLOW.router('treino');
    });
  </script>
</body>
</html>
