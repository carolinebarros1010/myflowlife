<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bege: #fff5ef;
      --terracota: #cc6a5a;
      --terracota-light: #f0c5b6;
      --terracota-lighter: #f6d7cc;
      --texto: #5b4f49;
    }

    body {
      margin: 0;
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      text-align: center;
      padding-top: 70px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 2rem;
      margin: 0;
    }

    p {
      margin: 8px 0 20px;
      color: var(--texto);
    }

    .phase-svg {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
    }

    svg {
      display: block;
      margin: 0 auto;
    }

    .current-phase {
      margin-top: 25px;
      font-weight: 700;
      color: var(--terracota);
    }

    .dual-lang {
      font-size: 0.9rem;
      color: #7a6c66;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 25px 0;
    }

    .tool {
      border: 1px solid rgba(204,106,90,0.25);
      background: #fff;
      color: var(--terracota);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: "Lato", sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .tool:hover {
      background: var(--terracota);
      color: #fff;
      transform: scale(1.03);
      transition: all .3s ease;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(204,106,90,0.8)); }
      100% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
    }

    .active-glow {
      animation: pulseGlow 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
</head>

<body>
  <h1>FemFlow</h1>
  <h3>Fase Hormonal</h3>
  <p class="subtitle">Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

 <div class="phase-svg">
  <svg viewBox="0 0 300 300" width="260" height="260">
    <!-- Fundo bege -->
    <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>

    <!-- Fatias -->
    <g stroke="#fff5ef" stroke-width="3">
      <path id="seg-ovulatory"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z" fill="#f9e0d8"></path>
      <path id="seg-luteal" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
      <path id="seg-menstrual"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z" fill="#f9e0d8"></path>
      <path id="seg-follicular"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z" fill="#f9e0d8"></path>
    </g>

    <!-- Centro -->
    <circle cx="150" cy="150" r="78" fill="#cc6a5a"></circle>

<!-- 🔁 Modelo base mantido, textos invertidos (girados 180° no próprio eixo) -->
<defs>
  <!-- Menstrual • centrado em 45° -->
  <path id="text-menstrual"
        d="M248.7,114.1 A105,105 0 0,1 185.9,51.3" fill="none" />

  <!-- Folicular • centrado em 135° -->
  <path id="text-follicular"
        d="M114.1,51.3 A105,105 0 0,1 51.3,114.1" fill="none" />

  <!-- Ovulatória • centrado em 225° -->
  <path id="text-ovulatory"
        d="M51.3,185.9 A105,105 0 0,1 114.1,248.7" fill="none" />

  <!-- Lútea • centrado em 315° -->
  <path id="text-luteal"
        d="M185.9,248.7 A105,105 0 0,1 248.7,185.9" fill="none" />
</defs>

<!-- Rótulos girados (mantêm posição e curvatura, mas texto invertido 180°) -->
<text id="lbl-ovulatory" font-family="Playfair Display" font-size="13" font-weight="700"
      fill="#cc6a5a" text-anchor="middle" transform="rotate(180,150,150)">
  <textPath href="#text-menstrual" startOffset="50%">Menstrual</textPath>
</text>

<text id="lbl-luteal" font-family="Playfair Display" font-size="13" font-weight="700"
      fill="#cc6a5a" text-anchor="middle" transform="rotate(180,150,150)">
  <textPath href="#text-follicular" startOffset="50%">Folicular</textPath>
</text>

<text id="lbl-menstrual" font-family="Playfair Display" font-size="13" font-weight="700"
      fill="#cc6a5a" text-anchor="middle" transform="rotate(180,150,150)">
  <textPath href="#text-ovulatory" startOffset="50%">Ovulatória</textPath>
</text>

<text id="lbl-follicular" font-family="Playfair Display" font-size="13" font-weight="700"
      fill="#cc6a5a" text-anchor="middle" transform="rotate(180,150,150)">
  <textPath href="#text-luteal" startOffset="50%">Lútea</textPath>
</text>
    <!-- Texto central -->
    <text id="centerPhase" x="150" y="152" text-anchor="middle"
          font-family="Playfair Display" font-size="18" font-weight="700" fill="#fff">—</text>
  </svg>
</div>
  
  <div class="current-phase" id="t_current">Fase atual: —</div>
  <div class="dual-lang" id="t_current_en">Current phase: —</div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração / <i>Breath</i></button>
    <button class="tool" id="toTrain">🏃 Treino / <i>Training</i></button>
  </div>

  <script src="./femflow-core.js"></script>

  <!-- ✅ Tradução dinâmica e lógica de ciclo -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    FEMFLOW.inserirHeaderApp?.();

    const lang = localStorage.getItem('femflow_lang') || 'pt';
    const T = {
      pt: {
        phases: { menstrual: "Menstrual", follicular: "Folicular", ovulatory: "Ovulatória", luteal: "Lútea" },
        titulo: "Fase Hormonal",
        frase: "Seu corpo tem um ritmo. Vamos acompanhar juntas.",
        faseAtual: "Fase atual:",
        botoes: { breath: "💨 Respiração", train: "🏃 Treino" }
      },
      en: {
        phases: { menstrual: "Menstrual", follicular: "Follicular", ovulatory: "Ovulatory", luteal: "Luteal" },
        titulo: "Hormonal Phase",
        frase: "Your body has a rhythm. Let's follow it together.",
        faseAtual: "Current phase:",
        botoes: { breath: "💨 Breath", train: "🏃 Training" }
      }
    };

    const L = T[lang];

    // Atualiza textos e botões
    document.querySelector("h3").textContent = L.titulo;
    document.querySelector(".subtitle").textContent = L.frase;
    document.getElementById("t_current").textContent = `${L.faseAtual} —`;
    document.getElementById("toBreath").textContent = L.botoes.breath;
    document.getElementById("toTrain").textContent = L.botoes.train;

    // Atualiza rótulos SVG
    for (const f of ["menstrual","follicular","ovulatory","luteal"]) {
      const el = document.querySelector(`#lbl-${f} textPath`);
      if (el) el.textContent = L.phases[f];
    }

    // Cálculo de ciclo
    const ciclo = parseInt(localStorage.getItem('femflow_cycleLength') || 28);
    const inicio = new Date(localStorage.getItem('femflow_startDate') || new Date());
    const diff = Math.floor((new Date() - inicio) / (1000*60*60*24));
    const dia = (diff % ciclo) + 1;
    const faseAtual = d => (d <= 5) ? "menstrual" : (d <= 13) ? "follicular" : (d <= 17) ? "ovulatory" : "luteal";
    const fase = faseAtual(dia);

    // Cor ativa no círculo
    document.querySelectorAll('path[id^="path-"]').forEach(p => p.setAttribute("fill", "#fbe9e4"));
    document.getElementById(`path-${fase}`).setAttribute("fill", "#e8b3a3");

    // Atualiza textos centrais
    document.getElementById('centerPhase').textContent = L.phases[fase];
    document.getElementById('t_current').textContent = `${L.faseAtual} ${L.phases[fase]}`;
    document.getElementById('t_current_en').textContent = (lang === "en" ? "" : "Current phase: " + L.phases[fase]);

    // Navegação
    document.getElementById('toBreath').onclick = () => FEMFLOW.router('respiracao');
    document.getElementById('toTrain').onclick = () => FEMFLOW.router('treino');
  });
  </script>
</body>
</html>
