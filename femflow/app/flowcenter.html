<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/flowcenter.css">
</head>

<body>

  <h1 id="tituloApp">FemFlow</h1>

  <!-- Títulos dinâmicos -->
  <h3 id="tituloFlow">—</h3>
  <p class="subtitle" id="subFlow">—</p>

  <!-- ================================
       CÍRCULO HORMONAL
  ================================= -->
  <div class="phase-wrapper">
    <div class="phase-svg">
      <svg viewBox="0 0 300 300" width="260" height="260">
        <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>

        <g stroke="#fff5ef" stroke-width="3">
          <path id="seg-menstrual"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
          <path id="seg-ovulatory"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-luteal"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z"  fill="#f9e0d8"></path>
        </g>

        <circle cx="150" cy="150" r="65" fill="none" stroke="#fff5ef" stroke-width="2"></circle>
        <circle cx="150" cy="150" r="63" fill="#cc6a5a"></circle>

        <!-- Labels -->
        <text id="lbl-menstrual"  x="215" y="95"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle">—</text>
        <text id="lbl-follicular" x="215" y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle">—</text>
        <text id="lbl-ovulatory"  x="85"  y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle">—</text>
        <text id="lbl-luteal"     x="85"  y="85"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle">—</text>

        <text id="centerPhase"
              x="150" y="155"
              text-anchor="middle"
              font-family="Playfair Display"
              font-size="18"
              font-weight="700"
              fill="#fff">—</text>
      </svg>
    </div>
  </div>

  <div class="current-phase" id="t_current">—</div>

  <!-- NAV -->
  <div class="toolbar">
    <button class="tool" id="toBreath">💨 —</button>
    <button class="tool" id="toTrain">🏃 —</button>
    <button class="tool" id="toEvolution">📈 —</button>
  </div>


<!-- SCRIPTS -->
<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

<script>

function ffHideLoading() {
  document.getElementById("ff-loading")?.classList.add("hidden");
}

document.addEventListener("DOMContentLoaded", async () => {

  FEMFLOW.inserirHeaderApp();
  FEMFLOW.inserirMenuLateral();

  /* ============================================================
     1) SINCRONIZAR COM BACKEND
  ============================================================ */
  const perfil = await FEMFLOW.carregarCicloBackend();

  if (!perfil) {
    FEMFLOW.toast(FEMFLOW.langs[FEMFLOW.lang].sistema.erroCiclo, true);
    ffHideLoading();
    return;
  }

  const faseRaw = (perfil.fase ? String(perfil.fase).toLowerCase() : "follicular");

  const map = {
    "lutea": "luteal", "lútea": "luteal", "luteal": "luteal",
    "folicular": "follicular", "follicular": "follicular",
    "ovulatoria": "ovulatory", "ovulatório": "ovulatory", "ovulatory": "ovulatory",
    "menstrual": "menstrual"
  };

  const faseNorm = map[faseRaw] || "follicular";

 /* ============================================================
   2) DEFINIR FUNÇÃO DE IDIOMA
============================================================ */
function aplicarIdioma() {
  const langObj = FEMFLOW.langs[FEMFLOW.lang];

  if (!langObj || !langObj.flowcenter) {
    console.warn("⚠️ flowcenter não encontrado:", FEMFLOW.lang);
    return;
  }

  const L = langObj.flowcenter; // ✔️ ESTA É A CORRETA

  const nome = perfil.nome || "";
  const first = nome.split(" ")[0] || L.titulo;

  document.getElementById("tituloFlow")?.textContent = `${first}, ${L.titulo}`;
  document.getElementById("subFlow")?.textContent = L.sub;

  document.getElementById("lbl-menstrual")?.textContent  = L.menstrual;
  document.getElementById("lbl-follicular")?.textContent = L.follicular;
  document.getElementById("lbl-ovulatory")?.textContent  = L.ovulatory;
  document.getElementById("lbl-luteal")?.textContent     = L.luteal;

  document.getElementById("centerPhase")?.textContent = L[faseNorm] || L.follicular;

  document.getElementById("t_current")?.textContent =
    `${langObj.geral.faseAtual}: ${L[faseNorm] || L.follicular}`;

  document.getElementById("toBreath")?.textContent    = "💨 " + langObj.menu.respiracao;
  document.getElementById("toTrain")?.textContent     = "🏃 " + langObj.treino.tituloTopo;
  document.getElementById("toEvolution")?.textContent = "📈 " + langObj.evolucao.titulo;
}



/* ============================================================
   3) APLICAR IDIOMA + LISTENER
============================================================ */
// 🚀 Só aplicar idioma quando TUDO estiver pronto:
// 1) idioma carregado (lang.js)
// 2) sincronização com backend concluída (faseNorm definida)
// 3) elementos do DOM já inseridos
document.addEventListener("femflow:langReady", aplicarIdioma);
document.addEventListener("femflow:langChange", aplicarIdioma);
document.addEventListener("femflow:ready", aplicarIdioma);



  /* ============================================================
     4) PINTAR CÍRCULO
  ============================================================ */
  ["menstrual", "follicular", "ovulatory", "luteal"].forEach(s => {
    document.getElementById(`seg-${s}`).classList.toggle("path-active", s === faseNorm);
    document.getElementById(`lbl-${s}`).classList.toggle("label-active", s === faseNorm);
  });

  ffHideLoading();

  /* ============================================================
     5) NAV
  ============================================================ */
  document.getElementById("toBreath").onclick    = () => FEMFLOW.router("respiracao.html");
  document.getElementById("toTrain").onclick     = () => FEMFLOW.router("treino.html");
  document.getElementById("toEvolution").onclick = () => FEMFLOW.router("evolucao.html");

});  

</script>


<div id="ff-loading" class="ff-loading">
  <div class="ff-loading-box">
    <div class="ff-spinner"></div>
    <p>Carregando…</p>
  </div>
</div>

</body>
</html>
