<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/flowcenter.css">
</head>

<body>

  <h1 id="tituloApp">FemFlow</h1>

  <!-- Títulos dinâmicos -->
  <h3 id="tituloFlow">—</h3>
  <p class="subtitle" id="subFlow">—</p>

  <!-- ================================
       CÍRCULO HORMONAL
  ================================= -->
  <div class="phase-wrapper">
    <div class="phase-svg">
      <svg viewBox="0 0 300 300" width="260" height="260">
        <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>

        <g stroke="#fff5ef" stroke-width="3">
          <path id="seg-menstrual"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
          <path id="seg-ovulatory"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-luteal"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z"  fill="#f9e0d8"></path>
        </g>

        <circle cx="150" cy="150" r="65" fill="none" stroke="#fff5ef" stroke-width="2"></circle>
        <circle cx="150" cy="150" r="63" fill="#cc6a5a"></circle>

                <!-- Labels (com rotação estilo FemFlow antigo) -->
        <text
          id="lbl-menstrual"
          x="215" y="95"
          font-family="Playfair Display"
          font-size="14"
          font-weight="700"
          fill="#cc6a5a"
          text-anchor="middle"
          transform="rotate(45,215,95)">—</text>

        <text
          id="lbl-follicular"
          x="215" y="215"
          font-family="Playfair Display"
          font-size="14"
          font-weight="700"
          fill="#cc6a5a"
          text-anchor="middle"
          transform="rotate(135,215,215)">—</text>

        <text
          id="lbl-ovulatory"
          x="85" y="215"
          font-family="Playfair Display"
          font-size="14"
          font-weight="700"
          fill="#cc6a5a"
          text-anchor="middle"
          transform="rotate(225,85,215)">—</text>

        <text
          id="lbl-luteal"
          x="85" y="85"
          font-family="Playfair Display"
          font-size="14"
          font-weight="700"
          fill="#cc6a5a"
          text-anchor="middle"
          transform="rotate(315,85,85)">—</text>


        <text id="centerPhase"
              x="150" y="155"
              text-anchor="middle"
              font-family="Playfair Display"
              font-size="18"
              font-weight="700"
              fill="#fff">—</text>
      </svg>
    </div>
  </div>

  <div class="current-phase" id="t_current">—</div>

  <!-- NAV -->
  <div class="toolbar">
    <button class="tool" id="toBreath">💨 —</button>
    <button class="tool" id="toTrain">🏃 —</button>
    <button class="tool" id="toEvolution">📈 —</button>
  </div>


<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

<script>
function ffHideLoading() {
  const box = document.getElementById("ff-loading");
  if (box) box.classList.add("hidden");
}

document.addEventListener("DOMContentLoaded", async function () {

  /* ============================================================
     0) HEADER + MENU + IDIOMA
  ============================================================ */
  FEMFLOW.inserirHeaderApp();
  FEMFLOW.inserirMenuLateral();
  FEMFLOW.inserirModalIdioma?.();



  /* ============================================================
     1) CARREGAR BACKEND (FONTE OFICIAL)
  ============================================================ */
  let perfil = await FEMFLOW.carregarCicloBackend();

  // Se falhar → fallback localStorage
  if (!perfil) {
    FEMFLOW.toast(FEMFLOW.langs[FEMFLOW.lang].sistema.erroCiclo, true);

    perfil = {
      nome: localStorage.getItem("femflow_nome") || "",
      fase: localStorage.getItem("femflow_fase_atual") || "follicular",
      diaCiclo: Number(localStorage.getItem("femflow_diaciclo") || 1)
    };
  }

  

  /* ============================================================
     2) NORMALIZAR FASE HORMONAL
  ============================================================ */
  const faseRaw = (perfil.fase || "follicular").toLowerCase();

  const mapa = {
    "lutea": "luteal", "lútea": "luteal",
    "luteal": "luteal",
    "folicular": "follicular",
    "follicular": "follicular",
    "ovulatoria": "ovulatory",
    "ovulatório": "ovulatory",
    "ovulatory": "ovulatory",
    "menstrual": "menstrual"
  };

  const faseNorm = mapa[faseRaw] || "follicular";



  /* ============================================================
     3) APLICAR IDIOMA (FUNÇÃO NOVA E SEGURA)
  ============================================================ */
  function aplicarIdioma() {

    // GARANTIA: idioma sempre definido
if (!FEMFLOW.lang) {
  FEMFLOW.lang = localStorage.getItem("femflow_lang") || "pt";
}

    const langObj = FEMFLOW.langs[FEMFLOW.lang];

    if (!langObj || !langObj.flowcenter) {
      console.warn("⚠ Idioma flowcenter ausente:", FEMFLOW.lang);
      return;
    }

    const L = langObj.flowcenter;

    // Nome da aluna
    const nomeBackend = (perfil && perfil.nome) ? perfil.nome : "";
    const nomeLS = localStorage.getItem("femflow_nome") || "";
    const nome = nomeBackend || nomeLS;

    const first = nome ? nome.split(" ")[0] : L.titulo;


    /* --- TÍTULOS --- */
    const titulo = document.getElementById("tituloFlow");
    if (titulo) titulo.textContent = `${first}, ${L.titulo}`;

    const sub = document.getElementById("subFlow");
    if (sub) sub.textContent = L.sub;


    /* --- LABELS DO CÍRCULO --- */
    const IDMAP = {
      menstrual: "lbl-menstrual",
      follicular: "lbl-follicular",
      ovulatory: "lbl-ovulatory",
      luteal: "lbl-luteal"
    };

    for (let key in IDMAP) {
      const el = document.getElementById(IDMAP[key]);
      if (el) el.textContent = L[key];
    }


    /* --- TEXTO CENTRAL --- */
    const cp = document.getElementById("centerPhase");
    if (cp) cp.textContent = L[faseNorm] || L.follicular;


    /* --- TEXTO ABAIXO --- */
    const tcurr = document.getElementById("t_current");
    if (tcurr)
      tcurr.textContent = `${langObj.geral.faseAtual}: ${L[faseNorm] || L.follicular}`;


    /* --- NAV --- */
    const b1 = document.getElementById("toBreath");
    if (b1) b1.textContent = "💨 " + langObj.menu.respiracao;

    const b2 = document.getElementById("toTrain");
    if (b2) b2.textContent = "🏃 " + langObj.treino.tituloTopo;

    const b3 = document.getElementById("toEvolution");
    if (b3) b3.textContent = "📈 " + langObj.evolucao.titulo;
  }


  aplicarIdioma();
  document.addEventListener("femflow:langChange", aplicarIdioma);



  /* ============================================================
     4) PINTAR CÍRCULO (SEGURO)
  ============================================================ */
  const fases = ["menstrual", "follicular", "ovulatory", "luteal"];

  fases.forEach(f => {
    const seg = document.getElementById("seg-" + f);
    const lbl = document.getElementById("lbl-" + f);

    if (seg) seg.classList.toggle("path-active", f === faseNorm);
    if (lbl) lbl.classList.toggle("label-active", f === faseNorm);
  });



  /* ============================================================
     5) NAV FINAL
  ============================================================ */
  const goBreath = document.getElementById("toBreath");
  if (goBreath) goBreath.onclick = () => FEMFLOW.router("respiracao.html");

  const goTrain = document.getElementById("toTrain");
  if (goTrain) goTrain.onclick = () => FEMFLOW.router("treino.html");

  const goEvo = document.getElementById("toEvolution");
  if (goEvo) goEvo.onclick = () => FEMFLOW.router("evolucao.html");


  ffHideLoading();
});
</script>




<div id="ff-loading" class="ff-loading">
  <div class="ff-loading-box">
    <div class="ff-spinner"></div>
    <p>Carregando…</p>
  </div>
</div>

</body>
</html>
