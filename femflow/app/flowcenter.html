<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bege: #fff5ef;
      --terracota: #cc6a5a;
      --texto: #5b4f49;
    }
    body {
      margin: 0; background: var(--bege); color: var(--texto);
      font-family: "Lato", sans-serif; text-align: center;
      padding-top: 70px;
    }
    h1 { font-family:'Playfair Display',serif; color:var(--terracota); margin:0; }
    .phase-svg { width:280px; height:280px; margin:0 auto; position:relative; }
    .toolbar { display:flex; gap:12px; justify-content:center; margin:25px 0; }
    .tool {
      border:1px solid rgba(204,106,90,0.25); background:#fff; color:var(--terracota);
      padding:8px 12px; border-radius:12px; font-weight:700; cursor:pointer;
      font-family:"Lato",sans-serif; font-size:0.9rem;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    .tool:hover { background:var(--terracota); color:#fff; transform:scale(1.03); transition:all .3s ease; }
/* Suaviza transição de cor dos setores */
path { 
  transition: fill 0.6s ease; 
}
    /* 🔍 Painel de Diagnóstico */
    #debugPanel {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(255,255,255,0.92);
      color: #333;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.3;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 8px 10px;
      z-index: 9999;
      max-width: 240px;
      text-align: left;
    }
    #debugPanel b { color: var(--terracota); }

    /* === PULSAR NO NOME DA FASE CENTRAL === */
#centerPhase {
  animation: phasePulse 3s ease-in-out infinite;
}
@keyframes phasePulse {
  0%, 100% { opacity: 0.95; text-shadow: 0 0 3px rgba(255,255,255,.3); }
  50% { opacity: 1; text-shadow: 0 0 8px rgba(255,255,255,.6); }
}

/* === DESTACAR FASE ATIVA === */
.path-active {
  fill: #cc6a5a !important;
  stroke: rgba(204,106,90,0.3);
  stroke-width: 3px;
  transition: all 0.6s ease;
}
.label-active {
  fill: var(--terracota);
  stroke: rgba(204,106,90,0.25);
  stroke-width: 0.5px;
}
  </style>
</head>

<body>
  <h1>FemFlow</h1>
  <h3>Fase Hormonal</h3>
  <p class="subtitle">Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

  <div class="phase-svg">
    <svg viewBox="0 0 300 300" width="260" height="260">
      <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>
      <g stroke="#fff5ef" stroke-width="3">
        <path id="seg-menstrual"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z" fill="#f9e0d8"></path>
        <path id="seg-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
        <path id="seg-ovulatory"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z" fill="#f9e0d8"></path>
        <path id="seg-luteal"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z" fill="#f9e0d8"></path>
      </g>

      <circle cx="150" cy="150" r="65" fill="none" stroke="#fff5ef" stroke-width="2"></circle>
      <circle cx="150" cy="150" r="63" fill="#cc6a5a"></circle>

      <text id="lbl-menstrual"  x="215" y="95"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(45,215,95)">Menstrual</text>
      <text id="lbl-follicular" x="215" y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(135,215,215)">Folicular</text>
      <text id="lbl-ovulatory"  x="85"  y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(225,85,215)">Ovulatória</text>
      <text id="lbl-luteal"     x="85"  y="85"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(315,85,85)">Lútea</text>

      <text id="centerPhase" x="150" y="155" text-anchor="middle" font-family="Playfair Display" font-size="18" font-weight="700" fill="#fff">—</text>
    </svg>
  </div>

  <div class="current-phase" id="t_current">Fase atual: —</div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração</button>
    <button class="tool" id="toTrain">🏃 Treino</button>
  </div>

  <div id="debugPanel" hidden></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="./femflow-core.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    FEMFLOW.inserirHeaderApp?.();

    const lang = localStorage.getItem("femflow_lang") || "pt";
    const T = {
      pt:{
        titulo:"Fase Hormonal",
        frase:"Seu corpo tem um ritmo. Vamos acompanhar juntas.",
        faseAtual:"Fase atual:",
        botoes:{breath:"💨 Respiração",train:"🏃 Treino"},
        fases:{menstrual:"Menstrual",follicular:"Folicular",ovulatory:"Ovulatória",luteal:"Lútea"}
      },
      en:{
        titulo:"Hormonal Phase",
       frase: "Your body moves in cycles. Let’s follow its rhythm together.",
        faseAtual:"Current phase:",
       botoes:{breath:"💨 Breathing", train:"🏃 Workout"},
        fases:{menstrual:"Menstrual",follicular:"Follicular",ovulatory:"Ovulatory",luteal:"Luteal"}
      }
    };
    const L = T[lang];

    document.querySelector("h3").textContent = L.titulo;
    document.querySelector(".subtitle").textContent = L.frase;
    document.getElementById("toBreath").textContent = L.botoes.breath;
    document.getElementById("toTrain").textContent  = L.botoes.train;
    
// 🚨 Sincronização entre contextos FemFlow (PWA / Web)
if (window.localStorage && navigator.serviceWorker) {
  try {
    const sharedKeys = ["femflow_startDate", "femflow_cycleLength", "fase_sugerida", "femflow_enfase", "femflow_perfilHormonal"];
    const backup = JSON.parse(localStorage.getItem("femflow_backup") || "{}");

    // Se backup existir e dados principais estiverem faltando, restaura
    sharedKeys.forEach(k => {
      if (!localStorage.getItem(k) && backup[k]) {
        localStorage.setItem(k, backup[k]);
      }
    });

    // Atualiza backup global
    const snapshot = {};
    sharedKeys.forEach(k => snapshot[k] = localStorage.getItem(k));
    localStorage.setItem("femflow_backup", JSON.stringify(snapshot));
  } catch (err) {
    console.warn("⚠️ Falha ao sincronizar dados locais:", err);
  }
}
   // ===================================================
// 🔄 Sincronização de Dados FemFlow (Web ↔ PWA ↔ Mobile)
// ===================================================
try {
  const sharedKeys = [
    "femflow_startDate",
    "femflow_cycleLength",
    "fase_sugerida",
    "femflow_enfase",
    "femflow_perfilHormonal"
  ];

  // 🔹 1. Lê backup global (criado no login)
  const backup = JSON.parse(localStorage.getItem("femflow_backup") || "{}");
  let restored = false;

  // 🔹 2. Se houver dados faltando, restaura
  sharedKeys.forEach(k => {
    if (!localStorage.getItem(k) && backup[k]) {
      localStorage.setItem(k, backup[k]);
      restored = true;
    }
  });

  // 🔹 3. Se restaurou, exibe aviso rápido
  if (restored) {
    const note = document.createElement("div");
    note.textContent = "🌸 Sincronizando seus dados hormonais...";
    note.style = `
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(204,106,90,0.9); color: #fff; font-size: 13px;
      font-family: 'Lato', sans-serif; padding: 8px 14px;
      border-radius: 20px; z-index: 9999; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      animation: fadeOut 3s forwards ease-in-out;
    `;
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 3000);
  }

  // 🔹 4. Atualiza backup (mantém coerência)
  const snapshot = {};
  sharedKeys.forEach(k => (snapshot[k] = localStorage.getItem(k)));
  localStorage.setItem("femflow_backup", JSON.stringify(snapshot));
} catch (err) {
  console.warn("⚠️ Falha ao sincronizar backup FemFlow:", err);
}

// 🔹 Animação fade-out do aviso (opcional)
const styleSync = document.createElement("style");
styleSync.textContent = `
@keyframes fadeOut {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(10px); }
}`;
document.head.appendChild(styleSync);
 
    // === CÁLCULO DE FASE ===
    const perfil = localStorage.getItem("femflow_perfilHormonal") || "regular";
    const ciclo  = parseInt(localStorage.getItem("femflow_cycleLength") || 28);
    const inicio = new Date(localStorage.getItem("femflow_startDate") || new Date());
    const faseSugerida = localStorage.getItem("fase_sugerida");

    let fase = "menstrual";
    if (perfil === "regular") {
      const diff = Math.floor((new Date() - inicio)/(1000*60*60*24));
      const dia = (diff % ciclo) + 1;
      if (dia>5 && dia<=13) fase="follicular";
      else if (dia<=17) fase="ovulatory";
      else fase="luteal";
    } else if (faseSugerida) {
      fase = faseSugerida.toLowerCase();
    }

    // === Atualiza UI ===
    document.getElementById("centerPhase").textContent = L.fases[fase];
    document.getElementById("t_current").textContent   = `${L.faseAtual} ${L.fases[fase]}`;

    document.getElementById("lbl-menstrual").textContent  = L.fases.menstrual;
    document.getElementById("lbl-follicular").textContent = L.fases.follicular;
    document.getElementById("lbl-ovulatory").textContent  = L.fases.ovulatory;
    document.getElementById("lbl-luteal").textContent     = L.fases.luteal;

    // destaca fase atual no gráfico
    ["menstrual","follicular","ovulatory","luteal"].forEach(s=>{
      const el=document.getElementById(`seg-${s}`);
      el.style.fill=(s===fase)?"#cc6a5a":"#f9e0d8";
    });
    // destaca fase atual no gráfico
["menstrual","follicular","ovulatory","luteal"].forEach(s=>{
  const el=document.getElementById(`seg-${s}`);
  el.style.fill=(s===fase)?"#cc6a5a":"#f9e0d8";
  el.classList.toggle("path-active", s===fase);
});

// destaca rótulo da fase ativa
document.getElementById("lbl-menstrual").classList.toggle("label-active",  fase==="menstrual");
document.getElementById("lbl-follicular").classList.toggle("label-active", fase==="follicular");
document.getElementById("lbl-ovulatory").classList.toggle("label-active",  fase==="ovulatory");
document.getElementById("lbl-luteal").classList.toggle("label-active",     fase==="luteal");

    // === Botões ===
    document.getElementById("toBreath").onclick = ()=> FEMFLOW.router("respiracao");
    document.getElementById("toTrain").onclick  = ()=> FEMFLOW.router("treino");

    // === Diagnóstico visível (só em debug) ===
    const dbg = document.getElementById("debugPanel");
    const debugData = {
      perfil,
      fase,
      fase_sugerida: faseSugerida,
      ciclo,
      startDate: localStorage.getItem("femflow_startDate"),
      enfase: localStorage.getItem("femflow_enfase"),
      program: localStorage.getItem("femflow_program_active")
    };
    dbg.innerHTML = Object.entries(debugData)
      .map(([k,v])=>`<b>${k}</b>: ${v||'—'}`).join("<br>");
    dbg.hidden = false; // coloque true se quiser ocultar em produção

  });
    // === Mudança dinâmica de idioma (fix real-time) ===
window.addEventListener("femflow:langchange", () => {
  console.log("🌐 Idioma alterado via menu FemFlow");

  const newLang = localStorage.getItem("femflow_lang") || "pt";
  const T = {
    pt:{
      titulo:"Fase Hormonal",
      frase:"Seu corpo tem um ritmo. Vamos acompanhar juntas.",
      faseAtual:"Fase atual:",
      botoes:{breath:"💨 Respiração",train:"🏃 Treino"},
      fases:{menstrual:"Menstrual",follicular:"Folicular",ovulatory:"Ovulatória",luteal:"Lútea"}
    },
    en:{
      titulo:"Hormonal Phase",
      frase:"Your body has a rhythm. Let's follow it together.",
      faseAtual:"Current phase:",
      botoes:{breath:"💨 Breathing",train:"🏃 Training"},
      fases:{menstrual:"Menstrual",follicular:"Follicular",ovulatory:"Ovulatory",luteal:"Luteal"}
    }
  };
  const L = T[newLang];

  // Reaplica todos os textos
  document.querySelector("h3").textContent = L.titulo;
  document.querySelector(".subtitle").textContent = L.frase;
  document.getElementById("toBreath").textContent = L.botoes.breath;
  document.getElementById("toTrain").textContent  = L.botoes.train;

  // Reaplica nomes de fases e status atual
 const fase = (localStorage.getItem("fase_sugerida") || "menstrual").toLowerCase();
  document.getElementById("centerPhase").textContent = L.fases[fase];
  document.getElementById("t_current").textContent   = `${L.faseAtual} ${L.fases[fase]}`;
  document.getElementById("lbl-menstrual").textContent  = L.fases.menstrual;
  document.getElementById("lbl-follicular").textContent = L.fases.follicular;
  document.getElementById("lbl-ovulatory").textContent  = L.fases.ovulatory;
  document.getElementById("lbl-luteal").textContent     = L.fases.luteal;
});
  </script>
  <script>
window.addEventListener("femflow:langchange", () => {
  const lang = localStorage.getItem("femflow_lang") || "pt";
  const T = {
    pt: {
      titulo: "Treino Diário",
      subtitulo: "Fluxo de movimento e consciência",
      salvar: "💾 Salvar treino",
      descanso: "🌿 Descanso"
    },
    en: {
      titulo: "Daily Workout",
      subtitulo: "Flow of movement and awareness",
      salvar: "💾 Save workout",
      descanso: "🌿 Rest day"
    }
  };
  const L = T[lang];

  document.querySelector("header h1").textContent = L.titulo;
  document.querySelector(".subtitle").textContent = L.subtitulo;
  document.getElementById("salvarTreinoBtn").textContent = L.salvar;
  document.getElementById("descansoBtn").textContent = L.descanso;
});
</script>
</body>
</html>
