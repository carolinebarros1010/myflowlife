<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemFlow Home</title>
    <!--
      FemFlow Home page

      Esta página é o centro de convivência da aluna durante o ciclo.  Aqui
      ela visualiza a fase hormonal atual, pode aceder ao treino de hoje,
      acompanhar a evolução e, principalmente, utilizar técnicas de
      respiração guiadas conforme o seu momento hormonal.  As técnicas
      incorporadas foram desenhadas para momentos específicos do ciclo:
        - "Zen TPM" para acalmar picos de tensão pré‑menstrual (fase lútea).
        - "Equilíbrio Cíclico" para recenterizar a energia durante a
          menstruação.  Utiliza o padrão box breathing 4–4–4–4.
        - "Foco Ovulatório" para ativar foco e clareza durante a fase
          ovulatória.

      Cada botão abre um modal com animação do círculo respiratório,
      contagem regressiva e áudio de inspiração/expiração.  Os ficheiros
      de som encontram‑se na pasta assets/sounds/ e podem ser
      substituídos pelos áudios definitivos conforme necessário.
    -->
    <style>
        :root {
            --color-tpm: #cc6a5a; /* terracota para Zen TPM */
            --color-equilibrio: #efbda6; /* pêssego para Equilíbrio Cíclico */
            --color-foco: #335953; /* teal para Foco Ovulatório */
            --color-background: #fff8f3; /* fundo claro */
            --color-text: #335953;
            --radius-btn: 9999px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        header .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--color-tpm);
        }

        header .greeting {
            font-size: 1.2rem;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        /* simples indicador de fase atual */
        .phase-indicator {
            margin-top: 1rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Seção de respirações guiadas */
        .breathing-section {
            margin-top: 2rem;
            text-align: center;
            width: 100%;
        }

        .breathing-section h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .breathing-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .breath-btn {
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-btn);
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            width: 80%;
            max-width: 300px;
        }

        .breath-btn:hover {
            transform: scale(1.02);
        }

        .tpm-btn {
            background: var(--color-tpm);
            color: #fff;
        }

        .equilibrio-btn {
            background: var(--color-equilibrio);
            color: var(--color-foco);
        }

        .foco-btn {
            background: var(--color-foco);
            color: #fff;
        }

        /* Ações gerais */
        .actions {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            max-width: 300px;
        }

        .actions button {
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-btn);
            border: none;
            background: #eee;
            color: var(--color-foco);
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .actions button:hover {
            background: #ddd;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: var(--color-background);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        .breath-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 1rem auto;
            opacity: 0.2;
            transform: scale(0.5);
        }

        #timer {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .close-btn {
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-btn);
            background: #fff;
            color: var(--color-foco);
            border: 2px solid var(--color-foco);
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">FemFlow</div>
        <div class="greeting">Olá, <span id="aluna-name">aluna</span> 🌸</div>
    </header>

    <main>
        <!-- Indicador simples de fase hormonal -->
        <div class="phase-indicator" id="phase-indicator">Fase atual: —</div>

        <!-- Seção de respiração -->
        <section class="breathing-section">
            <h2>Respire conforme seu momento 🌸</h2>
            <div class="breathing-buttons">
                <button class="breath-btn tpm-btn" onclick="startBreath('tpm')">Zen TPM</button>
                <button class="breath-btn equilibrio-btn" onclick="startBreath('equilibrio')">Equilíbrio Cíclico</button>
                <button class="breath-btn foco-btn" onclick="startBreath('foco')">Foco Ovulatório</button>
            </div>
        </section>

        <!-- Seção de ações principais -->
        <div class="actions">
            <button onclick="goToTreino()">Treino de Hoje</button>
            <button onclick="goToEvolucao()">Minha Evolução</button>
            <button onclick="goToCiclo()">Reconfigurar Ciclo</button>
        </div>
    </main>

    <!-- Modal de respiração -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="breath-title">Título</h3>
            <div id="breath-circle" class="breath-circle"></div>
            <div id="timer">0:00</div>
            <button class="close-btn" onclick="endBreath()">Encerrar sessão</button>
        </div>
    </div>

    <script>
        // Carrega o nome da aluna, se presente no localStorage
        (function() {
            const nome = localStorage.getItem('femflow_nome');
            if (nome) {
                document.getElementById('aluna-name').textContent = nome;
            }
        })();

        // Define as configurações das respirações
        const breathConfigs = {
            tpm: {
                title: 'Zen TPM',
                inhale: 4,
                holdAfterInhale: 0,
                exhale: 6,
                holdAfterExhale: 0,
                durationMinutes: 5,
                color: getComputedStyle(document.documentElement).getPropertyValue('--color-tpm').trim(),
                audioIn: new Audio('assets/sounds/tpm_inspirar.wav'),
                audioOut: new Audio('assets/sounds/tpm_expirar.wav')
            },
            equilibrio: {
                title: 'Equilíbrio Cíclico',
                inhale: 4,
                holdAfterInhale: 4,
                exhale: 4,
                holdAfterExhale: 4,
                durationMinutes: 5,
                color: getComputedStyle(document.documentElement).getPropertyValue('--color-equilibrio').trim(),
                audioIn: new Audio('assets/sounds/equilibrio_inspirar.wav'),
                audioOut: new Audio('assets/sounds/equilibrio_expirar.wav')
            },
            foco: {
                title: 'Foco Ovulatório',
                inhale: 2,
                holdAfterInhale: 2,
                exhale: 4,
                holdAfterExhale: 0,
                durationMinutes: 3,
                color: getComputedStyle(document.documentElement).getPropertyValue('--color-foco').trim(),
                audioIn: new Audio('assets/sounds/foco_inspirar.wav'),
                audioOut: new Audio('assets/sounds/foco_expirar.wav')
            }
        };

        let currentBreath = null;
        let timerInterval = null;
        let breathRunning = false;
        let sessionSecondsRemaining = 0;

        function startBreath(key) {
            if (breathRunning) return;
            currentBreath = breathConfigs[key];
            if (!currentBreath) return;
            breathRunning = true;
            sessionSecondsRemaining = currentBreath.durationMinutes * 60;
            // configurar modal
            document.getElementById('breath-title').textContent = currentBreath.title;
            const circle = document.getElementById('breath-circle');
            circle.style.backgroundColor = currentBreath.color;
            circle.style.opacity = '0.2';
            document.getElementById('modal').classList.remove('hidden');
            updateTimerDisplay();
            // iniciar cronômetro geral
            timerInterval = setInterval(() => {
                sessionSecondsRemaining--;
                updateTimerDisplay();
                if (sessionSecondsRemaining <= 0) {
                    endBreath();
                }
            }, 1000);
            // começar ciclo respiratório
            runBreathCycle();
        }

        function endBreath() {
            // parar sessão
            breathRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('modal').classList.add('hidden');
            // resetar animação
            const circle = document.getElementById('breath-circle');
            circle.style.transform = 'scale(0.5)';
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(sessionSecondsRemaining / 60);
            const seconds = sessionSecondsRemaining % 60;
            const fmt = (n) => (n < 10 ? '0' + n : n);
            document.getElementById('timer').textContent = `${minutes}:${fmt(seconds)}`;
        }

        async function runBreathCycle() {
            while (breathRunning && sessionSecondsRemaining > 0) {
                const cfg = currentBreath;
                // Inspirar
                animateCircle('inhale', cfg.inhale, cfg.color);
                playAudio(cfg.audioIn);
                await sleep(cfg.inhale * 1000);
                if (!breathRunning) break;
                // Pausa após inspirar
                if (cfg.holdAfterInhale > 0) {
                    await sleep(cfg.holdAfterInhale * 1000);
                    if (!breathRunning) break;
                }
                // Expirar
                animateCircle('exhale', cfg.exhale, cfg.color);
                playAudio(cfg.audioOut);
                await sleep(cfg.exhale * 1000);
                if (!breathRunning) break;
                // Pausa após expirar
                if (cfg.holdAfterExhale > 0) {
                    await sleep(cfg.holdAfterExhale * 1000);
                    if (!breathRunning) break;
                }
            }
        }

        function animateCircle(phase, seconds, color) {
            const circle = document.getElementById('breath-circle');
            const scale = phase === 'inhale' ? 1.0 : 0.5;
            circle.style.transition = `transform ${seconds}s ease-in-out, opacity 0.5s`;
            circle.style.transform = `scale(${scale})`;
            // ajustar opacidade para tornar visual mais suave
            circle.style.opacity = phase === 'inhale' ? '0.35' : '0.15';
        }

        function playAudio(audio) {
            try {
                audio.currentTime = 0;
                audio.play();
            } catch (e) {
                // ignorar erros de reprodução silenciosa
            }
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        // Redireciona para outras páginas
        function goToTreino() {
            location.href = 'treino.html';
        }
        function goToEvolucao() {
            location.href = 'evolucao.html';
        }
        function goToCiclo() {
            location.href = 'ciclo.html';
        }

        // Carregar fase atual do localStorage, se existir
        (function() {
            const phase = localStorage.getItem('fase_sugerida');
            if (phase) {
                let faseTxt = '';
                switch (phase) {
                    case 'menstrual': faseTxt = 'Menstrual'; break;
                    case 'folicular': faseTxt = 'Folicular'; break;
                    case 'ovulatoria': faseTxt = 'Ovulatória'; break;
                    case 'lutea': faseTxt = 'Lútea'; break;
                    default: faseTxt = phase;
                }
                document.getElementById('phase-indicator').textContent = 'Fase atual: ' + faseTxt;
            }
        })();
    </script>
</body>
</html>
