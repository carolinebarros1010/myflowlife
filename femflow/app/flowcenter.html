<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/flowcenter.css">
</head>

<body>

<h1 id="tituloApp">
  FemFlow <span id="nivelTag"></span>
</h1>

<h3 id="tituloFlow">—</h3>
<p class="subtitle"id="subFlow">—</p>

<!-- ================================
     CÍRCULO HORMONAL
================================= -->
<div class="phase-wrapper">
  <div class="phase-svg">
      <!-- SVG ORIGINAL -->
      <svg viewBox="0 0 300 300" width="260" height="260">
        <circle cx="150" cy="150" r="120" fill="#fff5ef"></circle>

        <g stroke="#fff5ef" stroke-width="3">
          <path id="seg-menstrual"  d="M150,150 L150,30 A120,120 0 0,1 270,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-follicular" d="M150,150 L270,150 A120,120 0 0,1 150,270 Z" fill="#f9e0d8"></path>
          <path id="seg-ovulatory"  d="M150,150 L150,270 A120,120 0 0,1 30,150 Z"  fill="#f9e0d8"></path>
          <path id="seg-luteal"     d="M150,150 L30,150 A120,120 0 0,1 150,30 Z"  fill="#f9e0d8"></path>
        </g>

        <circle cx="150" cy="150" r="65" fill="none" stroke="#fff5ef" stroke-width="2"></circle>
        <circle cx="150" cy="150" r="63" fill="#cc6a5a"></circle>

        <text id="lbl-menstrual"  x="215" y="95"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(45,215,95)">—</text>
        <text id="lbl-follicular" x="215" y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(135,215,215)">—</text>
        <text id="lbl-ovulatory"  x="85"  y="215" font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(225,85,215)">—</text>
        <text id="lbl-luteal"     x="85"  y="85"  font-family="Playfair Display" font-size="14" font-weight="700" fill="#cc6a5a" text-anchor="middle" transform="rotate(315,85,85)">—</text>

        <text id="centerPhase" x="150" y="155" text-anchor="middle" font-family="Playfair Display" font-size="18" font-weight="700" fill="#fff">—</text>
      </svg>
  </div>
</div>

<div class="current-phase" id="t_current">—</div>

<!-- NAV -->
<div class="toolbar">
  <button class="tool" id="toBreath">💨 —</button>
  <button class="tool" id="toTrain">🏃 —</button>
  <button class="tool" id="toEvolution">📈 —</button>
  <!-- NOVO BOTÃO ENDURANCE -->
<button class="tool" id="toEndurance">🏃‍♂️ Endurance</button>
</div>


<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

<script>
/* ============================================================
   ESCONDER LOADING
============================================================ */
function ffHideLoading() {
  const box = document.getElementById("ff-loading");
  if (box) box.classList.add("hidden");
}

/* ============================================================
   AO CARREGAR A PÁGINA
============================================================ */
document.addEventListener("DOMContentLoaded", async function () {

  /* ============================================================
     NIVEL NO HEADER — COM NORMALIZAÇÃO
  ============================================================ */
  function aplicarNivelH1() {

    let nivelLS = (localStorage.getItem("femflow_nivel") || "")
      .toLowerCase()
      .trim()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 

    if (nivelLS.includes("inicia")) nivelLS = "iniciante";
    else if (nivelLS.includes("inter")) nivelLS = "intermediaria";
    else if (nivelLS.includes("avanc")) nivelLS = "avancada";

    const tag = document.getElementById("nivelTag");
    if (!tag || !nivelLS) return;

    const lang = FEMFLOW.lang || localStorage.getItem("femflow_lang") || "pt";

    const mapaNivel = {
      iniciante: { pt:"Iniciante", en:"Beginner", fr:"Débutante" },
      intermediaria:{ pt:"Intermediária", en:"Intermediate", fr:"Intermédiaire" },
      avancada:{ pt:"Avançada", en:"Advanced", fr:"Avancée" }
    };

    const txt =
      mapaNivel[nivelLS]?.[lang] ||
      mapaNivel[nivelLS]?.pt ||
      nivelLS.charAt(0).toUpperCase() + nivelLS.slice(1);

    tag.textContent = `— ${txt}`;
  }

  document.addEventListener("femflow:ready", aplicarNivelH1);
  document.addEventListener("femflow:langChange", aplicarNivelH1);



  /* ============================================================
     HEADER / MENU / IDIOMA
  ============================================================ */
  FEMFLOW.inserirHeaderApp();
  FEMFLOW.inserirMenuLateral();
  FEMFLOW.inserirModalIdioma?.();



    /* ============================================================
     1) BUSCAR BACKEND (ciclo, nome, nível)
  ============================================================ */
  let perfil = await FEMFLOW.carregarCicloBackend();

  if (!perfil) {
    FEMFLOW.toast(FEMFLOW.langs[FEMFLOW.lang].sistema.erroCiclo, true);
    perfil = {
      nome: localStorage.getItem("femflow_nome") || "",
      fase: localStorage.getItem("femflow_fase") || "follicular",
      diaCiclo: Number(localStorage.getItem("femflow_diaCiclo") || 1),
      nivel: localStorage.getItem("femflow_nivel") || "iniciante",
      produto: localStorage.getItem("femflow_produto") || ""
    };
  }

  // SALVAR NÍVEL RETORNADO DO BACKEND
  if (perfil?.nivel) {
    localStorage.setItem("femflow_nivel", perfil.nivel);
    aplicarNivelH1();
  }

  /* ============================================================
     1.1 DETECTAR PERSONAL E MARCAR NO BODY
  ============================================================ */
  const produtoRaw = (perfil?.produto || "").toLowerCase().trim();
  const isPersonal = produtoRaw === "treino_personal";

  if (isPersonal) {
    FEMFLOW.log("🎨 FlowCenter em modo PERSONAL (produto=treino_personal)");
    document.body.classList.add("personal-mode");
    localStorage.setItem("femflow_personal", "true");
  } else {
    document.body.classList.remove("personal-mode");
    localStorage.removeItem("femflow_personal");
  }

  /* ============================================================
     2) NORMALIZAR FASE
  ============================================================ */
  const faseRaw = (perfil.fase || "follicular").toLowerCase();

  const mapaFase = {
    lutea:"luteal","lútea":"luteal", luteal:"luteal",
    folicular:"follicular", follicular:"follicular",
    ovulatoria:"ovulatory","ovulatório":"ovulatory", ovulatory:"ovulatory",
    menstrual:"menstrual"
  };

  const faseNorm = mapaFase[faseRaw] || "follicular";



  /* ============================================================
     3) APLICAR IDIOMA
  ============================================================ */
  function aplicarIdioma() {
    if (!FEMFLOW.lang)
      FEMFLOW.lang = localStorage.getItem("femflow_lang") || "pt";

    const langObj = FEMFLOW.langs[FEMFLOW.lang];
    if (!langObj?.flowcenter) return;

    const L = langObj.flowcenter;

    const nome = perfil.nome || localStorage.getItem("femflow_nome") || "";
    const first = nome ? nome.split(" ")[0] : L.titulo;

    document.getElementById("tituloFlow").textContent = `${first}, ${L.titulo}`;
    document.getElementById("subFlow").textContent = L.sub;

    const MAP = {
      menstrual:"lbl-menstrual",
      follicular:"lbl-follicular",
      ovulatory:"lbl-ovulatory",
      luteal:"lbl-luteal"
    };

    for (let key in MAP) {
      const el = document.getElementById(MAP[key]);
      if (el) el.textContent = L[key];
    }

    document.getElementById("centerPhase").textContent = L[faseNorm];
    document.getElementById("t_current").textContent = 
      `${langObj.geral.faseAtual}: ${L[faseNorm]}`;

    document.getElementById("toBreath").textContent = `💨 ${langObj.menu.respiracao}`;
    document.getElementById("toTrain").textContent  = `🏃 ${langObj.treino.tituloTopo}`;
    document.getElementById("toEvolution").textContent = `📈 ${langObj.evolucao.titulo}`;
  }

  aplicarIdioma();
  document.addEventListener("femflow:langChange", aplicarIdioma);



  /* ============================================================
     4) COLORIR CÍRCULO
  ============================================================ */
  ["menstrual","follicular","ovulatory","luteal"].forEach(f=>{
    document.getElementById("seg-"+f)?.classList.toggle("path-active", f===faseNorm);
    document.getElementById("lbl-"+f)?.classList.toggle("label-active", f===faseNorm);
  });



   /* ============================================================
     5) NAVEGAÇÃO
  ============================================================ */
  document.getElementById("toBreath").onclick = () => FEMFLOW.router("respiracao.html");

  document.getElementById("toTrain").onclick  = () => {
    const isPersonal =
      document.body.classList.contains("personal-mode") ||
      localStorage.getItem("femflow_personal") === "true";

    const url = isPersonal ? "treino.html?personal=1" : "treino.html";
    FEMFLOW.router(url);
  };

  document.getElementById("toEvolution").onclick = () => FEMFLOW.router("evolucao.html");

  document.getElementById("toEndurance").onclick = () => {
  const id = localStorage.getItem("femflow_id");

  // 🔥 regra:
  // Se ID existir → manda para o treino endurance ID.html
  // Se não existir → manda para página de ofertas
  if (id) {
    FEMFLOW.router(`treinoendurance/${id}.html`);
  } else {
    window.location.href = "https://www.myflowlife.com.br/#ofertas";
  }
};



  ffHideLoading();
});
</script>


<!-- MODAL DE NÍVEL -->
<div id="modal-nivel" class="modal-nivel oculto">
  <div class="modal-nivel-box">
    <h2>📊 Selecione seu nível</h2>

    <button class="nivel-btn" data-nivel="iniciante">Iniciante</button>
    <button class="nivel-btn" data-nivel="intermediaria">Intermediária</button>
    <button class="nivel-btn" data-nivel="avancada">Avançada</button>

    <button id="fecharNivel" class="nivel-fechar">Fechar</button>
  </div>
</div>

<div id="ff-loading" class="ff-loading">
  <div class="ff-loading-box">
    <div class="ff-spinner"></div>
    <p>Carregando…</p>
  </div>
</div>

</body>
</html>
