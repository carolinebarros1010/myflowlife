<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bege: #fff5ef;
      --terracota: #cc6a5a;
      --terracota-light: #f0c5b6;
      --terracota-lighter: #f6d7cc;
      --texto: #5b4f49;
    }

    body {
      margin: 0;
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      text-align: center;
      padding-top: 70px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 2rem;
      margin: 0;
    }

    p {
      margin: 8px 0 20px;
      color: var(--texto);
    }

    .phase-svg {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      position: relative;
    }

    svg {
      display: block;
      margin: 0 auto;
    }

    .current-phase {
      margin-top: 25px;
      font-weight: 700;
      color: var(--terracota);
    }

    .dual-lang {
      font-size: 0.9rem;
      color: #7a6c66;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 25px 0;
    }

    .tool {
      border: 1px solid rgba(204,106,90,0.25);
      background: #fff;
      color: var(--terracota);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: "Lato", sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .tool:hover {
      background: var(--terracota);
      color: #fff;
      transform: scale(1.03);
      transition: all .3s ease;
    }

    /* ✨ animação do brilho pulsante */
    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(204,106,90,0.8)); }
      100% { filter: drop-shadow(0 0 4px rgba(204,106,90,0.4)); }
    }

    .active-glow {
      animation: pulseGlow 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>
</head>

<body>
  <h1>FemFlow</h1>
  <h3>Fase Hormonal</h3>
  <p>Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

<div class="phase-svg">
  <svg id="svgCiclo" viewBox="0 0 300 300" width="260" height="260">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff5ef" />
        <stop offset="100%" stop-color="#fcebe4" />
      </radialGradient>
      <radialGradient id="centerGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#d98775"/>
        <stop offset="100%" stop-color="#cc6a5a"/>
      </radialGradient>

      <style>
        .seg {
          fill: none;
          stroke: #f6d7cc;
          stroke-width: 42;
          stroke-linecap: round;
        }
        .seg.active {
          stroke: #cc6a5a;
          filter: drop-shadow(0 0 4px rgba(204,106,90,.5));
        }
        @keyframes pulseGlow {
          0% { filter: drop-shadow(0 0 4px rgba(204,106,90,.4)); }
          50% { filter: drop-shadow(0 0 14px rgba(204,106,90,.8)); }
          100% { filter: drop-shadow(0 0 4px rgba(204,106,90,.4)); }
        }
        .seg.active.pulse { animation: pulseGlow 3s ease-in-out infinite; }
      </style>
    </defs>

    <!-- anel de fundo -->
    <circle cx="150" cy="150" r="120" fill="url(#bgGrad)" />

    <!-- cada fase = arco com gap entre eles (4° de espaço) -->
    <!-- Menstrual (cima direita) -->
    <path id="seg-menstrual" class="seg"
          d="M150,60 A90,90 0 0,1 240,150" />

    <!-- Folicular (baixo direita) -->
    <path id="seg-follicular" class="seg"
          d="M240,150 A90,90 0 0,1 150,240" />

    <!-- Ovulatória (baixo esquerda) -->
    <path id="seg-ovulatory" class="seg"
          d="M150,240 A90,90 0 0,1 60,150" />

    <!-- Lútea (cima esquerda) -->
    <path id="seg-luteal" class="seg"
          d="M60,150 A90,90 0 0,1 150,60" />

    <!-- nomes curvados -->
    <path id="path-menstrual"  d="M190,70 A100,100 0 0,1 240,120" fill="none"/>
    <path id="path-follicular" d="M240,180 A100,100 0 0,1 190,240" fill="none"/>
    <path id="path-ovulatory"  d="M110,240 A100,100 0 0,1 60,180" fill="none"/>
    <path id="path-luteal"     d="M60,120 A100,100 0 0,1 110,70" fill="none"/>

   <!-- nomes das fases (apenas 1 idioma por vez, controlado via script) -->
<text id="lbl-menstrual"  font-family="Playfair Display" font-size="12" font-weight="700" fill="#cc6a5a">
  <textPath href="#path-menstrual" startOffset="0%">Menstrual</textPath>
</text>
<text id="lbl-follicular" font-family="Playfair Display" font-size="12" font-weight="700" fill="#cc6a5a">
  <textPath href="#path-follicular" startOffset="0%">Folicular</textPath>
</text>
<text id="lbl-ovulatory"  font-family="Playfair Display" font-size="12" font-weight="700" fill="#cc6a5a">
  <textPath href="#path-ovulatory" startOffset="0%">Ovulatória</textPath>
</text>
<text id="lbl-luteal"     font-family="Playfair Display" font-size="12" font-weight="700" fill="#cc6a5a">
  <textPath href="#path-luteal" startOffset="0%">Lútea</textPath>
</text>

    <!-- círculo central com brilho -->
    <circle cx="150" cy="150" r="70" fill="url(#centerGrad)" />
    <text id="centerPhase" x="150" y="155" text-anchor="middle"
          font-family="Playfair Display" font-size="18" font-weight="700" fill="#fff">—</text>
  </svg>
</div>


  <div class="current-phase" id="t_current">Fase atual: —</div>
  <div class="dual-lang" id="t_current_en">Current phase: —</div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração / <i>Breath</i></button>
    <button class="tool" id="toTrain">🏃 Treino / <i>Training</i></button>
  </div>

  <script src="./femflow-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FEMFLOW.inserirHeaderApp();

      const ciclo = parseInt(localStorage.getItem('femflow_cycleLength') || 28);
      const inicio = new Date(localStorage.getItem('femflow_startDate') || new Date());
      const diff = Math.floor((new Date() - inicio) / (1000*60*60*24));
      const dia = (diff % ciclo) + 1;

      function faseAtual(d) {
        if (d <= 5) return 'menstrual';
        if (d <= 13) return 'follicular';
        if (d <= 17) return 'ovulatory';
        return 'luteal';
      }

      const fase = faseAtual(dia);
      const nomes = {
        menstrual: ['Menstrual', 'Menstrual'],
        follicular: ['Folicular', 'Follicular'],
        ovulatory: ['Ovulatória', 'Ovulatory'],
        luteal: ['Lútea', 'Luteal']
      };

      // Resetar fatias
      document.querySelectorAll('[id^="arc-"]').forEach(el => {
        el.setAttribute('fill', '#f6d7cc');
        el.classList.remove('active-glow');
      });

      // Ativar a fase correta
      const ativa = document.getElementById('arc-' + fase);
      ativa.setAttribute('fill', '#cc6a5a');
      ativa.classList.add('active-glow');

      // Atualizar textos centrais
      document.getElementById('centerPhase').textContent = nomes[fase][0];
      document.getElementById('t_current').textContent = `Fase atual: ${nomes[fase][0]}`;
      document.getElementById('t_current_en').textContent = `Current phase: ${nomes[fase][1]}`;

      // Botões
      document.getElementById('toBreath').onclick = () => FEMFLOW.router('respiracao');
      document.getElementById('toTrain').onclick = () => FEMFLOW.router('treino');
    });
  </script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const lang = localStorage.getItem('femflow_lang') || 'pt';

  // traduções completas
  const T = {
    pt: {
      hormonal: "Fase Hormonal",
      frase: "Seu corpo tem um ritmo. Vamos acompanhar juntas.",
      faseAtual: "Fase atual:",
      botoes: { breath: "💨 Respiração", train: "🏃 Treino" },
      fases: {
        menstrual: "Menstrual",
        follicular: "Folicular",
        ovulatory: "Ovulatória",
        luteal: "Lútea"
      }
    },
    en: {
      hormonal: "Hormonal Phase",
      frase: "Your body has a rhythm. Let's follow it together.",
      faseAtual: "Current phase:",
      botoes: { breath: "💨 Breathing", train: "🏃 Training" },
      fases: {
        menstrual: "Menstrual",
        follicular: "Follicular",
        ovulatory: "Ovulatory",
        luteal: "Luteal"
      }
    }
  };

  // textos fixos
  const L = T[lang];
  document.querySelector("h3")?.textContent = L.hormonal;
  document.querySelector("p")?.textContent = L.frase;
  document.getElementById("t_current")?.textContent = `${L.faseAtual} —`;

  // nomes curvados no SVG
  for (const f of ["menstrual","follicular","ovulatory","luteal"]) {
    const el = document.querySelector(`#lbl-${f} textPath`);
    if (el) el.textContent = L.fases[f];
  }

  // botões
  const btnB = document.getElementById("toBreath");
  const btnT = document.getElementById("toTrain");
  if (btnB) btnB.innerHTML = `${L.botoes.breath}`;
  if (btnT) btnT.innerHTML = `${L.botoes.train}`;

  // ações
  btnB?.addEventListener('click', () => FEMFLOW.router('respiracao'));
  btnT?.addEventListener('click', () => FEMFLOW.router('treino'));
});
</script>
</body>
</html>
