<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FemFlow • Flow Center</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root{
      --bege:#fff5ef;
      --terracota:#cc6a5a;
      --terracota-light:#eabbaa;
      --texto:#5b4f49;
    }
    body{
      margin:0;background:var(--bege);color:var(--texto);
      font-family:"Lato", sans-serif;text-align:center;
      overflow-x:hidden;
    }
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 18px;
    }
    .lang{
      display:flex;gap:8px;align-items:center;
      background:#fff;border-radius:20px;padding:4px 10px;
      border:1px solid rgba(204,106,90,0.25);
    }
    .lang button{
      border:none;background:transparent;font-weight:700;cursor:pointer;
      color:var(--texto);opacity:.6
    }
    .lang button.active{opacity:1;color:var(--terracota)}
    .brand{
      display:flex;align-items:center;justify-content:center;margin:8px auto 0;gap:8px;
    }
    .brand img{width:40px;height:40px;border-radius:12px}
    .brand h1{font-family:"Playfair Display",serif;font-size:1.8rem;color:var(--terracota);margin:0}
    .card{
      background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.06);
      padding:20px;margin:16px auto;max-width:400px;
    }
    h3{font-family:"Playfair Display",serif;margin:.5rem 0;color:var(--terracota)}
    p.subtitle{margin-top:.2rem;font-size:.9rem;opacity:.8}

    /* Circle container */
    .circle-wrap{position:relative;width:260px;height:260px;margin:12px auto;}
    svg{width:100%;height:100%;transform:rotate(-90deg)}
    .phase-label{
      position:absolute;font-family:"Playfair Display",serif;font-weight:700;
      font-size:.85rem;color:#7a6c66;
    }
    .p-menstrual  { top:78%; left:14%;}
    .p-follicular { top:10%; left:20%;}
    .p-ovulatory  { top:10%; right:18%;}
    .p-luteal     { top:76%; right:16%;}
    .current-phase{margin:.4rem 0 0;font-weight:800;color:var(--terracota)}
    .current-hint{margin:0;opacity:.75;font-size:.9rem;font-style:italic}
    .cta{
      display:block;width:90%;max-width:400px;margin:20px auto 28px;padding:14px 18px;
      border:none;border-radius:14px;background:var(--terracota);color:#fff;
      font-weight:800;letter-spacing:.2px;cursor:pointer;
      box-shadow:0 10px 18px rgba(204,106,90,.2)
    }
    .toolbar{display:flex;gap:12px;justify-content:center;margin:6px 0 20px}
    .tool{
      border:1px solid rgba(204,106,90,0.25);background:#fff;color:var(--terracota);
      padding:8px 12px;border-radius:12px;font-weight:700;cursor:pointer;
    }
    select{
      background:#fff;border:1px solid rgba(204,106,90,0.25);
      border-radius:10px;padding:6px 10px;font-weight:600;color:var(--texto);
      margin:12px auto 6px;
    }
  </style>
 <script>
  (async function(){
    const id = localStorage.getItem('femflow_id');
    if(!id){ location.href='login.html?ret=flowcenter.html'; return; }

    const hasStart = !!localStorage.getItem('femflow_startDate');
    const hasLen   = !!localStorage.getItem('femflow_cycleLength');
    if(!(hasStart && hasLen)){ location.href='ciclo.html'; return; }

    // Opcional: sincronizar direitos (quando tiver o endpoint pronto)
    // await syncEntitlement();
    // if(!hasEntitlement()){ location.href='home.html'; return; }
  })();
</script>
</head>
<body>
  <div class="topbar">
    <div></div>
    <div class="lang">
      <button id="btnPT" class="active">PT</button>
      <span>•</span>
      <button id="btnEN"><i>EN</i></button>
    </div>
  </div>

  <div class="brand">
    <img src="./assets/logofemflowterracotasf.png" alt="FemFlow logo"/>
    <h1>FemFlow</h1>
  </div>

  <div class="card">
    <h3 id="t_hormonalPhase">Fase hormonal</h3>
    <p id="t_hormonalHint" class="subtitle">Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

    <div class="circle-wrap">
      <svg viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="110" fill="none" stroke="#f3e0d9" stroke-width="22"/>
        <circle id="progressArc" cx="150" cy="150" r="110"
          fill="none" stroke="#cc6a5a" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="0 690"/>
        <circle cx="150" cy="150" r="70" fill="#f8ece7" stroke="#efd0c7" stroke-width="1"/>
        <text id="centerPhase" x="150" y="140" text-anchor="middle"
              font-family="Playfair Display,serif" font-size="18" font-weight="700" fill="#cc6a5a">—</text>
        <text id="centerDay" x="150" y="165" text-anchor="middle"
              font-family="Lato,sans-serif" font-size="13" fill="#7a6c66">—</text>
      </svg>
      <div class="phase-label p-follicular" id="lblFollicular">Folicular</div>
      <div class="phase-label p-ovulatory" id="lblOvulatory">Ovulatória</div>
      <div class="phase-label p-luteal" id="lblLuteal">Lútea</div>
      <div class="phase-label p-menstrual" id="lblMenstrual">Menstrual</div>
    </div>

    <p class="current-phase" id="t_current">Fase atual: —</p>
    <p class="current-hint" id="t_hint"><i>—</i></p>

    <select id="cycleSelect">
      <option value="28">28 dias</option>
      <option value="29">29 dias</option>
      <option value="30">30 dias</option>
      <option value="31">31 dias</option>
      <option value="32">32 dias</option>
      <option value="33">33 dias</option>
      <option value="34">34 dias</option>
      <option value="35">35 dias</option>
    </select>
  </div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração / <i>Breath</i></button>
    <button class="tool" id="toTrain">🏃 Treino / <i>Training</i></button>
  </div>

  <button class="cta" id="startBtn">Iniciar ciclo de 5 minutos / <i>Start 5-min cycle</i></button>

  <script>
    /* -------- I18N texts -------- */
    const T = {
      pt:{phases:{menstrual:"Menstrual",follicular:"Folicular",ovulatory:"Ovulatória",luteal:"Lútea"},
          hint:{menstrual:"Recuperação e introspecção",follicular:"Crescimento e energia crescente",
                 ovulatory:"Pico de fertilidade e confiança",luteal:"Regulação emocional e aterramento"},
          current:"Fase atual"},
      en:{phases:{menstrual:"Menstrual",follicular:"Follicular",ovulatory:"Ovulatory",luteal:"Luteal"},
          hint:{menstrual:"Recovery and introspection",follicular:"Growth and rising energy",
                 ovulatory:"Peak fertility and confidence",luteal:"Emotional regulation and grounding"},
          current:"Current phase"}
    };
    let LANG = localStorage.getItem("femflow_lang")||"pt";
    const $=s=>document.querySelector(s);

    function applyLang(){
      document.getElementById("btnPT").classList.toggle("active",LANG==="pt");
      document.getElementById("btnEN").classList.toggle("active",LANG==="en");
      const l=LANG==="pt"?T.pt:T.en;
      $("#lblMenstrual").innerHTML=l.phases.menstrual;
      $("#lblFollicular").innerHTML=l.phases.follicular;
      $("#lblOvulatory").innerHTML=l.phases.ovulatory;
      $("#lblLuteal").innerHTML=l.phases.luteal;
      renderPhaseUI();
    }
    $("#btnPT").onclick=()=>{LANG="pt";localStorage.setItem("femflow_lang","pt");applyLang()};
    $("#btnEN").onclick=()=>{LANG="en";localStorage.setItem("femflow_lang","en");applyLang()};

    /* -------- Progress engine -------- */
    let ciclo_duracao=parseInt(localStorage.getItem("femflow_cycleLength"))||28;
    let startDate=new Date(localStorage.getItem("femflow_startDate")||new Date());
    localStorage.setItem("femflow_startDate",startDate.toISOString());
    const circumference=2*Math.PI*110;

    function calcDia(){
      const diff=Math.floor((new Date()-new Date(startDate))/(1000*60*60*24));
      return (diff%ciclo_duracao)+1;
    }

    let diaCiclo=calcDia();
    $("#cycleSelect").value=ciclo_duracao;
    $("#cycleSelect").addEventListener("change",e=>{
      ciclo_duracao=parseInt(e.target.value);
      localStorage.setItem("femflow_cycleLength",ciclo_duracao);
      renderAll();
    });

    function phaseFromDay(d){
      if(d<=5) return"menstrual";
      if(d<=13)return"follicular";
      if(d<=17)return"ovulatory";
      return"luteal";
    }

    function renderArc(){
      const progress=(diaCiclo/ciclo_duracao);
      const dash=(circumference*progress).toFixed(1);
      $("#progressArc").setAttribute("stroke-dasharray",`${dash} ${circumference}`);
      $("#progressArc").style.transition="stroke-dasharray 2s linear";
    }

    function renderPhaseUI(){
      const l=LANG==="pt"?T.pt:T.en;
      const fase=phaseFromDay(diaCiclo);
      const nome=l.phases[fase];
      const dica=l.hint[fase];
      $("#centerPhase").textContent=nome;
      $("#centerDay").textContent=`${diaCiclo}/${ciclo_duracao}`;
      $("#t_current").innerHTML=`${LANG==="pt"?l.current:"<i>"+l.current+"</i>"}: ${nome}`;
      $("#t_hint").innerHTML=LANG==="pt"?dica:"<i>"+dica+"</i>";
      ["Menstrual","Follicular","Ovulatory","Luteal"].forEach(k=>{
        const el=$("#lbl"+k);
        el.style.color=k.toLowerCase().includes(fase.slice(0,4))?"#cc6a5a":"#7a6c66";
        el.style.opacity=k.toLowerCase().includes(fase.slice(0,4))?"1":".6";
      });
    }

    function renderAll(){diaCiclo=calcDia();renderArc();renderPhaseUI();}
    applyLang();renderAll();

    // animação automática (progressão diária)
    setInterval(()=>{renderAll()},1000*60*60); // atualiza a cada hora

    // auto-giro suave
    let angle=0;
    setInterval(()=>{
      angle+=.02;document.querySelector("svg").style.transform=`rotate(${angle-90}deg)`
    },100);

    // botões
    $("#toBreath").onclick=()=>location.href="respiracao.html";
    $("#toTrain").onclick=()=>location.href="treino.html";
    $("#startBtn").onclick=()=>location.href="respiracao.html";
  </script>
<script>
  (async function(){
    // já passou login + ciclo no guard do <head>
    await syncEntitlement();
    if (!hasEntitlement()) {
      // Sem direito ativo: manda de volta p/ Home para escolher novo programa
      location.href = 'home.html';
      return;
    }

    // aqui segue normalmente (sua renderização do arco, textos e botões)
    // ... (seu código atual permanece)
  })();
</script>
  <!-- Core no caminho solicitado -->
  <script src="./femflow-core.js"></script>
  <script>
  // Checa se há direito ativo (programa não expirado)
  function hasEntitlement() {
    const sku = localStorage.getItem('femflow_program');
    const exp = localStorage.getItem('femflow_program_expiry');
    if (!sku || !exp) return false;
    return new Date() <= new Date(exp);
  }

  // Sincroniza com o Apps Script (action=status) usando e-mail salvo no login
  async function syncEntitlement() {
    try {
      const email = localStorage.getItem('femflow_email') || '';
      if (!email || !window.FEMFLOW?.SCRIPT_URL) return;

      const url = `${FEMFLOW.SCRIPT_URL}?action=status&email=${encodeURIComponent(email)}`;
      const r = await fetch(url);
      const j = await r.json();

      if (j?.id) localStorage.setItem('femflow_id', j.id);
      if (j?.program) localStorage.setItem('femflow_program', j.program);
      else localStorage.removeItem('femflow_program');

      if (j?.expiryISO) localStorage.setItem('femflow_program_expiry', j.expiryISO);
      else localStorage.removeItem('femflow_program_expiry');

      if (j?.cycle?.startDate) localStorage.setItem('femflow_startDate', j.cycle.startDate);
      if (j?.cycle?.length)    localStorage.setItem('femflow_cycleLength', j.cycle.length);
    } catch(e) {
      console.warn('syncEntitlement failed', e);
    }
  }
</script>
</body>
</html>
