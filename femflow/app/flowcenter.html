<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bege: #fff5ef;
      --terracota: #cc6a5a;
      --terracota-light: #f0c5b6;
      --terracota-lighter: #f6d7cc;
      --texto: #5b4f49;
    }

    body {
      margin: 0;
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      text-align: center;
      padding-top: 70px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--terracota);
      margin: 10px 0;
    }

    h3 {
      color: var(--terracota);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .phase-circle {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 25px auto;
      border-radius: 50%;
      background: conic-gradient(
        var(--terracota-light) 0deg 90deg,
        var(--terracota-lighter) 90deg 180deg,
        var(--terracota-lighter) 180deg 270deg,
        var(--terracota-lighter) 270deg 360deg
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phase-circle.active-menstrual {
      background: conic-gradient(
        var(--terracota) 0deg 90deg,
        var(--terracota-lighter) 90deg 180deg,
        var(--terracota-lighter) 180deg 270deg,
        var(--terracota-lighter) 270deg 360deg
      );
    }

    .phase-circle.active-follicular {
      background: conic-gradient(
        var(--terracota-lighter) 0deg 90deg,
        var(--terracota) 90deg 180deg,
        var(--terracota-lighter) 180deg 270deg,
        var(--terracota-lighter) 270deg 360deg
      );
    }

    .phase-circle.active-ovulatory {
      background: conic-gradient(
        var(--terracota-lighter) 0deg 180deg,
        var(--terracota) 180deg 270deg,
        var(--terracota-lighter) 270deg 360deg
      );
    }

    .phase-circle.active-luteal {
      background: conic-gradient(
        var(--terracota-lighter) 0deg 270deg,
        var(--terracota) 270deg 360deg
      );
    }

    .inner-circle {
      width: 130px;
      height: 130px;
      background: var(--terracota);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .phase-labels {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--texto);
    }

    .phase-labels div {
      position: absolute;
      font-size: 0.85rem;
      width: 100px;
      text-align: center;
      color: #9c8a84;
    }

    .lbl-menstrual { top: -12px; left: 50%; transform: translateX(-50%); }
    .lbl-follicular { right: -40px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: left center; }
    .lbl-ovulatory { bottom: -14px; left: 50%; transform: translateX(-50%); }
    .lbl-luteal { left: -40px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: right center; }

    .current-phase {
      margin-top: 25px;
      font-weight: 700;
      color: var(--terracota);
    }

    .dual-lang {
      font-size: 0.9rem;
      color: #7a6c66;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 25px 0;
    }

    .tool {
      border: 1px solid rgba(204,106,90,0.25);
      background: #fff;
      color: var(--terracota);
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: "Lato", sans-serif;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .tool:hover {
      background: var(--terracota);
      color: #fff;
      transform: scale(1.03);
      transition: all .3s ease;
    }
  </style>
</head>

<body>
  <h1>FemFlow</h1>
  <h3>Fase Hormonal</h3>
  <p>Seu corpo tem um ritmo. Vamos acompanhar juntas.</p>

  <div class="phase-circle" id="circle">
    <div class="phase-labels">
      <div class="lbl-menstrual">Menstrual</div>
      <div class="lbl-follicular">Folicular</div>
      <div class="lbl-ovulatory">Ovulatória</div>
      <div class="lbl-luteal">Lútea</div>
    </div>
    <div class="inner-circle" id="centerPhase">—</div>
  </div>

  <div class="current-phase" id="t_current">Fase atual: —</div>
  <div class="dual-lang" id="t_current_en">Current phase: —</div>

  <div class="toolbar">
    <button class="tool" id="toBreath">💨 Respiração / <i>Breath</i></button>
    <button class="tool" id="toTrain">🏃 Treino / <i>Training</i></button>
  </div>

  <script src="./femflow-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FEMFLOW.inserirHeaderApp();

      const ciclo = parseInt(localStorage.getItem('femflow_cycleLength') || 28);
      const inicio = new Date(localStorage.getItem('femflow_startDate') || new Date());
      const diff = Math.floor((new Date() - inicio) / (1000*60*60*24));
      const dia = (diff % ciclo) + 1;

      function faseAtual(d){
        if(d <= 5) return 'menstrual';
        if(d <= 13) return 'follicular';
        if(d <= 17) return 'ovulatory';
        return 'luteal';
      }

      const fase = faseAtual(dia);
      const nomes = {
        menstrual:['Menstrual','Menstrual'],
        follicular:['Folicular','Follicular'],
        ovulatory:['Ovulatória','Ovulatory'],
        luteal:['Lútea','Luteal']
      };

      const circle = document.getElementById('circle');
      circle.classList.add('active-' + fase);
      document.getElementById('centerPhase').textContent = nomes[fase][0];
      document.getElementById('t_current').textContent = `Fase atual: ${nomes[fase][0]}`;
      document.getElementById('t_current_en').textContent = `Current phase: ${nomes[fase][1]}`;

      // Botões
      document.getElementById('toBreath').onclick = () => FEMFLOW.router('respiracao');
      document.getElementById('toTrain').onclick = () => FEMFLOW.router('treino');
    });
  </script>
</body>
</html>
