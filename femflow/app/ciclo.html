<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Momento • FemFlow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracota: #cc6a5a;
      --bege: #fff5ef;
      --verde: #335953;
      --texto: #5b4f49;
    }
    body {
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: "Playfair Display", serif;
      color: var(--terracota);
      margin-bottom: 8px;
    }
    p.sub {
      color: #7b6e68;
      margin-bottom: 28px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      max-width: 440px;
      margin: 0 auto 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      color: var(--verde);
    }
    input, button, select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #e6d8d2;
      border-radius: 10px;
      font-size: 1rem;
      font-family: "Lato", sans-serif;
      box-sizing: border-box;
    }
    button {
      background: var(--verde);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: all .3s ease;
      margin-top: 16px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:hover { background: var(--terracota); }

    .perfil-btns {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .perfil-btn {
      flex: 1 1 45%;
      background: #fff;
      border: 2px solid var(--verde);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      font-weight: 700;
      color: var(--verde);
      transition: all .3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .perfil-btn.active {
      background: var(--verde);
      color: #fff;
    }

    .quiz-box { display: none; margin-top: 20px; }
    .quiz-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }
    .quiz-btns button { width: 40%; }
  </style>
</head>

<body>
  <h1>Identifique seu momento</h1>
  <p class="sub">Vamos ajustar seus treinos ao seu ciclo atual 🌸</p>

  <div class="card">
    <h3>Seu perfil hormonal</h3>
    <div class="perfil-btns">
      <button type="button" class="perfil-btn" data-perfil="regular">Regular</button>
      <button type="button" class="perfil-btn" data-perfil="irregular">Irregular</button>
      <button type="button" class="perfil-btn" data-perfil="diu">Uso DIU</button>
      <button type="button" class="perfil-btn" data-perfil="menopausa">Menopausa</button>
    </div>

    <!-- REGULAR -->
    <div id="regularBox" style="display:none;">
      <label for="dataUltima">Data da última menstruação</label>
      <input type="date" id="dataUltima">
      <label for="duracao">Duração média (dias)</label>
      <input type="number" id="duracao" min="21" max="35" value="28">
      <button type="button" id="btnConfirmarRegular">Confirmar</button>
    </div>

    <!-- QUIZ -->
    <div id="quizBox" class="quiz-box">
      <p id="quizPergunta">Pronta?</p>
      <div class="quiz-btns">
        <button type="button" id="btnQuizSim">Sim</button>
        <button type="button" id="btnQuizNao">Não</button>
      </div>
      <p id="quizStep" style="margin-top:8px;color:#94786f;font-size:.9rem"></p>
    </div>
  </div>

  <p style="font-size:.9rem;color:#9a8077;margin-top:12px;">
    As informações servem apenas para adaptar os treinos ao seu corpo. 💫
  </p>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="./femflow-core.js"></script>

<script>
/* ================= HELPERS ================= */

function parseDateLocalYYYYMMDD(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}

function bindTap(el, handler){
  if(!el) return;
  let fired=false;
  el.addEventListener('touchstart', ()=>{fired=true;handler();}, {passive:true});
  el.addEventListener('click', e=>{ if(!fired) handler(); fired=false; });
}

/* ================= VARIÁVEIS ================= */

let perfil=null, quizIdx=0, quizScore=0;

const perguntas=[
  "Você sentiu variações fortes de energia nos últimos dias?",
  "Percebeu sensibilidade nos seios ou inchaço?",
  "Teve oscilações de humor sem motivo aparente?",
  "Está dormindo pior ou suando mais que o normal?",
  "Sente cólica, dor pélvica ou leve sangramento?"
];

const quizPerg=document.getElementById('quizPergunta');
const quizStep=document.getElementById('quizStep');
const regularBox=document.getElementById('regularBox');
const quizBox=document.getElementById('quizBox');


/* ================= PERFIL ================= */

document.querySelectorAll('.perfil-btn').forEach(btn=>{
  bindTap(btn, ()=>{
    document.querySelectorAll('.perfil-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    perfil=btn.dataset.perfil;

    regularBox.style.display = (perfil==='regular') ? 'block' : 'none';
    quizBox.style.display     = (perfil==='regular') ? 'none'  : 'block';

    if (perfil !== 'regular') iniciarQuiz();
  });
});


/* ================= QUIZ ================= */

function iniciarQuiz(){
  quizIdx=0; 
  quizScore=0;
  quizPerg.textContent = perguntas[0];
  quizStep.textContent = `Pergunta 1 de ${perguntas.length}`;
  quizBox.style.display='block';
}

function responderQuiz(v){
  quizScore += v ? 1 : 0;
  quizIdx++;

  if (quizIdx < perguntas.length){
    quizPerg.textContent = perguntas[quizIdx];
    quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntas.length}`;
  } else {
    concluirQuiz();
  }
}

function concluirQuiz(){
  let fase = quizScore<=2 ? 'folicular'
           : quizScore<=3 ? 'ovulatoria'
           : quizScore<=4 ? 'lutea'
           : 'menstrual';

  salvarCiclo({
    perfil,
    faseCalc: fase.toLowerCase()
  });
}

bindTap(document.getElementById('btnQuizSim'), ()=>responderQuiz(true));
bindTap(document.getElementById('btnQuizNao'), ()=>responderQuiz(false));


/* ================= CONFIRMAR REGULAR ================= */

bindTap(document.getElementById('btnConfirmarRegular'), ()=>{

  const s   = document.getElementById('dataUltima').value;
  const len = parseInt(document.getElementById('duracao').value||28,10);

  if(!s || len<21 || len>35){
    alert('Preencha corretamente data e duração do ciclo.');
    return;
  }

  const start  = parseDateLocalYYYYMMDD(s);
  const today  = new Date();
  const umDia  = 24*60*60*1000;
  let diff     = Math.floor((today - start) / umDia);

  if (diff < 0) diff = 0;

  let diaRaw   = ((diff % len) + len) % len;
  const diaCiclo = diaRaw === 0 ? 1 : diaRaw + 1;

  let fase;
  if (diaCiclo <= 5)       fase = "menstrual";
  else if (diaCiclo <=13)  fase = "follicular";
  else if (diaCiclo <=17)  fase = "ovulatory";
  else                     fase = "luteal";

  salvarCiclo({
    perfil:'regular',
    start,
    length: len,
    faseCalc: fase,
    dia: diaCiclo
  });

});


/* ================= SALVAR CICLO (FINAL OFICIAL) ================= */

function salvarCiclo({perfil, start, length, faseCalc, dia}){

  // SAVE LOCAL
  localStorage.setItem('femflow_perfilHormonal', perfil);
  localStorage.setItem('femflow_cycle_configured','yes');
  localStorage.setItem('femflow_program_active','yes');
  localStorage.setItem('femflow_program_startISO', new Date().toISOString());

  let faseFinal = (faseCalc || 'menstrual').toLowerCase();

  if (perfil === 'regular'){
    const dataInicio = start instanceof Date ? start : new Date(start);
    localStorage.setItem('femflow_startDate', dataInicio.toISOString());
    localStorage.setItem('femflow_cycleLength', String(length || 28));
    localStorage.setItem('dia_ciclo', String(dia || 1));
  } else {
    // irregular
    const map = {
      follicular:"follicular",
      ovulatory:"ovulatory",
      ovulatoria:"ovulatory",
      luteal:"luteal",
      lutea:"luteal",
      menstrual:"menstrual"
    };
    faseFinal = map[faseCalc] || faseCalc || "follicular";

    let diaSim = faseFinal==="follicular"?6:
                 faseFinal==="ovulatory"?14:
                 faseFinal==="luteal"?18:1;

    localStorage.setItem('femflow_startDate', new Date().toISOString());
    localStorage.setItem('femflow_cycleLength', '28');
    localStorage.setItem('dia_ciclo', String(diaSim));
  }

  // new official key
  localStorage.setItem("femflow_fase_atual", faseFinal);

  // remove old
  localStorage.removeItem("fase_sugerida");
  localStorage.removeItem("fase_atual");

  localStorage.setItem('femflow_perfilHormonal_locked','yes');

  (window.FEMFLOW?.toast || alert)("✨ Ciclo configurado com sucesso!");

  atualizarFaseBackend(faseFinal);

  const prox = localStorage.getItem('femflow_enfase') ? 'flowcenter.html' : 'home.html';
  setTimeout(()=>location.href=prox, 900);
}

/* ================= BACKEND ================= */

async function atualizarFaseBackend(fase){
  const id = localStorage.getItem("femflow_id");
  if (!id) return;

  try {
    await fetch(FEMFLOW.SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"setfase",
        id,
        fase
      })
    });
    console.log("✅ fase enviada backend:", fase);
  } catch(err){
    console.warn("⚠️ erro enviando fase:", err);
  }
}

</script>
</body>
</html>
