<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identifique seu Ciclo - FemFlow</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, var(--pessego), var(--terracota));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: 'Playfair Display', serif;
        font-size: 1.6rem;
        text-align: center;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease-in-out;
      }
      .welcome-overlay.show {
        opacity: 1;
        pointer-events: all;
      }
      @keyframes pulseGlow {
        0%,100% { text-shadow: 0 0 5px rgba(255,255,255,0.4); }
        50% { text-shadow: 0 0 20px rgba(255,255,255,0.8); }
      }
      .welcome-overlay p {
        animation: pulseGlow 2.2s infinite;
      }
    </style>
  </head>

  <body>
   <header class="header-ciclo">
  <h1 class="titulo-ciclo">Identifique seu ciclo</h1>
  <p class="subtitulo-ciclo">Ajuste seu treino ao seu ritmo</p>
</header>

    <div class="container">
  <!-- ============================= -->
  <!-- 🌿 SEÇÃO SUPERIOR: CONFIGURAR NOVO CICLO -->
  <!-- ============================= -->
  <div class="section" id="cicloSection">
    <h3>Configurar novo ciclo</h3>

    <label for="dataUltima">Data da última menstruação</label>
    <input type="date" id="dataUltima" placeholder="Selecione a data" />

    <label for="duracao">Duração média do ciclo (dias)</label>
    <input type="number" id="duracao" min="21" max="35" value="28" />

    <button id="btnIniciar">Iniciar Programa</button>
  </div>

  <!-- ============================= -->
  <!-- 🔹 BOTÕES LADO A LADO – OPÇÕES DE CICLO -->
  <!-- ============================= -->
  <div class="opcoes-ciclo">
    <button class="btn-pequeno" onclick="abrirQuiz('irregular')">Sou irregular</button>
    <button class="btn-pequeno" onclick="abrirQuiz('diu')">Uso DIU</button>
    <button class="btn-pequeno" onclick="abrirQuiz('menopausa')">Estou na menopausa</button>
  </div>

  <!-- ============================= -->
  <!-- 🌸 MODAL DO QUIZ HORMONAL -->
  <!-- ============================= -->
  <div id="quizModal" class="quiz-modal">
    <div class="quiz-content">
      <h3 id="quizPergunta">Pergunta aqui...</h3>
      <div id="quizRespostas" class="quiz-respostas"></div>
      <button class="btn" style="margin-top:1rem;"
        onclick="document.getElementById('quizModal').style.display='none'">Fechar</button>
    </div>
  </div>

  <!-- ============================= -->
  <!-- 🩷 SEÇÃO INFERIOR: ACESSO COM ID -->
  <!-- ============================= -->
  <div class="section" id="idSection">
    <h3>Já tem um ID?</h3>
    <input type="text" id="inputID" placeholder="FF-AAAA-XXXX" />
    <button id="btnValidar">Continuar</button>
    <p id="statusID" style="margin-top:0.5rem; font-size:0.9rem;"></p>
  </div>

  <!-- 🔑 LINK DE RECUPERAÇÃO DE ID -->
  <p style="text-align:center; margin-top:1rem;">
    <button class="btn-recuperar" onclick="mostrarRecuperar()">🔑 Esqueceu seu ID?</button>
  </p>

  <!-- 📩 BOX DE RECUPERAÇÃO DE ID -->
  <div id="recuperarBox" class="recuperar-box" style="display:none;">
    <input type="text" id="nomeRec" placeholder="Seu nome completo" required />
    <input type="email" id="emailRec" placeholder="Seu e-mail cadastrado" required />
    <button class="btn" style="background:var(--terracota);" onclick="recuperarID()">Recuperar ID</button>
    <p id="statusRec" style="margin-top:0.5rem; font-size:0.9rem;"></p>
  </div>
</div>
    <!-- Tela de boas-vindas -->
    <div id="welcomeOverlay" class="welcome-overlay">
      <p>✨ Bem-vinda ao seu ciclo FemFlow!</p>
    </div>
    
<!-- 📲 Botão flutuante de instalação -->
<div class="instalar-app">
  <h3>📲 Instale o FemFlow</h3>
  <p>Tenha acesso rápido aos seus treinos e fases do ciclo direto da tela inicial.</p>
  <button id="btnInstall" class="btn-install">Adicionar à tela inicial</button>
</div>

    <script src="./js/memoria.js"></script>
    <script src="./js/validacao.js"></script>
    <script src="./js/ciclo.js"></script>

    <script>
      async function validarID(id) {
        try {
          const response = await fetch(
            `https://script.google.com/macros/s/AKfycbyrSiF2ev6gNmmSB2BtsWgFNV24-0nZWjl5MqBd7RwceMfs0ClQGOqG_AQ1McfvWcQ/exec?id=${encodeURIComponent(id)}`,
            { method: "GET", mode: "cors" }
          );
          const data = await response.json();
          console.log("Retorno do servidor:", data);
          return data.valido === true || data.status === "ok";
        } catch (err) {
          console.error("Erro de validação:", err);
          return false;
        }
      }

      document.getElementById("btnValidar").addEventListener("click", async () => {
        const id = document.getElementById("inputID").value.trim();
        const status = document.getElementById("statusID");

        if (!id) {
          status.innerText = "Por favor, insira seu ID FemFlow.";
          status.style.color = "#CC6A5A";
          return;
        }

        status.innerText = "🔄 Verificando ID...";
        status.style.color = "#335953";

        const valido = await validarID(id);
        if (valido) {
          localStorage.setItem("femflow_id", id);
          status.innerText = "✅ ID confirmado! Iniciando...";
          status.style.color = "#335953";

          // 🌸 Mostra a tela de boas-vindas antes de redirecionar
          const overlay = document.getElementById("welcomeOverlay");
          overlay.classList.add("show");
          setTimeout(() => {
            window.location.href = "treino.html";
          }, 2200);
        } else {
          status.innerText = "⚠️ ID inválido ou não encontrado. Verifique e tente novamente.";
          status.style.color = "#CC6A5A";
        }
      });

      function mostrarRecuperar() {
        document.getElementById('recuperarBox').style.display = 'block';
      }

      function recuperarID() {
        const nome = document.getElementById('nomeRec').value.trim();
        const email = document.getElementById('emailRec').value.trim();
        const status = document.getElementById('statusRec');

        if (!nome || !email) {
          status.innerText = 'Por favor, preencha nome e e-mail.';
          status.style.color = '#CC6A5A';
          return;
        }

        status.innerText = '🔄 Verificando...';
        status.style.color = '#335953';

        fetch('https://script.google.com/macros/s/AKfycbwBut7gbyeXaZVFvBxIZOxd7mBcc9g1n2d2YGP1n0XGAdaFoVwtSmTkciE1u2XKg6m0/exec', {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'recuperarID', nome: nome, email: email })
        })
        .then(() => {
          status.innerText = '📩 Se o e-mail estiver cadastrado, o ID foi reenviado!';
          status.style.color = '#335953';
        })
        .catch(() => {
          status.innerText = '⚠️ Erro ao tentar recuperar. Tente novamente.';
          status.style.color = '#CC6A5A';
        });
      }
    </script>
  </body>
</html>
