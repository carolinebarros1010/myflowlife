<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Momento • FemFlow</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.ico">
  <meta name="msapplication-TileImage" content="favicon.ico">

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/ciclo.css">
</head>

<body>

<h1>Identifique seu momento</h1>
<p id="cycleMessage" class="cycle-info"></p>
<p class="sub">Vamos ajustar seus treinos ao seu ciclo atual 🌸</p>

<div class="card">

  <h3>Seu perfil hormonal</h3>

  <div class="perfil-btns">
    <button class="perfil-btn" data-perfil="regular">Regular</button>
    <button class="perfil-btn" data-perfil="irregular">Irregular</button>
    <button class="perfil-btn" data-perfil="diu">Uso DIU</button>
    <button class="perfil-btn" data-perfil="menopausa">Menopausa</button>
  </div>

  <!-- SUBMENU DIU -->
  <div id="diuSubmenu" class="card" style="display:none;margin-top:10px;">
    <h3>Qual tipo de DIU?</h3>
    <div class="perfil-btns">
      <button class="perfil-btn" data-diu="cobre">DIU de Cobre</button>
      <button class="perfil-btn" data-diu="hormonal">DIU Hormonal</button>
    </div>
  </div>

  <!-- REGULAR -->
  <div id="regularBox" style="display:none;">
    <label>Data da última menstruação</label>
    <input type="date" id="dataUltima">

    <label>Duração média (dias)</label>
    <input type="number" id="duracao" min="21" max="35" value="28">

    <button id="btnConfirmarRegular">Confirmar</button>
  </div>

  <!-- QUIZ PERFIS ENERGÉTICOS -->
  <div id="quizBox" class="quiz-box">
    <p id="quizPergunta">Pronta?</p>
    <div class="quiz-btns">
      <button id="btnQuizSim">Sim</button>
      <button id="btnQuizNao">Não</button>
    </div>
    <p id="quizStep" style="color:#94786f;font-size:.9rem;margin-top:8px;"></p>
  </div>

</div>

<p style="font-size:.9rem;color:#9a8077;margin-top:12px;">
  Essas informações servem apenas para adaptar seus treinos. 💫
</p>

<script src="./femflow-core.js"></script>

<script>

/* ============================================================
   0. MENSAGEM DE AJUSTE
============================================================ */
const url = new URLSearchParams(location.search);
if (url.get("continuar") === "1") {
  const msg = document.getElementById("cycleMessage");
  if (msg) msg.textContent = "Ajuste sua fase atual para calibrar o treino de hoje.";
}

/* ============================================================
   HELPERS
============================================================ */
function parseDateLocalYYYYMMDD(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y, m-1, d, 12,0,0);
}
function bindTap(el, handler){
  if(!el) return;
  let fired=false;
  el.addEventListener("touchstart", ()=>{ fired=true; handler(); }, {passive:true});
  el.addEventListener("click", e=>{ if(!fired) handler(); fired=false; });
}

/* ============================================================
   FASE ALTA POR NÍVEL (ENERGÉTICO)
============================================================ */
function faseAltaPorNivel(){
  const nivel=(localStorage.getItem("nivel_atual")||"iniciante").toLowerCase();
  if(nivel==="iniciante") return "luteal";
  if(nivel==="intermediaria") return "follicular";
  return "ovulatory";
}

/* ============================================================
   PERGUNTAS ENERGÉTICAS
============================================================ */
const perguntasIrregular = [
  "Você sentiu mudanças de energia ao longo da semana?",
  "Percebeu sensibilidade nos seios, inchaço ou retenção?",
  "Você teve oscilações emocionais sem motivo claro?",
  "Sentiu cólicas, peso abdominal ou desconforto pélvico?",
  "Você se sentiu sem vontade de treinar nos últimos dias?"
];
const perguntasMenopausa = [
  "Nos últimos dias, você sentiu sua energia mais instável do que o normal?",
  "Você teve ondas de calor ou suor noturno?",
  "Seu humor variou muito?",
  "Seu sono ficou mais leve ou interrompido?",
  "Você tem sentido baixa disposição?"
];
const perguntasDiuHormonal = [
  "Sua motivação para treinar caiu?",
  "Você sentiu cansaço constante?",
  "Irritabilidade ou sensibilidade emocional aumentou?",
  "Inchaço ou peso no ventre?",
  "Seu corpo parece lento ou travado?"
];

/* ============================================================
   SALVAR CICLO (LOCAL + BACKEND)
============================================================ */
async function salvarCiclo({perfil, start, length, faseCalc, faseAlta, dia}) {

  // LOCAL
  localStorage.setItem("femflow_perfilHormonal", perfil);
  localStorage.setItem("femflow_cycle_configured", "yes");
  localStorage.setItem("femflow_startDate", start.toISOString());
  localStorage.setItem("femflow_cycleLength", String(length));
  localStorage.setItem("femflow_diaciclo", String(dia));
  localStorage.setItem("femflow_fase_atual", faseCalc.toLowerCase());
  if (faseAlta) localStorage.setItem("femflow_faseAlta", faseAlta);

  // BACKEND — perfil hormonal
  try {
    await FEMFLOW.salvarPerfilHormonal(perfil);
  } catch(e){ console.warn("Erro salvar perfil:", e); }

  // BACKEND — fase
  try {
    await fetch(FEMFLOW.SCRIPT_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        action:"setfase",
        id: localStorage.getItem("femflow_id"),
        fase: faseCalc.toLowerCase()
      })
    });
  } catch(e){ console.warn("Erro fase:", e); }

  // BACKEND — dia do ciclo (NOVIDADE)
  try {
    await fetch(FEMFLOW.SCRIPT_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        action:"setdiaciclo",
        id: localStorage.getItem("femflow_id"),
        dia: dia
      })
    });
  } catch(e){ console.warn("Erro ao atualizar diaciclo:", e); }

  FEMFLOW.toast("✨ Ciclo configurado!");
  setTimeout(()=>location.href="flowcenter.html",800);
}

/* ============================================================
   PERFIS E QUIZ
============================================================ */
let perfil=null;
let perfilInterno=null;
let perguntasAtuais=[];
let quizIdx=0, quizScore=0;

const quizPerg = document.getElementById("quizPergunta");
const quizStep = document.getElementById("quizStep");
const quizBox  = document.getElementById("quizBox");
const regularBox=document.getElementById("regularBox");
const diuBox = document.getElementById("diuSubmenu");

/* ============================================================
   BOTÕES PRINCIPAIS
============================================================ */
document.querySelectorAll(".perfil-btn[data-perfil]").forEach(btn=>{
  bindTap(btn, ()=>{
    document.querySelectorAll(".perfil-btn[data-perfil]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    perfil = btn.dataset.perfil;

    regularBox.style.display="none";
    quizBox.style.display="none";
    diuBox.style.display="none";

    if(perfil==="regular"){
      regularBox.style.display="block";
    }
    else if(perfil==="irregular"){
      iniciarQuizIrregular();
    }
    else if(perfil==="menopausa"){
      iniciarQuizMenopausa();
    }
    else if(perfil==="diu"){
      diuBox.style.display="block";
    }
  });
});

/* ============================================================
   SUBMENU — DIU
============================================================ */
document.querySelectorAll("[data-diu]").forEach(btn=>{
  bindTap(btn, ()=>{
    document.querySelectorAll("[data-diu]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    if(btn.dataset.diu==="cobre"){
      regularBox.style.display="block";
    } else {
      iniciarQuizDiuHormonal();
    }
  });
});

/* ============================================================
   QUIZ — lógicas
============================================================ */
function iniciarQuizIrregular(){
  perfilInterno="irregular_quiz";
  perguntasAtuais=perguntasIrregular;
  abrirQuiz();
}
function iniciarQuizMenopausa(){
  perfilInterno="menopausa_quiz";
  perguntasAtuais=perguntasMenopausa;
  abrirQuiz();
}
function iniciarQuizDiuHormonal(){
  perfilInterno="diu_hormonal_quiz";
  perguntasAtuais=perguntasDiuHormonal;
  abrirQuiz();
}

function abrirQuiz(){
  quizIdx=0;
  quizScore=0;
  quizPerg.textContent=perguntasAtuais[0];
  quizStep.textContent=`Pergunta 1 de ${perguntasAtuais.length}`;
  quizBox.style.display="block";
}

bindTap(document.getElementById("btnQuizSim"), ()=>responderQuiz(true));
bindTap(document.getElementById("btnQuizNao"), ()=>responderQuiz(false));

function responderQuiz(v){
  quizScore += v?1:0;
  quizIdx++;

  if(quizIdx < perguntasAtuais.length){
    quizPerg.textContent = perguntasAtuais[quizIdx];
    quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntasAtuais.length}`;
  } else {
    finalizarQuiz();
  }
}

/* ============================================================
   FINAL DO QUIZ — cálculo energético 23+5
============================================================ */
function finalizarQuiz(){
  const faseAltaNivel = faseAltaPorNivel();
  const entraAlta = quizScore <= 3;

  const faseCalc = entraAlta ? faseAltaNivel : "menstrual";
  const diaInicial = entraAlta ? 1 : 24;

  salvarCiclo({
    perfil: perfilInterno.replace("_quiz",""),
    start:new Date(),
    length:28,
    faseCalc,
    faseAlta:faseAltaNivel,
    dia:diaInicial
  });
}

/* ============================================================
   PERFIL REGULAR — FISIOLÓGICO REAL
============================================================ */
bindTap(document.getElementById("btnConfirmarRegular"), ()=>{

  const s=document.getElementById("dataUltima").value;
  const len=parseInt(document.getElementById("duracao").value||28,10);

  if(!s||len<21||len>35){
    alert("Preencha corretamente data e duração.");
    return;
  }

  const start=parseDateLocalYYYYMMDD(s);
  const hoje=new Date();
  const umDia=86400000;

  let diff=Math.floor((hoje-start)/umDia);
  diff=Math.max(0,diff);

  let d=((diff%len)+len)%len;
  const dia=d===0?1:d+1;

  let fase="";
  if(dia<=5) fase="menstrual";
  else if(dia<=13) fase="follicular";
  else if(dia<=17) fase="ovulatory";
  else fase="luteal";

  salvarCiclo({
    perfil:"regular",
    start,
    length:len,
    faseCalc:fase,
    dia
  });
});

</script>

</body>
</html>
