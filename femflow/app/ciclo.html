<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Momento • FemFlow</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.ico">
  <meta name="msapplication-TileImage" content="favicon.ico">

  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/ciclo.css">
</head>

<body class="pagina-ciclo">

<h1>Identifique seu momento</h1>
<p id="cycleMessage" class="cycle-info"></p>
<p class="sub">Vamos ajustar seus treinos ao seu ciclo atual</p>

<div class="card">

  <h3 id="tituloPerfil">Seu perfil hormonal</h3>

  <div class="perfil-btns">
    <button class="perfil-btn" data-perfil="regular">Regular</button>
    <button class="perfil-btn" data-perfil="irregular">Irregular</button>
    <button class="perfil-btn" data-perfil="diu">Uso DIU</button>
    <button class="perfil-btn" data-perfil="menopausa">Menopausa</button>
  </div>

  <!-- SUBMENU DIU -->
  <div id="diuSubmenu" class="card" style="display:none;margin-top:10px;">
    <h3>Qual tipo de DIU?</h3>
    <div class="perfil-btns">
      <button class="perfil-btn" data-diu="cobre">DIU de Cobre</button>
      <button class="perfil-btn" data-diu="hormonal">DIU Hormonal</button>
    </div>
  </div>

  <!-- REGULAR -->
  <div id="regularBox" style="display:none;">
    <label>Data da última menstruação</label>
    <input type="date" id="dataUltima">

    <label>Duração média (dias)</label>
    <input type="number" id="duracao" min="21" max="35" value="28">

    <button id="btnConfirmarRegular">Confirmar</button>
  </div>

  <!-- QUIZ PERFIS ENERGÉTICOS -->
  <div id="quizBox" class="quiz-box">
    <p id="quizPergunta">Pronta?</p>
    <div class="quiz-btns">
      <button id="btnQuizSim">Sim</button>
      <button id="btnQuizNao">Não</button>
    </div>
    <p id="quizStep" style="color:#94786f;font-size:.9rem;margin-top:8px;"></p>
  </div>

</div>

<p id="cycleFooter" style="font-size:.9rem;color:#9a8077;margin-top:12px;">
  Essas informações servem apenas para adaptar seus treinos. 💫
</p>




  
<div id="ff-loading" class="ff-loading hidden">
  <div class="ff-loading-box">
    <div class="ff-spinner"></div>
    <p id="ff-loading-text">Configurando…</p>
  </div>
</div>
  
<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

 
<script>
  const id = localStorage.getItem("femflow_id");

// 🔐 validar sessão / token
(async () => {
  if (!id) {
    FEMFLOW.clearSession?.();
    FEMFLOW.router("index");
    return;
  }

  try {
    const sync = await FEMFLOW.get({ action: "sync", id });

    if (!sync || sync.status !== "ok") {
      FEMFLOW.clearSession?.();
      FEMFLOW.router("index");
      return;
    }

    // opcional: atualizar cache mínimo
    localStorage.setItem("femflow_nivel", sync.nivel || localStorage.getItem("femflow_nivel"));
  } catch (e) {
    console.error("Erro ao validar sessão:", e);
    FEMFLOW.clearSession?.();
    FEMFLOW.router("index");
  }
})();


  
function ffShowLoading(msg = "Processando…") {
  const box = document.getElementById("ff-loading");
  const text = document.getElementById("ff-loading-text");
  if (text) text.textContent = msg;
  if (box) box.classList.remove("hidden");
}

function ffHideLoading() {
  const box = document.getElementById("ff-loading");
  if (box) box.classList.add("hidden");
}

/* ============================================================
   0. MENSAGEM DE AJUSTE
============================================================ */
const url = new URLSearchParams(location.search);
if (url.get("continuar") === "1") {
  const msg = document.getElementById("cycleMessage");
  if (msg) msg.textContent = "Ajuste sua fase atual para calibrar o treino de hoje.";
}

/* ============================================================
   HELPERS
============================================================ */
function parseDateLocalYYYYMMDD(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y, m-1, d, 12,0,0);
}
function bindTap(el, handler){
  if(!el) return;
  let fired=false;
  el.addEventListener("touchstart", ()=>{ fired=true; handler(); }, {passive:true});
  el.addEventListener("click", e=>{ if(!fired) handler(); fired=false; });
}

/* ============================================================
   FASE ALTA POR NÍVEL (ENERGÉTICO)
============================================================ */
function faseAltaPorNivel(){
  const nivel=(localStorage.getItem("femflow_nivel")||"iniciante").toLowerCase();
  if(nivel==="iniciante") return "lutea";
  if(nivel==="intermediaria") return "folicular";
  return "ovulatoria";
}


function getPerguntas(tipo) {
  const langCode = FEMFLOW.lang || localStorage.getItem("femflow_lang") || "pt";
  const ciclo = FEMFLOW.langs[langCode]?.ciclo || FEMFLOW.langs.pt.ciclo;
  return ciclo.quizCiclo?.[tipo] || [];
}


  
/* ============================================================
   SALVAR CICLO — FAST MODE (LOCAL FIRST + 1 POST)
   FemFlow 2025
============================================================ */
async function salvarCiclo({
  perfil,
  start,
  length,
  faseCalc,
  dia,
  faseAlta = null
}) {

  ffShowLoading("Configurando seu ciclo…");
  await new Promise(requestAnimationFrame);

  const idUser = localStorage.getItem("femflow_id");

  /* ============================================================
     1) SALVAR IMEDIATAMENTE NO LOCALSTORAGE
     (isso destrava a navegação)
  ============================================================ */
  localStorage.setItem("femflow_perfilHormonal", perfil);
  localStorage.setItem("femflow_cycle_configured", "yes");
  localStorage.setItem("femflow_cycle_changed", "true"); // 🔥 novo
  localStorage.setItem("femflow_startDate", start.toISOString());
  localStorage.setItem("femflow_cycleLength", String(length));
  localStorage.setItem("femflow_diaCiclo", String(dia));
  localStorage.setItem("femflow_fase", faseCalc.toLowerCase());

  if (faseAlta) {
    localStorage.setItem("femflow_faseAlta", faseAlta);
  } else {
    localStorage.removeItem("femflow_faseAlta");
  }
/* ============================================================
   2) BACKEND — set base do ciclo
============================================================ */
await FEMFLOW.post({
  action: "setciclo",
  id: idUser,
  cicloDuracao: length,
  dataInicio: start.toISOString(),
  perfilHormonal: perfil,
  diaPrograma: 1
});

/* ============================================================
   3) SYNC — calcular fase + diaCiclo reais
============================================================ */
const sync = await FEMFLOW.get({
  action: "sync",
  id: idUser
});

// 🔥 atualizar cache local com fonte da verdade
if (sync?.status === "ok") {
  localStorage.setItem("femflow_fase", sync.fase);
  localStorage.setItem("femflow_diaCiclo", String(sync.diaCiclo));
  localStorage.setItem("femflow_diaPrograma", String(sync.diaPrograma || 1));
}


  /* ============================================================
     3) NAVEGAR IMEDIATAMENTE
  ============================================================ */
  FEMFLOW.toast("✨ Ciclo configurado!");

  ffShowLoading("Carregando seu painel…");

  const ret = new URLSearchParams(location.search).get("ret");

// 🔁 após configurar ciclo, sempre voltar ao HOME
FEMFLOW.router("home");

}

/* ============================================================
   PERFIS E QUIZ
============================================================ */
let perfilSelecionado=null;
let perfilInterno=null;
let perguntasAtuais=[];
let quizIdx=0, quizScore=0;

const quizPerg = document.getElementById("quizPergunta");
const quizStep = document.getElementById("quizStep");
const quizBox  = document.getElementById("quizBox");
const regularBox=document.getElementById("regularBox");
const diuBox = document.getElementById("diuSubmenu");

/* ============================================================
   BOTÕES PRINCIPAIS
============================================================ */
document.querySelectorAll(".perfil-btn[data-perfil]").forEach(btn=>{
  bindTap(btn, ()=>{
    document.querySelectorAll(".perfil-btn[data-perfil]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    perfilSelecionado = btn.dataset.perfil;

    regularBox.style.display="none";
    quizBox.style.display="none";
    diuBox.style.display="none";

    if(perfilSelecionado==="regular"){
      regularBox.style.display="block";
    }
    else if(perfilSelecionado==="irregular"){
      iniciarQuizIrregular();
    }
    else if(perfilSelecionado==="menopausa"){
      iniciarQuizMenopausa();
    }
    else if(perfilSelecionado==="diu"){
      diuBox.style.display="block";
    }
  });
});

/* ============================================================
   SUBMENU — DIU
============================================================ */
document.querySelectorAll("[data-diu]").forEach(btn=>{
  bindTap(btn, ()=>{
    document.querySelectorAll("[data-diu]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    if(btn.dataset.diu==="cobre"){
      regularBox.style.display="block";
    } else {
      iniciarQuizDiuHormonal();
    }
  });
});

/* ============================================================
   QUIZ — lógicas
============================================================ */
function iniciarQuizIrregular(){
  perfilInterno="irregular_quiz";
  perguntasAtuais = getPerguntas("irregular");
  abrirQuiz();
}

function iniciarQuizMenopausa(){
  perfilInterno="menopausa_quiz";
  perguntasAtuais = getPerguntas("menopausa");
  abrirQuiz();
}

function iniciarQuizDiuHormonal(){
  perfilInterno="diuHormonal_quiz";
  perguntasAtuais = getPerguntas("diuHormonal");
  abrirQuiz();
}

function abrirQuiz(){
  quizIdx = 0;
  quizScore = 0;

  // pergunta inicial
  quizPerg.textContent = perguntasAtuais[0];

   // etiqueta traduzida (sem mexer no lang.js)
  const langCode = FEMFLOW.lang || localStorage.getItem("femflow_lang") || "pt";
  const txtPerg = { pt: "Pergunta", en: "Question", fr: "Question" }[langCode] || "Pergunta";
  const txtDe   = { pt: "de",        en: "of",       fr: "sur"      }[langCode] || "de";

  quizStep.textContent = `${txtPerg} ${quizIdx + 1} ${txtDe} ${perguntasAtuais.length}`;


  quizBox.style.display = "block";
}


bindTap(document.getElementById("btnQuizSim"), ()=>responderQuiz(true));
bindTap(document.getElementById("btnQuizNao"), ()=>responderQuiz(false));

function responderQuiz(v){
  quizScore += v?1:0;
  quizIdx++;

  if(quizIdx < perguntasAtuais.length){
    quizPerg.textContent = perguntasAtuais[quizIdx];
    quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntasAtuais.length}`;
  } else {
    finalizarQuiz();
  }
}

/* ============================================================
   FINAL DO QUIZ — PERFIL ENERGÉTICO e PERFIL HORMONAL IRREGULAR
============================================================ */
function finalizarQuiz(){

  const nivel = (localStorage.getItem("femflow_nivel") || "iniciante").toLowerCase();
  const entraAlta = quizScore <= 3;   // true = alta energia

  /* ============================================================
     1) PERFIL IRREGULAR — fase aproximada
  ============================================================ */
  if (perfilInterno === "irregular_quiz") {

    let faseAprox = "";
    if (quizScore >= 4) faseAprox = "lutea";
    else if (quizScore === 3) faseAprox = "ovulatoria";
    else if (quizScore === 2) faseAprox = "folicular";
    else faseAprox = "menstrual";

    let diaInicial = 1;
    if (faseAprox === "folicular") diaInicial = 6;
    if (faseAprox === "ovulatoria")  diaInicial = 14;
    if (faseAprox === "lutea")     diaInicial = 18;

    // LOG DEBUG IRREGULAR
    console.log("🔍 IRREGULAR.DEBUG → faseAprox:", faseAprox);
    console.log("🔍 IRREGULAR.DEBUG → diaInicial:", diaInicial);
    console.log("🔍 IRREGULAR.DEBUG → perfilInterno:", perfilInterno);
    console.log("🔍 IRREGULAR.DEBUG → score:", quizScore);

    salvarCiclo({
      perfil: "irregular",
      start: new Date(),
      length: 28,
      faseCalc: faseAprox,
      dia: diaInicial
    });

    return;
  }

  /* ============================================================
     2) PERFIL ENERGÉTICO (DIU hormonal ou menopausa)
  ============================================================ */
  const faseAltaNivel = faseAltaPorNivel();
  const diaEnergetico = 1; // sempre começa 1 energético

  let faseCalc, diaReal;

  if (entraAlta) {
    faseCalc = faseAltaNivel;

    if (faseAltaNivel === "lutea") {
      diaReal = 18 + ((diaEnergetico - 1) % 11);
    } else if (faseAltaNivel === "folicular") {
      diaReal = 6 + ((diaEnergetico - 1) % 8);
    } else if (faseAltaNivel === "ovulatoria") {
      diaReal = 14 + ((diaEnergetico - 1) % 4);
    } else {
      diaReal = 1;
    }

  } else {
    faseCalc = "menstrual";
    diaReal = 1 + ((diaEnergetico - 1) % 5);
  }

  // LOG DEBUG ENERGÉTICO
  console.log("🔋 ENERGETICO.DEBUG → faseAltaNivel:", faseAltaNivel);
  console.log("🔋 ENERGETICO.DEBUG → faseCalc final:", faseCalc);
  console.log("🔋 ENERGETICO.DEBUG → diaReal:", diaReal);
  console.log("🔋 ENERGETICO.DEBUG → score:", quizScore);
  console.log("🔋 ENERGETICO.DEBUG → perfilInterno:", perfilInterno);

  salvarCiclo({
    perfil: perfilInterno.replace("_quiz",""),
    start: new Date(),
    length: 28,
    faseCalc,
    faseAlta: faseAltaNivel,
    dia: diaReal
  });
}


/* ============================================================
   PERFIL REGULAR — FISIOLÓGICO REAL
============================================================ */
bindTap(document.getElementById("btnConfirmarRegular"), ()=>{

  const s=document.getElementById("dataUltima").value;
  const len=parseInt(document.getElementById("duracao").value||28,10);

  if(!s||len<21||len>35){
    alert("Preencha corretamente data e duração.");
    return;
  }

  const start=parseDateLocalYYYYMMDD(s);
  const hoje=new Date();
  const umDia=86400000;

  let diff=Math.floor((hoje-start)/umDia);
  diff=Math.max(0,diff);

  let d=((diff%len)+len)%len;
  const dia=d===0?1:d+1;

  let fase="";
  if(dia<=5) fase="menstrual";
  else if(dia<=13) fase="folicular";
  else if(dia<=17) fase="ovulatoria";
  else fase="lutea";

  salvarCiclo({
    perfil:"regular",
    start,
    length:len,
    faseCalc:fase,
    dia
  });
});
/* ============================================================
   🔤 TRADUÇÃO — APLICAR IDIOMA NA PÁGINA DE CICLO
============================================================ */
function aplicarIdiomaCiclo() {
  // garante idioma definido
  if (!FEMFLOW.lang) {
    FEMFLOW.lang = localStorage.getItem("femflow_lang") || "pt";
  }

  const langCode = FEMFLOW.lang;
  const langSet  = FEMFLOW.langs[langCode] || FEMFLOW.langs.pt;
  const L        = langSet.ciclo;

  if (!L) {
    console.warn("⚠️ Dicionário 'ciclo' não encontrado para:", langCode);
    return;
  }

  // ----- TÍTULOS DO TOPO -----
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = L.titulo;

  const sub = document.querySelector(".sub");
  if (sub) sub.textContent = L.sub;

  // ----- TÍTULO DO CARD ("Seu perfil hormonal") -----
  const tituloPerfil = document.getElementById("tituloPerfil") || document.querySelector(".card h3");
  if (tituloPerfil) {
    const mapTituloPerfil = {
      pt: "Seu perfil hormonal",
      en: "Your hormonal profile",
      fr: "Votre profil hormonal"
    };
    tituloPerfil.textContent = mapTituloPerfil[langCode] || mapTituloPerfil.pt;
  }

  // ----- BOTÕES DE PERFIL HORMONAL -----
  const bReg = document.querySelector("[data-perfil='regular']");
  if (bReg) bReg.textContent = L.regular;

  const bIrreg = document.querySelector("[data-perfil='irregular']");
  if (bIrreg) bIrreg.textContent = L.irregular;

  const bDiu = document.querySelector("[data-perfil='diu']");
  if (bDiu) bDiu.textContent = L.diu;

  const bMeno = document.querySelector("[data-perfil='menopausa']");
  if (bMeno) bMeno.textContent = L.menopausa;

  // ----- SUBMENU DIU -----
  const hDiu = document.querySelector("#diuSubmenu h3");
  if (hDiu) hDiu.textContent = L.qualDiu;

  const bDiuC = document.querySelector("[data-diu='cobre']");
  if (bDiuC) bDiuC.textContent = L.diuCobre;

  const bDiuH = document.querySelector("[data-diu='hormonal']");
  if (bDiuH) bDiuH.textContent = L.diuHormonal;

  // ----- PERFIL REGULAR -----
  const lbl1 = document.querySelector("#regularBox label:nth-of-type(1)");
  if (lbl1) lbl1.textContent = L.ultimaMenstruacao;

  const lbl2 = document.querySelector("#regularBox label:nth-of-type(2)");
  if (lbl2) lbl2.textContent = L.duracaoMedia;

  const btnConf = document.getElementById("btnConfirmarRegular");
  if (btnConf) btnConf.textContent = L.confirmar;

  // ----- QUIZ ENERGÉTICO -----
  const quizPergunta = document.getElementById("quizPergunta");
  if (quizPergunta) quizPergunta.textContent = L.quizInicio;

  const btnSim = document.getElementById("btnQuizSim");
  if (btnSim) btnSim.textContent = L.sim;

  const btnNao = document.getElementById("btnQuizNao");
  if (btnNao) btnNao.textContent = L.nao;

  // ----- RODAPÉ -----
  const footer = document.getElementById("cycleFooter");
  if (footer) footer.textContent = L.footer;
}

/* ============================================================
   🔧 ATIVAR HEADER / MENU / IDIOMA
============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  FEMFLOW.inserirHeaderApp?.();
  FEMFLOW.inserirMenuLateral?.();
  FEMFLOW.inserirModalIdioma?.();

  aplicarIdiomaCiclo();
});

/* ============================================================
   🔄 Atualizar textos quando trocar idioma
============================================================ */
document.addEventListener("femflow:langChange", () => {
  aplicarIdiomaCiclo();

  // Se o quiz estiver aberto, reescreve a pergunta + passo
  if (quizBox && quizBox.style.display !== "none") {
    const tipo = (perfilInterno || "").replace("_quiz", "");
    perguntasAtuais = getPerguntas(tipo) || [];

    quizPerg.textContent = perguntasAtuais[quizIdx] || "";

    const langCode = FEMFLOW.lang || "pt";
    const txtPerg = { pt: "Pergunta", en: "Question", fr: "Question" }[langCode] || "Pergunta";
    const txtDe   = { pt: "de",       en: "of",       fr: "sur"      }[langCode] || "de";

    quizStep.textContent = `${txtPerg} ${quizIdx + 1} ${txtDe} ${perguntasAtuais.length}`;
  }
});

</script>
  
<!-- MODAL DE NÍVEL (CICLO) -->
<div id="modal-nivel" class="modal-nivel oculto">
  <div class="modal-nivel-box">
    <h2>📊 Selecione seu nível</h2>

    <button class="nivel-btn" data-nivel="iniciante">Iniciante</button>
    <button class="nivel-btn" data-nivel="intermediaria">Intermediária</button>
    <button class="nivel-btn" data-nivel="avancada">Avançada</button>

    <button id="btnConfirmarNivel" class="nivel-confirmar">
      Confirmar nível
    </button>

    <button id="fecharNivel" class="nivel-fechar">Fechar</button>
  </div>
</div>



</body>
</html>
