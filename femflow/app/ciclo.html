<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seu Momento • FemFlow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracota: #cc6a5a;
      --bege: #fff5ef;
      --verde: #335953;
      --texto: #5b4f49;
    }
    body {
      background: var(--bege);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: "Playfair Display", serif;
      color: var(--terracota);
      margin-bottom: 8px;
    }
    p.sub {
      color: #7b6e68;
      margin-bottom: 28px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      max-width: 440px;
      margin: 0 auto 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      color: var(--verde);
    }
    input, button, select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #e6d8d2;
      border-radius: 10px;
      font-size: 1rem;
      font-family: "Lato", sans-serif;
      box-sizing: border-box;
    }
    button {
      background: var(--verde);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: all .3s ease;
      margin-top: 16px;
    }
    button:hover { background: var(--terracota); }
    .perfil-btns {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .perfil-btn {
      flex: 1 1 45%;
      background: #fff;
      border: 2px solid var(--verde);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      font-weight: 700;
      color: var(--verde);
      transition: all .3s;
    }
    .perfil-btn.active {
      background: var(--verde);
      color: #fff;
    }
    .quiz-box {
      display: none;
      margin-top: 20px;
    }
    .quiz-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }
    .quiz-btns button {
      width: 40%;
    }
  </style>
</head>

<body>
  <h1>Identifique seu momento</h1>
  <p class="sub">Vamos ajustar seus treinos ao seu ciclo atual 🌸</p>

  <div class="card">
    <h3>Seu perfil hormonal</h3>
    <div class="perfil-btns">
      <button class="perfil-btn" data-perfil="regular">Regular</button>
      <button class="perfil-btn" data-perfil="irregular">Irregular</button>
      <button class="perfil-btn" data-perfil="diu">Uso DIU</button>
      <button class="perfil-btn" data-perfil="menopausa">Menopausa</button>
    </div>

    <!-- REGULAR -->
    <div id="regularBox" style="display:none;">
      <label for="dataUltima">Data da última menstruação</label>
      <input type="date" id="dataUltima">
      <label for="duracao">Duração média (dias)</label>
      <input type="number" id="duracao" min="21" max="35" value="28">
      <button id="btnConfirmarRegular">Confirmar</button>
    </div>

    <!-- QUIZ -->
    <div id="quizBox" class="quiz-box">
      <p id="quizPergunta">Pronta?</p>
      <div class="quiz-btns">
        <button id="btnQuizSim">Sim</button>
        <button id="btnQuizNao">Não</button>
      </div>
      <p id="quizStep" style="margin-top:8px;color:#94786f;font-size:.9rem"></p>
    </div>
  </div>

  <p style="font-size:.9rem;color:#9a8077;margin-top:12px;">
    As informações servem apenas para adaptar os treinos ao seu corpo. 💫
  </p>

  <script src="./femflow-core.js"></script>
  
  <script>
    
    function parseDateLocalYYYYMMDD(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0); // 12h local = sem shift de fuso
}
  // === VARIÁVEIS ===
  let perfil = null;
  let quizIdx = 0, quizScore = 0;
  const perguntas = [
    "Você sentiu variações fortes de energia nos últimos dias?",
    "Percebeu sensibilidade nos seios ou inchaço?",
    "Teve oscilações de humor sem motivo aparente?",
    "Está dormindo pior ou suando mais que o normal?",
    "Sente cólica, dor pélvica ou leve sangramento?"
  ];

  const quizPerg = document.getElementById('quizPergunta');
  const quizStep = document.getElementById('quizStep');
  const regularBox = document.getElementById('regularBox');
  const quizBox = document.getElementById('quizBox');

  // === SELEÇÃO DE PERFIL ===
  document.querySelectorAll('.perfil-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.perfil-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      perfil = btn.dataset.perfil;
      regularBox.style.display = perfil==='regular' ? 'block' : 'none';
      quizBox.style.display    = perfil==='regular' ? 'none'  : 'block';
      if (perfil!=='regular') iniciarQuiz();
    });
  });

  // === QUIZ ===
  function iniciarQuiz(){
    quizIdx = 0; quizScore = 0;
    quizPerg.textContent = perguntas[quizIdx];
    quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntas.length}`;
    quizBox.style.display = 'block';
  }
  function responderQuiz(v){
    quizScore += v ? 1 : 0;
    quizIdx++;
    if (quizIdx < perguntas.length){
      quizPerg.textContent = perguntas[quizIdx];
      quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntas.length}`;
    } else {
      concluirQuiz();
    }
  }
  function concluirQuiz(){
    const fase = quizScore <=2 ? 'folicular' :
                 quizScore <=3 ? 'ovulatoria' :
                 quizScore <=4 ? 'lutea' : 'menstrual';
    salvarCiclo({ perfil, fase: fase.toLowerCase() });
  }

  document.getElementById('btnQuizSim').onclick = ()=>responderQuiz(true);
  document.getElementById('btnQuizNao').onclick = ()=>responderQuiz(false);

  // === CONFIRMAR REGULAR ===
 document.getElementById('btnConfirmarRegular').onclick = ()=>{
  const s = document.getElementById('dataUltima').value;
  const len  = parseInt(document.getElementById('duracao').value||28,10);
  if(!s || len<21 || len>35){ alert('Preencha corretamente data e duração do ciclo.'); return; }

  const start = parseDateLocalYYYYMMDD(s);
  const today = new Date();
  const diff  = Math.floor((today - start)/(1000*60*60*24));
  const dia   = ((diff % len)+len)%len + 1; // 1..len

  const fase = (()=>{
    if (dia<=5) return 'menstrual';
    if (dia<=13) return 'folicular';
    if (dia<=17) return 'ovulatoria';
    return 'lutea';
  })();

  salvarCiclo({ perfil:'regular', start, length:len, faseCalc:fase, dia });
};

  // === SALVAR E REDIRECIONAR ===
 function salvarCiclo({perfil,start,length,fase,faseCalc,dia}){
  localStorage.setItem('femflow_perfilHormonal', perfil);
  localStorage.setItem('femflow_cycle_configured','yes');
  localStorage.setItem('femflow_program_active','yes');
  localStorage.setItem('femflow_program_startISO', new Date().toISOString());

  if (perfil==='regular'){
    localStorage.setItem('femflow_startDate', (start instanceof Date? start : new Date(start)).toISOString());
    localStorage.setItem('femflow_cycleLength', String(length||28));

    // 🔒 remove qualquer sugestão antiga que possa conflitar
    localStorage.removeItem('fase_sugerida');

    // ✅ sincroniza estado consumido pelo app
    localStorage.setItem('dia_ciclo', String(dia||1));
    localStorage.setItem('fase_atual', (faseCalc||'menstrual').toLowerCase());
  }   } else {
    // 🔹 Perfis: Irregular / DIU / Menopausa (definidos via quiz)
    localStorage.setItem('femflow_startDate', new Date().toISOString());
    localStorage.setItem('femflow_cycleLength', '28');

    // 🔧 Mapeia nomes de fases vindas do quiz (padroniza nomenclaturas)
    const faseMap = {
      follicular: 'folicular',
      ovulatory: 'ovulatoria',
      luteal: 'lutea',
      menstrual: 'menstrual'
    };
    fase = (faseMap[fase] || fase || 'folicular').toLowerCase();

    // 🔢 Define o "dia simbólico" da fase — referência para o Firebase
    let diaSimbolico = 1;
    if (fase === 'folicular') diaSimbolico = 6;
    else if (fase === 'ovulatoria') diaSimbolico = 14;
    else if (fase === 'lutea') diaSimbolico = 18;
    else diaSimbolico = 1; // menstrual (default)

    // 💾 Grava o estado coerente para o app
    localStorage.setItem('fase_sugerida', fase);
    localStorage.setItem('fase_atual', fase);
    localStorage.setItem('dia_ciclo', String(diaSimbolico));
  }


  localStorage.setItem('femflow_perfilHormonal_locked','yes');

  // 🔄 opcional: persistir no backend (se quiser gravar na planilha)
  try {
    fetch((window.FEMFLOW?.SCRIPT_URL)||'',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'sincronizarCiclo',
        id: localStorage.getItem('femflow_id'),
        perfil: localStorage.getItem('femflow_perfilHormonal'),
        startDate: localStorage.getItem('femflow_startDate'),
        cycleLength: localStorage.getItem('femflow_cycleLength'),
        fase: localStorage.getItem('fase_atual'),
        diaCiclo: localStorage.getItem('dia_ciclo')
      })
    }).catch(()=>{});
  } catch(_) {}

  (window.FEMFLOW?.toast||alert)('✨ Ciclo configurado com sucesso!');

  // Se já escolheu programa (enfase), ir direto ao FlowCenter; senão, volta pra Home
  const prox = localStorage.getItem('femflow_enfase') ? 'flowcenter.html' : 'home.html';
  setTimeout(()=>location.href = prox, 900);
}
  </script>
</body>
</html>
