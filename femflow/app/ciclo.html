<script>
 const id = localStorage.getItem("femflow_id");

function ffShowLoading(msg = "Processando…") {

/* ============================================================

============================================================ */
const url = new URLSearchParams(location.search);
if (url.get("continuar") === "1") {

/* ============================================================
   HELPERS
============================================================ */
function parseDateLocalYYYYMMDD(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y, m-1, d, 12,0,0);
}
function bindTap(el, handler){
  if(!el) return;
  let fired=false;
  el.addEventListener("touchstart", ()=>{ fired=true; handler(); }, {passive:true});
  el.addEventListener("click", e=>{ if(!fired) handler(); fired=false; });
}
/* ============================================================
   🔋 RESOLVER PERFIL ENERGÉTICO (FINAL • FEMFLOW 2025)
   - Score define ALTA ou BAIXA
   - BAIXA → menstrual dia 1 (hoje)
   - ALTA  → depende do nível:
       iniciante      → lutea 18
       intermediaria  → folicular 6
       avancada       → ovulatoria 14
============================================================ */
function resolverPerfilEnergetico(quizScore) {
  const LIMIAR_ALTA = 6;
  const entraAlta = quizScore >= LIMIAR_ALTA;

  // ===== FASE BAIXA (FIXA, SEGURA)
  if (!entraAlta) {
    return {
      fase: "menstrual",
      dia: 1,
      faseAlta: null
    };
  }

  // ===== FASE ALTA (POR NÍVEL)
  const faseAltaNivel = faseAltaPorNivel();

  if (faseAltaNivel === "lutea") {
    return { fase: "lutea", dia: 18, faseAlta: "lutea" };
  }

  if (faseAltaNivel === "folicular") {
    return { fase: "folicular", dia: 6, faseAlta: "folicular" };
  }

  if (faseAltaNivel === "ovulatoria") {
    return { fase: "ovulatoria", dia: 14, faseAlta: "ovulatoria" };
  }

  // fallback defensivo (não deveria acontecer)
  return {
    fase: "menstrual",
    dia: 1,
    faseAlta: null
  };
}

/* ============================================================
   FASE ALTA POR NÍVEL (ENERGÉTICO)
============================================================ */
function faseAltaPorNivel(){
  const nivel=(localStorage.getItem("femflow_nivel")||"iniciante").toLowerCase();
  if(nivel==="iniciante") return "lutea";
  if(nivel==="intermediaria") return "folicular";
  return "ovulatoria";
}


function getPerguntas(tipo) {
  const langCode = FEMFLOW.lang || localStorage.getItem("femflow_lang") || "pt";
  const ciclo = FEMFLOW.langs[langCode]?.ciclo || FEMFLOW.langs.pt.ciclo;
  return ciclo.quizCiclo?.[tipo] || [];
}
  
function calcularDataManualPorFaseEDia(fase, dia) {
  const hoje = new Date();
  const base = new Date(hoje);
  const deslocamento = Math.max(0, Number(dia) - 1);
  base.setDate(hoje.getDate() - deslocamento);
  return base;
}


  
/* ============================================================
   SALVAR CICLO — FAST MODE (LOCAL FIRST + 1 POST)
   FemFlow 2025
============================================================ */
async function salvarCiclo({
  perfil,
  start,
  length,
  faseCalc,
  dia,
  faseAlta = null
}) {

  ffShowLoading("Configurando seu ciclo…");
  await new Promise(requestAnimationFrame);

  const idUser = localStorage.getItem("femflow_id");

  /* ============================================================
     1) CACHE LOCAL (destrava navegação)
  ============================================================ */
  localStorage.setItem("femflow_perfilHormonal", perfil);
  localStorage.setItem("femflow_cycle_configured", "yes");
  localStorage.setItem("femflow_cycle_changed", "true");
  localStorage.setItem("femflow_cycleLength", String(length));
   

  if (faseAlta) {
    localStorage.setItem("femflow_faseAlta", faseAlta);
  } else {
    localStorage.removeItem("femflow_faseAlta");
  }

  /* ============================================================
     2) BACKEND — contrato oficial
  ============================================================ */
  await FEMFLOW.post({
    action: "setperfilhormonal",
    id: idUser,
    perfil
  });

  await FEMFLOW.post({
    action: "setciclo",
    id: idUser,
    cicloDuracao: length,
    dataInicio: start.toISOString(),
    perfilHormonal: perfil
  });

  /* ============================================================
     3) VALIDAR — fonte da verdade
  ============================================================ */
  const qs = new URLSearchParams({ action: "validar", id: idUser });
const perfilFresh = await fetch(`${FEMFLOW.SCRIPT_URL}?${qs.toString()}`)
  .then(r => r.json())
  .catch(() => ({ status: "error" }));


  if (perfilFresh?.status === "ok") {
    localStorage.setItem("femflow_fase", perfilFresh.fase);
    localStorage.setItem("femflow_diaCiclo", String(perfilFresh.diaCiclo));
    localStorage.setItem("femflow_diaPrograma", String(perfilFresh.diaPrograma));
     localStorage.setItem(
      "femflow_dataInicioPrograma",
      perfilFresh.dataInicioPrograma ? String(perfilFresh.dataInicioPrograma) : ""
    );
  }

  /* ============================================================
     4) FEEDBACK + NAVEGAÇÃO ÚNICA
  ============================================================ */
  FEMFLOW.toast("✨ Ciclo configurado!");

  const ret = (new URLSearchParams(location.search).get("ret") || "").toLowerCase();
  FEMFLOW.router(ret.includes("flowcenter") ? "flowcenter" : "home");
}

/* ============================================================

============================================================ */
function iniciarQuizIrregular(){
  perfilInterno="irregular_quiz";
  perguntasAtuais = getPerguntas("irregular");
  abrirQuiz();
}

function iniciarQuizMenopausa(){
  perfilInterno="menopausa_quiz";
  perguntasAtuais = getPerguntas("menopausa");
  abrirQuiz();
}

function iniciarQuizDiuHormonal(){
  perfilInterno="diuHormonal_quiz";
  perguntasAtuais = getPerguntas("diuHormonal");
  abrirQuiz();
}

function abrirQuiz(){
  quizIdx = 0;
  quizScore = 0;

  // pergunta inicial
  quizPerg.textContent = perguntasAtuais[0];

   // etiqueta traduzida (sem mexer no lang.js)
  const langCode = FEMFLOW.lang || localStorage.getItem("femflow_lang") || "pt";
  const txtPerg = { pt: "Pergunta", en: "Question", fr: "Question" }[langCode] || "Pergunta";
  const txtDe   = { pt: "de",        en: "of",       fr: "sur"      }[langCode] || "de";

  quizStep.textContent = `${txtPerg} ${quizIdx + 1} ${txtDe} ${perguntasAtuais.length}`;


  quizBox.style.display = "block";
}


bindTap(document.getElementById("btnQuizSim"), ()=>responderQuiz(true));
bindTap(document.getElementById("btnQuizNao"), ()=>responderQuiz(false));

function responderQuiz(v){
  quizScore += v?1:0;
  quizIdx++;

  if(quizIdx < perguntasAtuais.length){
    quizPerg.textContent = perguntasAtuais[quizIdx];
    quizStep.textContent = `Pergunta ${quizIdx+1} de ${perguntasAtuais.length}`;
  } else {
    finalizarQuiz();
  }
}

 // 🔒 FALLBACK FEMFLOW — quiz falhou ou não iniciou
if (!perguntasAtuais || !perguntasAtuais.length) {

if (perfilInterno === "irregular_quiz") {

 const perfilFinalMap = {

const perfilFinal = perfilFinalMap[perfilInterno] || perfilInterno.replace("_quiz","");

{

bindTap(document.getElementById("btnConfirmarRegular"), ()=>{

function aplicarIdiomaCiclo() {

    FEMFLOW.lang = localStorage.getItem("femflow_lang") || "pt";
  }

  const langCode = FEMFLOW.lang;
  const langSet  = FEMFLOW.langs[langCode] || FEMFLOW.langs.pt;
  const L        = langSet.ciclo;

  if (!L) {
    console.warn("⚠️ Dicionário 'ciclo' não encontrado para:", langCode);
    return;
  }

  // ----- TÍTULOS DO TOPO -----
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = L.titulo;

  const sub = document.querySelector(".sub");
  if (sub) sub.textContent = L.sub;

  // ----- TÍTULO DO CARD ("Seu perfil hormonal") -----
  const tituloPerfil = document.getElementById("tituloPerfil") || document.querySelector(".card h3");
  if (tituloPerfil) {
    const mapTituloPerfil = {
      pt: "Seu perfil hormonal",
      en: "Your hormonal profile",

    };
    tituloPerfil.textContent = mapTituloPerfil[langCode] || mapTituloPerfil.pt;
  }

  // ----- BOTÕES DE PERFIL HORMONAL -----
  const bReg = document.querySelector("[data-perfil='regular']");
  if (bReg) bReg.textContent = L.regular;

  const bIrreg = document.querySelector("[data-perfil='irregular']");
  if (bIrreg) bIrreg.textContent = L.irregular;

  const bDiu = document.querySelector("[data-perfil='diu']");
  if (bDiu) bDiu.textContent = L.diu;

  const bMeno = document.querySelector("[data-perfil='menopausa']");
  if (bMeno) bMeno.textContent = L.menopausa;

  // ----- SUBMENU DIU -----
  const hDiu = document.querySelector("#diuSubmenu h3");
  if (hDiu) hDiu.textContent = L.qualDiu;

  const bDiuC = document.querySelector("[data-diu='cobre']");
  if (bDiuC) bDiuC.textContent = L.diuCobre;

  const bDiuH = document.querySelector("[data-diu='hormonal']");
  if (bDiuH) bDiuH.textContent = L.diuHormonal;

  // ----- PERFIL REGULAR -----
  const lbl1 = document.querySelector("#regularBox label:nth-of-type(1)");
  if (lbl1) lbl1.textContent = L.ultimaMenstruacao;

  const lbl2 = document.querySelector("#regularBox label:nth-of-type(2)");

  // ----- QUIZ ENERGÉTICO -----
  const quizPergunta = document.getElementById("quizPergunta");

  const btnSim = document.getElementById("btnQuizSim");

  const btnNao = document.getElementById("btnQuizNao");
  if (btnNao) btnNao.textContent = L.nao;

  // ----- RODAPÉ -----
  const footer = document.getElementById("cycleFooter");
  if (footer) footer.textContent = L.footer;
}

/* ============================================================
   🔧   NORMALIZAR CICLO   menstrual:   [1, 5],  folicular:  [6, 13],
    ovulatoria: [14, 17],   lutea:      [18, 35]
============================================================ */
  
function normalizarFaseEDia(fase, dia) {
  const mapa = {
    menstrual:   [1, 5],
    folicular:  [6, 13],
    ovulatoria: [14, 17],
    lutea:      [18, 35]
  };

  const range = mapa[fase];
  if (!range) return { fase: "menstrual", dia: 1 };

  const [min, max] = range;

  if (dia < min) dia = min;
  if (dia > max) dia = max;

  return { fase, dia };
}
/* ============================================================
   🛡️ MANUAL START SEGURO — FONTE DA VERDADE
============================================================ */
function criarManualStartSeguro(fase, dia) {
  const normalizado = normalizarFaseEDia(fase, dia);

  const manualStart = calcularDataManualPorFaseEDia(
    normalizado.fase,
    normalizado.dia
  );

  return { normalizado, manualStart };
}
  
/* ============================================================
   🔄 Atualizar textos quando trocar idioma
============================================================ */

  // Se o quiz estiver aberto, reescreve a pergunta + passo

    const txtDe   = { pt: "de",       en: "of",       fr: "sur"      }[langCode] || "de";

    quizStep.textContent = `${txtPerg} ${quizIdx + 1} ${txtDe} ${perguntasAtuais.length}`;
  }
});
