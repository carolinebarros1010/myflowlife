<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Entrar no FemFlow</title>

  <!-- Favicon FemFlow -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.ico">
  <meta name="msapplication-TileImage" content="favicon.ico">
  <link rel="icon" href="favicon.ico">

  <!-- Core FemFlow -->
  <script>window.FEMFLOW_DISABLE_UI = true;</script>
  <script defer src="./femflow-core.js"></script>

  <!-- GOOGLE SIGN-IN -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/login.css">

  <style>
    .login-lang-btn{
      background:#ffffff;
      border:1px solid #d8ccc8;
      padding:6px 14px;
      font-size:.9rem;
      font-weight:600;
      color:#335953;
      border-radius:12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin:6px auto 16px auto;
      box-shadow:0 2px 6px rgba(0,0,0,0.06);
    }
  </style>
</head>

<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">

      <img src="assets/logofemflowterracotasf.png" class="logo"/>

      <h2 id="tLoginBemVinda">Bem-vinda</h2>
      <p class="subtitle" id="tLoginSub">Acesse ou crie sua conta para iniciar seu ciclo</p>

      <button id="btnLoginLang" class="login-lang-btn">🌐 Idioma</button>

      <input id="loginEmail" type="email" placeholder="Seu e-mail"/>

      <!-- SENHA -->
      <div class="password-wrapper">
        <input id="loginSenha" type="password" placeholder="Sua senha">
        <span id="toggleSenha" class="toggle-eye"></span>
      </div>

      <!-- METER -->
      <div class="strength-meter" id="strengthMeter">
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
      </div>

      <button id="btnEntrar" type="button">Entrar</button>
      <p id="mensagem" class="message"></p>

      <a class="toggle" id="linkCadastro" href="anamnese_deluxe.html">Ainda não tem conta? Cadastre-se</a>
      <p class="toggle" id="goRecuperar">Esqueci minha senha</p>

      <div class="social-row boho">
        <div class="social-icon boho google" id="googleSignIn">
          <img src="assets/icons/google-g.svg">
        </div>

        <div class="social-icon boho apple" id="appleSignIn">
          <img src="assets/icons/apple.svg">
        </div>

        <div class="social-icon boho bio" id="bioSignIn">🔒</div>
      </div>

    </div>
  </div>

  <!-- ============================================================
       LOGIN + MULTILÍNGUE + SOCIAL / BIO
  ============================================================ -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {

    // --------- HELPERS BÁSICOS ----------
    window.FEMFLOW = window.FEMFLOW || {};

    const scriptURL =
      FEMFLOW.SCRIPT_URL ||
      localStorage.getItem("femflow_script") ||
      "https://api-myflowlife.falling-wildflower-a8c0.workers.dev";

    const $ = sel => document.querySelector(sel);
    const msg = $("#mensagem");

    function setErr(t){ msg.textContent = t; msg.style.color = "#cc6a5a"; }
    function setMsg(t, ok=false){
      msg.textContent = t;
      msg.style.color = ok ? "#2e7d32" : "#335953";
    }

    async function postGAS(p){
      const r = await fetch(scriptURL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(p)
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    // --------- LOGIN PADRÃO ----------
    async function entrar(){
      const email = $("#loginEmail").value.trim();
      const senha = $("#loginSenha").value.trim();

      if (!email || !senha){
        setErr("Digite e-mail e senha.");
        return;
      }

      setMsg("Verificando...");

      try {
        const d = await postGAS({ action:"login", email, senha });

        if (d.status === "ok"){
          setMsg(`Bem-vinda, ${d.nome || "aluna"}!`, true);
          localStorage.setItem("femflow_id", d.id);
          localStorage.setItem("femflow_email", d.email || email);
          localStorage.setItem("femflow_auth", "yes");
          setTimeout(() => location.href = "home.html", 700);
        } else {
          setErr(d.msg || "E-mail ou senha incorretos.");
        }
      } catch(e){
        console.error(e);
        setErr("Erro de rede.");
      }
    }

    // Liga o botão Entrar
    $("#btnEntrar").onclick = entrar;
    $("#loginSenha").addEventListener("keydown", e => {
      if (e.key === "Enter") entrar();
    });

    // --------- OLHO iOS ----------
    const senhaInput = $("#loginSenha");
    const toggleEye  = $("#toggleSenha");
    const meter      = $("#strengthMeter");

    toggleEye.addEventListener("click", () => {
      const isPass = senhaInput.type === "password";
      senhaInput.type = isPass ? "text" : "password";
      toggleEye.classList.toggle("active", isPass);
    });

    // Força da senha
    senhaInput.addEventListener("input", () => {
      const v = senhaInput.value;
      let score = 0;
      if (v.length >= 6) score++;
      if (/[A-Z]/.test(v) || /[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v) || v.length >= 10) score++;

      meter.classList.remove("strength-1","strength-2","strength-3");
      if (score === 1) meter.classList.add("strength-1");
      if (score === 2) meter.classList.add("strength-2");
      if (score >= 3) meter.classList.add("strength-3");
    });

    // --------- GOOGLE LOGIN ----------
    $("#googleSignIn").onclick = () => google.accounts.id.prompt();

    async function preencherComGoogle(response){
      try{
        const data = jwt_decode(response.credential);
        if (!data || !data.email) return;

        $("#loginEmail").value = data.email;

        const res = await postGAS({ action:"login", email:data.email, senha:"" });

        if (res.status === "ok"){
          localStorage.setItem("femflow_id", res.id);
          localStorage.setItem("femflow_email", res.email || data.email);
          localStorage.setItem("femflow_auth", "yes");
          FEMFLOW.toast?.("✨ Login automático realizado!");
          setTimeout(() => location.href = "home.html", 800);
        } else {
          FEMFLOW.toast?.("💡 Complete seu cadastro para continuar.");
        }
      } catch(e){
        console.warn("Erro Google:", e);
      }
    }
    window.preencherComGoogle = preencherComGoogle;

    // --------- BIOMETRIA ----------
    const bio = $("#bioSignIn");
    (async () => {
      if (window.PublicKeyCredential &&
          await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()){
        bio.style.display = "flex";
      }
    })();

    bio.onclick = async () => {
      try{
        const email = $("#loginEmail").value.trim();
        if (!email){ setErr("Digite seu e-mail."); return; }

        const chal = crypto.getRandomValues(new Uint8Array(32));

        await navigator.credentials.create({
          publicKey:{
            challenge: chal,
            rp:{ name:"FemFlow" },
            user:{
              id:new TextEncoder().encode(email),
              name: email,
              displayName: email
            },
            pubKeyCredParams:[
              { type:"public-key", alg:-7 },
              { type:"public-key", alg:-257 }
            ],
            authenticatorSelection:{
              authenticatorAttachment:"platform",
              userVerification:"required"
            }
          }
        });

        const res = await postGAS({ action:"login", email, senha:"" });
        if (res.status === "ok"){
          localStorage.setItem("femflow_id", res.id);
          localStorage.setItem("femflow_email", res.email || email);
          localStorage.setItem("femflow_auth","yes");
          setMsg("Acesso liberado ✨", true);
          setTimeout(() => location.href = "home.html", 700);
        }
      } catch(e){
        console.warn(e);
        setErr("Falha ao usar biometria.");
      }
    };

    // Apple login placeholder
    $("#appleSignIn").onclick = () => FEMFLOW.toast?.("🍎 Entrar com Apple em breve.");

    // --------- RECUPERAÇÃO DE SENHA ----------
    $("#goRecuperar").onclick = async () => {
      const email = $("#loginEmail").value.trim().toLowerCase();

      if (!email){
        setErr("Digite seu e-mail para recuperar a senha.");
        return;
      }

      setMsg("Enviando instruções...");

      try {
        const r = await fetch(FEMFLOW.SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "solicitarreset",
            email
          })
        });

        const data = await r.json();

        if (data.status === "ok") {
          setMsg("📬 Verifique seu e-mail!", true);
        } else if (data.status === "notfound") {
          setErr("E-mail não encontrado.");
        } else {
          setErr("Erro ao solicitar redefinição.");
        }
      } catch(e){
        console.error(e);
        setErr("Erro ao enviar solicitação.");
      }
    };

    // ==================================================
    //        IDIOMA — MODAL E TRADUÇÃO
    // ==================================================
    const modalLang = document.getElementById("ff-lang-modal");
    const btnLang   = document.getElementById("btnLoginLang");

    btnLang.onclick = () => {
      modalLang.classList.remove("hidden");
    };

    function aplicarIdiomaLogin(lang){
      const Tmap = {
        pt: {
          bemvinda: "Bem-vinda",
          subtitulo: "Acesse ou crie sua conta para iniciar seu ciclo",
          email: "Seu e-mail",
          senha: "Sua senha",
          entrar: "Entrar",
          cadastrar: "Ainda não tem conta? Cadastre-se",
          esquecer: "Esqueci minha senha"
        },
        en: {
          bemvinda: "Welcome",
          subtitulo: "Access or create your account to start your cycle",
          email: "Your email",
          senha: "Your password",
          entrar: "Login",
          cadastrar: "Don’t have an account? Sign up",
          esquecer: "Forgot my password"
        },
        fr: {
          bemvinda: "Bienvenue",
          subtitulo: "Accédez ou créez votre compte pour commencer votre cycle",
          email: "Votre e-mail",
          senha: "Votre mot de passe",
          entrar: "Entrer",
          cadastrar: "Pas de compte ? S'inscrire",
          esquecer: "J’ai oublié mon mot de passe"
        }
      };

      const T = Tmap[lang] || Tmap.pt;

      document.getElementById("tLoginBemVinda").textContent = T.bemvinda;
      document.getElementById("tLoginSub").textContent      = T.subtitulo;
      document.getElementById("loginEmail").placeholder     = T.email;
      document.getElementById("loginSenha").placeholder     = T.senha;
      document.getElementById("btnEntrar").textContent      = T.entrar;
      document.getElementById("linkCadastro").textContent   = T.cadastrar;
      document.getElementById("goRecuperar").textContent    = T.esquecer;
    }

    // torna global para o HTML inline
    window.setLoginLang = function(lang){
      try { FEMFLOW.setLang?.(lang); } catch(e){}
      localStorage.setItem("femflow_lang", lang);
      modalLang.classList.add("hidden");
      aplicarIdiomaLogin(lang);
    };

    // aplicar idioma salvo ao entrar
    const langSalvo = localStorage.getItem("femflow_lang") || "pt";
    aplicarIdiomaLogin(langSalvo);

  });
  </script>

  <!-- 🌐 Modal de Idioma -->
  <div id="ff-lang-modal" class="ff-lang-modal hidden">
    <div class="ff-lang-box">
      <h3 style="margin:0 0 14px; color:#335953;">Selecione o idioma</h3>

      <button onclick="setLoginLang('pt')" class="ff-lang-btn" style="background:#335953;">Português</button>
      <button onclick="setLoginLang('en')" class="ff-lang-btn" style="background:#cc6a5a;">English</button>
      <button onclick="setLoginLang('fr')" class="ff-lang-btn" style="background:#e2b5a5; color:#573b2e;">Français</button>

      <button onclick="document.getElementById('ff-lang-modal').classList.add('hidden')"
        class="ff-lang-close">Fechar</button>
    </div>
  </div>

</body>
</html>
