<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Entrar no FemFlow</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png"/>

  <style>
    :root{--terracota:#cc6a5a;--teal:#335953;--pessego:#efbda6;--bege:#f4e1d7;}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:"Lato",sans-serif;background:linear-gradient(180deg,var(--bege) 0%,var(--pessego) 100%);
      color:var(--teal);-webkit-font-smoothing:antialiased;
    }
    .login-card{
      width:90%;max-width:400px;padding:2rem;border-radius:18px;
      background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
      box-shadow:0 8px 20px rgba(0,0,0,.1);text-align:center;animation:fadeIn .4s ease;
    }
    .login-card img.logo{width:130px;margin-bottom:1rem}
    h2{margin:0;font-size:1.6rem;color:var(--terracota);font-family:"Playfair Display",serif}
    .subtitle{font-size:.95rem;color:var(--teal);margin:.35rem 0 1.2rem}
    .form-group{margin-bottom:.9rem;text-align:left}
    input{
      width:100%;padding:.8rem .9rem;border:1px solid #ddd;border-radius:12px;
      font-size:1rem;color:var(--teal);background:#fff;outline:none;
      transition:border-color .2s,box-shadow .2s
    }
    input:focus{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(204,106,90,.25)}
    button{
      width:100%;padding:.9rem;margin-top:.35rem;border:none;border-radius:14px;font-weight:700;font-size:1rem;
      color:#fff;background:linear-gradient(135deg,var(--teal),var(--terracota));cursor:pointer;transition:transform .25s ease
    }
    button:hover{transform:scale(1.02)}
    .toggle{font-size:.9rem;color:var(--terracota);margin-top:.8rem;cursor:pointer;text-decoration:underline}
    .message{margin-top:1rem;min-height:1.4rem;font-size:.95rem}
    .env-warn{
      position:fixed;top:0;left:0;right:0;padding:.7rem 1rem;text-align:center;
      background:#fff3cd;color:#856404;border-bottom:1px solid #ffeeba;font-size:.9rem;
      z-index:1000;display:none
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="env-warn" id="envWarn">
    ⚠️ Endpoint não configurado. Defina <code>localStorage.femflow_script</code> com o seu Deployment ID do Apps Script.
  </div>

  <div class="login-card">
    <img src="assets/logofemflowterracotasf.png" alt="FemFlow" class="logo"/>
    <h2>Bem-vinda ao FemFlow</h2>
    <p class="subtitle">Acesse ou crie sua conta para iniciar seu ciclo 🌸</p>

    <!-- Login -->
    <div id="loginBox">
      <div class="form-group"><input type="email" id="loginEmail" placeholder="Seu e-mail"/></div>
      <div class="form-group"><input type="password" id="loginSenha" placeholder="Sua senha"/></div>
      <button id="btnEntrar">Entrar</button>
      <a class="toggle" href="anamnese_deluxe.html">Ainda não tem conta? Cadastre-se</a>
      <p class="toggle" id="goRecuperar">Esqueci minha senha</p>
    </div>

    <!-- Recuperar Senha -->
    <div id="recuperarBox" style="display:none">
      <div class="form-group"><input type="email" id="recEmail" placeholder="Seu e-mail cadastrado"/></div>
      <button id="btnRecuperar">Enviar instruções</button>
      <p class="toggle" id="voltarLogin">Voltar ao login</p>
    </div>

    <!-- Cadastro (opcional) -->
    <div id="cadastroBox" style="display:none">
      <div class="form-group"><input type="text" id="nome" placeholder="Nome completo"/></div>
      <div class="form-group"><input type="email" id="email" placeholder="E-mail"/></div>
      <div class="form-group"><input type="password" id="senha" placeholder="Crie uma senha"/></div>
      <button id="btnCriar">Criar conta</button>
      <p class="toggle" id="goLogin">Já tem conta? Fazer login</p>
    </div>

    <p id="mensagem" class="message"></p>
  </div>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- 🔥 Inicialização segura do Firebase -->
  <script>
  (function initFirebase(){
    if(window._femflowFirebaseReady) return;
    const firebaseConfig = {
      apiKey: "AIzaSyB675lX-la7dGkZP1tfvzlPZ4oxvMPLBh0",
      authDomain: "femflow-ebec2.firebaseapp.com",
      projectId: "femflow-ebec2",
      storageBucket: "femflow-ebec2.appspot.com",
      messagingSenderId: "1043953159611",
      appId: "1:1043953159611:web:d12b82f744740f3124c89e",
      measurementId: "G-6F644L5VTW"
    };
    try{
      if(typeof firebase==="undefined"){console.error("Firebase SDK não encontrado");return;}
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      window._femflowFirebaseReady=true;
      console.log("🔥 Firebase inicializado com sucesso (FemFlow)");
    }catch(e){
      console.warn("⚠️ Falha ao inicializar Firebase:",e);
      window._femflowFirebaseReady=false;
    }
  })();
  </script>

  <!-- Core -->
  <script src="./femflow-core.js"></script>

  <script>
    const scriptURL = (FEMFLOW && FEMFLOW.SCRIPT_URL) || localStorage.getItem('femflow_script') || null;
    const $ = (s)=>document.querySelector(s);
    const msg=$("#mensagem"), warn=$("#envWarn");
    if(!scriptURL){warn.style.display='block';}

    // ========== Funções de exibição ==========
    function mostrarLogin(){ $("#recuperarBox").style.display="none"; $("#cadastroBox").style.display="none"; $("#loginBox").style.display="block"; msg.textContent=""; }
    function mostrarCadastro(){ $("#loginBox").style.display="none"; $("#recuperarBox").style.display="none"; $("#cadastroBox").style.display="block"; msg.textContent=""; }

    $("#goLogin")?.addEventListener("click", mostrarLogin);
    $("#goRecuperar")?.addEventListener("click", ()=>{ $("#loginBox").style.display="none"; $("#recuperarBox").style.display="block"; msg.textContent=""; });
    $("#voltarLogin")?.addEventListener("click", mostrarLogin);

    function setMsg(t,ok=false){msg.textContent=t;msg.style.color=ok?"#2e7d32":"#335953";}
    function setErr(t){msg.textContent=t;msg.style.color="#cc6a5a";}

    // ========== Revalidação automática ==========
    (function autoRouteIfLogged(){
      const id=localStorage.getItem('femflow_id');
      const auth=localStorage.getItem('femflow_auth')==='yes';
      if(id && auth){ location.href='home.html'; }
    })();

    // ========== Comunicação com Apps Script ==========
    async function postGAS(payload){
        const r = await fetch(scriptURL, {
    method: "POST",
    headers: { "Content-Type": "application/json" }, // ✅ mantém JSON
    body: JSON.stringify(payload)
  });
  return r.json();
}

    // ========== Cadastro ==========
    async function registrar(){
      if(!scriptURL){setErr("Endpoint não configurado.");return;}
      const nome=$("#nome").value.trim(), email=$("#email").value.trim(), senha=$("#senha").value.trim();
      if(!nome||!email||!senha){setErr("Preencha todos os campos.");return;}
      setMsg("Criando conta...");
      try{
        const data=await postGAS({action:"register",nome,email,senha});
        if(data.status==="ok"||data.status==="created"){
          setMsg(`Conta criada! Bem-vinda, ${data.nome||nome} ✨`,true);
          localStorage.setItem("femflow_id",data.id);
          localStorage.setItem("femflow_email",data.email||email);
          localStorage.setItem("femflow_auth","yes");
          setTimeout(()=>location.href="ciclo.html",1000);
        }else setErr(data.msg||"Erro ao cadastrar.");
      }catch(e){console.error(e);setErr("Erro de rede.");}
    }

    // ========== Login ==========
    async function entrar(){
      if(!scriptURL){setErr("Endpoint não configurado.");return;}
      const email=$("#loginEmail").value.trim();
      const senha=$("#loginSenha").value.trim();
      if(!email||!senha){setErr("Digite e-mail e senha.");return;}
      setMsg("Verificando...");
      try{
        const data=await postGAS({action:"login",email,senha});
        console.log("Login retorno:",data);

        // 🧩 Checa licença
        if(data.licencaAtiva===false){
          setErr("💳 Sua assinatura está inativa. Clique para renovar.");
          setTimeout(()=>window.open("https://pay.hotmart.com/SEU-LINK-MENSAL","_blank"),2000);
          return;
        }

        if(data.status==="ok"){
          setMsg(`Bem-vinda, ${data.nome||"aluna"}!`,true);
          localStorage.setItem("femflow_id",data.id);
          localStorage.setItem("femflow_nome",data.nome||"");
          localStorage.setItem("femflow_email",data.email||email);
          localStorage.setItem("femflow_auth","yes");
          setTimeout(()=>location.href="home.html",800);
        }else setErr(data.msg||"E-mail ou senha incorretos.");
      }catch(e){console.error(e);setErr("Erro de rede. Tente novamente.");}
    }

    // ========== Recuperar senha ==========
    async function recuperarSenha(){
      const email=$("#recEmail").value.trim();
      if(!email){setErr("Digite seu e-mail.");return;}
      setMsg("Verificando...");
      try{
        const data=await postGAS({action:"recuperarsenha",email});
        if(data.status==="ok") setMsg("📩 Se o e-mail existir, você receberá instruções em instantes.",true);
        else setErr("⚠️ E-mail não encontrado.");
      }catch(e){setErr("Erro de rede.");}
    }

    // ========== Eventos ==========
    $("#btnEntrar").addEventListener("click", entrar);
    $("#btnCriar")?.addEventListener("click", registrar);
    $("#btnRecuperar").addEventListener("click", recuperarSenha);
    $("#loginSenha").addEventListener("keydown",e=>{if(e.key==='Enter')entrar();});
    $("#senha")?.addEventListener("keydown",e=>{if(e.key==='Enter')registrar();});
    $("#recEmail").addEventListener("keydown",e=>{if(e.key==='Enter')recuperarSenha();});
  </script>
</body>
</html>
