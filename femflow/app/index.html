<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Entrar no FemFlow</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>window.FEMFLOW_DISABLE_UI = true;</script>
  <script defer src="./femflow-core.js"></script>

  <!-- GOOGLE SIGN-IN (PRONTO E CONFIGURADO) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Callback -->
  <div id="g_id_onload"
       data-client_id="457716839153-mot8gjc4j50cfug9em1t1niahhferll6.apps.googleusercontent.com"
       data-callback="preencherComGoogle"
       data-auto_select="false"
       data-login_uri="https://myflowlife.com.br/femflow/app/index.html">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <style>
    :root{
      --terracota:#cc6a5a;
      --verde:#335953;
      --pessego:#fceae3;
      --bege:#fffaf7;
      --texto:#5b4f49;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Lato",sans-serif;
      background:linear-gradient(180deg,var(--bege) 0%,var(--pessego) 100%);
      color:var(--texto);
    }

    .login-card{
      width:92%;
      max-width:400px;
      padding:2.2rem 1.7rem;
      border-radius:26px;
      background:rgba(255,255,255,0.94);
      backdrop-filter:blur(14px);
      box-shadow:0 10px 28px rgba(0,0,0,0.08);
      text-align:center;
      animation:fadeIn .5s ease;
      border:1px solid rgba(255,255,255,0.6);
    }

    .logo{ width:120px; margin-bottom:1rem }

    h2{
      font-family:"Playfair Display",serif;
      color:var(--terracota);
      font-size:1.65rem;
      margin:0;
    }

    .subtitle{
      font-size:.95rem;
      color:var(--verde);
      margin:.5rem 0 1.8rem;
    }

    input{
      width:78%;
      max-width:290px;
      padding:.8rem 1rem;
      margin:0 auto 1rem auto;
      border:1px solid #e6ddd8;
      border-radius:14px;
      font-size:.95rem;
      display:block;
      color:var(--texto);
      background:#fff;
      transition:.2s;
    }

  /* NOVO PADRÃO FEMFLOW – inputs totalmente alinhados */
input,
.password-wrapper {
  width: 78%;
  max-width: 290px;
  margin: 0 auto 1rem auto;
  display: block;
  box-sizing: border-box;
}

.password-wrapper input {
  width: 100%;
}

    /* 🔧 Wrapper opcional para telas futuras */
.login-box {
  width: 92%;
  max-width: 400px;
  margin: 0 auto;
  padding: 0; /* evita conflito com padding do login-card */
  box-sizing: border-box;
}

/* Label alinhado caso use campos com label */
.login-label {
  text-align: left;
  font-size: 0.95rem;
  margin: 6px auto 4px;
  width: 78%;
  max-width: 290px;
  color: var(--texto);
  display: block;
}
    /* OLHO iOS */
    .toggle-eye{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      width:22px;
      height:22px;
      background-image:url("assets/icons/eye-off.svg");
      background-size:22px;
      background-repeat:no-repeat;
      opacity:.55;
      cursor:pointer;
      transition:.25s ease;
    }
    .toggle-eye.active{
      background-image:url("assets/icons/eye.svg");
      opacity:.95;
      transform:translateY(-50%) scale(1.05);
    }

    /* BARRA DE FORÇA */
    .strength-meter{
      width:78%;
      max-width:290px;
      margin:-4px auto 14px auto;
      display:flex;
      gap:6px;
      justify-content:center;
    }
    .strength-bar{
      flex:1;
      height:6px;
      background:#e6ddd8;
      border-radius:6px;
      opacity:.5;
      transition:.35s ease;
    }
    .strength-1 #bar1{ background:#cc6a5a; opacity:1; }
    .strength-2 #bar1,
    .strength-2 #bar2{ background:#efbda6; opacity:1; }
    .strength-3 #bar1,
    .strength-3 #bar2,
    .strength-3 #bar3{ background:#335953; opacity:1; }

    /* BOTÃO ENTRAR — VERSÃO MENOR E ELEGANTE */
    button{
      width:64%;
      max-width:240px;
      padding:.85rem;
      background:linear-gradient(135deg,var(--verde),var(--terracota));
      border:none;
      border-radius:14px;
      color:#fff;
      font-weight:600;
      cursor:pointer;
      font-size:.95rem;
      margin:0 auto .8rem auto;
      display:block;
      transition:.25s;
    }

    .toggle{ color:var(--terracota); text-decoration:underline; cursor:pointer; margin:.8rem 0; display:block; }

    .message{
      min-height:1.4rem;
      margin:.8rem 0;
      font-size:.95rem;
      text-align:center;
    }

    /* SOCIAL BOHO */
    .social-row.boho{
      display:flex;
      justify-content:center;
      gap:18px;
      margin:1.6rem 0;
    }

    .social-icon.boho{
      width:56px;
      height:56px;
      border-radius:18px;
      background:linear-gradient(145deg,#f7e9e3,#f3d7cb,#f6ece5);
      border:1px solid rgba(204,106,90,0.25);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.12),
                 inset 0 1px 2px rgba(255,255,255,0.4);
      transition:.35s;
      cursor:pointer;
    }
  </style>
</head>

<body>
<div class="login-card">

  <img src="assets/logofemflowterracotasf.png" class="logo"/>

  <h2>Bem-vinda ao FemFlow</h2>
  <p class="subtitle">Acesse ou crie sua conta para iniciar seu ciclo 🌸</p>

  <input id="loginEmail" type="email" placeholder="Seu e-mail"/>

  <!-- SENHA -->
  <div class="password-wrapper">
    <input id="loginSenha" type="password" placeholder="Sua senha">
    <span id="toggleSenha" class="toggle-eye"></span>
  </div>

  <!-- METER -->
  <div class="strength-meter" id="strengthMeter">
    <div class="strength-bar" id="bar1"></div>
    <div class="strength-bar" id="bar2"></div>
    <div class="strength-bar" id="bar3"></div>
  </div>

  <button id="btnEntrar" type="button">Entrar</button>
  <p id="mensagem" class="message"></p>

  <a class="toggle" href="anamnese_deluxe.html">Ainda não tem conta? Cadastre-se</a>
  <p class="toggle" id="goRecuperar">Esqueci minha senha</p>

  <div class="social-row boho">
    <div class="social-icon boho google" id="googleSignIn">
      <img src="assets/icons/google-g.svg">
    </div>

    <div class="social-icon boho apple" id="appleSignIn">
      <img src="assets/icons/apple.svg">
    </div>

    <div class="social-icon boho bio" id="bioSignIn">🔒</div>
  </div>

</div>
<script>
document.getElementById("btnEsqueci")?.addEventListener("click", () => {
  const email = document.getElementById("loginEmail").value.trim();
  FEMFLOW.solicitarResetSenha(email);
});
</script>
<script>
/* === HELPERS === */
window.FEMFLOW = window.FEMFLOW || {};

const scriptURL =
  FEMFLOW.SCRIPT_URL ||
  localStorage.getItem("femflow_script") ||
  "https://api-myflowlife.falling-wildflower-a8c0.workers.dev";

const $ = s => document.querySelector(s);
const msg = $("#mensagem");

function setErr(t){ msg.textContent=t; msg.style.color="#cc6a5a"; }
function setMsg(t,ok=false){ msg.textContent=t; msg.style.color=ok?"#2e7d32":"#335953"; }

async function postGAS(p){
  const r = await fetch(scriptURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(p)
  });
  if(!r.ok) throw new Error();
  return r.json();
}

/* === LOGIN PADRÃO === */
async function entrar(){
  const email=$("#loginEmail").value.trim();
  const senha=$("#loginSenha").value.trim();

  if(!email || !senha){ setErr("Digite e-mail e senha."); return; }

  setMsg("Verificando...");

  try{
    const d=await postGAS({action:"login",email,senha});
    if(d.status==="ok"){
      setMsg(`Bem-vinda, ${d.nome||"aluna"}!`,true);
      localStorage.setItem("femflow_id",d.id);
      localStorage.setItem("femflow_email",d.email||email);
      localStorage.setItem("femflow_auth","yes");
      setTimeout(()=>location.href="home.html",700);
    } else setErr(d.msg||"E-mail ou senha incorretos.");
  } catch(e){ setErr("Erro de rede."); }
}

$("#btnEntrar").onclick = entrar;
$("#loginSenha").addEventListener("keydown",e=>{ if(e.key==="Enter") entrar(); });

/* === OLHO iOS === */
const senhaInput = $("#loginSenha");
const toggle = $("#toggleSenha");

toggle.onclick = ()=>{
  const isPass = senhaInput.type==="password";
  senhaInput.type = isPass ? "text" : "password";
  toggle.classList.toggle("active",isPass);
};

/* === FORÇA DA SENHA === */
const meter = $("#strengthMeter");

senhaInput.addEventListener("input", ()=>{
  const v = senhaInput.value;
  let score = 0;
  if(v.length >= 6) score++;
  if(/[A-Z]/.test(v) || /[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v) || v.length >= 10) score++;

  meter.classList.remove("strength-1","strength-2","strength-3");
  if(score===1) meter.classList.add("strength-1");
  if(score===2) meter.classList.add("strength-2");
  if(score>=3) meter.classList.add("strength-3");
});

/* ==================================================
   GOOGLE LOGIN — VERSÃO FINAL COM CALLBACK
   ================================================== */
$("#googleSignIn").onclick = ()=> google.accounts.id.prompt();

async function preencherComGoogle(response){
  try{
    const data = jwt_decode(response.credential);
    if(!data || !data.email) return;

    $("#loginEmail").value = data.email;

    const res = await postGAS({action:"login",email:data.email,senha:""});

    if(res.status==="ok"){
      localStorage.setItem("femflow_id",res.id);
      localStorage.setItem("femflow_email",res.email);
      localStorage.setItem("femflow_auth","yes");
      FEMFLOW.toast?.("✨ Login automático realizado!");
      setTimeout(()=>location.href="home.html",800);
    } else {
      FEMFLOW.toast?.("💡 Complete seu cadastro para continuar.");
    }

  } catch(e){
    console.warn("Erro Google:",e);
  }
}

window.preencherComGoogle = preencherComGoogle;

/* ==================================================
   BIOMETRIA — AGORA FUNCIONANDO (ES256 + RS256)
   ================================================== */
const bio=$("#bioSignIn");

(async()=>{
  if(window.PublicKeyCredential &&
     await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()){
    bio.style.display="flex";
  }
})();

bio.onclick = async ()=>{
  try{
    const email=$("#loginEmail").value.trim();
    if(!email){ setErr("Digite seu e-mail."); return; }

    const chal = crypto.getRandomValues(new Uint8Array(32));

    await navigator.credentials.create({
      publicKey:{
        challenge: chal,
        rp:{ name:"FemFlow" },
        user:{
          id:new TextEncoder().encode(email),
          name: email,
          displayName: email
        },
        pubKeyCredParams:[
          { type:"public-key", alg:-7 },
          { type:"public-key", alg:-257 }
        ],
        authenticatorSelection:{
          authenticatorAttachment:"platform",
          userVerification:"required"
        }
      }
    });

    const res = await postGAS({action:"login",email,senha:""});
    if(res.status==="ok"){
      localStorage.setItem("femflow_id",res.id);
      localStorage.setItem("femflow_email",res.email||email);
      localStorage.setItem("femflow_auth","yes");
      setMsg("Acesso liberado ✨",true);
      setTimeout(()=>location.href="home.html",700);
    }
  } catch(e){
    console.warn(e);
    setErr("Falha ao usar biometria.");
  }
};

/* APPLE LOGIN FUTURO */
$("#appleSignIn").onclick = ()=> FEMFLOW.toast?.("🍎 Entrar com Apple em breve.");
  
/* ==================================================
   🔐 RECUPERAÇÃO DE SENHA (FLUXO SIMPLIFICADO)
================================================== */
$("#goRecuperar").onclick = async () => {
  const email = $("#loginEmail").value.trim();

  if (!email) {
    setErr("Digite seu e-mail para recuperar a senha.");
    return;
  }

  setMsg("Enviando instruções...", false);

  try {
    const res = await FEMFLOW.resetSenha(email);

    if (res.ok) {
      setMsg("📬 Verifique seu e-mail!", true);
    } else {
      setErr("E-mail não encontrado.");
    }

  } catch (e) {
    console.error(e);
    setErr("Erro ao enviar solicitação.");
  }
};

</script>
</body>
</html>
