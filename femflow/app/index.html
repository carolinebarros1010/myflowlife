<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FemFlow Cyclic Trainer</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#CC6A5A" />
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <script>
          // redirect to ciclo page if no ID stored
      document.addEventListener('DOMContentLoaded', () => {
        const id = localStorage.getItem('femflow_id');
        if (!id) {
         document.addEventListener('DOMContentLoaded', () => {
  if (!localStorage.getItem('femflow_id')) {
    document.querySelector('.container').style.display = 'none';
    window.location.href = 'ciclo.html';
  }
});
    </script>
  </head>
  <body>
    <header>
      <img src="assets/icons/icon-192.png" alt="FemFlow logo" style="width:64px;height:64px;" />
      <h1>FemFlow</h1>
      <p class="subtitle">Cyclic Trainer</p>
    </header>
    <div class="container">
      <button class="btn" onclick="location.href='ciclo.html'">🔍 Identificar e ajustar ciclo</button>
      <button class="btn btn-secondary" onclick="location.href='treino.html'">💪 Treino diário</button>
      <button class="btn" style="background:var(--pessego);" onclick="location.href='evolucao.html'">📊 Minha evolução</button>
      <button class="btn btn-hotmart" onclick="window.open('https://pay.hotmart.com/Q102567067C','_blank')">💫 Adquira seu Acesso</button>
    </div>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('✅ Service Worker registrado'))
      .catch((err) => console.error('SW erro:', err));
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.deferredPrompt = e;
    console.log('📱 App instalável detectado');
  });
</script>
    <!-- === FEMFLOW INSTALL & PAYMENT SECTION === -->
<section class="instalar-app">
  <h3>💫 Tenha o FemFlow no seu celular</h3>
  <p>Instale o app e acompanhe seus treinos e ciclo — mesmo offline.</p>

  <!-- Botão de instalação PWA -->
  <button id="installButton" class="btn-install">📲 Instalar o App FemFlow</button>

  <hr style="border:none; border-top:1px solid rgba(0,0,0,0.1); margin:1.5rem 0;">

  <!-- Botão de pagamento Hotmart -->
  <button class="btn-hotmart" onclick="window.open('https://pay.hotmart.com/Q102567067C','_blank')">
    💪 Adquira seu treino completo
  </button>

  <!-- QR Code -->
  <div class="qrcode-container">
    <p style="margin-bottom:0.5rem;">ou escaneie e instale direto:</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://carolinebarros1010.github.io/myflowlife/femflow/app/" 
         alt="QR Code FemFlow" width="160" height="160">
  </div>
</section>

<!-- Script de instalação do PWA -->
<script>
  let deferredPrompt;
  const installButton = document.getElementById('installButton');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installButton.style.display = 'block';
  });

  installButton.addEventListener('click', async () => {
    installButton.disabled = true;
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        console.log('✅ App FemFlow instalado!');
        installButton.innerText = "App instalado 🌸";
      } else {
        installButton.disabled = false;
      }
      deferredPrompt = null;
    }
  });
</script>

      </body>
</html>
