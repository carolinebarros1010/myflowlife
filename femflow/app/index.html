<script>
/* === HELPERS === */
window.FEMFLOW = window.FEMFLOW || {};

const scriptURL =
  FEMFLOW.SCRIPT_URL ||
  localStorage.getItem("femflow_script") ||
  "https://api-myflowlife.falling-wildflower-a8c0.workers.dev";

const $ = s => document.querySelector(s);
const msg = $("#mensagem");

function setErr(t){ msg.textContent=t; msg.style.color="#cc6a5a"; }
function setMsg(t,ok=false){ msg.textContent=t; msg.style.color=ok?"#2e7d32":"#335953"; }

async function postGAS(p){
  const r = await fetch(scriptURL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(p)
  });
  if(!r.ok) throw new Error();
  return r.json();
}

/* === LOGIN PADRÃO === */
async function entrar(){
  const email=$("#loginEmail").value.trim();
  const senha=$("#loginSenha").value.trim();

  if(!email || !senha){ setErr("Digite e-mail e senha."); return; }

  setMsg("Verificando...");

  try{
    const d=await postGAS({action:"login",email,senha});
    if(d.status==="ok"){
      setMsg(`Bem-vinda, ${d.nome||"aluna"}!`,true);
      localStorage.setItem("femflow_id",d.id);
      localStorage.setItem("femflow_email",d.email||email);
      localStorage.setItem("femflow_auth","yes");
      setTimeout(()=>location.href="home.html",700);
    } else setErr(d.msg||"E-mail ou senha incorretos.");
  } catch(e){ setErr("Erro de rede."); }
}

$("#btnEntrar").onclick = entrar;
$("#loginSenha").addEventListener("keydown",e=>{ if(e.key==="Enter") entrar(); });

/* === OLHO iOS === */
const senhaInput = document.querySelector("#loginSenha");
const toggle = document.querySelector("#toggleSenha");

toggle.addEventListener("click", () => {
  const isPass = senhaInput.type === "password";

  // troca tipo
  senhaInput.type = isPass ? "text" : "password";

  // ativa o olho
  if (isPass) {
    toggle.classList.add("active");
  } else {
    toggle.classList.remove("active");
  }
});

/* === FORÇA DA SENHA === */
const meter = $("#strengthMeter");

senhaInput.addEventListener("input", ()=>{
  const v = senhaInput.value;
  let score = 0;
  if(v.length >= 6) score++;
  if(/[A-Z]/.test(v) || /[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v) || v.length >= 10) score++;

  meter.classList.remove("strength-1","strength-2","strength-3");
  if(score===1) meter.classList.add("strength-1");
  if(score===2) meter.classList.add("strength-2");
  if(score>=3) meter.classList.add("strength-3");
});

/* ==================================================
   GOOGLE LOGIN — VERSÃO FINAL COM CALLBACK
   ================================================== */
$("#googleSignIn").onclick = ()=> google.accounts.id.prompt();

async function preencherComGoogle(response){
  try{
    const data = jwt_decode(response.credential);
    if(!data || !data.email) return;

    $("#loginEmail").value = data.email;

    const res = await postGAS({action:"login",email:data.email,senha:""});

    if(res.status==="ok"){
      localStorage.setItem("femflow_id",res.id);
      localStorage.setItem("femflow_email",res.email);
      localStorage.setItem("femflow_auth","yes");
      FEMFLOW.toast?.("✨ Login automático realizado!");
      setTimeout(()=>location.href="home.html",800);
    } else {
      FEMFLOW.toast?.("💡 Complete seu cadastro para continuar.");
    }

  } catch(e){
    console.warn("Erro Google:",e);
  }
}

window.preencherComGoogle = preencherComGoogle;

/* ==================================================
   BIOMETRIA — AGORA FUNCIONANDO (ES256 + RS256)
   ================================================== */
const bio=$("#bioSignIn");

(async()=>{
  if(window.PublicKeyCredential &&
     await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()){
    bio.style.display="flex";
  }
})();

bio.onclick = async ()=>{
  try{
    const email=$("#loginEmail").value.trim();
    if(!email){ setErr("Digite seu e-mail."); return; }

    const chal = crypto.getRandomValues(new Uint8Array(32));

    await navigator.credentials.create({
      publicKey:{
        challenge: chal,
        rp:{ name:"FemFlow" },
        user:{
          id:new TextEncoder().encode(email),
          name: email,
          displayName: email
        },
        pubKeyCredParams:[
          { type:"public-key", alg:-7 },
          { type:"public-key", alg:-257 }
        ],
        authenticatorSelection:{
          authenticatorAttachment:"platform",
          userVerification:"required"
        }
      }
    });

    const res = await postGAS({action:"login",email,senha:""});
    if(res.status==="ok"){
      localStorage.setItem("femflow_id",res.id);
      localStorage.setItem("femflow_email",res.email||email);
      localStorage.setItem("femflow_auth","yes");
      setMsg("Acesso liberado ✨",true);
      setTimeout(()=>location.href="home.html",700);
    }
  } catch(e){
    console.warn(e);
    setErr("Falha ao usar biometria.");
  }
};

/* APPLE LOGIN FUTURO */
$("#appleSignIn").onclick = ()=> FEMFLOW.toast?.("🍎 Entrar com Apple em breve.");
  
/* ==================================================
   🔐 RECUPERAÇÃO DE SENHA (FLUXO SIMPLIFICADO)
================================================== */
$("#goRecuperar").onclick = async () => {
  const email = $("#loginEmail").value.trim().toLowerCase();

  if (!email) {
    setErr("Digite seu e-mail para recuperar a senha.");
    return;
  }

  setMsg("Enviando instruções...", false);

  try {
    const r = await fetch(FEMFLOW.SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "solicitarreset",
        email
      })
    });

    const data = await r.json();

    if (data.status === "ok") {
      setMsg("📬 Verifique seu e-mail!", true);
    }
    else if (data.status === "notfound") {
      setErr("E-mail não encontrado.");
    }
    else {
      setErr("Erro ao solicitar redefinição.");
    }

  } catch (e) {
    console.error(e);
    setErr("Erro ao enviar solicitação.");
  }
};


</script>
    <script>
// Botão abre o modal
document.getElementById("btnLoginLang").onclick = () => {
  document.getElementById("ff-lang-modal").classList.remove("hidden");
};

// Função para trocar idioma no login e persistir no app todo
function setLoginLang(lang){
  try { 
    FEMFLOW.setLang(lang); 
  } catch(e){}

  localStorage.setItem("femflow_lang", lang);

  document.getElementById("ff-lang-modal").classList.add("hidden");

  // Atualiza textos do login imediatamente
  aplicarIdiomaLogin(lang);
}

// Atualiza placeholders, textos e botões do login
function aplicarIdiomaLogin(lang){
  const T = {
    pt: {
      bemvinda: "Bem-vinda",
      subtitulo: "Acesse ou crie sua conta para iniciar seu ciclo",
      email: "Seu e-mail",
      senha: "Sua senha",
      entrar: "Entrar",
      cadastrar: "Ainda não tem conta? Cadastre-se",
      esquecer: "Esqueci minha senha"
    },
    en: {
      bemvinda: "Welcome",
      subtitulo: "Access or create your account to start your cycle",
      email: "Your email",
      senha: "Your password",
      entrar: "Login",
      cadastrar: "Don't have an account? Sign up",
      esquecer: "Forgot my password"
    },
    fr: {
      bemvinda: "Bienvenue",
      subtitulo: "Accédez ou créez votre compte pour commencer votre cycle",
      email: "Votre e-mail",
      senha: "Votre mot de passe",
      entrar: "Entrer",
      cadastrar: "Pas de compte ? S'inscrire",
      oublier: "J'ai oublié mon mot de passe"
    }
  }[lang];

  document.querySelector("h2").textContent = T.bemvinda;
  document.querySelector(".subtitle").textContent = T.subtitulo;
  document.getElementById("loginEmail").placeholder = T.email;
  document.getElementById("loginSenha").placeholder = T.senha;
  document.getElementById("btnEntrar").textContent = T.entrar;
  document.querySelector("a.toggle").textContent = T.cadastrar;
  document.getElementById("goRecuperar").textContent = T.esquecer || T.oublier;
}

// Ao entrar na página, já carregar o idioma salvo
const langSalvo = localStorage.getItem("femflow_lang") || "pt";
aplicarIdiomaLogin(langSalvo);
</script>
