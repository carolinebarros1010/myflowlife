<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treino Diário - FemFlow</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>

  <body>
    <header>
      <h1>Treino Diário</h1>
    </header>

    <div class="container">
      <div id="treinoContainer" class="section" style="text-align:center;">
        <h3 id="tituloTreino">Carregando treino...</h3>
        <video id="videoTreino" width="100%" height="auto" controls playsinline></video>
      </div>

      <div class="section">
        <label for="pseInput">Avalie o esforço (PSE de 0 a 10)</label>
        <input type="range" id="pseInput" min="0" max="10" step="1" value="5" />
        <p id="pseValor" style="text-align:center;">PSE: 5</p>
      </div>

      <div class="botoes-treino">
        <button class="btn" onclick="registrarPSE()">Registrar PSE</button>
        <button class="btn btn-secondary" onclick="proximoTreino()">Próximo treino</button>
      </div>

      <button class="btn" style="margin-top:1.5rem;" onclick="location.href='index.html'">🏠 Voltar ao início</button>
    </div>

    <script src="js/memoria.js"></script>
    <script>
      // --- Protege acesso (só entra se tiver ID válido)
      const id = localStorage.getItem('femflow_id');
      if (!id) window.location.href = 'ciclo.html';

      // --- Exibe fase atual no topo
      const faseAtual = localStorage.getItem("fase_sugerida");
      if (faseAtual) {
        const header = document.querySelector('header');
        const faseInfo = document.createElement('p');
        faseInfo.innerText = `🌿 Fase atual: ${faseAtual}`;
        faseInfo.style.color = "#335953";
        faseInfo.style.fontWeight = "600";
        faseInfo.style.marginTop = "0.3rem";
        header.appendChild(faseInfo);
      }

      // --- Atualiza valor visual do PSE
      const pseInput = document.getElementById('pseInput');
      const pseValor = document.getElementById('pseValor');
      pseInput.addEventListener('input', () => {
        pseValor.innerText = `PSE: ${pseInput.value}`;
      });

      // --- Carrega vídeo e dados do treino
      const video = document.getElementById('videoTreino');
      video.onerror = () => {
        alert("Vídeo indisponível offline. Tente novamente com internet ativa.");
      };

      document.addEventListener('DOMContentLoaded', () => {
        const diaPrograma = obterDiaPrograma();
        const fase = localStorage.getItem("fase_sugerida") || "Folicular";

        const titulo = document.getElementById("tituloTreino");
        titulo.innerText = `Treino do Dia ${diaPrograma} – Fase ${fase}`;

        // Caminho do vídeo conforme fase e dia
        const videoPath = `videos/video_${fase.toLowerCase()}_${diaPrograma}.mp4`;
        video.src = videoPath;
      });

      // --- Função para registrar PSE local e enviar ao servidor
      function registrarPSE() {
        const pse = Number(document.getElementById('pseInput').value);
        const fase = localStorage.getItem("fase_sugerida") || "Folicular";
        const diaPrograma = obterDiaPrograma();
        const data = new Date().toISOString().split('T')[0];

        salvarTreino(id, data, fase, diaPrograma, pse);

        alert("✅ PSE registrado com sucesso!");
      }

      // --- Avança o treino para o próximo dia
      function proximoTreino() {
        const diaAtual = obterDiaPrograma();
        const proximo = diaAtual + 1;
        salvarMemoria(id, { ultimoTreino: proximo });
        location.reload();
      }

      // --- Auxiliar: obtém o dia atual do programa
      function obterDiaPrograma() {
        const memoria = carregarMemoria(id);
        return memoria?.ultimoTreino || 1;
      }
    </script>

    <style>
      .botoes-treino {
        display: flex;
        justify-content: space-around;
        gap: 1rem;
        margin-top: 1rem;
      }

      #pseInput {
        width: 100%;
        accent-color: var(--terracota);
      }

      #pseValor {
        font-weight: 600;
        color: var(--teal);
      }
    </style>
    <script>
// 🌸 Instalação FemFlow – PWA Inteligente

let deferredPrompt;

// === ANDROID: instala automaticamente (ou com botão flutuante) ===
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  // Exibe popup automático após 3 segundos
  setTimeout(async () => {
    if (deferredPrompt) {
      await deferredPrompt.prompt();
      deferredPrompt = null;
    }
  }, 3000);

  // Botão manual caso o prompt falhe
  const btn = document.createElement('button');
  btn.textContent = '📲 Instalar FemFlow';
  btn.className = 'btn';
  btn.style.cssText = `
    position:fixed;
    bottom:1.2rem;
    left:50%;
    transform:translateX(-50%);
    background:var(--teal);
    color:white;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:0.8rem 1.4rem;
    z-index:9999;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  `;
  btn.onclick = async () => {
    btn.disabled = true;
    await deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      btn.textContent = '✅ Instalado com sucesso!';
      setTimeout(() => btn.remove(), 2500);
    } else {
      btn.textContent = '⚠️ Instalação cancelada';
      btn.disabled = false;
    }
  };
  document.body.appendChild(btn);
});

// === iPHONE: mostra banner educativo ===
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandalone = ('standalone' in window.navigator) && window.navigator.standalone;
if (isIOS && !isInStandalone) {
  const aviso = document.createElement('div');
  aviso.innerHTML = `
    <div style="
      position:fixed;
      bottom:10px;
      left:10px;
      right:10px;
      background:var(--pessego);
      color:white;
      text-align:center;
      padding:1rem;
      border-radius:12px;
      font-weight:600;
      z-index:9999;
      box-shadow:0 2px 8px rgba(0,0,0,0.3);
    ">
      📲 Para instalar o FemFlow:<br>
      Toque em <strong>Compartilhar ▢</strong> → <strong>“Adicionar à Tela de Início”</strong>
    </div>`;
  document.body.appendChild(aviso);
}

// === Fallback universal (para browsers sem suporte) ===
if (!('BeforeInstallPromptEvent' in window)) {
  const info = document.createElement('div');
  info.innerHTML = `
    <div style="
      margin:1rem;
      padding:1rem;
      background:var(--terracota);
      color:white;
      border-radius:10px;
      font-weight:600;
      text-align:center;
    ">
      ⚙️ Dica: adicione este site à tela inicial pelo menu do navegador.
    </div>`;
  document.body.appendChild(info);
}
</script>
<script>
let deferredPrompt;

// Android: wait for beforeinstallprompt, then prompt automatically after 3 s
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // prompt automatically after 3 s
  setTimeout(async () => {
    if (deferredPrompt) {
      await deferredPrompt.prompt();
      deferredPrompt = null;
    }
  }, 3000);
  // optional floating install button
  const btn = document.createElement('button');
  btn.textContent = '📲 Instalar FemFlow';
  btn.className = 'btn';
  btn.style.cssText = 'position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);z-index:9999;';
  btn.onclick = async () => {
    if (deferredPrompt) {
      await deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      if (result.outcome === 'accepted') {
        btn.remove();
      }
    }
  };
  document.body.appendChild(btn);
});

// iOS: show instruction banner if not installed
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = ('standalone' in window.navigator) && window.navigator.standalone;
if (isIOS && !isStandalone) {
  const banner = document.createElement('div');
  banner.innerHTML = `
    <div style="position:fixed;bottom:10px;left:10px;right:10px;background:var(--pessego);
    color:white;padding:1rem;border-radius:12px;z-index:9999;">
      📲 Para instalar FemFlow: toque em <strong>Compartilhar ▢</strong>
      e escolha <strong>“Adicionar à Tela de Início”</strong>.
    </div>`;
  document.body.appendChild(banner);
}
</script>

  </body>
</html>
