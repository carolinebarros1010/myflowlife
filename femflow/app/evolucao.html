<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Evolução - FemFlow</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <h1>Minha Evolução</h1>
    </header>
    <div class="container">
      <div id="evolucaoContainer" class="section">
        <p>Veja seu progresso de PSE ao longo do programa.</p>
        <ul id="listaEvolucao" style="list-style:none; padding:0;"></ul>
      </div>
      <button class="btn" onclick="location.href='index.html'">Voltar ao menu</button>
    </div>
    <script src="js/memoria.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const id = localStorage.getItem('femflow_id');
        if (!id) {
          window.location.href = 'ciclo.html';
          return;
        }
        const memoria = carregarMemoria(id);
        if (!memoria) {
          document.getElementById('listaEvolucao').innerHTML = '<li>Você ainda não iniciou o programa.</li>';
          return;
        }
        const lista = document.getElementById('listaEvolucao');
        // ordenar treinos por diaPrograma
        const treinos = memoria.treinos.slice().sort((a,b) => a.diaPrograma - b.diaPrograma);
        if (treinos.length === 0) {
          lista.innerHTML = '<li>Ainda não há treinos registrados.</li>';
        } else {
          treinos.forEach(t => {
            const li = document.createElement('li');
            li.style.padding = '0.5rem';
            li.style.borderBottom = '1px solid rgba(0,0,0,0.1)';
            let cor;
            if (t.pse <= 3) cor = 'var(--teal)'; else if (t.pse <= 7) cor = 'var(--pessego)'; else cor = 'var(--terracota)';
            li.innerHTML = `<strong>Dia ${t.diaPrograma}</strong> – Fase ${t.fase} – PSE <span style="color:${cor}">${t.pse}</span>`;
            lista.appendChild(li);
          });
        }
      });
    </script>
  </body>
</html>
