<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Evolução - FemFlow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .texto-progresso { font-weight: 700; color: var(--teal); margin-bottom: 0.6rem; letter-spacing: 0.5px; }
    .barra-progresso { position: relative; width: 100%; height: 18px; border-radius: 20px; background: rgba(240,236,233,0.8); overflow: hidden; }
    .preenchimento-progresso { width: 0%; height: 100%; border-radius: 20px; background: linear-gradient(90deg,var(--terracota),var(--pessego),var(--teal)); transition: width 1.2s ease-in-out; }

    .mensagem-final {
      background: rgba(239,189,166,0.3);
      border-left: 4px solid var(--terracota);
      color: var(--teal);
      padding: 1rem; border-radius: 10px; margin-top: 1.5rem;
      font-weight: 600; text-align: center;
    }

    .btn-novo-ciclo {
      background: var(--teal); color: white; border: none; border-radius: 12px;
      padding: 0.8rem 1.4rem; margin-top: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.3s ease-in-out;
    }
    .btn-novo-ciclo:hover { background: var(--terracota); }

    #voltarFlow {
      background: var(--terracota);
      color: #fff;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      margin: 1.5rem auto;
      display: block;
      width: 90%;
      max-width: 350px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    #voltarFlow:hover { background: var(--teal); }
  </style>
</head>

<body>

  <header style="margin-top:85px;">
    <h1 id="tituloPagina">Minha Evolução</h1>
    <p class="subtitle" id="subtituloPagina">Acompanhe como seu corpo responde ao treino</p>
  </header>

  <div class="container">

    <div class="section progresso-box">
      <h3 id="tituloProgresso">🌿 Progresso do seu programa</h3>
      <p id="progressoTexto" class="texto-progresso">Calculando...</p>
      <div class="barra-progresso"><div id="progressoBarra" class="preenchimento-progresso"></div></div>
    </div>

    <div class="section grafico-box">
      <h3 id="tituloPSE">📈 Evolução do Esforço Percebido (PSE)</h3>
      <canvas id="graficoPSE"></canvas>
      <p id="legendaPSE">🩵 Leve • 🍑 Moderado • ❤️ Intenso</p>
    </div>

    <div id="mensagemFinal" class="mensagem-final" style="display:none;">
      <span id="textoMensagemFinal">
        ✨ Parabéns! Você concluiu seu ciclo de 30 dias FemFlow.<br>
        Respire, celebre e permita que o seu corpo descanse.
      </span><br>
      <button type="button" class="btn-novo-ciclo" id="novoCicloBtn">🔄 Iniciar novo ciclo</button>
    </div>

    <button type="button" id="voltarFlow">← Voltar ao Flow Center</button>
  </div>

  <!-- CORE SEMPRE DEVE VIR ANTES DO SCRIPT LOCAL -->
  <script src="scripts/femflow-core.js"></script>

  <script>
    window.FEMFLOW_DISABLE_UI = false;
    document.addEventListener("DOMContentLoaded", () => FEMFLOW.inserirHeaderApp());

    const FEMFLOW_LANG = localStorage.getItem("femflow_lang") || "pt";

    const I18N = {
      pt: {
        tituloPagina: "Minha Evolução",
        subtituloPagina: "Acompanhe como seu corpo responde ao treino",
        progresso: "🌿 Progresso do seu programa",
        pse: "📈 Evolução do Esforço Percebido (PSE)",
        mensagemFinal: "✨ Parabéns! Você concluiu seu ciclo de 30 dias FemFlow.<br>Respire, celebre e permita que o seu corpo descanse.",
        novoCiclo: "🔄 Iniciar novo ciclo",
        voltar: "← Voltar ao Flow Center"
      },
      en: {
        tituloPagina: "My Evolution",
        subtituloPagina: "Track how your body responds to training",
        progresso: "🌿 Your Program Progress",
        pse: "📈 Perceived Effort Evolution (RPE)",
        mensagemFinal: "✨ Congratulations! You’ve completed your 30-day FemFlow cycle.<br>Breathe, celebrate, and let your body rest.",
        novoCiclo: "🔄 Start a new cycle",
        voltar: "← Back to Flow Center"
      }
    };

    function traduzir() {
      const T = I18N[FEMFLOW_LANG];

      document.getElementById("tituloPagina").innerHTML = T.tituloPagina;
      document.getElementById("subtituloPagina").innerHTML = T.subtituloPagina;
      document.getElementById("tituloProgresso").innerHTML = T.progresso;
      document.getElementById("tituloPSE").innerHTML = T.pse;
      document.getElementById("textoMensagemFinal").innerHTML = T.mensagemFinal;
      document.getElementById("novoCicloBtn").innerHTML = T.novoCiclo;
      document.getElementById("voltarFlow").innerHTML = T.voltar;
    }

    document.addEventListener("DOMContentLoaded", async () => {

      traduzir();

      const id = localStorage.getItem("femflow_id");
      if (!id) { return FEMFLOW.router("ciclo"); }

      // progresso do programa
      const prog = Number(localStorage.getItem("femflow_dia_treino") || 1);
      const pct = Math.min(100, Math.floor((prog / 30) * 100));

      document.getElementById("progressoBarra").style.width = pct + "%";
      document.getElementById("progressoTexto").textContent =
        FEMFLOW_LANG === "en" ? `You’ve completed ${pct}%` : `Você completou ${pct}%`;

      if (pct >= 100) {
        document.getElementById("mensagemFinal").style.display = "block";
        document.getElementById("novoCicloBtn").addEventListener("click", () => {
          localStorage.removeItem("femflow_dia_treino");
          FEMFLOW.router("ciclo");
        });
      }

      // Histórico PSE
      const hist = await FEMFLOW.buscarHistorico(id, 30);
      if (!hist.length) {
        FEMFLOW.toast("Nenhum treino ainda.");
        return;
      }

      const pseValues = hist.map(h => Number(h.pse) || 0);
      const labels = hist.map((_, i) => `Dia ${i+1}`);

      new Chart(document.getElementById("graficoPSE"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: pseValues,
            borderColor: "#CC6A5A",
            backgroundColor: "rgba(239,189,166,0.25)",
            fill: true, tension: 0.35
          }]
        },
        options: { plugins: { legend: { display:false } } }
      });

      // voltar
      document.getElementById("voltarFlow").onclick = () => FEMFLOW.router("flowcenter");
    });
  </script>

</body>
</html>
