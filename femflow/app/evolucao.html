<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow • Minha Evolução</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --terracota: #CC6A5A;
      --pessego: #F4D4C8;
      --teal: #335953;
      --bege: #FFF5EF;
    }

    body {
      margin: 0;
      font-family: "Lato", sans-serif;
      background: var(--bege);
      color: var(--teal);
      text-align: center;
      padding-top: 90px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      margin: 0;
      font-size: 1.8rem;
    }

    .evo-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
      box-sizing: border-box;
    }

    .section {
      margin-top: 26px;
    }

    /* Barra de progresso */
    .barra-progresso {
      width: 100%;
      height: 18px;
      background: rgba(240,236,233,0.8);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .preenchimento-progresso {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--terracota), var(--pessego), var(--teal));
      transition: width 1.2s ease-in-out;
    }

    .texto-progresso {
      font-weight: bold;
      margin-bottom: 0.4rem;
    }

    /* Gráficos responsivos */
    .chart-container {
      position: relative;
      width: 100%;
      height: 260px;
      margin: 0 auto;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Mensagem final */
    .mensagem-final {
      background: rgba(239,189,166,0.4);
      border-left: 4px solid var(--terracota);
      padding: 16px;
      color: var(--teal);
      font-weight: 600;
      border-radius: 12px;
      margin-top: 18px;
      display: none;
    }

    .btn-novo-ciclo {
      background: var(--teal);
      color: white;
      padding: 10px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-novo-ciclo:hover {
      background: var(--terracota);
    }

    #voltarFlow {
      background: var(--terracota);
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 34px;
      margin-bottom: 40px;
      cursor: pointer;
      width: 90%;
      max-width: 330px;
    }
    #voltarFlow:hover {
      background: var(--teal);
    }
  </style>
</head>

<body>

  <h1 id="tituloPagina">Minha Evolução</h1>
  <p id="subtituloPagina" class="subtitle">Acompanhe como seu corpo responde ao treino</p>

  <div class="evo-container">

    <!-- PROGRESSO -->
    <div class="section">
      <h3 id="tituloProgresso">🌿 Progresso do seu programa</h3>
      <p id="progressoTexto" class="texto-progresso"></p>
      <div class="barra-progresso">
        <div id="progressoBarra" class="preenchimento-progresso"></div>
      </div>
    </div>

    <!-- GRÁFICO PSE -->
    <div class="section">
      <h3 id="tituloPSE">📈 Evolução do Esforço Percebido (PSE)</h3>

      <div class="chart-container">
        <canvas id="graficoPSE"></canvas>
      </div>

      <p id="legendaPSE">🩵 Leve • 🍑 Moderado • ❤️ Intenso</p>
    </div>

    <!-- MENSAGEM FINAL -->
    <div id="mensagemFinal" class="mensagem-final">
      <span id="textoMensagemFinal"></span>
      <button id="novoCicloBtn" class="btn-novo-ciclo"></button>
    </div>

    <button id="voltarFlow">← Voltar ao Flow Center</button>

  </div>

  <!-- CORE -->
  <script src="scripts/femflow-core.js"></script>

  <!-- === FUNÇÕES NECESSÁRIAS DO ANTIGO memoria.js === -->
  <script>
    function calcularProgresso(id, total = 30) {
      const dia = Number(localStorage.getItem("femflow_dia_treino") || 1);
      return Math.min(100, Math.round(((dia - 1) / total) * 100));
    }

    function limparMemoria(id) {
      const keys = [
        "femflow_dia_treino",
        "femflow_hist",
        "femflow_lastSync",
        `femflow_reiniciado_${id}`
      ];
      keys.forEach(k => localStorage.removeItem(k));
      localStorage.setItem("femflow_dia_treino","1");
    }
  </script>

  <!-- === LÓGICA PRINCIPAL === -->
  <script>
  // TRADUÇÃO
  window.addEventListener("femflow:langchange", traduzir);
  document.addEventListener("DOMContentLoaded", traduzir);

  function traduzir() {
    const lang = localStorage.getItem("femflow_lang") || "pt";

    const T = {
      pt: {
        titulo: "Minha Evolução",
        subtitulo: "Acompanhe como seu corpo responde ao treino",
        progresso: "🌿 Progresso do seu programa",
        pse: "📈 Evolução do Esforço Percebido (PSE)",
        final: "✨ Parabéns! Você concluiu seu ciclo de 30 dias FemFlow.<br>Respire, celebre e permita-se descansar.",
        novo: "🔄 Iniciar novo ciclo",
        back: "← Voltar ao Flow Center",
        progText: x => `Você completou ${x}% do programa`,
      },
      en: {
        titulo: "My Evolution",
        subtitulo: "Track how your body responds to training",
        progresso: "🌿 Your Program Progress",
        pse: "📈 Perceived Effort Evolution (RPE)",
        final: "✨ Congratulations! You completed your 30-day FemFlow cycle.<br>Breathe, celebrate and rest.",
        novo: "🔄 Start new cycle",
        back: "← Back to Flow Center",
        progText: x => `You've completed ${x}% of the program`,
      }
    };

    const L = T[lang];

    document.getElementById("tituloPagina").innerHTML = L.titulo;
    document.getElementById("subtituloPagina").innerHTML = L.subtitulo;
    document.getElementById("tituloProgresso").innerHTML = L.progresso;
    document.getElementById("tituloPSE").innerHTML = L.pse;
    document.getElementById("textoMensagemFinal").innerHTML = L.final;
    document.getElementById("novoCicloBtn").innerHTML = L.novo;
    document.getElementById("voltarFlow").innerHTML = L.back;

    if (window.__prog !== undefined) {
      document.getElementById("progressoTexto").innerText = L.progText(window.__prog);
    }
  }

  // LÓGICA
  document.addEventListener("DOMContentLoaded", async () => {

    FEMFLOW.inserirHeaderApp?.();

    const id = localStorage.getItem("femflow_id");
    if (!id) { FEMFLOW.router("ciclo"); return; }

    // Progresso
    const prog = calcularProgresso(id, 30);
    window.__prog = prog;
    traduzir();

    document.getElementById("progressoBarra").style.width = prog + "%";

    if (prog >= 100) {
      document.getElementById("mensagemFinal").style.display = "block";
      document.getElementById("novoCicloBtn").onclick = () => {
        limparMemoria(id);
        FEMFLOW.router("ciclo");
      };
    }

    // Histórico
    const hist = await FEMFLOW.buscarHistorico(id, 40);

    if (!hist || !hist.length) {
      FEMFLOW.toast("🌿 Sem treinos registrados");
      return;
    }

    // Gráfico
    new Chart(document.getElementById("graficoPSE"), {
      type: "line",
      data: {
        labels: hist.map((t, i) => i + 1),
        datasets: [{
          data: hist.map(t => Number(t.pse) || 0),
          borderColor: "#CC6A5A",
          backgroundColor: "rgba(239,189,166,0.35)",
          borderWidth: 2,
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false
      }
    });

    // Voltar
    document.getElementById("voltarFlow").onclick = () => FEMFLOW.router("flowcenter");
  });
  </script>

</body>
</html>
