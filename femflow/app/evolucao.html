<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Evolução - FemFlow</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>Minha Evolução</h1>
      <p class="subtitle">Acompanhe como seu corpo responde ao treino</p>
    </header>

    <div class="container">
      <!-- Gráfico de PSE -->
      <div class="section" style="text-align:center;">
        <h3>📈 Evolução do Esforço Percebido (PSE)</h3>
        <canvas id="graficoPSE" width="300" height="200"></canvas>
      </div>

      <!-- Histórico textual -->
      <div id="evolucaoContainer" class="section">
        <h3>📋 Histórico de Treinos</h3>
        <p>Veja seu progresso de PSE ao longo do programa.</p>
        <ul id="listaEvolucao" style="list-style:none; padding:0;"></ul>
      </div>

      <button class="btn" onclick="location.href='index.html'">🏠 Voltar ao início</button>
    </div>

    <script src="js/memoria.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const id = localStorage.getItem('femflow_id');
        if (!id) {
          window.location.href = 'ciclo.html';
          return;
        }

        const memoria = carregarMemoria(id);
        const lista = document.getElementById('listaEvolucao');
        const ctx = document.getElementById('graficoPSE');

        if (!memoria || !memoria.treinos || memoria.treinos.length === 0) {
          lista.innerHTML = '<li>Você ainda não iniciou o programa.</li>';
          return;
        }

        // Ordenar por dia do programa
        const treinos = memoria.treinos.slice().sort((a,b) => a.diaPrograma - b.diaPrograma);

        // Montar lista textual
        lista.innerHTML = '';
        const labels = [];
        const pseValues = [];

        treinos.forEach(t => {
          const li = document.createElement('li');
          li.style.padding = '0.5rem';
          li.style.borderBottom = '1px solid rgba(0,0,0,0.1)';
          let cor;
          if (t.pse <= 3) cor = 'var(--teal)'; 
          else if (t.pse <= 7) cor = 'var(--pessego)'; 
          else cor = 'var(--terracota)';

          li.innerHTML = `<strong>Dia ${t.diaPrograma}</strong> – Fase ${t.fase} – PSE <span style="color:${cor}">${t.pse}</span>`;
          lista.appendChild(li);

          labels.push('Dia ' + t.diaPrograma);
          pseValues.push(t.pse);
        });

        // Criar gráfico
        new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'PSE',
              data: pseValues,
              borderColor: '#CC6A5A',
              backgroundColor: 'rgba(204,106,90,0.15)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointBackgroundColor: '#335953',
              pointRadius: 4
            }]
          },
          options: {
            scales: {
              y: { 
                min: 0, 
                max: 10, 
                title: { display: true, text: 'PSE' } 
              },
              x: { 
                title: { display: true, text: 'Dias do Programa' } 
              }
            },
            plugins: {
              legend: { display: false },
              title: {
                display: false
              }
            },
            responsive: true,
            maintainAspectRatio: false
          }
        });
      });
    </script>
  </body>
</html>
