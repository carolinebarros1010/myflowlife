<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FemFlow • Minha Evolução</title>

  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/evolucao.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <h1 id="tituloPagina">—</h1>
  <p id="subtituloPagina" class="evo-subtitle">—</p>

  <div class="evo-container">

    <!-- PROGRESSO -->
    <section class="evo-card">
      <h2 id="tituloProgresso">—</h2>
      <p id="progressoTexto" class="texto-progresso"></p>

      <div class="evo-progress">
        <div id="progressoBarra" class="evo-progress-fill"></div>
      </div>
    </section>

    <!-- GRÁFICO PSE -->
    <section class="evo-card evo-chart">
      <h3 id="tituloPSE">—</h3>

      <div class="chart-container">
        <canvas id="graficoPSE"></canvas>
      </div>

      <p id="legendaPSE" class="evo-legend">
        🩵 Leve • 🍑 Moderado • ❤️ Intenso
      </p>
    </section>

    <!-- FINAL -->
    <section id="mensagemFinal" class="mensagem-final" style="display:none">
      <span id="textoMensagemFinal"></span>
      <button id="novoCicloBtn" class="evo-btn"></button>
    </section>

    <button id="voltarFlow" class="evo-btn" style="margin-top:20px">—</button>

  </div>

<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

<script>

/* ====================================================================
   1) APLICAR IDIOMA
==================================================================== */
function aplicarIdioma() {
  const L = FEMFLOW.langs[FEMFLOW.lang].evolucao;
  const LG = FEMFLOW.langs[FEMFLOW.lang].geral;

  document.getElementById("tituloPagina").innerHTML   = L.titulo;
  document.getElementById("subtituloPagina").innerHTML = L.subtitulo;

  document.getElementById("tituloProgresso").innerHTML = L.tituloProgresso;
  document.getElementById("tituloPSE").innerHTML       = L.tituloPSE;

  document.getElementById("textoMensagemFinal").innerHTML = L.finalMensagem;
  document.getElementById("novoCicloBtn").innerHTML       = L.btnNovoCiclo;
  document.getElementById("voltarFlow").innerHTML         = L.btnVoltar;

  // Progresso dinâmico
  if (window.__prog !== undefined) {
    document.getElementById("progressoTexto").innerText = L.progressoTexto(window.__prog);
  }
}

/* Eventos de idioma */
document.addEventListener("femflow:langChange", aplicarIdioma);
document.addEventListener("DOMContentLoaded", aplicarIdioma);


/* ====================================================================
   2) LÓGICA PRINCIPAL DA PÁGINA
==================================================================== */
document.addEventListener("DOMContentLoaded", async () => {

  FEMFLOW.inserirHeaderApp?.();

  const id = localStorage.getItem("femflow_id");
  if (!id) { FEMFLOW.router("index.html"); return; }

  /* -------------------------
     PROGRESSO DO CICLO — 30 dias
  ------------------------- */
  const dia = Number(localStorage.getItem("femflow_dia_treino") || 1);
  const prog = Math.min(100, Math.round(((dia - 1) / 30) * 100));
  window.__prog = prog;

  aplicarIdioma(); // atualiza porcentagem no texto

  document.getElementById("progressoBarra").style.width = prog + "%";

  if (prog >= 100) {
    document.getElementById("mensagemFinal").style.display = "block";

    document.getElementById("novoCicloBtn").onclick = () => {
      localStorage.setItem("femflow_dia_treino","1");
      FEMFLOW.router("ciclo.html");
    };
  }

  /* -------------------------
     HISTÓRICO PSE — LOCALSTORAGE
  ------------------------- */
  let hist = [];
  try {
    hist = JSON.parse(localStorage.getItem("femflow_hist") || "[]");
  } catch {
    hist = [];
  }

  hist = hist.slice(-40);

  if (!hist.length) {
    FEMFLOW.toast(FEMFLOW.langs[FEMFLOW.lang].evolucao.semPSE);
  }

  /* -------------------------
     GRÁFICO
  ------------------------- */
  new Chart(document.getElementById("graficoPSE"), {
    type: "line",
    data: {
      labels: hist.map((t,i)=> i+1),
      datasets: [{
        data: hist.map(t=>Number(t.pse)||0),
        borderColor: "#CC6A5A",
        backgroundColor: "rgba(239,189,166,0.35)",
        borderWidth: 2,
        tension: 0.35,
        fill: true
      }]
    },
    options:{
      plugins:{ legend:{ display:false }},
      responsive: true,
      maintainAspectRatio:false
    }
  });

  /* -------------------------
     BOTÃO VOLTAR
  ------------------------- */
  document.getElementById("voltarFlow").onclick = () =>
    FEMFLOW.router("flowcenter.html");
});
</script>

</body>
</html>
