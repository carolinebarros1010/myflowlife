<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respiração FemFlow</title>

  <link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/respiracao.css">
  
</head>

<body>
  <h1>
    <span>Respiração</span>
    <span>FemFlow</span>
  </h1>
  <p class="sub">Escolha o protocolo conforme seu momento 🌿</p>

  <button class="btn-protocolo box" onclick="iniciarProtocolo('box')">🟤 Box Breathing – 4•4•4•4</button>
  <button class="btn-protocolo moon" onclick="iniciarProtocolo('moon')">🌙 Moon Flow – 5•7•8</button>
  <button class="btn-protocolo energy" onclick="iniciarProtocolo('energy')">⚡ Energy Flow – 3•2•3•2</button>
  <button class="btn-protocolo calm" onclick="iniciarProtocolo('calm')">🌸 Calm Focus – 6•2•6•2</button>
  <button class="btn-protocolo fire" onclick="iniciarProtocolo('fire')">🔥 Fire Flow – 2•1•4•1</button>

  <div id="breathModal">
    <div id="breathCircle">5</div>
    <div id="faseLabel">Preparar...</div>
    <div id="countdown"></div>
    <button id="btnStart">Iniciar Respiração</button>
  </div>

  <footer>🌬️ Inspire equilíbrio. Expire leveza.</footer>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="./femflow-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FEMFLOW.inserirHeaderApp?.();

      let cicloAtivo = false;
      let timerTotal;

      const circle = document.getElementById('breathCircle');
      const label = document.getElementById('faseLabel');
      const modal = document.getElementById('breathModal');
      const countdown = document.getElementById('countdown');
      const btnStart = document.getElementById('btnStart');

      const protocolos = {
        box:    { nome: "Box Breathing", fases: [4,4,4,4], cor: "#CC6A5A", vibra: [100,400] },
        moon:   { nome: "Moon Flow", fases: [5,7,8,0], cor: "#E2B5A5", vibra: [100,500] },
        energy: { nome: "Energy Flow", fases: [3,2,3,2], cor: "#335953", vibra: [80,300] },
        calm:   { nome: "Calm Focus", fases: [6,2,6,2], cor: "#D9BBAA", vibra: [100,300] },
        fire:   { nome: "Fire Flow", fases: [2,1,4,1], cor: "#B44C3B", vibra: [120,500] },
      };

      window.iniciarProtocolo = function(tipo) {
        const protocolo = protocolos[tipo];
        if (!protocolo) return;
        document.querySelectorAll('.btn-protocolo').forEach(b => b.style.display = 'none');
        modal.style.display = 'flex';
        modal.style.background = protocolo.cor + "20";
        circle.style.background = protocolo.cor;
        btnStart.style.display = 'block';
        btnStart.onclick = () => startProtocolo(protocolo);
      };

      async function startProtocolo(protocolo) {
        btnStart.style.display = 'none';
        cicloAtivo = true;
        if ("vibrate" in navigator) navigator.vibrate([200,100,200]);

        await contagemInicial();
        const inicio = Date.now();
        iniciarContadorTotal(inicio);

        const nomes = ["Inspire", "Segure", "Expire", "Segure"];
        let faseIndex = 0;

        async function ciclo() {
          const duracao = protocolo.fases[faseIndex];
          if (duracao === 0) { faseIndex = (faseIndex + 1) % 4; return ciclo(); }

          const nome = nomes[faseIndex];
          label.textContent = `${nome} / ${["Inhale","Hold","Exhale","Hold"][faseIndex]}`;
          label.style.fontStyle = "italic";
          circle.style.background = protocolo.cor;

          if (faseIndex === 0 && "vibrate" in navigator) navigator.vibrate(protocolo.vibra[0]);
          if (faseIndex === 2 && "vibrate" in navigator) navigator.vibrate(protocolo.vibra[1]);

          await animarContagem(duracao, faseIndex);
          faseIndex = (faseIndex + 1) % 4;
          if (cicloAtivo) ciclo();
        }

        ciclo();
      }

      async function contagemInicial() {
        for (let i = 5; i >= 1; i--) {
          circle.textContent = i;
          circle.style.opacity = 1;
          await esperar(1000);
          circle.style.opacity = 0.5;
        }
      }

      async function animarContagem(segundos, faseIndex) {
        for (let s = segundos; s >= 1; s--) {
          circle.textContent = s;
          if (faseIndex === 0) circle.style.transform = "scale(1.2)";
          else if (faseIndex === 2) circle.style.transform = "scale(0.85)";
          else circle.style.transform = "scale(1.0)";
          circle.style.opacity = 1;
          await esperar(800);
          circle.style.opacity = 0.6;
          await esperar(200);
        }
      }

      function iniciarContadorTotal(inicio) {
        countdown.style.display = "block";
        timerTotal = setInterval(() => {
          const decorrido = Date.now() - inicio;
          const restante = 300000 - decorrido;
          if (restante <= 0) return encerrar();

          const min = Math.floor(restante / 60000);
          const seg = Math.floor((restante % 60000) / 1000);
          countdown.textContent = `⏱ ${min}:${seg.toString().padStart(2,'0')}`;
        }, 1000);
      }

      function encerrar() {
        cicloAtivo = false;
        clearInterval(timerTotal);
        circle.textContent = "✓";
        label.textContent = "Finalizado 🌸";
        countdown.style.display = "none";
        if ("vibrate" in navigator) navigator.vibrate([300,100,300]);
        setTimeout(() => window.location.reload(), 2500);
      }

      function esperar(ms) {
        return new Promise(res => setTimeout(res, ms));
      }
    });
  </script>
 <script>
window.addEventListener("femflow:langchange", () => {
  const lang = localStorage.getItem("femflow_lang") || "pt";
  const T = {
    pt: {
      titulo: "Respiração Consciente",
      subtitulo: "Regule o corpo, acalme a mente 🌸",
      voltar: "🏠 Voltar ao Flow Center"
    },
    en: {
      titulo: "Conscious Breathing",
      subtitulo: "Balance your body, calm your mind 🌸",
      voltar: "🏠 Back to Flow Center"
    }
  };
  const L = T[lang];

  document.querySelector("h1").textContent = L.titulo;
  const sub = document.querySelector(".subtitle");
  if (sub) sub.textContent = L.subtitulo;
  const voltarBtn = document.getElementById("voltarBtn");
  if (voltarBtn) voltarBtn.textContent = L.voltar;
});
</script>
</body>
</html>
