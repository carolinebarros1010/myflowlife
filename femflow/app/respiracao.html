<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respiração • FemFlow</title>

  <link rel="icon" href="favicon.ico">

  <!-- CSS -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/respiracao.css">

  <style>
    /* Garantir que o modal não fique escondido atrás do header */
    #breathModal {
      margin-top: 60px !important;
    }

    /* Texto de descrição dentro do modal */
    #descricaoRespModal {
      font-size: 15px;
      color: #6a4f47;
      text-align: center;
      max-width: 90%;
      margin: 10px auto 18px auto;
      line-height: 1.45;
    }
  </style>

</head>

<body>

<h1 id="respTituloTopo">
  <span id="respTitulo1">Respirações</span>
  <span id="respTitulo2">FemFlow</span>
</h1>
<p class="sub" id="respSub">Escolha o protocolo conforme seu momento 🌿</p>

<!-- ============================= -->
<!--     GRUPOS DE PROTOCOLOS      -->
<!-- ============================= -->
<h2 class="grupo-titulo" id="grupoCiclo">Respirações do Ciclo</h2>

<button class="btn-protocolo" onclick="abrirRespiracao('raiz')" id="btnRaiz">Respiração Raiz</button>

<button class="btn-protocolo" onclick="abrirRespiracao('clareza')" id="btnClareza">Respiração Clareza</button>

<button class="btn-protocolo" onclick="abrirRespiracao('brilho')" id="btnBrilho">Respiração Brilho</button>

<button class="btn-protocolo" onclick="abrirRespiracao('sereno')" id="btnSereno">Respiração Sereno</button>

<h2 class="grupo-titulo" id="grupoTreino">Respirações para Treinar</h2>

<button class="btn-protocolo" onclick="abrirRespiracao('wake')" id="btnWake">Wake Flow</button>

<button class="btn-protocolo" onclick="abrirRespiracao('charge')" id="btnCharge">Charge Flow</button>

<button class="btn-protocolo" onclick="abrirRespiracao('release')" id="btnRelease">Release Flow</button>

<button class="btn-protocolo" onclick="abrirRespiracao('restore')" id="btnRestore">Restore Flow</button>

<h2 class="grupo-titulo" id="grupoUniversal">Respirações Universais</h2>

<button class="btn-protocolo" onclick="abrirRespiracao('equilibrio')" id="btnEquilibrio">Respiração Equilíbrio</button>

<button class="btn-protocolo" onclick="abrirRespiracao('transparencia')" id="btnTransparencia">Respiração Transparência</button>

<button class="ff-voltar-treino" id="btnVoltarTreino">← voltar ao treino</button>

<!-- ============================= -->
<!--      DRAWER LATERAL           -->
<!-- ============================= -->
<div class="breath-drawer" id="breathDrawer">
  <button class="drawer-close-btn" id="closeDrawer">✖</button>
  <div class="drawer-header" id="drawerTitle">Respiração</div>

  <div id="breathDrawerContent"></div>
</div>

<!-- ============================= -->
<!--      MODAL DE RESPIRAÇÃO      -->
<!-- ============================= -->
<div id="breathModal">
  <div id="breathCircle">5</div>
  <div id="faseLabel">Preparar...</div>

  <!-- DESCRIÇÃO DINÂMICA AQUI -->
  <p id="descricaoRespModal"></p>

  <div id="countdown"></div>
  <button id="btnStart">Iniciar Respiração</button>
  <button id="btnCloseModal">← voltar às respirações</button>
</div>

<footer id="respFooter">Inspire equilíbrio. Expire leveza.</footer>

<!-- ===================================== -->
<!-- SCRIPTS FEMFLOW -->
<!-- ===================================== -->
<script src="js/lang.js"></script>
<script src="femflow-core.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  FEMFLOW.inserirHeaderApp?.();
  FEMFLOW.inserirMenuLateral?.();
  FEMFLOW.inserirModalIdioma?.();

  let cicloAtivo = false;
  let protocoloAtual = null;

  const drawer     = document.getElementById("breathDrawer");
  const drawerClose= document.getElementById("closeDrawer");
  const modal      = document.getElementById("breathModal");
  const drawerCt   = document.getElementById("breathDrawerContent");

  const circle     = document.getElementById("breathCircle");
  const label      = document.getElementById("faseLabel");
  const descModal  = document.getElementById("descricaoRespModal");
  const btnStart   = document.getElementById("btnStart");
  const btnClose   = document.getElementById("btnCloseModal");

  /* DESCRIÇÕES OFICIAIS NO MODAL */
  const descricoes = {
    raiz: "Acalma o corpo, reduz tensões e ajuda você a retornar ao eixo interno.",
    clareza: "Traz foco, leveza mental e sensação de reorganização.",
    brilho: "Eleva sua energia e presença durante fases mais fortes do ciclo.",
    sereno: "Suaviza irritabilidade, oscilações emocionais e TPM.",
    wake: "Ativa o corpo sem acelerar demais.",
    charge: "Energia imediata para treinos fortes.",
    release: "Dissolve tensões e acalma pós-treino.",
    restore: "Recupera o sistema nervoso profundamente.",
    equilibrio: "Centraliza sua mente e emoções.",
    transparencia: "Traz clareza emocional instantânea."
  };

  /* PROTOCOLOS */
  const protocolos = {
    raiz:        { fases:[4,4,4,4], cor:"#CC6A5A" },
    clareza:     { fases:[5,7,8,0], cor:"#E2B5A5" },
    brilho:      { fases:[3,2,3,2], cor:"#FFB26B" },
    sereno:      { fases:[6,2,6,2], cor:"#A4C3B2" },
    wake:        { fases:[3,3,3,0], cor:"#88C1A7" },
    charge:      { fases:[2,1,4,1], cor:"#B44C3B" },
    release:     { fases:[4,2,6,0], cor:"#CBD6D6" },
    restore:     { fases:[6,2,6,2], cor:"#8BAAAD" },
    equilibrio:  { fases:[4,4,4,4], cor:"#6E8A9F" },
    transparencia:{fases:[5,5,5,5], cor:"#D0C7E2" }
  };

  /* ------------------------------
     ABRIR RESPIRAÇÃO
  --------------------------------*/
  window.abrirRespiracao = function(tipo){
    const p = protocolos[tipo];
    if (!p) return;

    protocoloAtual = p;
    cicloAtivo = false;

    // texto explicativo dentro do modal
    descModal.textContent = descricoes[tipo] || "";

    circle.textContent = "5";
    label.textContent = "Preparar...";

    if (!drawerCt.contains(modal)) drawerCt.appendChild(modal);

    modal.style.display = "flex";
    drawer.classList.add("active");

    btnStart.style.display = "block";
    btnStart.onclick = () => startProtocolo(protocoloAtual);

    modal.style.background = p.cor + "22";
    circle.style.background = p.cor;
  };

  /* ------------------------------ */
  function fecharDrawer(){
    cicloAtivo = false;
    drawer.classList.remove("active");
  }

  drawerClose.onclick = fecharDrawer;
  btnClose.onclick = fecharDrawer;

  async function esperar(ms){
    return new Promise(r => setTimeout(r, ms));
  }

  async function contagemInicial(){
    for (let i = 5; i >= 1; i--){
      circle.textContent = i;
      await esperar(900);
    }
  }

  async function animarContagem(segundos, faseIndex, cor){
    const textos = {
      pt:["Inspire","Segure","Expire","Segure"],
      en:["Inhale","Hold","Exhale","Hold"],
      fr:["Inspirez","Retenez","Expirez","Retenez"]
    };

    const idioma = FEMFLOW.lang || "pt";
    const nomeFase = textos[idioma] || textos.pt;

    label.textContent = nomeFase[faseIndex];
    circle.style.background = cor;

    for (let s = segundos; s >= 1; s--){
      circle.textContent = s;
      await esperar(1000);
    }
  }

  async function startProtocolo(p){
    cicloAtivo = true;
    btnStart.style.display = "none";

    await contagemInicial();

    let fase = 0;

    async function cicloResp(){
      const dur = p.fases[fase];
      await animarContagem(dur, fase, p.cor);
      fase = (fase + 1) % 4;

      if (cicloAtivo) cicloResp();
    }

    cicloResp();
  }

});
</script>

<!-- ========================= -->
<!--       MODAL NÍVEL        -->
<!-- ========================= -->
<div id="modal-nivel" class="modal-nivel oculto">
  <div class="modal-nivel-box">
    <h2>📊 Selecione seu nível</h2>

    <button class="nivel-btn" data-nivel="iniciante">Iniciante</button>
    <button class="nivel-btn" data-nivel="intermediaria">Intermediária</button>
    <button class="nivel-btn" data-nivel="avancada">Avançada</button>

    <button id="fecharNivel" class="nivel-fechar">Fechar</button>
  </div>
</div>

</body>
</html>
