<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow • Respiração Guiada</title>

  <style>
    :root {
      --terracota: #CC6A5A;
      --bege: #F6E9E1;
      --verde: #335953;
    }

    body {
      background-color: var(--bege);
      color: #5A4032;
      font-family: 'Lato', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 25px;
    }

    .logo-img {
      width: 120px;
      height: auto;
      opacity: 0.9;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 1.7em;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    p.sub {
      color: #7C6058;
      font-size: 1em;
      margin-bottom: 25px;
    }

    #breathModal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      transition: background 0.6s ease;
    }

    #breathCircle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--terracota);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 3em;
      font-weight: 700;
      animation: fadeIn 0.8s ease;
      box-shadow: 0 0 25px rgba(204, 106, 90, 0.25);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    #faseLabel {
      margin-top: 10px;
      font-family: 'Playfair Display', serif;
      font-size: 1.3em;
      color: #5A4032;
      font-style: italic;
      transition: opacity 0.5s;
    }

    #countdown {
      font-size: 1.3em;
      margin-top: 10px;
      color: var(--verde);
      display: none;
    }

    .btn {
      width: 85%;
      max-width: 320px;
      border: none;
      border-radius: 25px;
      padding: 12px 18px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px auto;
    }

    .btn:hover { transform: scale(1.03); }

    #btnStart {
      background: var(--terracota);
      color: #fff;
    }

    #btnClose {
      background: var(--verde);
      color: #fff;
      display: none;
    }

    footer {
      margin-top: 40px;
      color: #A87E72;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img src="../../assets/logofemflowterracota.png" alt="FemFlow" class="logo-img">
  </div>

  <h1>Respiração FemFlow</h1>
  <p class="sub">Modulação neurológica do momento feminino 🌿</p>

  <div id="breathModal">
    <div id="breathCircle">5</div>
    <div id="faseLabel">Preparar...</div>
    <div id="countdown"></div>
  </div>

  <button id="btnStart" class="btn" onclick="iniciarProtocolo()">Iniciar Respiração</button>
  <button id="btnClose" class="btn" onclick="encerrar()">Encerrar</button>

  <footer>🌸 Inspire equilíbrio. Expire leveza.</footer>

  <script>
    let cicloAtivo = false;
    let faseTimer, timerTotal;

    const circle = document.getElementById('breathCircle');
    const faseLabel = document.getElementById('faseLabel');
    const btnStart = document.getElementById('btnStart');
    const btnClose = document.getElementById('btnClose');
    const countdown = document.getElementById('countdown');

    const fases = [
      { nome: "Inspire", en: "Inhale", cor: "#CC6A5A", vibra: [100] },
      { nome: "Segure",  en: "Hold",   cor: "#E2B5A5", vibra: [] },
      { nome: "Expire",  en: "Exhale", cor: "#335953", vibra: [400] },
      { nome: "Segure",  en: "Hold",   cor: "#E2B5A5", vibra: [] }
    ];

    const tempoFase = 4000;   // 4s por fase
    const duracaoTotal = 300000; // 5 minutos

    async function iniciarProtocolo() {
      if (cicloAtivo) return;
      cicloAtivo = true;
      btnStart.style.display = "none";
      btnClose.style.display = "inline-block";

      // Vibração dupla de início
      if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);

      await contagemInicial(); 
      iniciarCiclo();
      iniciarContadorTotal();
    }

    async function contagemInicial() {
      for (let i = 5; i >= 1; i--) {
        circle.textContent = i;
        circle.style.opacity = 1;
        await esperar(1000);
        circle.style.opacity = 0.5;
      }
      circle.style.opacity = 1;
    }

    function iniciarCiclo() {
      let faseIndex = 0;

      function cicloResp() {
        const f = fases[faseIndex];
        circle.style.backgroundColor = f.cor;
        faseLabel.textContent = `${f.nome} / *${f.en}*`;
        if (f.vibra.length && "vibrate" in navigator) navigator.vibrate(f.vibra);

        executarContagemFase(faseIndex);
        faseIndex = (faseIndex + 1) % fases.length;
      }

      cicloResp();
      faseTimer = setInterval(cicloResp, tempoFase);
    }

    async function executarContagemFase(faseIndex) {
      for (let s = 4; s >= 1; s--) {
        circle.textContent = s;
        if (faseIndex === 0) circle.style.transform = "scale(1.2)";
        else if (faseIndex === 2) circle.style.transform = "scale(0.85)";
        else circle.style.transform = "scale(1.0)";
        circle.style.opacity = 1;
        await esperar(800);
        circle.style.opacity = 0.6;
        await esperar(200);
      }
    }

    function iniciarContadorTotal() {
      const inicio = Date.now();
      countdown.style.display = "block";
      timerTotal = setInterval(() => {
        const decorrido = Date.now() - inicio;
        const restante = duracaoTotal - decorrido;
        if (restante <= 0) {
          encerrar();
          return;
        }
        const minutos = Math.floor(restante / 60000);
        const segundos = Math.floor((restante % 60000) / 1000);
        countdown.textContent = `⏱ ${minutos}:${segundos.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function encerrar() {
      cicloAtivo = false;
      clearInterval(faseTimer);
      clearInterval(timerTotal);
      circle.textContent = "✓";
      faseLabel.textContent = "Finalizado 🌸";
      countdown.style.display = "none";
      btnClose.style.display = "none";
      btnStart.style.display = "inline-block";

      // Vibração final longa
      if ("vibrate" in navigator) navigator.vibrate([300, 100, 300, 100, 300]);
    }

    function esperar(ms) {
      return new Promise(res => setTimeout(res, ms));
    }
  </script>
</body>
</html>
