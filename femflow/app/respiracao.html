<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow • Protocolos de Respiração</title>

  <style>
    :root {
      --terracota: #CC6A5A;
      --bege: #F6E9E1;
      --verde: #335953;
    }

    body {
      background-color: var(--bege);
      color: #5A4032;
      font-family: 'Lato', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .logo-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-img {
      width: 120px;
      height: auto;
      opacity: 0.9;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 1.7em;
      margin: 15px 0 5px;
    }

    p.sub {
      color: #7C6058;
      font-size: 1em;
      margin-bottom: 25px;
    }

    .btn-protocolo {
      width: 90%;
      max-width: 340px;
      border: none;
      border-radius: 25px;
      padding: 14px 18px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      margin: 8px auto;
      display: block;
      transition: all 0.3s ease;
    }

    .btn-protocolo:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
    }

    /* Cores dos botões */
    .box { background: #CC6A5A; color: #fff; }
    .moon { background: #E2B5A5; color: #5A4032; }
    .energy { background: #335953; color: #fff; }
    .calm { background: #EAD5C8; color: #5A4032; }
    .fire { background: #B44C3B; color: #fff; }

    /* MODAL */
    #breathModal {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 75vh;
      background: var(--bege);
      transition: background 0.6s ease;
    }

    #breathCircle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--terracota);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 3em;
      font-weight: 700;
      box-shadow: 0 0 25px rgba(204, 106, 90, 0.25);
    }

    #faseLabel {
      margin-top: 10px;
      font-family: 'Playfair Display', serif;
      font-size: 1.3em;
      color: #5A4032;
      font-style: italic;
      transition: opacity 0.5s;
    }

    #countdown {
      font-size: 1.3em;
      margin-top: 10px;
      color: var(--verde);
      display: none;
    }

    .btn {
      width: 85%;
      max-width: 320px;
      border: none;
      border-radius: 25px;
      padding: 12px 18px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px auto;
    }

    #btnClose {
      background: var(--verde);
      color: #fff;
      display: none;
    }

    footer {
      margin-top: 35px;
      color: #A87E72;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
<script>
(function(){
  const id = localStorage.getItem('femflow_id');
  if(!id){ location.href='login.html?ret=respiracao.html'; return; }
  const hasProduct = localStorage.getItem('femflow_hasProduct')==='yes'; if(!hasProduct){ location.href='home.html'; return; }
  const ok = localStorage.getItem('femflow_cycle_configured')==='yes' &&
             localStorage.getItem('femflow_startDate') &&
             localStorage.getItem('femflow_cycleLength');
  if(!ok){ location.href='ciclo.html'; return; }
})();
</script>
  <div class="logo-container">
    <img src="assets/logofemflowterracota.png" alt="FemFlow" class="logo-img" />
  </div>

  <h1>Respiração FemFlow</h1>
  <p class="sub">Escolha o protocolo conforme seu momento 🌿</p>

  <!-- BOTÕES DE PROTOCOLOS -->
  <button class="btn-protocolo box" onclick="iniciarProtocolo('box')">🟤 Box Breathing – 4•4•4•4</button>
  <button class="btn-protocolo moon" onclick="iniciarProtocolo('moon')">🌙 Moon Flow – 5•7•8</button>
  <button class="btn-protocolo energy" onclick="iniciarProtocolo('energy')">⚡ Energy Flow – 3•2•3•2</button>
  <button class="btn-protocolo calm" onclick="iniciarProtocolo('calm')">🌸 Calm Focus – 6•2•6•2</button>
  <button class="btn-protocolo fire" onclick="iniciarProtocolo('fire')">🔥 Fire Flow – 2•1•4•1</button>

  <!-- MODAL -->
  <div id="breathModal">
    <div id="breathCircle">5</div>
    <div id="faseLabel">Preparar...</div>
    <div id="countdown"></div>
   <!-- BOTÃO FIXO DE VOLTAR -->
<button id="btnVoltarFlow" onclick="window.location.href='flowcenter.html'"
  style="
    position: fixed;
    top: 15px;
    left: 15px;
    background: var(--verde);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.9em;
    font-family: 'Lato';
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    z-index: 1000;
  ">
  ← Voltar
</button>

<script>
function encerrar() {
  cicloAtivo = false;
  clearInterval(timerTotal);
  circle.textContent = "✓";
  label.textContent = "Finalizado 🌸";
  btnClose.style.display = "none";
  countdown.style.display = "none";

  // Vibração final
  if ("vibrate" in navigator) navigator.vibrate([300,100,300]);

  // Exibe botão de retorno com transição suave
  setTimeout(() => {
    label.innerHTML = "✨ Sessão concluída<br>Volte ao Flow Center para continuar.";
    const voltarBtn = document.createElement('button');
    voltarBtn.textContent = "← Voltar ao Flow Center";
    voltarBtn.className = "btn";
    voltarBtn.style.background = "var(--verde)";
    voltarBtn.style.color = "#fff";
    voltarBtn.onclick = () => window.location.href = "flowcenter.html";
    modal.appendChild(voltarBtn);
  }, 1200);
}
</script>
  </div>

  <footer>🌬️ Inspire equilíbrio. Expire leveza.</footer>

  <script>
    let cicloAtivo = false;
    let faseTimer, timerTotal;

    const circle = document.getElementById('breathCircle');
    const label = document.getElementById('faseLabel');
    const modal = document.getElementById('breathModal');
    const countdown = document.getElementById('countdown');
    const btnClose = document.getElementById('btnClose');

    const protocolos = {
      box:    { nome: "Box Breathing", fases: [4,4,4,4], cor: "#CC6A5A", vibra: [100,400] },
      moon:   { nome: "Moon Flow", fases: [5,7,8,0], cor: "#E2B5A5", vibra: [100,500] },
      energy: { nome: "Energy Flow", fases: [3,2,3,2], cor: "#335953", vibra: [80,300] },
      calm:   { nome: "Calm Focus", fases: [6,2,6,2], cor: "#D9BBAA", vibra: [100,300] },
      fire:   { nome: "Fire Flow", fases: [2,1,4,1], cor: "#B44C3B", vibra: [120,500] },
    };

    async function iniciarProtocolo(tipo) {
      if (cicloAtivo) return;
      const protocolo = protocolos[tipo];
      if (!protocolo) return;

      cicloAtivo = true;
      document.querySelectorAll('.btn-protocolo').forEach(b => b.style.display = 'none');
      modal.style.display = 'flex';
      modal.style.background = protocolo.cor + "20";
      btnClose.style.display = "inline-block";

      if ("vibrate" in navigator) navigator.vibrate([200,100,200]);
      await contagemInicial();

      const inicio = Date.now();
      iniciarContadorTotal(inicio);

      const nomes = ["Inspire", "Segure", "Expire", "Segure"];
      let faseIndex = 0;

      async function ciclo() {
        const duracao = protocolo.fases[faseIndex];
        if (duracao === 0) { faseIndex = (faseIndex + 1) % 4; return ciclo(); }

        const nome = nomes[faseIndex];
        label.textContent = `${nome} / *${["Inhale","Hold","Exhale","Hold"][faseIndex]}*`;
        label.style.fontStyle = "italic";
        circle.style.background = protocolo.cor;

        if (faseIndex === 0 && "vibrate" in navigator) navigator.vibrate(protocolo.vibra[0]);
        if (faseIndex === 2 && "vibrate" in navigator) navigator.vibrate(protocolo.vibra[1]);

        await animarContagem(duracao, faseIndex);
        faseIndex = (faseIndex + 1) % 4;
        if (cicloAtivo) ciclo();
      }
      ciclo();
    }

    async function contagemInicial() {
      for (let i = 5; i >= 1; i--) {
        circle.textContent = i;
        circle.style.opacity = 1;
        await esperar(1000);
        circle.style.opacity = 0.5;
      }
    }

    async function animarContagem(segundos, faseIndex) {
      for (let s = segundos; s >= 1; s--) {
        circle.textContent = s;
        if (faseIndex === 0) circle.style.transform = "scale(1.2)";
        else if (faseIndex === 2) circle.style.transform = "scale(0.85)";
        else circle.style.transform = "scale(1.0)";
        circle.style.opacity = 1;
        await esperar(800);
        circle.style.opacity = 0.6;
        await esperar(200);
      }
    }

    function iniciarContadorTotal(inicio) {
      countdown.style.display = "block";
      timerTotal = setInterval(() => {
        const decorrido = Date.now() - inicio;
        const restante = 300000 - decorrido;
        if (restante <= 0) return encerrar();

        const min = Math.floor(restante / 60000);
        const seg = Math.floor((restante % 60000) / 1000);
        countdown.textContent = `⏱ ${min}:${seg.toString().padStart(2,'0')}`;
      }, 1000);
    }

    function encerrar() {
      cicloAtivo = false;
      clearInterval(timerTotal);
      circle.textContent = "✓";
      label.textContent = "Finalizado 🌸";
      btnClose.style.display = "none";
      countdown.style.display = "none";
      if ("vibrate" in navigator) navigator.vibrate([300,100,300]);
      setTimeout(() => window.location.reload(), 2500);
    }

    function esperar(ms) {
      return new Promise(res => setTimeout(res, ms));
    }
  </script>
<script>
(function(){
  function ensureModal(){
    if(document.getElementById('breath-modal')) return;
    const modal = document.createElement('div');
    modal.id = 'breath-modal';
    modal.style.cssText = 'position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.95);z-index:1000;text-align:center;font-family:Lato,sans-serif';
    modal.innerHTML = `
      <img src="assets/logofemflowterracota.png" alt="FemFlow" style="width:110px;opacity:.95;margin-bottom:8px">
      <h3 id="breath-title" style="color:#335953;margin:6px 0 10px">Respiração</h3>
      <div id="breath-circle" style="width:160px;height:160px;border-radius:50%;background:#EABAA3;transition:transform 4s ease, background-color 2s ease;"></div>
      <p id="breath-label" style="margin-top:14px;color:#5b4f49">Preparar</p>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button id="breath-start" style="background:#335953;color:#fff;border:none;border-radius:20px;padding:8px 16px;cursor:pointer">Iniciar</button>
        <button id="breath-close" style="background:#cc6a5a;color:#fff;border:none;border-radius:20px;padding:8px 16px;cursor:pointer">Fechar</button>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('breath-close').onclick = fecharModal;
  }
  let intervaloResp=null, contando=null, faseCfg=null, inspirando=false;
  function fecharModal(){
    clearInterval(intervaloResp); intervaloResp=null;
    clearInterval(contando); contando=null;
    const m=document.getElementById('breath-modal');
    if(m) m.style.display='none';
  }
  window.iniciarRespiracaoVisual = function(tipo){
    ensureModal();
    clearInterval(intervaloResp);
    clearInterval(contando);
    const modal = document.getElementById('breath-modal');
    const circle = document.getElementById('breath-circle');
    const label = document.getElementById('breath-label');
    const title = document.getElementById('breath-title');
    const btnStart = document.getElementById('breath-start');
    const config = {
      tpm:   { in: 4000, out: 6000, color: '#D67660', label: 'Zen TPM' },
      ciclo: { in: 4000, out: 4000, color: '#EABAA3', label: 'Equilíbrio Cíclico' },
      foco:  { in: 2000, out: 4000, color: '#335953', label: 'Foco Ovulatório' }
    };
    faseCfg = config[tipo]; if(!faseCfg) return;
    title.textContent = faseCfg.label;
    circle.style.backgroundColor = faseCfg.color;
    label.textContent = 'Preparar';
    circle.style.transform = 'scale(1.0)';
    modal.style.display = 'flex';
    btnStart.disabled = false;
    btnStart.onclick = () => {
      btnStart.disabled = true;
      let c=5; label.textContent = 'Preparar: ' + c;
      contando = setInterval(()=>{
        c--; label.textContent = 'Preparar: ' + c;
        if(c<=0){ clearInterval(contando); iniciarCiclo(); }
      }, 1000);
    };
    function iniciarCiclo(){
      inspirando = true;
      function passo(){
        if(inspirando){
          circle.style.transform = 'scale(1.18)'; label.textContent = 'Inspire...';
          try{ navigator.vibrate && navigator.vibrate([80, faseCfg.in/2]); }catch{}
          setTimeout(()=>{ inspirando=false; }, faseCfg.in);
        }else{
          circle.style.transform = 'scale(0.86)'; label.textContent = 'Expire...';
          try{ navigator.vibrate && navigator.vibrate([50, faseCfg.out/2]); }catch{}
          setTimeout(()=>{ inspirando=true; }, faseCfg.out);
        }
      }
      passo(); intervaloResp = setInterval(passo, faseCfg.in + faseCfg.out);
    }
  };
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') fecharModal(); });
})();
</script>
</body>
</html>
