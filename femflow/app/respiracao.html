<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow • Flow Center</title>

  <style>
    :root {
      --terracota: #CC6A5A;
      --bege: #F6E9E1;
      --verde: #335953;
    }

    body {
      background: var(--bege);
      font-family: "Lato", sans-serif;
      margin: 0;
      text-align: center;
      color: #5A4032;
    }

    /* LOGO */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
    }
    .logo-img {
      width: 160px;
      opacity: 0.95;
    }

    /* TÍTULOS */
    h1 {
      font-family: "Playfair Display", serif;
      color: var(--terracota);
      font-size: 1.6em;
      margin-bottom: 0.2rem;
    }
    p.subtitulo {
      font-size: 1em;
      color: #7C6058;
      margin-bottom: 25px;
    }

    /* SAUDAÇÃO */
    #saudacaoBox {
      font-family: 'Playfair Display', serif;
      color: var(--verde);
      font-size: 1.15em;
      margin-top: 8px;
    }

    /* CÍRCULO DE FASES */
    #fase-circular {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 25px auto;
    }

    .fase-anel {
      fill: none;
      stroke-width: 24;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .fase-texto {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      font-family: 'Playfair Display', serif;
      color: var(--verde);
      font-size: 1.2em;
    }

    /* BOTÕES PRINCIPAIS */
    .btn {
      display: block;
      width: 90%;
      max-width: 340px;
      margin: 12px auto;
      padding: 14px 18px;
      font-size: 1.05em;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn-treino {
      background: var(--terracota);
      color: #fff;
    }
    .btn-respirar {
      background: var(--verde);
      color: #fff;
    }
    .btn-evolucao {
      background: var(--bege);
      color: #5A4032;
      border: 2px solid var(--terracota);
    }

    footer {
      margin-top: 35px;
      color: #A87E72;
      font-size: 0.9em;
    }

    /* BOTÃO FIXO VOLTAR */
    #btnVoltar {
      position: fixed;
      top: 15px;
      left: 15px;
      background: var(--verde);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.9em;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>

<body>
  <button id="btnVoltar" onclick="window.location.href='../../index.html'">← Voltar</button>

  <div class="logo-container">
    <img src="../../assets/logofemflowterracota.png" alt="FemFlow" class="logo-img" />
  </div>

  <h1>Flow Center</h1>
  <p class="subtitulo">Harmonia entre corpo, mente e ciclo 🌿</p>

  <div id="saudacaoBox">Bem-vinda 🌸</div>

  <!-- CÍRCULO DE FASES -->
  <div id="fase-circular">
    <svg viewBox="0 0 200 200">
      <circle class="fase-anel" cx="100" cy="100" r="85" stroke="#EAD5C8" stroke-dasharray="565" stroke-dashoffset="0"></circle>
      <circle class="fase-anel" id="anelAtivo" cx="100" cy="100" r="85" stroke="#CC6A5A" stroke-dasharray="565" stroke-dashoffset="0"></circle>
    </svg>
    <div class="fase-texto" id="faseLabel">Fase atual: —</div>
  </div>

  <!-- BOTÕES PRINCIPAIS -->
  <button class="btn btn-treino" onclick="window.location.href='treino.html'">🏋️ Iniciar Treino</button>
  <button class="btn btn-respirar" onclick="window.location.href='respiracao.html'">🌬️ Respiração Guiada</button>
  <button class="btn btn-evolucao" onclick="window.location.href='evolucao.html'">📈 Evolução</button>

  <footer>✨ Continue seu ciclo com consciência e leveza.</footer>

  <script src="../scripts/femflow-core.js"></script>
  <script>
    // 🔹 Exibe nome e fase atual
    document.addEventListener("DOMContentLoaded", async () => {
      const id = localStorage.getItem("femflow_id");
      const saudacao = document.getElementById("saudacaoBox");
      const faseLabel = document.getElementById("faseLabel");
      const anelAtivo = document.getElementById("anelAtivo");

      if (!id) {
        saudacao.textContent = "Bem-vinda 🌸";
        return;
      }

      try {
        const resp = await fetch(`${FEMFLOW.SCRIPT_URL}?action=validar&id=${id}`);
        const data = await resp.json();

        if (data?.nome) saudacao.textContent = `Olá, ${data.nome.split(" ")[0]} 🌿`;
        if (data?.fase_atual) {
          const fase = data.fase_atual.toLowerCase();
          faseLabel.textContent = `Fase atual: ${fase.charAt(0).toUpperCase() + fase.slice(1)}`;
          const offset = { menstrual: 0, folicular: 140, ovulatoria: 280, lutea: 420 }[fase] || 0;
          anelAtivo.setAttribute("stroke-dashoffset", offset);
        }
      } catch (err) {
        console.error("Erro ao buscar dados:", err);
        saudacao.textContent = "Bem-vinda 🌸";
      }
    });
  </script>
</body>
</html>
