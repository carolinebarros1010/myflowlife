<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Treino Diário - FemFlow</title>

  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bege:#FBF6F0; --terracota:#CC6A5A; --pessego:#F4A386; --teal:#335953; --texto:#223;
      --fonte-corpo:"Lato",sans-serif;
    }
    body{background:var(--bege);font-family:var(--fonte-corpo);color:var(--texto);margin:0;text-align:center;}
    header{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--terracota),var(--pessego));color:#fff;padding:1rem;border-radius:0 0 30px 30px;box-shadow:0 3px 10px rgba(0,0,0,.1);}
    header img{width:42px;height:42px}
    header h1{font-family:"Playfair Display",serif;font-size:1.25rem;margin:0}
    .container{padding:1.2rem;max-width:640px;margin:0 auto}
    .box{background:#fff;border-radius:20px;margin-bottom:1.1rem;padding:1rem 1.2rem;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.08);animation:fadeIn .6s ease}
    .box h2{font-family:"Playfair Display",serif;color:var(--teal);font-size:1.05rem;margin:0 0 .25rem}
    .motivacional{font-style:italic;color:var(--teal);line-height:1.6;margin:.25rem 0 .5rem}
    .exercicio{border-top:1px solid rgba(0,0,0,.06);padding:.6rem 0}
    .exercicio:first-of-type{border-top:none}
    .mini{font-size:.9rem;color:#666;margin:.25rem 0}
    .btn{background:var(--teal);color:#fff;font-weight:600;border:none;border-radius:20px;padding:12px 24px;margin-top:1.2rem;cursor:pointer;width:90%;max-width:380px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
    .btn:hover{background:var(--terracota)}
    .timer-global,.timer-descanso{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;color:var(--teal);background:rgba(51,89,83,.08);margin:1rem auto;box-shadow:inset 0 0 10px rgba(51,89,83,.15);cursor:pointer;transition:all .3s ease}
    .timer-global{width:110px;height:110px;font-size:1.35rem}
    .timer-descanso{width:64px;height:64px;font-size:1rem}
    .timer-descanso.ativo{background:var(--terracota);color:#fff;animation:pulse 1s infinite}
    a.video{color:var(--terracota);text-decoration:none;font-weight:600}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <header>
    <img src="./assets/logofemflowterracota.png" alt="FemFlow"/>
    <h1>Treino Diário</h1>
  </header>

  <div class="container" id="containerTreino">
    <p>Carregando treino do dia...</p>
  </div>

  <script src="scripts/femflow-core.js"></script>
<script src="js/treino.js"></script>
</body>
</html>
