<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FemFlow — Treino Diário</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/treino.css">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Progress Bar -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Header -->
  <header class="treino-header">
    <h1>Treino Diário</h1>

    <h2 id="tituloDiaTreino"
        style="text-align:center;
               color:#335953;
               margin:10px 0;
               font-family:'Playfair Display',serif;
               font-weight:700;">
      Dia do Programa
    </h2>
  </header>

  <!-- Carrossel -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-item"><p>Carregando treino...</p></div>
    </div>
  </div>

  <!-- Rodapé Fixado -->
  <div class="fix-footer">
    <button id="salvarTreinoBtn">💾 Salvar treino</button>
    <button id="descansoBtn" class="secundario">🌿 Descanso</button>
    <button id="cancelarTreinoBtn" class="secundario">Cancelar</button>
  </div>

  <!-- ========================================== -->
<!-- Firebase (SOMENTE treino.html usa) -->
<!-- ========================================== -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyB675lX-la7dGkZP1tfvzlPZ4oxvMPLBh0",
    authDomain: "femflow-ebec2.firebaseapp.com",
    projectId: "femflow-ebec2",
    storageBucket: "femflow-ebec2.firebasestorage.app",
    messagingSenderId: "1043953159611",
    appId: "1:1043953159611:web:d12b82f744740f3124c89e",
    measurementId: "G-6F644L5VTW"
  });
</script>
  
  <!-- FEMFLOW CORE -->
  <script src="./femflow-core.js"></script>

  <!-- ENGINE & TREINO -->
  <script src="./js/treino-engine.js"></script>
  <script src="./js/treino.js"></script>

  <!-- INIT (garantia) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.FEMFLOW && typeof FEMFLOW.init === "function") {
        FEMFLOW.init();
      }
    });

    // Cancelar Treino → volta ao FlowCenter
    document.getElementById("cancelarTreinoBtn").onclick = () => {
      FEMFLOW.router("flowcenter");
    };
  </script>

  <!-- MULTI-IDIOMA -->
  <script>
    window.addEventListener("femflow:langchange", () => {
      const lang = localStorage.getItem("femflow_lang") || "pt";
      const T = {
        pt: {
          titulo: "Treino Diário",
          salvar: "💾 Salvar treino",
          descanso: "🌿 Descanso",
          cancelar: "Cancelar"
        },
        en: {
          titulo: "Daily Workout",
          salvar: "💾 Save Workout",
          descanso: "🌿 Rest",
          cancelar: "Cancel"
        }
      };

      const L = T[lang];
      document.querySelector(".treino-header h1").textContent = L.titulo;
      document.getElementById("salvarTreinoBtn").textContent = L.salvar;
      document.getElementById("descansoBtn").textContent = L.descanso;
      document.getElementById("cancelarTreinoBtn").textContent = L.cancelar;
    });
  </script>

</body>
</html>
