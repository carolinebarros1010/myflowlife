<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FemFlow — Treino Diário</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/treino.css?v3.1">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="progress-bar" id="progressBar"></div>

  <header class="treino-header">
    <h1>Treino Diário</h1>
    <h2 id="tituloDiaTreino"
        style="text-align:center;color:#335953;margin:10px 0;font-family:'Playfair Display',serif;font-weight:700;">
      Dia do Programa
    </h2>
  </header>

  <!-- CARROSSEL CORRIGIDO -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-item"><p>Carregando treino...</p></div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <div class="fix-footer">
    <button id="salvarTreinoBtn">💾 Salvar treino</button>
    <button id="descansoBtn" class="secundario">🌿 Descanso</button>
    <button id="cancelarTreinoBtn" class="secundario">Cancelar</button>
  </div>

  <!-- MODAL PSE -->
  <div id="modalPSE" class="modal-pse">
    <div class="modal-inner">
      <h3>Como foi o treino?</h3>

      <label>PSE (0 a 10)</label>
      <input type="range" min="0" max="10" value="0" id="pseInput"/>

      <div class="modal-actions">
        <button id="btnConfirmarPSE">Salvar</button>
        <button id="btnCancelarPSE" class="cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL RESPIRAÇÃO INLINE PREMIUM -->
  <div id="breathModal" class="breath-overlay hidden">
    <div class="breath-box">
      <div id="breathCircle" class="breath-circle">60</div>
      <div id="faseLabel" class="breath-fase">Preparar...</div>
      <button id="btnStart" class="breath-start">Iniciar</button>
      <button id="btnRespClose" class="breath-close">Fechar</button>
    </div>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCNDL55caHcFqLpCPgxq5QK2Yt9YkXAvkE",
      authDomain: "femflow-ebec2.firebaseapp.com",
      projectId: "femflow-ebec2",
      storageBucket: "femflow-ebec2.appspot.com",
      messagingSenderId: "929402947409",
      appId: "1:929402947409:web:b65b7775ac44edeb4283ae"
    });
  </script>

  <!-- SCRIPTS FEMFLOW -->
  <script src="./femflow-core.js"></script>
  <script src="./js/treino-engine.js?v3.1"></script>
  <script src="./js/treino.js?v3.1"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      FEMFLOW.init();
    });
    cancelarTreinoBtn.onclick = () => FEMFLOW.router("flowcenter");
  </script>
</body>
</html>
