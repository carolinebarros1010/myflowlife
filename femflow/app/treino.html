<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treino Diário - FemFlow</title>

  <!-- 🔗 PWA e estilos -->
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/treino.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <h1>Treino Diário</h1>
    <p class="subtitle">Seu corpo, seu ritmo</p>
    <p id="avisoCiclo" class="tarja-novo-ciclo" style="display:none;"></p>
  </header>

  <div class="container">
    <div id="treinoDia" class="section treino-box">
      <p>Carregando treino...</p>
    </div>

    <!-- 💪 Controle de PSE -->
    <div class="section pse-box">
      <h3>Como foi seu esforço hoje?</h3>
      <input type="range" id="pse" min="0" max="10" value="5" step="1" />
      <p>PSE: <span id="valorPSE">5</span></p>

      <div class="botoes-pse">
        <button id="salvarTreinoBtn">💾 Salvar treino</button>
        <button id="descansoBtn" class="secundario">🌿 Descanso ativo</button>
      </div>

      <button id="flowBtn" style="margin-top:10px" onclick="location.href='flowcenter.html'">← Voltar ao FlowCenter</button>
      <button id="evolucaoBtn" style="margin-top:10px" onclick="location.href='evolucao.html'">📊 Ver evolução</button>
    </div>
  </div>

  <script src="scripts/femflow-core.js"></script>

  <script>
    const $treino = document.getElementById('treinoDia');
    const $pse = document.getElementById('pse');
    const $pseVal = document.getElementById('valorPSE');
    $pse.addEventListener('input', () => $pseVal.textContent = $pse.value);

    // ======== FUNÇÕES DE RENDERIZAÇÃO ========
    function criarBoxHTML(box) {
      if (box.tipo === 'texto') {
        return `
          <div class="box texto">
            <h3>${box.titulo}</h3>
            <p>${box.mensagem}</p>
          </div>`;
      }

      if (box.tipo === 'exercicios' || box.tipo === 'forca') {
        const itens = (box.itens || []).map(it => `
          <div class="ex">
            <div class="ex-head">
              <b>${it.exercicio}</b>
              ${it.link ? `<a href="${it.link}" target="_blank">🎥</a>` : ''}
            </div>
            <div class="ex-grid">
              <label>Séries</label><input value="${it.series || ''}" />
              <label>Reps</label><input value="${it.reps || ''}" />
              <label>Timer</label><div class="subtimer" data-total="${it.tempo || 45}">00:${String(it.tempo || 45).padStart(2, '0')}</div>
            </div>
          </div>`).join('');
        return `
          <div class="box treino">
            <h3>${box.titulo}</h3>
            ${itens}
            ${box.interval ? `<p class="subtle">Intervalos sugeridos: ${box.interval}s</p>` : ''}
          </div>`;
      }

      if (box.tipo === 'hiit' || box.tipo === 'cardio') {
        return `
          <div class="hiit" style="background:${box.tipo === 'cardio' ? 'var(--pessego)' : 'var(--terracota)'}">
            <b>${box.titulo}</b><br>
            ${box.descricao}<br>
            <small><i>${box.tipo === 'hiit' ? '🔥 Potência Feminina' : '💓 Ritmo leve e consciente'}</i></small>
          </div>`;
      }

      if (box.tipo === 'resfriamento') {
        return `
          <div class="box resfriamento">
            <h3>${box.titulo}</h3>
            <p>${box.mensagem}</p>
          </div>`;
      }

      return '';
    }

    function iniciarTimers() {
      document.querySelectorAll('.subtimer').forEach(el => {
        const total = parseInt(el.dataset.total || 0, 10);
        if (!total) return;
        let restante = total;
        el.textContent = `00:${String(restante).padStart(2, '0')}`;
        el.addEventListener('click', () => {
          el.classList.add('ativo');
          const iv = setInterval(() => {
            restante--;
            el.textContent = `00:${String(Math.max(restante, 0)).padStart(2, '0')}`;
            if (restante <= 0) {
              clearInterval(iv);
              el.classList.remove('ativo');
              navigator.vibrate([100, 200, 100]); // vibra ao fim do timer
            }
          }, 1000);
        });
      });
    }

    async function carregarTreino() {
      const id = localStorage.getItem('femflow_id');
      if (!id) return (location.href = 'ciclo.html');

      try {
        const url = `${FEMFLOW.SCRIPT_URL}?action=treino&id=${encodeURIComponent(id)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data || data.error) throw new Error(data?.error || 'Erro desconhecido');

        localStorage.setItem('fase_sugerida', data.fase);
        localStorage.setItem('dia_ciclo', data.diaCiclo + 1);

        const header = `
          <h3>🌿 Fase: ${data.fase}</h3>
          <h4>Dia ${data.diaCiclo} • ${data.nivel}</h4>
          <p class="subtle">Plano ${data.plano} • Descansos (7d): ${data.descansos_usados}/${data.descansos_semana}</p>
        `;

        const boxesHTML = data.boxes.map(criarBoxHTML).join('');
        $treino.innerHTML = header + boxesHTML;

        iniciarTimers();

      } catch (err) {
        console.error(err);
        $treino.innerHTML = `<p style="color:var(--terracota)">❌ Falha ao carregar treino. Tente novamente.</p>`;
      }
    }

    // ======== AÇÕES ========
    document.getElementById('salvarTreinoBtn').addEventListener('click', () => {
      const id = localStorage.getItem('femflow_id');
      const fase = localStorage.getItem('fase_sugerida') || 'desconhecida';
      FEMFLOW.abrirPSE(async (pse) => {
        await FEMFLOW.salvarTreino({
          id,
          fase,
          treino: `Dia ${localStorage.getItem('dia_ciclo') || 1}`,
          tipo_dia: "treino",
          pse
        });
        FEMFLOW.toast("✅ Treino salvo!");
        setTimeout(() => location.reload(), 1200);
      });
    });

    document.getElementById('descansoBtn').addEventListener('click', async () => {
      const fase = localStorage.getItem('fase_sugerida') || 'desconhecida';
      await FEMFLOW.salvarDescanso(fase);
      FEMFLOW.toast("🌿 Descanso registrado!");
      setTimeout(() => location.reload(), 1200);
    });

    carregarTreino();
 /* ===== GESTO DE DESLIZAR (TOQUE) ===== */
    let startX = 0;
    let endX = 0;
    const sensibilidade = 50; // px mínimos de movimento para contar swipe

    track.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    });

    track.addEventListener("touchmove", (e) => {
      endX = e.touches[0].clientX;
    });

    track.addEventListener("touchend", () => {
      const diff = startX - endX;
      if (Math.abs(diff) > sensibilidade) {
        if (diff > 0) nextBox(); // deslizou para esquerda
        else prevBox(); // deslizou para direita
      }
    });
  </script>
</body>
</html>
