<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow • Treino Diário</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: var(--bege);
      font-family: "Lato", sans-serif;
      color: var(--texto);
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: linear-gradient(90deg, var(--terracota), var(--pessego));
      color: white;
      padding: 1rem 0.5rem;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    header img.logo {
      width: 40px;
      height: auto;
    }
    h1 {
      font-size: 1.4rem;
      font-family: "Playfair Display", serif;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 1rem 2rem;
    }
    .box {
      background: #fff;
      border-radius: 16px;
      padding: 1rem;
      margin: 1rem 0;
      text-align: left;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      animation: fadeUp 0.6s ease both;
    }
    .box h3 {
      color: var(--teal);
      font-family: "Playfair Display", serif;
      margin-top: 0;
    }
    .exercicio {
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .exercicio a {
      color: var(--terracota);
      text-decoration: none;
      font-weight: 600;
    }
    .exercicio small {
      color: #555;
      display: block;
      margin-top: 4px;
    }
    .timer-btn {
      margin-top: 6px;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }
    .timer-btn:hover {
      background: var(--terracota);
    }
    .pse-box {
      background: #fff;
      border-radius: 18px;
      padding: 1rem;
      margin-top: 2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--terracota);
    }
    #btnSalvar {
      background: var(--terracota);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
    }
    #btnSalvar:hover {
      background: var(--teal);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logofemflowverde.png" class="logo" alt="FemFlow" />
    <h1>Treino Diário</h1>
  </header>

  <div class="container">
    <p>Carregando treino...</p>
  </div>

  <script src="femflow.core.js"></script>
  <script src="treino.js"></script>
</body>
</html>
