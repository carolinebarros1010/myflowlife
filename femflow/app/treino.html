<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treino Diário - FemFlow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bege:#fff7ef; --teal:#335953; --pessego:#f7b69e; --terracota:#cc6a5a; --texto:#2a2a2a;
      --fonte-corpo:'Lato',sans-serif;
    }
    *{box-sizing:border-box}
    body{background:var(--bege);font-family:var(--fonte-corpo);color:var(--texto);margin:0}
    header{
      display:flex;align-items:center;gap:10px;
      background:linear-gradient(90deg,var(--terracota),var(--pessego));
      color:#fff;padding:12px 16px;border-radius:0 0 28px 28px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:5;
    }
    header img{width:42px;height:42px;border-radius:10px}
    header .ttl{display:flex;flex-direction:column}
    header .ttl h1{font-family:"Playfair Display",serif;font-size:1.2rem;margin:0;line-height:1}
    header .ttl small{opacity:.95;font-size:.8rem}
    .container{padding:16px;max-width:560px;margin:0 auto}
    .pill{
      display:inline-flex;gap:8px;align-items:center;
      background:#fff;border-radius:999px;padding:8px 12px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);margin:.25rem .25rem 1rem 0;font-weight:700;color:var(--teal)
    }
    .box{
      background:#fff;border-radius:18px;margin-bottom:14px;padding:14px 16px;text-align:left;
      box-shadow:0 3px 10px rgba(0,0,0,.08);animation:fadeIn .45s ease;
    }
    .box h2{font-family:"Playfair Display",serif;color:var(--teal);font-size:1.05rem;margin:0 0 .25rem}
    .box p{margin:.35rem 0}
    .motivacional{font-style:italic;color:var(--teal);line-height:1.6}
    .exercicio{padding:.7rem 0;border-bottom:1px solid rgba(0,0,0,.05)}
    .exercicio:last-child{border-bottom:none}
    .exercicio h4{margin:.1rem 0 .25rem;font-size:.98rem}
    .exercicio a{color:var(--terracota);font-weight:700;text-decoration:none}
    .meta{opacity:.8;font-size:.9rem}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .timer-global,.timer-descanso{
      display:flex;align-items:center;justify-content:center;
      border-radius:999px;font-weight:800;color:var(--teal);
      background:rgba(51,89,83,.08);margin:.6rem auto 0;
      width:110px;height:110px;font-size:1.35rem;cursor:pointer;
      box-shadow:inset 0 0 10px rgba(51,89,83,.12);user-select:none
    }
    .timer-descanso{width:64px;height:64px;font-size:1rem;margin:0}
    .timer-descanso.ativo{background:var(--terracota);color:#fff;animation:pulse 1s infinite}
    .hiit{
      background:var(--terracota);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;
      box-shadow:0 4px 12px rgba(204,106,90,.25);margin-top:.5rem
    }
    .btn{
      width:100%;max-width:380px;display:block;margin:1.1rem auto 0;
      background:var(--teal);color:#fff;font-weight:800;border:none;border-radius:18px;padding:14px 18px;cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.15)
    }
    .btn:hover{background:var(--terracota)}
    input[type=range]{width:100%;accent-color:var(--terracota)}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:480px){header .ttl h1{font-size:1.1rem}}
  </style>
</head>
<body>
  <header>
    <img src="assets/logofemflowverde.png" alt="FemFlow" />
    <div class="ttl">
      <h1>Treino Diário</h1>
      <small id="subHeader"></small>
    </div>
  </header>

  <div class="container">
    <div id="badges"></div>
    <div id="containerTreino" class="container">
      <p>Carregando treino do dia...</p>
    </div>
  </div>

  <!-- núcleo FemFlow (url + salvarTreino) -->
  <script src="scripts/femflow-core.js"></script>
  <!-- lógica desta página -->
  <script src="scripts/treino.js"></script>
</body>
</html>
