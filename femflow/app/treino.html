<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FemFlow — Treino Diário</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <!-- CSS base FemFlow -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">

  <!-- treino.css v3.6 (modelo B final) -->
  <link rel="stylesheet" href="css/treino.css?v3.6">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Progress Bar -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Header -->
  <header class="treino-header">
    <h1>Treino Diário</h1>

    <h2 id="tituloDiaTreino"
        style="text-align:center;
               color:#335953;
               margin:10px 0;
               font-family:'Playfair Display',serif;
               font-weight:700;">
      Dia do Programa
    </h2>
  </header>

  <!-- Carrossel -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-item"><p>Carregando treino...</p></div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="fix-footer">
    <button id="salvarTreinoBtn" class="btn-primary-clean">💾 Salvar treino</button>
    <button id="descansoBtn" class="btn-secondary-clean">🌿 Descanso</button>
    <button id="cancelarTreinoBtn" class="btn-tertiary-clean">Cancelar</button>
  </div>

  <!-- ====================================================== -->
  <!-- MODAL PSE -->
  <!-- ====================================================== -->
  <div id="modalPSE" class="modal-pse-overlay hidden">
    <div class="modal-pse-card">
      <h3 class="modal-title">Como foi o treino?</h3>

      <label class="modal-label">PSE (0 a 10)</label>
      <input type="range" min="0" max="10" value="0" id="pseInput" class="modal-slider"/>

      <div class="modal-actions">
        <button id="btnConfirmarPSE" class="modal-btn-ok">Salvar</button>
        <button id="btnCancelarPSE" class="modal-btn-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ====================================================== -->
  <!-- MODAL RESPIRAÇÃO (Sheet iOS) — oculto até clicar -->
  <!-- ====================================================== -->
  <div id="breathBackdrop" class="breath-backdrop hidden"></div>

  <div id="breathModal" class="breath-sheet hidden">
    <div class="breath-sheet-handle"></div>

    <div class="breath-sheet-content">
      <h3 id="breathTitle" class="breath-title">Respiração</h3>

      <div id="breathCircle" class="breath-circle">—</div>
      <div id="faseLabel" class="breath-phase"></div>

      <div class="breath-actions">
        <button id="btnStart" class="breath-start-btn">Iniciar</button>
        <button id="btnRespClose" class="breath-close-btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCNDL55caHcFqLpCPgxq5QK2Yt9YkXAvkE",
      authDomain: "femflow-ebec2.firebaseapp.com",
      projectId: "femflow-ebec2",
      storageBucket: "femflow-ebec2.appspot.com",
      messagingSenderId: "929402947409",
      appId: "1:929402947409:web:b65b7775ac44edeb4283ae"
    });
  </script>

  <!-- Scripts FemFlow -->
  <script src="./femflow-core.js"></script>
  <script src="./js/treino-engine.js?v3.6"></script>
  <script src="./js/treino.js?v3.6"></script>

  <!-- Boot -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.FEMFLOW && typeof FEMFLOW.init === "function") {
        FEMFLOW.init();
      }
    });

    cancelarTreinoBtn.onclick = () => FEMFLOW.router("flowcenter.html");
  </script>

</body>
</html>
