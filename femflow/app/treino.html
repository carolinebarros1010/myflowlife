<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FemFlow — Treino Diário</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/treino.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{ --teal:#335953; --terracota:#cc6a5a; } /* garante as vars aqui também */

    /* ===== 🌸 CARROSSEL DE BOXES ===== */
    body {
  padding-top: calc(70px + env(safe-area-inset-top, 0px));
  box-sizing: border-box;
}
   header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-top: 15px;  /* afastamento do topo */
  margin-bottom: 10px;
}
    header h1 { margin:0; color:var(--teal); font-family:'Playfair Display', serif; }
    header .subtitle { margin:4px 0 0; color:#7a6c66; font-size:.95rem; }

    .carousel-container {
      overflow:hidden; width:100%; position:relative;
      height:calc(100vh - 180px); display:flex; justify-content:center; align-items:center;
    }
    .carousel-track {
      display:flex; flex-wrap:nowrap; transition:transform .8s ease; width:100%; cursor:grab;
    }
    .carousel-track:active { cursor:grabbing; transform:scale(.995); transition:transform .15s ease; }
    .carousel-item { flex:0 0 100%; max-width:100%; padding:1rem; box-sizing:border-box; scroll-snap-align:center; }

    /* ===== BOTÕES DE NAVEGAÇÃO ===== */
    .carousel-nav {
      position:fixed; bottom:25px; left:0; width:100%;
      display:flex; justify-content:space-between; padding:0 25px; box-sizing:border-box;
    }
    .nav-btn {
      background:var(--teal); color:#fff; border:none; border-radius:50%;
      width:55px; height:55px; font-size:1.4rem; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.25);
      transition:background .3s, transform .2s;
    }
    .nav-btn:hover { background:var(--terracota); transform:scale(1.08); }

    /* ===== PROGRESSO ===== */
    .progress-bar {
      position:fixed; top:0; left:0; height:5px; background:var(--terracota);
      width:0%; transition:width .4s ease; border-radius:0 3px 3px 0; z-index:999;
    }

    /* ===== RODAPÉ ===== */
    .fix-footer {
      position:fixed; bottom:10px; width:100%; text-align:center; font-size:.9rem; color:var(--teal); opacity:.85;
      display:flex; gap:10px; justify-content:center;
    }
    #salvarTreinoBtn, .secundario {
      background:var(--teal); color:#fff; border:none; padding:10px 16px; border-radius:20px; font-size:1rem; cursor:pointer; transition:.3s ease;
    }
    .secundario { background:#fff; color:var(--teal); border:1px solid rgba(51,89,83,.25); }
    #salvarTreinoBtn:hover, .secundario:hover { transform:scale(1.05); }
    /* feedback visual dos timers */
    .subtimer { user-select:none; padding:.35rem .6rem; border-radius:12px; background:#f3e7e3; display:inline-block; min-width:64px; text-align:center; }
    .subtimer.running { background:#e9f3ef; }
    .subtimer.done { background:#e9dedd; }
  </style>
</head>

<body>
  <div class="progress-bar" id="progressBar"></div>

  <header>
    <h1>Treino Diário</h1>
    <p class="subtitle">Fluxo de movimento e consciência</p>

    <!-- ✅ Contador do dia do programa -->
    <h2 id="tituloDiaTreino"
        style="text-align:center;
               color:#335953;
               margin:12px 0;
               font-family:'Playfair Display',serif;
               font-weight:700;">
      Dia do Programa
    </h2>
  </header>

  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-item"><p>Carregando treino...</p></div>
    </div>
  </div>

  <div class="fix-footer">
    <button id="salvarTreinoBtn">💾 Salvar treino</button>
    <button id="descansoBtn" class="secundario">🌿 Descanso</button>
  </div>
<!-- Firebase compat (antes do femflow-core.js) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- Core no mesmo nível do arquivo -->
  <script src="./femflow-core.js"></script>
  <!-- Lógica híbrida (Apps Script + Firebase) com timers + links -->
  <script src="js/treino.js"></script>
 <script>
window.addEventListener("femflow:langchange", () => {
  const lang = localStorage.getItem("femflow_lang") || "pt";
  const T = {
    pt: {
      titulo: "Treino Diário",
      subtitulo: "Fluxo de movimento e consciência",
      salvar: "💾 Salvar treino",
      descanso: "🌿 Descanso"
    },
    en: {
      titulo: "Daily Workout",
      subtitulo: "Flow of movement and awareness",
      salvar: "💾 Save workout",
      descanso: "🌿 Rest day"
    }
  };
  const L = T[lang];

  document.querySelector("header h1").textContent = L.titulo;
  document.querySelector(".subtitle").textContent = L.subtitulo;
  document.getElementById("salvarTreinoBtn").textContent = L.salvar;
  document.getElementById("descansoBtn").textContent = L.descanso;
});
</script>
</body>
</html>
