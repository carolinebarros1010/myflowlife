<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FemFlow — Treino Diário</title>

  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <!-- CSS base FemFlow -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">

  <!-- treino.css -->
  <link rel="stylesheet" href="css/treino.css">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Barra de Progresso -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Header -->
  <header class="treino-header">
    <h1>Treino Diário</h1>

    <h2 id="tituloDiaTreino"
        style="text-align:center;
               color:#335953;
               margin:10px 0;
               font-family:'Playfair Display',serif;
               font-weight:700;">
      Dia do Programa
    </h2>
  </header>

  <!-- Carrossel -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-item">
        <p>Carregando treino...</p>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="fix-footer">
    <button id="salvarTreinoBtn" class="btn-primary-clean">💾 Salvar treino</button>
    <button id="descansoBtn" class="btn-secondary-clean">🌿 Descanso</button>
    <button id="cancelarTreinoBtn" class="btn-tertiary-clean">Cancelar</button>
  </div>

  <!-- ====================================================== -->
  <!-- MODAL PSE -->
  <!-- ====================================================== -->
  <div id="modalPSE" class="modal-pse-overlay hidden">
    <div class="modal-pse-card">
      <h3 class="modal-title">Como foi o treino?</h3>

      <label class="modal-label">PSE (0 a 10)</label>
      <input type="range" min="0" max="10" value="0" id="pseInput" class="modal-slider"/>

      <div class="modal-actions">
        <button id="btnConfirmarPSE" class="modal-btn-ok">Salvar</button>
        <button id="btnCancelarPSE" class="modal-btn-cancel">Cancelar</button>
      </div>
    </div>
  </div>

 
  <!-- ====================================================== -->
  <!-- FIREBASE -->
  <!-- ====================================================== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCNDL55caHcFqLpCPgxq5QK2Yt9YkXAvkE",
      authDomain: "femflow-ebec2.firebaseapp.com",
      projectId: "femflow-ebec2",
      storageBucket: "femflow-ebec2.appspot.com",
      messagingSenderId: "929402947409",
      appId: "1:929402947409:web:b65b7775ac44edeb4283ae"
    });
  </script>

  <!-- ====================================================== -->
  <!-- SCRIPTS FEMFLOW -->
  <!-- ====================================================== -->
  <script src="./femflow-core.js"></script>
  <script src="./js/treino-engine.js"></script>
  <script src="./js/treino.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.FEMFLOW && typeof FEMFLOW.init === "function") {
        FEMFLOW.init();
      }
    });

    // Botão cancelar — voltar ao FlowCenter
    document.getElementById("cancelarTreinoBtn").onclick = () => {
      FEMFLOW.router("flowcenter.html");
    };
  </script>

</body>
</html>
