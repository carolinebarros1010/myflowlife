<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treino Diário - FemFlow</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      background: var(--bege);
      font-family: var(--fonte-corpo);
      color: var(--texto);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      background: linear-gradient(90deg, var(--terracota), var(--pessego));
      color: white;
      padding: 1rem;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    header img {
      width: 45px;
      height: 45px;
      border-radius: 10px;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      margin: 0;
    }

    .container {
      padding: 1.2rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .box {
      background: #fff;
      border-radius: 20px;
      margin-bottom: 1.2rem;
      padding: 1rem 1.2rem;
      text-align: left;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      animation: fadeIn 0.6s ease;
    }

    .box h2 {
      font-family: "Playfair Display", serif;
      color: var(--teal);
      font-size: 1.1rem;
      margin-top: 0;
    }

    .box a {
      color: var(--terracota);
      font-weight: 700;
      text-decoration: none;
    }

    .box a:hover {
      text-decoration: underline;
    }

    .motivacional {
      font-style: italic;
      line-height: 1.6;
      color: var(--teal);
      padding-top: 0.5rem;
    }

    .exercicio {
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 0.6rem 0;
    }

    .hiit {
      background: var(--terracota);
      color: white;
      border-radius: 15px;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(204,106,90,0.25);
    }

    .timer {
      background: rgba(51,89,83,0.1);
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      color: var(--teal);
      padding: 0.4rem;
      margin-top: 0.5rem;
    }

    .btn {
      background: var(--teal);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      margin-top: 1.5rem;
      cursor: pointer;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: var(--terracota);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      .btn { padding: 10px 20px; font-size: 0.95rem; }
    }
  </style>
</head>

<body>
  <header>
    <img src="assets/logofemflowverde.png" alt="FemFlow Logo" />
    <h1>Treino Diário</h1>
  </header>

  <div class="container" id="containerTreino">
    <p>Carregando treino do dia...</p>
  </div>

  <script src="scripts/femflow-core.js"></script>

  <script>
  (async () => {
    const id = localStorage.getItem('femflow_id');
    if (!id) {
      FEMFLOW.toast("⚠️ ID não encontrado, faça login novamente.");
      window.location.href = "ciclo.html";
      return;
    }

    try {
      // 🔹 Busca treino completo do Apps Script
      const url = `${FEMFLOW.SCRIPT_URL}?action=treino&id=${id}`;
      const response = await fetch(url);
      const treinoData = await response.json();

      if (!treinoData || !treinoData.boxes) {
        FEMFLOW.toast("Erro ao carregar treino.");
        return;
      }

      const container = document.getElementById("containerTreino");
      container.innerHTML = ""; // limpa o conteúdo atual

      treinoData.boxes.forEach((box) => {
        const div = document.createElement("div");
        div.className = "box";

        // 🌸 Título do box
        div.innerHTML = `<h2>${box.titulo}</h2>`;

        // 🌿 Texto motivacional
        if (box.tipo === "texto") {
          div.innerHTML += `<p class="motivacional">${box.mensagem}</p>`;
        }

        // 💪 Box de exercícios
        if (box.tipo === "exercicios" && box.itens) {
          const list = document.createElement("div");
          box.itens.forEach((ex, i) => {
            const e = document.createElement("div");
            e.className = "exercicio";
            e.innerHTML = `
              <h4>${i + 1}. <a href="${ex.link}" target="_blank">${ex.exercicio}</a></h4>
              <p>🔁 ${ex.series} séries × ${ex.reps} repetições</p>
            `;
            list.appendChild(e);
          });
          div.appendChild(list);

          // 🕒 Timer do box
          const timer = document.createElement("div");
          timer.className = "timer";
          timer.textContent = `${Math.floor((box.tempo_total || 300)/60)} min`;
          div.appendChild(timer);
        }

        // 🔥 HIIT
        if (box.tipo === "hiit") {
          div.innerHTML += `
            <div class="hiit">
              <b>${box.titulo}</b><br>${box.descricao || ""}
              <small><br>⏱️ ${Math.floor((box.tempo_total || 360)/60)} min</small>
            </div>
          `;
        }

        // 💗 Cardio leve ou resfriamento
        if (box.tipo === "cardio" || box.tipo === "resfriamento") {
          div.innerHTML += `<p class="motivacional">${box.mensagem || box.descricao}</p>`;
        }

        container.appendChild(div);
      });

      // ✅ Botão de finalização
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "✅ Concluir Treino";
      btn.onclick = async () => {
        await FEMFLOW.salvarTreino({
          tipo_dia: "treino",
          fase: treinoData.fase,
          treino: `Dia ${treinoData.diaCiclo} - ${treinoData.fase}`,
          pse: 5,
          observacao: "Treino completo"
        });
        FEMFLOW.toast("✅ Treino salvo com sucesso!");
        setTimeout(() => (window.location.href = "flowcenter.html"), 2500);
      };
      container.appendChild(btn);
    } catch (err) {
      console.error(err);
      FEMFLOW.toast("❌ Erro ao conectar com o servidor.");
    }
  })();
  </script>
</body>
</html>
