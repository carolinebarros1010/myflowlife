<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar no FemFlow</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="login-container">
    <h2>🌸 Entrar no FemFlow</h2>

    <div id="register">
      <input type="text" id="nome" placeholder="Nome completo"><br>
      <input type="email" id="email" placeholder="E-mail"><br>
      <input type="password" id="senha" placeholder="Senha"><br>
      <button onclick="registrar()">Criar Conta</button>
    </div>

    <hr>

    <div id="login">
      <input type="email" id="loginEmail" placeholder="E-mail"><br>
      <input type="password" id="loginSenha" placeholder="Senha"><br>
      <button onclick="entrar()">Entrar</button>
    </div>

    <p id="mensagem"></p>
  </div>

<script>
const scriptURL = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec';

async function registrar() {
  const nome = document.getElementById('nome').value;
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const res = await fetch(scriptURL, {
    method: 'POST',
    body: JSON.stringify({ action: 'register', nome, email, senha })
  });
  const data = await res.json();
  document.getElementById('mensagem').textContent =
    data.status === 'ok'
      ? 'Cadastro realizado! ID: ' + data.id
      : data.msg || 'Erro no cadastro.';
}

async function entrar() {
  const email = document.getElementById('loginEmail').value;
  const senha = document.getElementById('loginSenha').value;
  const res = await fetch(scriptURL, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', email, senha })
  });
  const data = await res.json();
  if (data.status === 'ok') {
    localStorage.setItem('femflow_id', data.id);
    window.location.href = '../ciclo.html';
  } else {
    document.getElementById('mensagem').textContent = data.msg || 'Erro no login.';
  }
}
</script>
</body>
</html>
