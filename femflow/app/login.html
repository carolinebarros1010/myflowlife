<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar no FemFlow</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Helvetica Rounded", "Arial Rounded MT Bold", sans-serif;
        background: linear-gradient(180deg, #f4e1d7 0%, #efbda6 100%);
        color: #335953;
      }

      .login-card {
        width: 90%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .login-card img.logo {
        width: 130px;
        margin-bottom: 1rem;
      }

      .login-card h2 {
        margin: 0;
        font-size: 1.6rem;
        color: #cc6a5a;
        font-family: "Playfair Display", serif;
      }

      .login-card .subtitle {
        font-size: 0.9rem;
        color: #335953;
        margin: 0.2rem 0 1.5rem;
      }

      .form-group {
        margin-bottom: 0.9rem;
      }

      .form-group input {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 1rem;
        color: #335953;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .form-group input:focus {
        border-color: #cc6a5a;
        box-shadow: 0 0 0 3px rgba(204, 106, 90, 0.25);
      }

      button {
        width: 100%;
        padding: 0.8rem;
        margin-top: 0.4rem;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #335953, #cc6a5a);
        transition: transform 0.3s, background 0.3s;
      }

      button:hover {
        transform: scale(1.03);
      }

      .toggle {
        font-size: 0.85rem;
        color: #cc6a5a;
        margin-top: 0.8rem;
        cursor: pointer;
        text-decoration: underline;
      }

      .message {
        margin-top: 1rem;
        min-height: 1.4rem;
        font-size: 0.9rem;
        color: #335953;
      }

      .loader {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #cc6a5a;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-left: 8px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <img src="../assets/logoterracotabege.png" alt="FemFlow logo" class="logo" />
      <h2>Bem-vinda ao FemFlow</h2>
      <p class="subtitle">Acesse sua conta para continuar seu ciclo 🌸</p>

      <!-- Login form -->
      <div id="loginBox">
        <div class="form-group">
          <input type="text" id="loginEmail" placeholder="E-mail ou ID FemFlow" />
        </div>
        <div class="form-group">
          <input type="password" id="loginSenha" placeholder="Sua senha" />
        </div>
        <button onclick="entrar()">Entrar</button>
        <p class="toggle" onclick="irParaAnamnese()">Ainda não tem conta? Faça sua anamnese</p>
      </div>

      <p id="mensagem" class="message"></p>
    </div>

    <!-- FemFlow Core primeiro -->
    <script src="scripts/femflow-core.js"></script>

    <script>
      const scriptURL = FEMFLOW?.SCRIPT_URL || "https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec";

      async function entrar() {
        const identificador = document.getElementById("loginEmail").value.trim();
        const senha = document.getElementById("loginSenha").value.trim();
        const msgEl = document.getElementById("mensagem");

        msgEl.textContent = "Conectando ao seu ciclo...";
        msgEl.style.color = "#335953";
        msgEl.insertAdjacentHTML("beforeend", '<span class="loader"></span>');

        if (!identificador || !senha) {
          msgEl.textContent = "Digite seu e-mail ou ID e senha.";
          msgEl.style.color = "#d35470";
          return;
        }

        try {
          const isEmail = identificador.includes("@");
          const params = isEmail
            ? `?action=validar&email=${encodeURIComponent(identificador)}`
            : `?action=validar&id=${encodeURIComponent(identificador)}`;

          const res = await fetch(`${scriptURL}${params}`);
          const data = await res.json();

          if (data.status === "ok") {
            localStorage.setItem("femflow_id", data.id);
            msgEl.textContent = `✨ Bem-vinda de volta, ${data.nome || "aluna"}!`;
            msgEl.style.color = "#28a745";
            setTimeout(() => (window.location.href = "./home.html"), 1200);
          } else if (data.status === "notfound") {
            msgEl.textContent = "❌ Nenhuma conta encontrada. Faça sua anamnese para começar.";
            msgEl.style.color = "#d35470";
          } else {
            msgEl.textContent = "⚠️ E-mail, ID ou senha incorretos.";
            msgEl.style.color = "#d35470";
          }
        } catch (error) {
          console.error(error);
          msgEl.textContent = "Erro de conexão. Tente novamente.";
          msgEl.style.color = "#d35470";
        }
      }

      function irParaAnamnese() {
        window.location.href = "anamnese.html";
      }
    </script>
  </body>
</html>
