<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • FemFlow</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f4e1d7 0%, #efbda6 100%);
      font-family: "Lato", sans-serif;
      color: #335953;
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
    }

    img.logo {
      width: 130px;
      margin-bottom: 1rem;
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      margin: 0;
      color: #cc6a5a;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #335953;
      margin: 0.4rem 0 1.4rem;
    }

    .form-group {
      margin-bottom: 0.9rem;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 1rem;
      color: #335953;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #cc6a5a;
      box-shadow: 0 0 0 3px rgba(204, 106, 90, 0.25);
    }

    button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #335953, #cc6a5a);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    .toggle {
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: #cc6a5a;
      cursor: pointer;
      text-decoration: underline;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.3rem;
    }

    .loader {
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid #cc6a5a;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 🔑 Recuperar senha */
    #recuperarBox {
      display: none;
      animation: fadeIn 0.4s ease;
      margin-top: 1rem;
    }

    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

  </style>
</head>

<body>
  <div class="card">
    <img src="../assets/logoterracotaebege.jpg" alt="FemFlow logo" class="logo" />
    <h2>Bem-vinda ao FemFlow</h2>
    <p class="subtitle">Acesse sua conta para continuar seu ciclo 🌸</p>

    <!-- Login -->
    <div id="loginBox">
      <div class="form-group">
        <input type="text" id="loginEmail" placeholder="E-mail ou ID FemFlow" />
      </div>
      <div class="form-group">
        <input type="password" id="loginSenha" placeholder="Sua senha" />
      </div>
      <button onclick="entrar()">Entrar</button>
      <p class="toggle" onclick="mostrarRecuperar()">🔑 Esqueci minha senha</p>
      <p class="toggle" onclick="irParaAnamnese()">Ainda não tem conta? Faça sua anamnese</p>
    </div>

    <!-- Recuperar Senha -->
    <div id="recuperarBox">
      <p style="font-size:0.95rem;">Digite o e-mail cadastrado para receber as instruções:</p>
      <input type="email" id="recEmail" placeholder="Seu e-mail" />
      <button style="margin-top:0.6rem;" onclick="recuperarSenha()">Enviar</button>
      <p class="toggle" onclick="voltarLogin()">Voltar ao login</p>
    </div>

    <p id="mensagem" class="message"></p>
  </div>

  <script src="scripts/femflow-core.js"></script>
  <script>
    const scriptURL = FEMFLOW?.SCRIPT_URL ||
      "https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec"; // ⚙️ substitua pelo seu deploy real

    async function entrar() {
      const identificador = document.getElementById("loginEmail").value.trim();
      const senha = document.getElementById("loginSenha").value.trim();
      const msg = document.getElementById("mensagem");

      msg.innerHTML = "Conectando..." + '<span class="loader"></span>';
      msg.style.color = "#335953";

      if (!identificador || !senha) {
        msg.textContent = "Digite e-mail/ID e senha.";
        msg.style.color = "#cc6a5a";
        return;
      }

      try {
        const isEmail = identificador.includes("@");
        const params = isEmail
          ? `?action=validar&email=${encodeURIComponent(identificador)}`
          : `?action=validar&id=${encodeURIComponent(identificador)}`;

        const res = await fetch(`${scriptURL}${params}`);
        const data = await res.json();

        if (data.status === "ok") {
          localStorage.setItem("femflow_id", data.id);
          localStorage.setItem("femflow_nome", data.nome);
          msg.textContent = `✨ Bem-vinda de volta, ${data.nome || "aluna"}!`;
          msg.style.color = "#28a745";
          setTimeout(() => (window.location.href = "home.html"), 1500);
        } else if (data.status === "notfound") {
          msg.textContent = "❌ Nenhuma conta encontrada. Faça sua anamnese.";
          msg.style.color = "#cc6a5a";
        } else {
          msg.textContent = "⚠️ E-mail, ID ou senha incorretos.";
          msg.style.color = "#cc6a5a";
        }
      } catch (err) {
        console.error(err);
        msg.textContent = "⚠️ Falha de conexão. Tente novamente.";
        msg.style.color = "#cc6a5a";
      }
    }

    function mostrarRecuperar() {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("recuperarBox").style.display = "block";
      document.getElementById("mensagem").textContent = "";
    }

    function voltarLogin() {
      document.getElementById("recuperarBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("mensagem").textContent = "";
    }

    async function recuperarSenha() {
      const email = document.getElementById("recEmail").value.trim();
      const msg = document.getElementById("mensagem");

      if (!email) {
        msg.textContent = "Digite seu e-mail.";
        msg.style.color = "#cc6a5a";
        return;
      }

      msg.innerHTML = "Verificando..." + '<span class="loader"></span>';
      msg.style.color = "#335953";

      try {
        const res = await fetch(scriptURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "recuperarSenha", email })
        });
        const data = await res.json();

        if (data.status === "ok") {
          msg.textContent = "📩 E-mail de recuperação enviado!";
          msg.style.color = "#28a745";
          setTimeout(voltarLogin, 2500);
        } else if (data.status === "notfound") {
          msg.textContent = "⚠️ E-mail não encontrado.";
          msg.style.color = "#cc6a5a";
        } else {
          msg.textContent = "❌ Erro ao enviar e-mail.";
          msg.style.color = "#cc6a5a";
        }
      } catch (err) {
        console.error(err);
        msg.textContent = "❌ Falha de rede. Tente novamente.";
        msg.style.color = "#cc6a5a";
      }
    }

    function irParaAnamnese() {
      window.location.href = "anamnese.html";
    }
  </script>
</body>
</html>
