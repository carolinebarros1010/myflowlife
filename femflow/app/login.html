<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar no FemFlow</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background: linear-gradient(180deg, #fdf2f8 0%, #fde2e4 100%);
      font-family: "Lato", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", serif;
      color: #e46a84;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.4rem 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 1rem;
      transition: 0.2s;
    }

    input:focus {
      border-color: #e46a84;
      box-shadow: 0 0 0 2px rgba(228,106,132,0.2);
    }

    button {
      width: 100%;
      background: #e46a84;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      margin-top: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #d4556e;
    }

    .toggle {
      color: #e46a84;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    .mensagem {
      margin-top: 1rem;
      color: #444;
      font-size: 0.9rem;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌸 FemFlow</h1>
    <p class="subtitle">Acesse ou crie sua conta</p>

    <!-- LOGIN -->
    <div id="loginBox">
      <input type="email" id="loginEmail" placeholder="Seu e-mail">
      <input type="password" id="loginSenha" placeholder="Sua senha">
      <button onclick="entrar()">Entrar</button>
      <p class="toggle" onclick="mostrarCadastro()">Ainda não tem conta? Cadastre-se</p>
    </div>

    <!-- CADASTRO -->
    <div id="cadastroBox" style="display:none;">
      <input type="text" id="nome" placeholder="Nome completo">
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="senha" placeholder="Crie uma senha">
      <button onclick="registrar()">Criar conta</button>
      <p class="toggle" onclick="mostrarLogin()">Já tem conta? Fazer login</p>
    </div>

    <p id="mensagem" class="mensagem"></p>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz2cvzQoEeillb39d3XQ4Y8aldw7p3txQOhgYyuNH-IFbH2hNF6ZbQ7HpYcvJOowyuD/exec"; // 🔸 Substitua pelo seu deploy ID

    function mostrarCadastro() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('cadastroBox').style.display = 'block';
      document.getElementById('mensagem').textContent = '';
    }

    function mostrarLogin() {
      document.getElementById('cadastroBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('mensagem').textContent = '';
    }

    async function registrar() {
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const msg = document.getElementById('mensagem');
      msg.textContent = 'Criando sua conta...';

      const res = await fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({ action: 'register', nome, email, senha }),
      });

      const data = await res.json();
      if (data.status === 'ok') {
        msg.textContent = `Conta criada com sucesso! ID: ${data.id}`;
        setTimeout(() => {
          localStorage.setItem('femflow_id', data.id);
          window.location.href = './ciclo.html';
        }, 1500);
      } else {
        msg.textContent = data.msg || 'Erro ao cadastrar.';
      }
    }

    async function entrar() {
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();
      const msg = document.getElementById('mensagem');
      msg.textContent = 'Verificando...';

      const res = await fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', email, senha }),
      });

      const data = await res.json();
      if (data.status === 'ok') {
        msg.textContent = `Bem-vinda, ${data.nome}!`;
        setTimeout(() => {
          localStorage.setItem('femflow_id', data.id);
          window.location.href = './ciclo.html';
        }, 1000);
      } else {
        msg.textContent = data.msg || 'E-mail ou senha incorretos.';
      }
    }
  </script>
</body>
</html>
