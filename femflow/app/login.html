<!--
  FemFlow login and registration page
  ------------------------------------------------------------
  This page provides an entry point for users to create an account
  with their e‑mail and password or to sign in with existing
  credentials. It uses the FemFlow palette (creme, pêssego,
  terracota and teal) and displays the FemFlow logo at the top
  of the card. When a user registers or logs in successfully,
  their FemFlow ID will be stored in localStorage and they will
  be redirected to ciclo.html. Replace YOUR_DEPLOY_ID with your
  Apps Script deployment ID for production.
-->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar no FemFlow</title>
    <!-- Load shared styles if present -->
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Page background using FemFlow palette */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Helvetica Rounded", "Arial Rounded MT Bold", sans-serif;
        background: linear-gradient(180deg, #F4E1D7 0%, #EFBDA6 100%);
        color: #335953;
      }

      /* Card container */
      .login-card {
        width: 90%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .login-card img.logo {
        width: 130px;
        margin-bottom: 1rem;
      }

      .login-card h2 {
        margin: 0;
        font-size: 1.6rem;
        color: #cc6a5a;
        font-family: "Playfair Display", serif;
      }

      .login-card .subtitle {
        font-size: 0.9rem;
        color: #335953;
        margin: 0.2rem 0 1.5rem;
      }

      .form-group {
        margin-bottom: 0.9rem;
      }

      .form-group input {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 1rem;
        color: #335953;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus {
        border-color: #cc6a5a;
        box-shadow: 0 0 0 3px rgba(204, 106, 90, 0.25);
      }

      button {
        width: 100%;
        padding: 0.8rem;
        margin-top: 0.4rem;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #335953, #cc6a5a);
        transition: transform 0.3s, background 0.3s;
      }
      button:hover {
        transform: scale(1.03);
      }

      .toggle {
        font-size: 0.85rem;
        color: #cc6a5a;
        margin-top: 0.8rem;
        cursor: pointer;
        text-decoration: underline;
      }

      .message {
        margin-top: 1rem;
        min-height: 1.4rem;
        font-size: 0.9rem;
        color: #335953;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <!-- FemFlow logo at the top of the card -->
      <img src="../assets/logofemflowterracota.png" alt="FemFlow logo" class="logo" />
      <h2>Bem‑vinda ao FemFlow</h2>
      <p class="subtitle">Acesse ou crie sua conta para iniciar seu ciclo</p>

      <!-- Login form -->
      <div id="loginBox">
        <div class="form-group">
          <input type="email" id="loginEmail" placeholder="Seu e‑mail" />
        </div>
        <div class="form-group">
          <input type="password" id="loginSenha" placeholder="Sua senha" />
        </div>
        <button onclick="entrar()">Entrar</button>
        <p class="toggle" onclick="mostrarCadastro()">Ainda não tem conta? Cadastre‑se</p>
      </div>

      <!-- Cadastro form -->
      <div id="cadastroBox" style="display: none;">
        <div class="form-group">
          <input type="text" id="nome" placeholder="Nome completo" />
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="E‑mail" />
        </div>
        <div class="form-group">
          <input type="password" id="senha" placeholder="Crie uma senha" />
        </div>
        <button onclick="registrar()">Criar conta</button>
        <p class="toggle" onclick="mostrarLogin()">Já tem conta? Fazer login</p>
      </div>

      <p id="mensagem" class="message"></p>
    </div>

    <script>
      
      function mostrarLogin() {
        document.getElementById("cadastroBox").style.display = "none";
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("mensagem").textContent = "";
      }

      async function registrar() {
        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value.trim();
        const msgEl = document.getElementById("mensagem");
        msgEl.textContent = "Criando sua conta...";
        msgEl.style.color = "#335953";
        try {
          const res = await fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify({ action: "register", nome, email, senha }),
          });
          const data = await res.json();
          if (data.status === "ok") {
            msgEl.textContent = `Conta criada! ID: ${data.id}`;
            msgEl.style.color = "#28a745";
            setTimeout(() => {
              localStorage.setItem("femflow_id", data.id);
              window.location.href = "./ciclo.html";
            }, 1500);
          } else {
            msgEl.textContent = data.msg || "Erro ao cadastrar.";
            msgEl.style.color = "#d35470";
          }
        } catch (error) {
          console.error(error);
          msgEl.textContent = "Erro de rede. Tente novamente.";
          msgEl.style.color = "#d35470";
        }
      }

      async function entrar() {
        const email = document.getElementById("loginEmail").value.trim();
        const senha = document.getElementById("loginSenha").value.trim();
        const msgEl = document.getElementById("mensagem");
        msgEl.textContent = "Verificando...";
        msgEl.style.color = "#335953";
        try {
          const res = await fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify({ action: "login", email, senha }),
          });
          const data = await res.json();
          if (data.status === "ok") {
            msgEl.textContent = `Bem‑vinda, ${data.nome}!`;
            msgEl.style.color = "#28a745";
            setTimeout(() => {
              localStorage.setItem("femflow_id", data.id);
              window.location.href = "./ciclo.html";
            }, 1000);
          } else {
            msgEl.textContent = data.msg || "E‑mail ou senha incorretos.";
            msgEl.style.color = "#d35470";
          }
        } catch (error) {
          console.error(error);
          msgEl.textContent = "Erro de rede. Tente novamente.";
          msgEl.style.color = "#d35470";
        }
      }
    </script>
    <script src="js/femflow-core.js"></script>

  
<script>
// Auto-redirect APENAS se já houver sessão validada anteriormente
(async function autoRouteIfLogged(){
  const id   = localStorage.getItem('femflow_id');
  const auth = localStorage.getItem('femflow_auth') === 'yes';
  if (!id || !auth) return;  // ← bloqueia redirect "fantasma"
  await decidirDestinoPosLogin(id, new URLSearchParams(location.search).get('ret'));
})();

async function decidirDestinoPosLogin(id, retTarget){
  try{
    const url = `${FEMFLOW.SCRIPT_URL}?action=validar&id=${encodeURIComponent(id)}`;
    const d = await fetch(url).then(r=>r.json());
    const hasProduct = !!(d?.produto_ativo || d?.possui_produto || (Array.isArray(d?.produtos) && d.produtos.length));
    const cicloOk = localStorage.setItem('femflow_id', data.id);
                    localStorage.setItem('femflow_nome', data.nome || '');
                    localStorage.setItem('femflow_auth', 'yes');        // ← NOVO: marca sessão válida
                    decidirDestinoPosLogin(data.id, ret);    
    if (d?.produto_fim) localStorage.setItem('femflow_produto_fim', d.produto_fim);
    localStorage.setItem('femflow_hasProduct', hasProduct ? 'yes' : 'no');
    if (retTarget){
      const t = retTarget.toLowerCase();
      if (t.includes('flowcenter') && hasProduct && cicloOk) { location.href = retTarget; return; }
      if (t.includes('ciclo') && hasProduct) { location.href = retTarget; return; }
    }
    if (!hasProduct){ location.href = 'home.html'; return; }
    if (!cicloOk){ location.href = 'ciclo.html'; return; }
    location.href = 'flowcenter.html';
  }catch(e){
    console.error(e); location.href = 'home.html';
  }
}  
</script>
</body>
</html>
