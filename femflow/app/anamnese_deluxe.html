<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FemFlow • Anamnese Deluxe</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="app/favicon.ico">
  <link rel="shortcut icon" href="app/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="app/favicon.ico">
  <meta name="msapplication-TileImage" content="app/favicon.ico">
  <link rel="icon" href="/femflow/app/favicon.ico">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cc6a5a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracota:#cc6a5a; --bege:#fff5ef; --verde:#335953; --texto:#5b4f49;
    }
    body{
      margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      background:linear-gradient(180deg,var(--bege) 0%,#fae6dc 100%); color:var(--texto);
      font-family:"Lato",sans-serif; overflow-x:hidden;
    }
    h1{
      font-family:'Playfair Display',serif; color:var(--terracota); font-size:2rem; margin:1rem 0 .4rem;
    }
    #btnLang{
      background:none; border:none; color:var(--verde);
      font-size:.9rem; font-weight:600; cursor:pointer;
      margin-top:-10px; margin-bottom:8px;
    }
    .card{
      background:#fff; border-radius:24px; box-shadow:0 8px 20px rgba(0,0,0,.08);
      max-width:420px; width:90%; padding:26px 22px; margin-top:1.2rem; text-align:center; animation:fadeIn .5s ease;
    }
    .hint{ margin:.2rem 0 1rem; font-size:.95rem; color:#6a5f59 }
    input{
      width:78%; max-width:300px; padding:.85rem 1rem; margin:.4rem 0 1rem;
      border:1px solid #e6ddd8; border-radius:14px; font-size:.95rem; color:var(--texto); background:#fff;
      transition:border-color .2s, box-shadow .2s;
    }
    input:focus{ border-color:var(--terracota); box-shadow:0 0 0 3px rgba(204,106,90,.18) }
    input[aria-invalid="true"]{ border-color:#d9534f }
    .err{ font-size:.9rem; color:#d9534f; min-height:1.1rem; margin:-.6rem 0 .6rem; }
    button{
      background:linear-gradient(135deg,var(--verde),var(--terracota)); color:#fff; border:none; border-radius:14px;
      padding:12px 18px; font-size:1rem; font-weight:600; width:78%; max-width:300px; margin-top:.2rem; cursor:pointer;
      transition:all .25s ease;
    }
    button[disabled]{ opacity:.6; cursor:not-allowed; }
    button:hover:not([disabled]){ transform:translateY(-2px) }
    .gif{
      width:180px; height:180px; object-fit:cover; border-radius:20px; margin:1rem auto; display:block;
      box-shadow:0 5px 15px rgba(0,0,0,.1);
    }
    .question{ font-size:1.1rem; font-weight:600; margin:1.2rem 0; line-height:1.4 }
    .options{ display:flex; flex-direction:column; gap:10px; align-items:center }
    .options button{ width:100%; max-width:320px; border-radius:14px; font-size:1rem; padding:10px }
    .hidden{ display:none !important }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  </style>

  <link rel="preload" href="./assets/logofemflowterracota.png" as="image" />

  <script>window.FEMFLOW_DISABLE_UI = true;</script>
  <script defer src="femflow-core.js"></script>
</head>

<body>

  <img src="./assets/logofemflowterracota.png"
       alt="FemFlow" style="width:120px;margin-top:10px;">

  <!-- 🔥 MULTILINGUAL TITLE -->
  <h1 id="tituloAnamnese">Anamnese Deluxe</h1>
  <button id="btnLang">🌐 Idioma</button>

  <!-- Etapa 1 -->
  <div id="cadastro" class="card">
    <p id="cadHint" class="hint">🌸 Preencha seus dados para começar:</p>

    <form id="formCadastro" onsubmit="return false" novalidate>
      <input id="nome" placeholder="Nome completo" required>
      <div id="eNome" class="err"></div>

      <input id="email" type="email" placeholder="E-mail" required>
      <div id="eEmail" class="err"></div>

      <input id="telefone" type="tel" placeholder="Telefone (opcional)">
      <div id="eTel" class="err"></div>

      <input id="senha" type="password" placeholder="Crie uma senha (mín. 6)" required>
      <div id="eSenha" class="err"></div>

      <input id="confirma" type="password" placeholder="Confirme a senha" required>
      <div id="eConf" class="err"></div>

      <button type="button" id="btnIniciar" disabled>Iniciar Anamnese</button>
    </form>
  </div>

  <!-- Etapa 2 -->
  <div id="quiz" class="card hidden">
    <img id="gif" src="./assets/gifs/profile_form.webp" class="gif" alt="gif ilustrativo">
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
  </div>

  <!-- Etapa 3 -->
  <div id="final" class="card hidden">
    <img src="./assets/gifs/success_flow.webp" class="gif" alt="Sucesso">
    <p id="final-msg" class="final-msg">✨ Análise concluída! Calculando seu perfil...</p>
  </div>

  <!-- SISTEMA MULTILÍNGUE PARA A ETAPA 1 -->
  <script>
    const Tcad = {
      pt: {
        titulo: "Anamnese Deluxe",
        hint: "🌸 Preencha seus dados para começar:",
        nome: "Nome completo",
        email: "E-mail",
        telefone: "Telefone (opcional)",
        senha: "Crie uma senha (mín. 6)",
        confirma: "Confirme a senha",
        iniciar: "Iniciar Anamnese",
        idioma: "🌐 Idioma"
      },
      en: {
        titulo: "Deluxe Assessment",
        hint: "🌸 Fill your details to begin:",
        nome: "Full name",
        email: "Email",
        telefone: "Phone (optional)",
        senha: "Create password (min. 6)",
        confirma: "Confirm password",
        iniciar: "Start Assessment",
        idioma: "🌐 Language"
      },
      fr: {
        titulo: "Anamnèse Deluxe",
        hint: "🌸 Remplis tes informations pour commencer :",
        nome: "Nom complet",
        email: "E-mail",
        telefone: "Téléphone (optionnel)",
        senha: "Créer un mot de passe (min. 6)",
        confirma: "Confirmer le mot de passe",
        iniciar: "Commencer l’anamnèse",
        idioma: "🌐 Langue"
      }
    };

    function aplicarIdiomaCadastro() {
      const lang = FEMFLOW.lang || "pt";
      const T = Tcad[lang];

      document.getElementById("tituloAnamnese").textContent = T.titulo;
      document.getElementById("btnLang").textContent = T.idioma;
      document.getElementById("cadHint").textContent = T.hint;

      document.getElementById("nome").placeholder = T.nome;
      document.getElementById("email").placeholder = T.email;
      document.getElementById("telefone").placeholder = T.telefone;
      document.getElementById("senha").placeholder = T.senha;
      document.getElementById("confirma").placeholder = T.confirma;

      document.getElementById("btnIniciar").textContent = T.iniciar;
    }

    document.addEventListener("femflow:langReady", aplicarIdiomaCadastro);
    document.addEventListener("femflow:langChange", aplicarIdiomaCadastro);
    
    document.getElementById("btnLang").onclick = () => {
      document.getElementById("ff-lang-modal")?.classList.remove("hidden");
    };
  </script>

  <!-- Validação + Início do fluxo -->
 <script>
(function(){

  const $ = (s) => document.querySelector(s);

  const nome=$("#nome"), email=$("#email"), tel=$("#telefone"),
        senha=$("#senha"), conf=$("#confirma"), btn=$("#btnIniciar");

  const eNome=$("#eNome"), eEmail=$("#eEmail"),
        eSenha=$("#eSenha"), eConf=$("#eConf");

  /* ============================================================
     SCRIPT_URL — seguro mesmo se FEMFLOW não estiver carregado
  ============================================================ */
  const SCRIPT_URL =
    (window.FEMFLOW && FEMFLOW.SCRIPT_URL) ||
    localStorage.getItem("femflow_script") ||
    "https://api-myflowlife.falling-wildflower-a8c0.workers.dev";

  const reEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function mark(input, elErr, ok, msg=""){
    input.setAttribute("aria-invalid", ok?"false":"true");
    elErr.textContent = ok ? "" : msg;
  }

  function validate(){
    const vNome = (nome.value||"").trim().length >= 2;
    const vEmail = reEmail.test((email.value||"").trim());
    const vSenha = (senha.value||"").trim().length >= 6;
    const vConf  = (conf.value||"").trim() === (senha.value||"").trim();

    mark(nome,  eNome,  vNome,  "Informe seu nome.");
    mark(email, eEmail, vEmail, "Digite um e-mail válido.");
    mark(senha, eSenha, vSenha, "Mínimo de 6 caracteres.");
    mark(conf,  eConf,  vConf,  "As senhas não coincidem.");

    btn.disabled = !(vNome && vEmail && vSenha && vConf);
    return !btn.disabled;
  }

  ["input","blur"].forEach(evt => {
    [nome,email,tel,senha,conf].forEach(el => el.addEventListener(evt, validate));
  });

  async function leadParcial(nome,email,telefone){
    try{
      const qs=new URLSearchParams({
        action:"leadparcial", nome,email,telefone,
        origem:"Anamnese Deluxe FemFlow"
      }).toString();
      await fetch(SCRIPT_URL+"?"+qs);
    }catch(_){}
  }

  /* ============================================================
     BOTÃO INICIAR ANAMNESE — agora funciona
  ============================================================ */
  btn.addEventListener("click", async ()=>{
    if(!validate()) return;

    const nomeV = nome.value.trim();
    const emailV = email.value.trim();
    const telV = (tel.value||"").trim();

    localStorage.setItem("lead_nome", nomeV);
    localStorage.setItem("lead_email", emailV);
    if(telV) localStorage.setItem("lead_telefone", telV);

    leadParcial(nomeV,emailV,telV);

    FEMFLOW.toast?.("✨ Anamnese iniciada!");

    document.getElementById("cadastro").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    document.addEventListener("femflow:ready", () => {
      if (window.iniciarQuizFemFlow) iniciarQuizFemFlow();
    });

    FEMFLOW._leadCadastro = { nome:nomeV, email:emailV, telefone:telV||"" };
  });

})();
</script>


 <script src="js/anamnese_lang.js" defer></script>
<script src="js/anamnese.js" defer></script>


</body>
</html>
