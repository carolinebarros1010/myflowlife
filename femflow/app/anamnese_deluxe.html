<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FemFlow • Anamnese Deluxe</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cc6a5a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracota:#cc6a5a; --bege:#fff5ef; --verde:#335953; --texto:#5b4f49;
    }
    body{
      margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      background:linear-gradient(180deg,var(--bege) 0%,#fae6dc 100%); color:var(--texto);
      font-family:"Lato",sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;
    }
    h1{
      font-family:'Playfair Display',serif; color:var(--terracota); font-size:2rem; margin:1rem 0 .5rem; text-align:center;
    }
    .card{
      background:#fff; border-radius:24px; box-shadow:0 8px 20px rgba(0,0,0,.08);
      max-width:420px; width:90%; padding:26px 22px; margin-top:1.2rem; text-align:center; animation:fadeIn .5s ease;
    }
    .hint{ margin:.2rem 0 1rem; font-size:.95rem; color:#6a5f59 }
    input{
      width:78%; max-width:300px; padding:.85rem 1rem; margin:.4rem 0 1rem;
      border:1px solid #e6ddd8; border-radius:14px; font-size:.95rem; color:var(--texto); background:#fff; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    input:focus{ border-color:var(--terracota); box-shadow:0 0 0 3px rgba(204,106,90,.18) }
    input[aria-invalid="true"]{ border-color:#d9534f }
    .err{
      font-size:.9rem; color:#d9534f; min-height:1.1rem; margin:-.6rem 0 .6rem;
    }
    button{
      background:linear-gradient(135deg,var(--verde),var(--terracota)); color:#fff; border:none; border-radius:14px;
      padding:12px 18px; font-size:1rem; font-weight:600; width:78%; max-width:300px; margin-top:.2rem; cursor:pointer;
      transition:all .25s ease;
    }
    button[disabled]{ opacity:.6; cursor:not-allowed; }
    button:hover:not([disabled]){ transform:translateY(-2px) }
    .gif{
      width:180px; height:180px; object-fit:cover; border-radius:20px; margin:1rem auto; display:block; box-shadow:0 5px 15px rgba(0,0,0,.1);
    }
    .question{ font-size:1.1rem; font-weight:600; margin:1.2rem 0; line-height:1.4 }
    .options{ display:flex; flex-direction:column; gap:10px; align-items:center }
    .options button{ width:100%; max-width:320px; border-radius:14px; font-size:1rem; padding:10px }
    .hidden{ display:none !important }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  </style>

  <link rel="preload" href="./assets/logofemflowterracota.png" as="image" />

  <!-- Firebase (mantido para compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Desativa header automático do core -->
  <script>window.FEMFLOW_DISABLE_UI = true;</script>

  <!-- Core FemFlow -->
  <script defer src="./femflow-core.js"></script>
</head>

<body>
  <img src="./assets/logofemflowterracota.png" alt="FemFlow" style="width:120px;margin-top:10px;">
  <h1>Anamnese Deluxe</h1>

  <!-- Etapa 1 -->
  <div id="cadastro" class="card">
    <p class="hint">🌸 Preencha seus dados para começar:</p>

    <form id="formCadastro" onsubmit="return false" novalidate>
      <input id="nome" placeholder="Nome completo" required>
      <div id="eNome" class="err"></div>

      <input id="email" type="email" placeholder="E-mail" required>
      <div id="eEmail" class="err"></div>

      <input id="telefone" type="tel" placeholder="Telefone (opcional)">
      <div id="eTel" class="err"></div>

      <input id="senha" type="password" placeholder="Crie uma senha (mín. 6)" required>
      <div id="eSenha" class="err"></div>

      <input id="confirma" type="password" placeholder="Confirme a senha" required>
      <div id="eConf" class="err"></div>

      <button type="button" id="btnIniciar" disabled>Iniciar Anamnese</button>
    </form>
  </div>

  <!-- Etapa 2 -->
  <div id="quiz" class="card hidden">
    <img id="gif" src="./assets/gifs/profile_form.webp" class="gif" alt="gif ilustrativo">
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
  </div>

  <!-- Etapa 3 -->
  <div id="final" class="card hidden">
    <img src="./assets/gifs/success_flow.webp" class="gif" alt="Sucesso">
    <p id="final-msg" class="final-msg">✨ Análise concluída! Calculando seu perfil...</p>
  </div>

  <!-- Corrige botões mobile -->
  <script>
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b && !b.getAttribute("type")) b.setAttribute("type", "button");
    }, { capture: true, passive: true });
  </script>

  <!-- Validação + início do fluxo (sem depender do anamnese.js para a etapa 1) -->
  <script>
    (function(){
      const $ = (s)=>document.querySelector(s);

      const nome = $("#nome");
      const email = $("#email");
      const tel = $("#telefone");
      const senha = $("#senha");
      const conf = $("#confirma");
      const eNome = $("#eNome");
      const eEmail = $("#eEmail");
      const eSenha = $("#eSenha");
      const eConf = $("#eConf");
      const btn = $("#btnIniciar");

      // script do GAS
      const SCRIPT_URL = (window.FEMFLOW && FEMFLOW.SCRIPT_URL) || localStorage.getItem("femflow_script") ||
                         "https://api-myflowlife.falling-wildflower-a8c0.workers.dev";

      const reEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function mark(input, elErr, ok, msg=""){
        input.setAttribute("aria-invalid", ok ? "false" : "true");
        elErr.textContent = ok ? "" : msg;
      }

      function validate(){
        const vNome  = (nome.value||"").trim().length >= 2;
        const vEmail = reEmail.test((email.value||"").trim());
        const vSenha = (senha.value||"").trim().length >= 6;
        const vConf  = (conf.value||"").trim() === (senha.value||"").trim() && vSenha;

        mark(nome,  eNome,  vNome,  "Informe seu nome.");
        mark(email, eEmail, vEmail, "Digite um e-mail válido.");
        mark(senha, eSenha, vSenha, "Mínimo de 6 caracteres.");
        mark(conf,  eConf,  vConf,  "As senhas não coincidem.");

        btn.disabled = !(vNome && vEmail && vSenha && vConf);
        return !btn.disabled;
      }

      ["input","blur"].forEach(evt=>{
        [nome,email,tel,senha,conf].forEach(el=> el.addEventListener(evt, validate));
      });

      async function leadParcial(nome, email, telefone){
        try{
          await fetch(SCRIPT_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
              action:"leadParcial",
              nome, email, telefone,
              origem:"Anamnese Deluxe FemFlow"
            })
          });
        }catch(_){}
      }

      btn.addEventListener("click", async ()=>{
        if(!validate()) return;

        const nomeV = nome.value.trim();
        const emailV = email.value.trim();
        const telV = (tel.value||"").trim();

        // guarda lead local
        localStorage.setItem("lead_nome", nomeV);
        localStorage.setItem("lead_email", emailV);
        if(telV) localStorage.setItem("lead_telefone", telV);

        // dispara lead parcial (silencioso)
        leadParcial(nomeV, emailV, telV);

        // feedback
        if(window.FEMFLOW && FEMFLOW.toast){
          FEMFLOW.toast("✨ Anamnese iniciada!");
        }

        // avança para o quiz (anamnese.js assume a partir daqui)
        document.getElementById("cadastro").classList.add("hidden");
        document.getElementById("quiz").classList.remove("hidden");

        // opcional: expõe dados básicos para o anamnese.js (se quiser usar)
        window.FEMFLOW = window.FEMFLOW || {};
        FEMFLOW._leadCadastro = { nome:nomeV, email:emailV, telefone:telV || "" };
      });
    })();
  </script>

  <!-- Script principal do quiz/perfil -->
  <script src="js/anamnese.js" defer></script>
</body>
</html>
