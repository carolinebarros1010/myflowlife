<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FemFlow • Anamnese Deluxe</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#cc6a5a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracota: #cc6a5a;
      --bege: #fff5ef;
      --verde: #335953;
      --texto: #5b4f49;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bege) 0%, #fae6dc 100%);
      color: var(--texto);
      font-family: "Lato", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--terracota);
      font-size: 2rem;
      margin: 1rem 0 0.5rem;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,.1);
      max-width: 420px;
      width: 90%;
      padding: 24px 20px;
      margin-top: 1rem;
      text-align: center;
      transition: all .3s ease-in-out;
      animation: fadeIn 0.5s ease;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
    }

    button {
      background: var(--terracota);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--verde);
    }

    .gif {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin: 1rem auto;
      display: block;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .question {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1rem 0;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .options button {
      width: 100%;
      max-width: 320px;
      border-radius: 14px;
      font-size: 1rem;
      padding: 10px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .final-msg {
      font-size: 1.1rem;
      color: var(--verde);
      font-weight: bold;
      text-align: center;
      margin-top: 1rem;
      line-height: 1.5;
    }

    .success {
      color: var(--terracota);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <script>window.FEMFLOW_DISABLE_UI = true;</script>

  <img src="./assets/logofemflowterracota.png" alt="FemFlow" style="width:120px;margin-top:10px;">
  <h1>Anamnese Deluxe</h1>

  <!-- Etapa 1 -->
  <div id="cadastro" class="card">
    <p>🌸 Preencha seus dados para começar:</p>
    <input id="nome" placeholder="Nome completo" required>
    <input id="email" type="email" placeholder="E-mail" required>
    <input id="telefone" type="tel" placeholder="Telefone (opcional)">
    <input id="senha" type="password" placeholder="Crie uma senha" required>
    <input id="confirma" type="password" placeholder="Confirme a senha" required>
    <button type="button" id="btnIniciar">Iniciar Anamnese</button>
  </div>

  <!-- Etapa 2 -->
  <div id="quiz" class="card hidden">
    <img id="gif" src="./assets/gifs/profile_form.webp" class="gif" alt="gif">
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
  </div>

  <!-- Etapa 3 -->
  <div id="final" class="card hidden">
    <img src="./assets/gifs/success_flow.webp" class="gif" alt="Sucesso">
    <p id="final-msg" class="final-msg">
      ✨ Análise concluída! Calculando seu perfil...
    </p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Core -->
  <script src="./femflow-core.js" defer></script>

  <!-- Script da Anamnese -->
  <script src="js/anamnese.js" defer></script>
</body>
</html>
