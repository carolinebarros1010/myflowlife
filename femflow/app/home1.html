<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FemFlow • Home</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Fonte / Estilo base -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> <!-- mantém sua folha global, se existir -->

  <style>
    :root{
      --bege:#FBF6F0; --terracota:#CC6A5A; --pessego:#F4A386; --teal:#335953; --texto:#223;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bege);font-family:"Lato",sans-serif;color:var(--texto);}

    header{
      display:flex; align-items:center; gap:12px;
      padding:14px 16px; background:linear-gradient(90deg,var(--terracota),var(--pessego));
      color:#fff; border-radius:0 0 24px 24px; box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    header img{width:48px;height:48px}
    header .hi{line-height:1.25}
    header .hi h1{font:700 1.15rem "Playfair Display",serif; margin:0}
    header .hi p{margin:2px 0 0; opacity:.95}

    .container{max-width:720px;margin:0 auto;padding:18px}

    .card{
      background:#fff; border-radius:18px; margin:14px 0; padding:16px 18px;
      box-shadow:0 6px 18px rgba(0,0,0,.06); animation:fadeIn .5s ease;
    }
    .card h3{font-family:"Playfair Display",serif; color:var(--teal); margin:0 0 8px}

    /* Anel do ciclo */
    .ring{display:flex; align-items:center; gap:18px}
    .ring svg{width:120px;height:120px; transform:rotate(-90deg)}
    .ring .meta{flex:1}
    .ring .meta .fase{font-weight:800; color:var(--terracota)}
    .ring .meta .dia{opacity:.8}
    #arc{transition:stroke-dasharray 1.2s ease}

    /* Cartão treino */
    .treino .linha{display:flex;justify-content:space-between;align-items:center}
    .muted{opacity:.8}
    .btn{display:inline-block; border:none; border-radius:14px; padding:10px 16px; cursor:pointer; font-weight:700}
    .btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 12px rgba(51,89,83,.2)}
    .btn-ghost{background:#fff; color:var(--terracota); border:1px solid rgba(204,106,90,.35)}

    /* Atalhos */
    .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
    .shortcut{display:block; text-align:center; padding:14px 10px; border-radius:14px;
      background:#fff; color:var(--teal); text-decoration:none; font-weight:700;
      box-shadow:0 6px 14px rgba(0,0,0,.05)
    }
    .shortcut small{display:block; opacity:.7; font-weight:600}
    .shortcut:hover{transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.08); transition:.2s}

    /* PWA install */
    #installBar{position:fixed; left:50%; transform:translateX(-50%);
      bottom:14px; background:var(--teal); color:#fff; border:none; border-radius:12px;
      padding:10px 16px; font-weight:700; box-shadow:0 8px 18px rgba(0,0,0,.25); display:none; z-index:9999}

    @keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

    /* (Opcional) se o core ainda inserir "← Voltar", esconda no Home até ajustar o core */
    button[style*="top:15px"][style*="left:15px"]{display:none!important;}
  </style>
</head>
<body>

  <header>
    <img src="assets/logofemflowterracota.png" alt="FemFlow">
    <div class="hi">
      <h1 id="hiNome">Bem-vinda 🌸</h1>
      <p id="hiSub" class="muted">Seu ciclo, seu ritmo</p>
    </div>
  </header>

  <main class="container">
    <!-- Anel do ciclo -->
    <section class="card ring" aria-live="polite">
      <svg viewBox="0 0 140 140" role="img" aria-label="Progresso do ciclo">
        <circle cx="70" cy="70" r="52" fill="none" stroke="#f3e0d9" stroke-width="12"/>
        <circle id="arc" cx="70" cy="70" r="52" fill="none" stroke="#CC6A5A" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 327"/>
      </svg>
      <div class="meta">
        <div class="fase" id="lblFase">Fase: —</div>
        <div class="dia" id="lblDia">Dia —/—</div>
        <div class="muted" id="lblHint">Acompanhando seu ritmo hormonal.</div>
      </div>
    </section>

    <!-- Treino de hoje -->
    <section class="card treino">
      <div class="linha">
        <h3>Treino de hoje</h3>
        <span class="muted" id="lblNivel">—</span>
      </div>
      <p class="muted" id="lblResumo">Carregando...</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-primary" id="goTreinar">▶️ Treinar agora</button>
        <button class="btn btn-ghost" id="goRespirar">🌬️ Respirar 5 min</button>
      </div>
    </section>

    <!-- Atalhos -->
    <section class="grid" aria-label="Atalhos">
      <a class="shortcut" href="respiracao.html">Respiração <small>5 min</small></a>
      <a class="shortcut" href="evolucao.html">Evolução <small>PSE & cargas</small></a>
      <a class="shortcut" href="flowcenter.html">Flow Center <small>detalhado</small></a>
    </section>
  </main>

  <button id="installBar">📲 Instalar FemFlow</button>

  <!-- Núcleo FemFlow -->
  <script src="scripts/femflow-core.js"></script>

  <script>
  (function(){
    const $ = (s)=>document.querySelector(s);
    const circumference = 2 * Math.PI * 52;

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault(); deferredPrompt = e;
      const btn = document.getElementById('installBar');
      btn.style.display = 'inline-block';
      btn.onclick = async ()=>{
        btn.disabled = true;
        await deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        btn.textContent = outcome === 'accepted' ? '✅ Instalado!' : '⚠️ Cancelado';
        setTimeout(()=>btn.remove(), 2200);
      };
    });

    // CTA
    $('#goTreinar').onclick = ()=> location.href = 'treino.html';
    $('#goRespirar').onclick = ()=> location.href = 'respiracao.html';

    // Carrega dados
    document.addEventListener('DOMContentLoaded', init);

    async function init(){
      const id = localStorage.getItem('femflow_id');
      if(!id){
        // Sem ID → manda para captura/cadastro
        location.href = 'ciclo.html';
        return;
      }

      try{
        // Perfil (nome, ciclo_duracao etc.)
        const perf = await fetch(`${FEMFLOW.SCRIPT_URL}?action=validar&id=${encodeURIComponent(id)}`).then(r=>r.json());
        const nome = (perf?.nome||'').split(' ')[0]||'';
        if(nome) $('#hiNome').textContent = `Olá, ${nome} 🌿`;
        const cicloDur = Number(perf?.ciclo_duracao||28);

        // Treino do dia (fase, diaCiclo, nivel…)
        const td = await fetch(`${FEMFLOW.SCRIPT_URL}?action=treino&id=${encodeURIComponent(id)}`).then(r=>r.json());
        const fase = normalizarFase(td?.fase || 'folicular');
        const dia = Number(td?.diaCiclo || 1);
        const nivel = (td?.nivel||'—').toString().replace('_',' ');
        const usados = Number(td?.descansos_usados||0);
        const semana = Number(td?.descansos_semana||0);

        // UI: anel
        const progress = Math.max(0, Math.min(1, dia / cicloDur));
        const dash = (circumference * progress).toFixed(1);
        const arc = document.getElementById('arc');
        arc.setAttribute('stroke-dasharray', `${dash} ${circumference}`);

        // UI: textos
        document.getElementById('lblFase').textContent = `Fase: ${labelFase(fase)}`;
        document.getElementById('lblDia').textContent = `Dia ${dia}/${cicloDur}`;
        document.getElementById('lblHint').textContent = dicaFase(fase);
        document.getElementById('lblNivel').textContent = `Nível: ${nivel}`;
        document.getElementById('lblResumo').textContent =
          `Hoje é um dia ${td?.regras?.foco ? `com foco em ${td.regras.foco}` : 'do seu programa'} • Descansos usados nesta semana: ${usados}/${semana}`;

        // Ajuste de logo conforme seu core (opcional)
        FEMFLOW.carregarLogoContextual?.();

      }catch(err){
        console.error(err);
        FEMFLOW.toast?.("❌ Erro ao carregar seu Home. Tente novamente.", true);
      }
    }

    function normalizarFase(f){
      const s = (f||'').toString().toLowerCase();
      if(s.startsWith('ovu')) return 'ovulatoria';
      if(s.startsWith('fol')) return 'folicular';
      if(s.startsWith('lut')) return 'lutea';
      if(s.startsWith('men')) return 'menstrual';
      return 'folicular';
    }
    function labelFase(f){
      return {menstrual:'Menstrual', folicular:'Folicular', ovulatoria:'Ovulatória', lutea:'Lútea'}[f] || 'Folicular';
    }
    function dicaFase(f){
      const map = {
        menstrual:'Recuperação e introspecção',
        folicular:'Crescimento e energia crescente',
        ovulatoria:'Pico de fertilidade e confiança',
        lutea:'Regulação emocional e aterramento'
      };
      return map[f] || 'Acompanhando seu ritmo hormonal.';
    }
  })();
  </script>
</body>
</html>
