<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FemFlow • Home</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#335953"/>
  <style>
    :root{ --bege:#fff7f2; --terracota:#cc6a5a; --teal:#335953; --texto:#4d3f3a; }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#fffdfb 0%, #f3ece6 100%);
         color:var(--texto);font-family:"Lato",system-ui,Segoe UI,Arial,sans-serif}
    header{display:flex;justify-content:center;padding:16px 14px}
    .logo{height:56px}
    .wrap{max-width:1160px;margin:0 auto;padding:0 14px 22px}

    /* vídeo topo */
    .video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;
           box-shadow:0 10px 24px rgba(0,0,0,.12);background:#000}
    .video iframe,.video video{position:absolute;inset:0;width:100%;height:100%}

    /* título da vitrine */
    h1{font-size:1.25rem;color:var(--teal);margin:14px 2px 10px;font-weight:900}

    /* carrossel horizontal (scroll lateral) */
    .rail{
      display:flex; gap:12px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:2px 2px 10px; margin:0 -8px 8px; scroll-snap-type:x mandatory;
    }
    .rail::-webkit-scrollbar{display:none} /* mobile clean */
    .card{
      flex:0 0 220px; scroll-snap-align:start;
      background:#fff;border-radius:16px;overflow:hidden;border:1px solid rgba(204,106,90,.14);
      box-shadow:0 6px 16px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease
    }
    .card:active{transform:scale(.98)}
    .thumb{position:relative;height:140px;background:#fff;display:flex;align-items:center;justify-content:center}
    .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .ph{font-weight:900;font-size:28px;color:#fff;z-index:1}
    .badge{position:absolute;right:10px;top:10px;background:rgba(51,89,83,.92);color:#fff;border-radius:999px;
           padding:4px 10px;font-size:.8rem;font-weight:800}
    .info{padding:12px}
    .ttl{margin:0 0 6px;color:var(--teal);font-weight:900}
    .desc{margin:0;color:#94786f;font-size:.92rem;min-height:38px}

    /* CTA Flow Center */
    .cta{
      display:block;width:100%;max-width:480px;margin:16px auto 4px;padding:12px 16px;
      border:0;border-radius:14px;font-weight:900;letter-spacing:.2px;cursor:pointer;
      background:linear-gradient(135deg,var(--teal),var(--terracota));color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12)
    }
    footer{padding:16px 0 24px;text-align:center;color:#9a8077;font-size:.9rem}
  </style>
</head>
<body>
  <header><img class="logo" src="assets/logofemflowverde.png" alt="FemFlow"/></header>

  <main class="wrap">
    <!-- Vídeo -->
    <section class="video">
      <iframe src="https://www.youtube.com/embed/VIDEO_ID?rel=0"
              title="Boas-vindas FemFlow" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
    </section>

    <!-- Vitrine (scroll lateral) -->
    <h1>Programas de 30 dias</h1>
    <section class="rail" id="railProdutos"></section>

    <!-- CTAs lado a lado -->
    <div style="display:flex;gap:10px;justify-content:center;margin:16px 0 4px">
      <button id="btnFlow" class="cta" style="max-width:260px">Ir para o Flow Center</button>
      <button id="btnCad"  class="cta" style="max-width:260px;background:#fff;color:#335953;border:1px solid #e6d8d2">
        Cadastro
      </button>
    </div>
  </main>

  <footer>FemFlow • escolha seu foco e comece hoje</footer>
<!-- Firebase compat (antes do femflow-core.js) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="./femflow-core.js"></script>

<script>
async function syncEntitlement() {
  try {
    const email = localStorage.getItem('femflow_email') || '';
    const id    = localStorage.getItem('femflow_id') || '';
    if (!email && !id) return;
    if (!window.FEMFLOW?.SCRIPT_URL) return;

    // usa email; se não tiver, cai pro id
    const q = email ? `email=${encodeURIComponent(email)}` : `id=${encodeURIComponent(id)}`;
    const url = `${FEMFLOW.SCRIPT_URL}?action=status&${q}`;

    const r = await fetch(url);
    const j = await r.json();

    if (j?.id) localStorage.setItem('femflow_id', j.id);
    if (j?.program) localStorage.setItem('femflow_program', j.program);
    else localStorage.removeItem('femflow_program');

    if (j?.expiryISO) localStorage.setItem('femflow_program_expiry', j.expiryISO);
    else localStorage.removeItem('femflow_program_expiry');

    if (j?.cycle?.startDate) localStorage.setItem('femflow_startDate', j.cycle.startDate);
    if (j?.cycle?.length)    localStorage.setItem('femflow_cycleLength', j.cycle.length);
  } catch(e) {
    console.warn('syncEntitlement failed', e);
  }
}
</script>
<script>
// --- Checa direito ativo (programa válido) ---
function hasEntitlement() {
  const sku = localStorage.getItem('femflow_program');
  const exp = localStorage.getItem('femflow_program_expiry');
  if (!sku || !exp) return false;
  return new Date() <= new Date(exp);
}

// --- Sincroniza status com Apps Script (GET action=status) ---
async function syncEntitlement() {
  try {
    const email = localStorage.getItem('femflow_email') || '';
    if (!email || !window.FEMFLOW?.SCRIPT_URL) return;

    const url = `${FEMFLOW.SCRIPT_URL}?action=status&email=${encodeURIComponent(email)}`;
    const r = await fetch(url);
    const j = await r.json();

    // Atualiza localStorage com dados retornados
    if (j?.id) localStorage.setItem('femflow_id', j.id);
    if (j?.program) localStorage.setItem('femflow_program', j.program);
    else localStorage.removeItem('femflow_program');

    if (j?.expiryISO) localStorage.setItem('femflow_program_expiry', j.expiryISO);
    else localStorage.removeItem('femflow_program_expiry');

    if (j?.cycle?.startDate) localStorage.setItem('femflow_startDate', j.cycle.startDate);
    if (j?.cycle?.length)    localStorage.setItem('femflow_cycleLength', j.cycle.length);
  } catch (e) {
    console.warn('syncEntitlement failed', e);
  }
}
</script>
<script>
// ========= Catálogo / UI =========
const PRODUTOS = [
  { sku:'FF-30D-GLUTEOS',     titulo:'30 dias • Glúteos',            foco:'Glúteos',      img:null, color:'#d98f80', desc:'Ênfase em glúteo médio/máximo' },
  { sku:'FF-30D-QUADRICEPS',  titulo:'30 dias • Ênfase Quadríceps',  foco:'Pernas',       img:null, color:'#9fb7ac', desc:'Foco em extensão de joelhos' },
  { sku:'FF-30D-PEITORAL',    titulo:'30 dias • Ênfase Peitoral',    foco:'Peitoral',     img:null, color:'#c8a1a6', desc:'Empurrar, isometrias e controle' },
  { sku:'FF-30D-COSTAS',      titulo:'30 dias • Ênfase Costas',      foco:'Costas',       img:null, color:'#a0a6c8', desc:'Remadas, escápulas e postura' },
  { sku:'FF-30D-POSTERIORES', titulo:'30 dias • Posteriores',        foco:'Posteriores',  img:null, color:'#b08fb8', desc:'Hinge e cadeia posterior' },
  { sku:'FF-30D-PANTURRILHA', titulo:'30 dias • Panturrilhas',       foco:'Panturrilhas', img:null, color:'#bfa27d', desc:'Sóleo e gastrocnêmio' },
  { sku:'FF-30D-CORE',        titulo:'30 dias • Core',               foco:'Core',         img:null, color:'#86a9b8', desc:'Antiextensão e antirotação' },
  { sku:'FF-30D-MOBILIDADE',  titulo:'30 dias • Mobilidade',         foco:'Mobilidade',   img:null, color:'#a7b08f', desc:'Alongamento + liberação + flow' },
  { sku:'FF-30D-HIIT-LOW',    titulo:'30 dias • HIIT Baixo Impacto', foco:'Cardio',       img:null, color:'#e0a36b', desc:'Cardio gentil às articulações' }
];
const CHECKOUTS = { /* 'FF-30D-GLUTEOS':'ABCD1234' */ };
const rail = document.getElementById('railProdutos');

function cardHTML(p){
  const initials = p.titulo.replace('30 dias • ','').split(' ').map(s=>s[0]).join('').slice(0,3).toUpperCase();
  return `
    <article class="card" data-sku="${p.sku}">
      <div class="thumb" style="background:${p.color}">
        ${p.img ? `<img src="${p.img}" alt="${p.titulo}"/>` : `<div class="ph">${initials}</div>`}
        <span class="badge">${p.foco}</span>
      </div>
      <div class="info">
        <h3 class="ttl">${p.titulo}</h3>
        <p class="desc">${p.desc||''}</p>
      </div>
    </article>`;
}

function render(){
  rail.innerHTML = PRODUTOS.map(cardHTML).join('');
  rail.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=>onChoose(el.dataset.sku));
  });
}

function onChoose(sku){
  const id = localStorage.getItem('femflow_id');
  const payCode = CHECKOUTS[sku];
  if (payCode) { location.href = `https://pay.hotmart.com/${payCode}`; return; }
  if (!id) { location.href = `login.html?sku=${encodeURIComponent(sku)}`; return; }
  location.href = `flowcenter.html?sku=${encodeURIComponent(sku)}`;
}

(async () => {
  await syncEntitlement();   // 1) atualiza status
  render();                  // 2) renderiza vitrine

  // 3) CTAs
  document.getElementById('btnFlow').onclick = async () => {
    await syncEntitlement();
    if (hasEntitlement()) location.href = 'flowcenter.html';
    else {
      const id = localStorage.getItem('femflow_id');
      if (!id) location.href = 'login.html';
      else alert('Seu acesso terminou. Escolha um programa abaixo para continuar.');
    }
  };
  document.getElementById('btnCad').onclick  = () => location.href = 'login.html';

  // 4) Deep link ?id=...
  const p = new URLSearchParams(location.search);
  const got = p.get('id'); if (got) localStorage.setItem('femflow_id', got);
})();

// PWA (se usar)
if ('serviceWorker' in navigator) {
  addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
