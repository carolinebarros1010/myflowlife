<!--
  FemFlow • Home (estilo Netflix)
  - Paleta FemFlow + tipografia
  - Catálogo em carrossel horizontal com scroll-snap
  - Entrada por ID + roteamento inteligente (prontoParaTreinar)
-->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FemFlow • Bem-vinda</title>

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root{
        --bege:#FBF6F0; --pessego:#EFBDA6; --terracota:#CC6A5A; --teal:#335953;
        --texto:#223; --glass:rgba(255,255,255,.85);
      }
      *{box-sizing:border-box} html,body{height:100%}
      body{
        margin:0; font-family:"Lato",sans-serif; color:var(--texto);
        background:
          radial-gradient(1200px 800px at 20% -10%, #fff 0%, transparent 60%),
          radial-gradient(900px 700px at 110% 30%, rgba(239,189,166,.25) 0%, transparent 60%),
          linear-gradient(180deg, #fff 0%, #F7EEE8 100%);
        background-attachment: fixed;
      }
      .header{padding:22px 16px 10px; text-align:center;}
      .logo{width:140px; margin:0 auto 6px; display:block; filter: drop-shadow(0 4px 10px rgba(0,0,0,.08));}
      .tagline{margin:0; font-weight:700; color:var(--terracota); letter-spacing:.2px;}

      .video-wrap{max-width:860px; margin:18px auto 8px; padding:0 14px;}
      .glass{background:var(--glass); backdrop-filter: blur(10px); border-radius:18px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.08);}
      .video-wrap video{display:block; width:100%; height:auto}

      .section-title{font-family:"Playfair Display",serif; color:var(--teal); text-align:center; margin:22px 0 8px; font-size:1.6rem;}
      .row{margin:0 auto 22px; max-width:1100px; padding:0 10px;}
      .rail{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:10px 4px 16px; -webkit-overflow-scrolling:touch;}
      .rail::-webkit-scrollbar{height:8px} .rail::-webkit-scrollbar-thumb{background:#e3d2ca; border-radius:8px}
      .card{min-width:230px; scroll-snap-align:start; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.08); transition:transform .25s, box-shadow .25s;}
      .card:hover{transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.12);}
      .thumb{width:100%; aspect-ratio:16/9; object-fit:cover; display:block;}
      .card-body{padding:12px 12px 14px}
      .title{margin:2px 0 4px; font-weight:800; color:var(--teal)}
      .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
      .chip{font-size:.78rem; font-weight:700; color:#fff; background:var(--terracota); padding:4px 10px; border-radius:999px}
      .chip.alt{background:var(--teal)}
      .btn{width:100%; border:none; border-radius:12px; cursor:pointer; padding:10px 12px; font-weight:800; background:linear-gradient(135deg,var(--teal),var(--terracota)); color:#fff; transition:transform .2s, opacity .2s;}
      .btn:hover{transform:scale(1.03)}

      .id-wrap{max-width:640px; margin:18px auto; padding:0 14px;}
      .id-card{display:grid; gap:10px; grid-template-columns:1fr auto; align-items:center; padding:14px; border-radius:16px; background:var(--glass); backdrop-filter:blur(10px); box-shadow:0 6px 16px rgba(0,0,0,.06);}
      .id-card input{width:100%; border:1px solid #e7d7cf; border-radius:12px; padding:12px; font-size:1rem; color:var(--teal); outline:none;}
      .id-card input:focus{box-shadow:0 0 0 3px rgba(204,106,90,.18)}
      .id-card button{white-space:nowrap}
      .cta{display:block; width:fit-content; margin:16px auto 26px; padding:12px 18px; border:none; border-radius:14px; cursor:pointer; font-weight:900; letter-spacing:.2px; background:linear-gradient(135deg,var(--teal),var(--terracota)); color:#fff; box-shadow:0 10px 22px rgba(204,106,90,.18); transition:transform .2s;}
      .cta:hover{transform:translateY(-2px)}

      @media (max-width:520px){
        .card{min-width:74%}
        .id-card{grid-template-columns:1fr}
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="assets/logofemflowverde.png" alt="FemFlow" class="logo" />
      <p class="tagline">Cuidar do corpo é viver o ciclo em harmonia 🌿</p>
    </header>

    <main>
      <!-- Vídeo de boas-vindas -->
      <section class="video-wrap">
        <div class="glass">
          <video poster="assets/capa_video.jpg" controls playsinline>
            <source src="assets/videos/boasvindas.webm" type="video/webm" />
            <source src="assets/videos/boasvindas.mp4" type="video/mp4" />
            Seu navegador não suporta o vídeo.
          </video>
        </div>
      </section>

      <!-- Catálogo estilo Netflix -->
      <h2 class="section-title">Escolha seu Plano FemFlow</h2>
      <section class="row">
        <div class="rail">
          <article class="card">
            <img class="thumb" src="assets/capas/30dias.jpg" alt="Plano 30 Dias — Série ABCD" />
            <div class="card-body">
              <h4 class="title">Plano 30 Dias — Série ABCD</h4>
              <div class="chips">
                <span class="chip">Ciclo • 4x/sem</span>
                <span class="chip alt">Força + Harmonia</span>
              </div>
              <button class="btn" onclick="abrirHotmart('https://pay.hotmart.com/Q102567067C?off=y4z291v3')">💳 Adquirir</button>
            </div>
          </article>

          <article class="card">
            <img class="thumb" src="assets/capas/40dias.jpg" alt="Plano 40 Dias — Série ABCD-EFG" />
            <div class="card-body">
              <h4 class="title">Plano 40 Dias — Série ABCD-EFG</h4>
              <div class="chips">
                <span class="chip">Ciclo • 5-7x/sem</span>
                <span class="chip alt">Potência</span>
              </div>
              <button class="btn" onclick="abrirHotmart('https://pay.hotmart.com/Q203456078X')">💳 Adquirir</button>
            </div>
          </article>

          <article class="card">
            <img class="thumb" src="assets/capas/facajunto.jpg" alt="Faça junto com a gente" />
            <div class="card-body">
              <h4 class="title">Faça Junto com a Gente</h4>
              <div class="chips">
                <span class="chip">30 vídeos guiados</span>
                <span class="chip alt">Thalita 🌿</span>
              </div>
              <button class="btn" onclick="abrirHotmart('https://pay.hotmart.com/Q304567098P')">💳 Adquirir</button>
            </div>
          </article>
        </div>
      </section>

      <!-- Entrada por ID -->
      <section class="id-wrap">
        <div class="id-card">
          <input id="inputID" placeholder="Digite seu ID FemFlow (ex.: FF-YYMM-ABCD)" />
          <button class="btn" onclick="entrarComID()">Entrar</button>
        </div>
      </section>

      <!-- CTA principal -->
      <button class="cta" id="continuarBtn">✨ Continuar para o FemFlow</button>
    </main>

    <script>
      function abrirHotmart(url){ window.open(url,'_blank'); }

      function entrarComID(){
        const id = document.getElementById('inputID').value.trim();
        if(!id){ alert('Por favor, insira seu ID.'); return; }
        localStorage.setItem('femflow_id', id);
        // Usa o mesmo fluxo inteligente após setar o ID
        prontoParaTreinar();
      }

      // 👉 Função solicitada
      function prontoParaTreinar(){
        const id = localStorage.getItem('femflow_id');
        if(!id){ location.href='cadastro.html'; return; }

        const cfg = localStorage.getItem('femflow_cycle_configured')==='yes';
        const hasStart = !!localStorage.getItem('femflow_startDate');
        const hasLen   = !!localStorage.getItem('femflow_cycleLength');

        location.href = (cfg && hasStart && hasLen) ? 'flowcenter.html' : 'ciclo.html';
      }

      // CTA principal
      document.getElementById('continuarBtn')?.addEventListener('click', prontoParaTreinar);

      // Deep link Hotmart (?id=FF-...)
      const p = new URLSearchParams(location.search);
      if(p.get('id')){
        localStorage.setItem('femflow_id', p.get('id'));
        prontoParaTreinar();
      }
    </script>

    <!-- (Opcional) Core do FemFlow -->
    <script src="scripts/femflow-core.js"></script>
  </body>
</html>
