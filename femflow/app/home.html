<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FemFlow • Home</title>
  <!-- Favicon FemFlow -->
<link rel="icon" type="image/x-icon" href="app/favicon.ico">
<link rel="shortcut icon" href="app/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="app/favicon.ico">
<meta name="msapplication-TileImage" content="app/favicon.ico">

<!-- Fallback absoluto -->
<link rel="icon" href="/femflow/app/favicon.ico">

  <link rel="manifest" href="manifest.json"/>

  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/home.css">

</head>

<body>

  <main class="wrap">

   <!-- Vídeo topo -->
<section class="video">
  <div class="video-wrapper">
    <iframe 
      src="https://www.youtube-nocookie.com/embed/DyX8F1ChSDw"
      title="FemFlow boas-vindas"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</section>



    <!-- ============================ -->
    <!--        FILEIRA 1            -->
    <!--  ÊNFASES MUSCULARES         -->
    <!-- ============================ -->
    <h1>Ênfases Musculares</h1>
    <section class="rail" id="railMuscular"></section>


    <!-- ============================ -->
    <!--        FILEIRA 2            -->
    <!--        ESPORTES             -->
    <!-- ============================ -->
    <h1>Esportes</h1>
    <section class="rail" id="railEsportes"></section>


    <!-- ============================ -->
    <!--        FILEIRA 3            -->
    <!--       TREINOS EM CASA        -->
    <!-- ============================ -->
    <h1>Treinos em Casa</h1>
    <section class="rail" id="railCasa"></section>


    <!-- CTAs -->
    <button id="btnFlow" class="cta">Ir para o Flow Center</button>
    <button id="btnCad"  class="cta" style="background:#fff;color:#335953;border:1px solid #e6d8d2">
      Cadastro
    </button>

  </main>

  <footer>FemFlow • escolha seu foco e comece hoje</footer>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Core -->
  <script> window.FEMFLOW_DISABLE_UI = true; </script>
  <script src="./femflow-core.js"></script>


<script>
/* ==========================================================
   LISTAS DAS 3 FILEIRAS
========================================================== */

const LISTA_MUSCULAR = [
  { titulo:"Glúteo", enfase:"gluteo", color:"#d98f80", desc:"Foco total no glúteo" },
  { titulo:"Costas", enfase:"costas", color:"#a6b8c8", desc:"Remadas e postura" },
  { titulo:"Peito", enfase:"peito", color:"#e6a09b", desc:"Força de empurrar" },
  { titulo:"Braço", enfase:"braco", color:"#d38b6e", desc:"Bíceps + tríceps" },
  { titulo:"Posterior", enfase:"posterior", color:"#b58fb5", desc:"Cadeia posterior" },
  { titulo:"Quadríceps", enfase:"quadriceps", color:"#9fb7ac", desc:"Pernas fortes" }
];

const LISTA_ESPORTES = [
  { titulo:"Corrida", enfase:"corrida", color:"#b8a59c", desc:"Base aeróbica" },
  { titulo:"Natação", enfase:"natacao", color:"#80a8b3", desc:"Propulsão aquática" },
  { titulo:"Remo", enfase:"remo", color:"#7f9d94", desc:"Tração e core" },
  { titulo:"Bike", enfase:"bike", color:"#9cc2c1", desc:"Cardio leve/moderado" },
  { titulo:"Beach", enfase:"beach", color:"#e3a689", desc:"Areia, agilidade e potência" }
];

const LISTA_CASA = [
  { titulo:"Em Casa", enfase:"casa", color:"#d1a697", desc:"Sem equipamentos" },
  { titulo:"Casa Glúteo", enfase:"casa_gluteo", color:"#dc9d8c", desc:"Glúteos em casa" },
  { titulo:"Casa Core", enfase:"casa_core", color:"#cababa", desc:"Abdômen e lombar" },
  { titulo:"Casa Elástico", enfase:"casa_elastico", color:"#d8c4b0", desc:"Treino com elástico" },
  { titulo:"Casa Halter", enfase:"casa_halter", color:"#c6b4a4", desc:"Halter em casa" }
];


/* ==========================================================
   MONTAGEM DOS CARDS
========================================================== */

function cardHTML(p){
  return `
    <article class="card" data-enfase="${p.enfase}">
      <div class="thumb" style="background:${p.color}">
        <span class="badge">${p.titulo}</span>
      </div>
      <div class="info">
        <h3 class="ttl">${p.titulo}</h3>
        <p class="desc">${p.desc||''}</p>
      </div>
    </article>`;
}


/* ==========================================================
   RENDERIZAÇÃO
========================================================== */

function renderRail(el, lista){
  el.innerHTML = lista.map(cardHTML).join("");
  el.querySelectorAll(".card").forEach(c=>{
    c.onclick = () => onChoose(c.dataset.enfase);
  });
}


/* ==========================================================
   FUNÇÃO PRINCIPAL — onChoose
========================================================== */

async function onChoose(enfase){
  const id = localStorage.getItem("femflow_id");

  // LocalStorage
  localStorage.setItem("femflow_enfase", enfase);

  // Backend
  if (id) {
    try {
      await fetch(FEMFLOW.SCRIPT_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          action:"setenfase",
          id,
          enfase
        })
      });
    } catch(e){
      console.warn("Falha ao enviar ênfase ao backend:", e);
    }
  }

  // Checa ciclo
  const cicloOK =
    localStorage.getItem("femflow_cycle_configured")==="yes" &&
    localStorage.getItem("femflow_startDate") &&
    localStorage.getItem("femflow_cycleLength");

  if (!cicloOK){
    FEMFLOW.toast("🌿 Configure seu ciclo primeiro");
    location.href="ciclo.html";
  } else {
    location.href="flowcenter.html";
  }
}


/* ==========================================================
   INIT
========================================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

  renderRail(document.getElementById("railMuscular"), LISTA_MUSCULAR);
  renderRail(document.getElementById("railEsportes"),  LISTA_ESPORTES);
  renderRail(document.getElementById("railCasa"),      LISTA_CASA);

  document.getElementById("btnFlow").onclick = ()=>location.href="flowcenter.html";
  document.getElementById("btnCad").onclick  = ()=>location.href="index.html";
});
// === 🌺 INSTALAÇÃO / DOWNLOAD DO APP ===
let deferredPrompt = null;

// Captura segura
const btnInstall = document.getElementById("btnInstall");

// Links das lojas
const PLAY_URL = "https://play.google.com/store/apps/details?id=com.myflowlife.femflow";
const APPLE_URL = "https://apps.apple.com/app/id0000000000"; // << substitua quando tiver o ID real

// Detecta plataforma
function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// Banner de instalação PWA detectado
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  if (btnInstall) btnInstall.style.display = "inline-block";
});

// Clique do botão
if (btnInstall) {
  btnInstall.addEventListener("click", async () => {
    // 📱 iOS → App Store
    if (isIOS()) {
      window.location.href = APPLE_URL;
      return;
    }

    // 🤖 Android → Play Store
    if (isAndroid()) {
      window.location.href = PLAY_URL;
      return;
    }

    // 💻 Desktop/PWA → fluxo normal de instalação
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`📲 Resultado da instalação: ${outcome}`);
      deferredPrompt = null;
      btnInstall.style.display = "none";
    } else {
      // fallback (se não houver deferredPrompt)
      window.location.href = PLAY_URL;
    }
  });
}

// Após instalar PWA
window.addEventListener("appinstalled", () => {
  console.log("✅ FemFlow instalado como PWA!");
  if (btnInstall) btnInstall.style.display = "none";
});

</script>
</body>
</html>
