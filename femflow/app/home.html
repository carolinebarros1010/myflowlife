<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FemFlow • Home</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>

  <!-- CSS Base -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/home.css">

</head>

<body>

  <main class="wrap">

    <!-- VÍDEO TOPO -->
    <section class="video">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube-nocookie.com/embed/DyX8F1ChSDw"
          title="FemFlow boas-vindas"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <!-- FILEIRA 1 -->
    <h1>Ênfases Musculares</h1>
    <section class="rail" id="railMuscular"></section>

    <!-- FILEIRA 2 -->
    <h1>Esportes</h1>
    <section class="rail" id="railEsportes"></section>

    <!-- FILEIRA 3 -->
    <h1>Treinos em Casa</h1>
    <section class="rail" id="railCasa"></section>

    <!-- FILEIRA 4 — TREINO PERSONAL (só aparece para quem tem o produto) -->
    <h1 id="tituloPersonal" style="display:none;">Treino Personal</h1>
    <section class="rail" id="railPersonal" style="display:none;"></section>

    <!-- CTAs -->
    <button id="btnFlow" class="cta">Ir para o Flow Center</button>
    <button id="btnCad"  class="cta" style="background:#fff;color:#335953;border:1px solid #e6d8d2">
      Cadastro
    </button>

  </main>

  <footer>FemFlow • escolha seu foco e comece hoje</footer>

  <!-- CORE -->
  <script src="femflow-core.js"></script>

<script>
/* ============================================================
   LISTAS DAS FILEIRAS
=========================================================== */

const LISTA_MUSCULAR = [
  { titulo:"Glúteo", enfase:"gluteo", color:"#d98f80", desc:"Foco total no glúteo" },
  { titulo:"Costas", enfase:"costas", color:"#a6b8c8", desc:"Remadas e postura" },
  { titulo:"Peito", enfase:"peito", color:"#e6a09b", desc:"Força de empurrar" },
  { titulo:"Braço", enfase:"braco", color:"#d38b6e", desc:"Bíceps + tríceps" },
  { titulo:"Posterior", enfase:"posterior", color:"#b58fb5", desc:"Cadeia posterior" },
  { titulo:"Quadríceps", enfase:"quadriceps", color:"#9fb7ac", desc:"Pernas fortes" }
];

const LISTA_ESPORTES = [
  { titulo:"Corrida", enfase:"corrida", color:"#b8a59c", desc:"Base aeróbica" },
  { titulo:"Natação", enfase:"natacao", color:"#80a8b3", desc:"Propulsão aquática" },
  { titulo:"Remo", enfase:"remo", color:"#7f9d94", desc:"Tração e core" },
  { titulo:"Bike", enfase:"bike", color:"#9cc2c1", desc:"Cardio leve/moderado" },
  { titulo:"Beach", enfase:"beach", color:"#e3a689", desc:"Areia e potência" }
];

const LISTA_CASA = [
  { titulo:"Em Casa", enfase:"casa", color:"#d1a697", desc:"Sem equipamentos" },
  { titulo:"Casa Glúteo", enfase:"casa_gluteo", color:"#dc9d8c", desc:"Glúteos em casa" },
  { titulo:"Casa Core", enfase:"casa_core", color:"#cababa", desc:"Abdômen e lombar" },
  { titulo:"Casa Elástico", enfase:"casa_elastico", color:"#d8c4b0", desc:"Elástico" },
  { titulo:"Casa Halter", enfase:"casa_halter", color:"#c6b4a4", desc:"Halter em casa" }
];

/* ============================================================
   LISTA PERSONAL — visível somente para produto=treino_personal
=========================================================== */
const LISTA_PERSONAL = [
  { 
    titulo:"Treino Personal",
    enfase:"personal",
    color:"#335953",
    desc:"Seu treino exclusivo criado pelo coach"
  }
];


/* ============================================================
   RENDERIZAÇÃO DE CARDS
=========================================================== */
function cardHTML(p){
  return `
    <article class="card" data-enfase="${p.enfase}">
      <div class="thumb" style="background:${p.color}">
        <span class="badge">${p.titulo}</span>
      </div>
      <div class="info">
        <h3 class="ttl">${p.titulo}</h3>
        <p class="desc">${p.desc||''}</p>
      </div>
    </article>`;
}

function renderRail(el, lista){
  el.innerHTML = lista.map(cardHTML).join("");

  el.querySelectorAll(".card").forEach(c=>{
    c.onclick = () => {

      const enfase = c.dataset.enfase;

      // 🔥 Caso especial: treino personal
      if (enfase === "personal") {
        location.href = "treino.html?personal=1";
        return;
      }

      selecionarEnfase(enfase);
    };
  });
}


/* ============================================================
   SALVAR ÊNFASE (CORE)
=========================================================== */
async function selecionarEnfase(enfase){

  console.log("🎯 selecionarEnfase() → clicou na ênfase:", enfase);

  const id = localStorage.getItem("femflow_id");
  console.log("🆔 femflow_id:", id);

  localStorage.setItem("femflow_enfase", enfase);

  if (id) {
    try {
      const resp = await fetch(FEMFLOW.SCRIPT_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          action:"setenfase",
          id,
          enfase
        })
      });

      const raw = await resp.text();
      console.log("📦 RESPOSTA RAW setenfase:", raw);
      try { console.log("🔍 JSON:", JSON.parse(raw)); } catch(e){}

    } catch(e){
      console.warn("❌ Falha ao enviar ênfase:", e);
    }
  }

  FEMFLOW.router("flowcenter");
}


/* ============================================================
   ATIVAR OU OCULTAR CARD PERSONAL
=========================================================== */
function ativarCardPersonal() {
  const produto = localStorage.getItem("femflow_produto");
  const ativa   = localStorage.getItem("femflow_ativa");

  if (produto === "treino_personal" && ativa === "true") {

    document.getElementById("tituloPersonal").style.display = "block";

    const rail = document.getElementById("railPersonal");
    rail.style.display = "block";

    renderRail(rail, LISTA_PERSONAL);
  }
}


/* ============================================================
   INIT HOME
=========================================================== */
document.addEventListener("DOMContentLoaded", ()=>{

  renderRail(document.getElementById("railMuscular"), LISTA_MUSCULAR);
  renderRail(document.getElementById("railEsportes"),  LISTA_ESPORTES);
  renderRail(document.getElementById("railCasa"),      LISTA_CASA);

  document.getElementById("btnFlow").onclick = () => FEMFLOW.router("flowcenter");
  document.getElementById("btnCad").onclick  = () => FEMFLOW.router("index");

  // 🔥 ativa o card personal caso a aluna tenha esse produto
  ativarCardPersonal();
});

</script>

</body>
</html>
