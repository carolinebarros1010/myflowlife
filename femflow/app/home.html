<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FemFlow • Home</title>
  <style>
    :root {
      --terracota:#CC6A5A; --pessego:#F4A386; --teal:#335953; --bege:#FBF6F0;
    }
    body {
      margin: 0;
      font-family: "Lato", sans-serif;
      background: linear-gradient(180deg,#F4E1D7 0%,#EFBDA6 100%);
      color: var(--teal);
    }
    header {
      display:flex; justify-content:space-between; align-items:center;
      padding:1rem 1.5rem; background:rgba(255,255,255,0.8); backdrop-filter:blur(10px);
      box-shadow:0 4px 10px rgba(0,0,0,.08);
    }
    header img {height:48px;}
    header button {
      background:linear-gradient(135deg,var(--teal),var(--terracota));
      color:#fff; border:none; border-radius:12px; padding:0.6rem 1rem; cursor:pointer; font-weight:bold;
    }
    header button:hover {transform:scale(1.05);}
    .welcome {text-align:center; margin-top:1.2rem;}
    .welcome h2{color:var(--terracota); font-family:"Playfair Display",serif;}
    .welcome p{font-size:1rem; opacity:.9;}
    .video-container{width:100%;max-width:800px;margin:1.5rem auto;border-radius:20px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.15);}
    video{width:100%;display:block;}
    .catalog{padding:1rem 1.5rem;}
    .catalog h3{color:var(--teal);font-family:"Playfair Display",serif;}
    .scroll-container{display:flex;overflow-x:auto;gap:1rem;scroll-behavior:smooth;}
    .item{flex:0 0 220px;background:white;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.1);overflow:hidden;cursor:pointer;transition:.3s;}
    .item:hover{transform:scale(1.05);}
    .item img{width:100%;height:140px;object-fit:cover;}
    .info{text-align:center;padding:.8rem;}
    .info h4{margin:0;font-size:1rem;color:var(--terracota);font-family:"Playfair Display",serif;}
    .info p{margin:.4rem 0 0;font-size:.85rem;color:#666;}
    .cta{margin:2rem auto;text-align:center;}
    .cta button{
      background:linear-gradient(135deg,var(--teal),var(--terracota));
      color:#fff;border:none;border-radius:14px;padding:0.9rem 1.4rem;font-weight:bold;font-size:1rem;
      cursor:pointer;transition:.3s;
    }
    .cta button:hover{transform:scale(1.05);}
    footer{text-align:center;padding:1rem;font-size:.8rem;opacity:.6;}
  </style>
</head>

<body>
  <header>
    <img src="../assets/logofemflowterracota.png" alt="FemFlow logo">
    <button id="logoutBtn" style="display:none;">Sair</button>
  </header>

  <div class="welcome" id="welcomeBox">
    <h2 id="welcomeTitle">🌸 Bem-vinda ao FemFlow</h2>
    <p id="welcomeSub">Seu equilíbrio hormonal em movimento</p>
  </div>

  <div class="video-container">
    <video autoplay muted controls poster="../assets/capas/boasvindas.jpg">
      <source src="../assets/videos/boasvindas.mp4" type="video/mp4" />
      Seu navegador não suporta vídeo.
    </video>
  </div>

  <div class="catalog">
    <h3>💖 Explore nossos programas</h3>
    <div class="scroll-container" id="catalogScroll"></div>
  </div>

  <div class="cta" id="ctaArea">
    <button onclick="irParaCadastro()">Cadastre-se agora</button>
    <button onclick="irParaLogin()" style="margin-left:10px;">Já tenho conta</button>
  </div>

  <footer>
    FemFlow • MyFlowLife © 2025 — Todos os direitos reservados.
  </footer>

  <script src="scripts/femflow-core.js"></script>
  <script>
    async function initHome() {
      const id = localStorage.getItem("femflow_id");
      const catalog = document.getElementById("catalogScroll");
      renderCatalog(catalog);

      // 🔹 Sem login → modo público
      if (!id) {
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("welcomeTitle").textContent = "🌸 Bem-vinda ao FemFlow";
        document.getElementById("welcomeSub").textContent = "Explore nossos programas e descubra seu fluxo natural";
        return;
      }

      // 🔹 Com login → modo aluna
      try {
        const res = await fetch(`${FEMFLOW.SCRIPT_URL}?action=validar&id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.status === "ok") {
          document.getElementById("logoutBtn").style.display = "inline-block";
          document.getElementById("ctaArea").style.display = "none";
          document.getElementById("welcomeTitle").textContent = `🌸 Bem-vinda de volta, ${data.nome || "aluna"}`;
          document.getElementById("welcomeSub").textContent = `Nível: ${data.nivel || "iniciante"} • Fase: ${data.fase || "folicular"}`;
          
          // Adiciona botão “Acessar meu ciclo”
          const btn = document.createElement("button");
          btn.textContent = "Acessar meu ciclo";
          btn.onclick = () => window.location.href = "flowcenter.html";
          document.getElementById("ctaArea").appendChild(btn);
        } else {
          localStorage.removeItem("femflow_id");
        }
      } catch (e) {
        console.error("Erro ao carregar perfil:", e);
      }
    }

    function renderCatalog(el) {
      const produtos = [
        {titulo:"FemFlow 30 por 15",desc:"Treinos cíclicos por 30 dias",img:"../assets/capas/femflow30.jpg",link:"https://pay.hotmart.com/XXXX"},
        {titulo:"RespiraFlow",desc:"Protocolos de respiração e foco",img:"../assets/capas/respiraflow.jpg",link:"https://pay.hotmart.com/YYYY"},
        {titulo:"MyFlowLife Pro",desc:"Acesso completo e plano personalizado",img:"../assets/capas/myflowlifepro.jpg",link:"https://pay.hotmart.com/ZZZZ"}
      ];
      el.innerHTML = produtos.map(p=>`
        <div class="item" onclick="window.open('${p.link}','_blank')">
          <img src="${p.img}" alt="${p.titulo}" />
          <div class="info">
            <h4>${p.titulo}</h4>
            <p>${p.desc}</p>
          </div>
        </div>`).join("");
    }

    function irParaLogin(){window.location.href="login.html";}
    function irParaCadastro(){window.location.href="anamnese.html";}
    function logout(){localStorage.removeItem("femflow_id");window.location.href="home.html";}

    initHome();
  </script>
</body>
</html>
