<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FemFlow • Home</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg,#F4E1D7 0%,#EFBDA6 100%);
      font-family: "Lato", sans-serif;
      color: #335953;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
    }
    .logo { width: 100px; }
    .tagline { font-size: 1rem; color: #335953; }
    video { width: 100%; border-radius: 16px; margin-top: 10px; }
    .section-title {
      font-family: "Playfair Display", serif;
      color: #CC6A5A; font-size: 1.2rem;
      margin: 16px 0 8px 16px;
    }
    .catalogo-container {
      display: flex; gap: 12px; overflow-x: auto;
      padding: 0 16px 16px;
      scroll-snap-type: x mandatory;
    }
    .plano-card {
      background: #fff;
      border-radius: 14px;
      min-width: 180px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      scroll-snap-align: start;
      text-align: center;
      padding-bottom: 10px;
    }
    .plano-card img {
      width: 100%;
      height: 120px;
      border-radius: 14px 14px 0 0;
      object-fit: cover;
    }
    .plano-card h4 { margin: 8px 0 4px; font-size: 0.95rem; color: #335953; }
    .plano-card p { margin: 0; font-size: 0.85rem; color: #666; }
    .plano-card button {
      margin-top: 8px;
      background: linear-gradient(135deg,#335953,#CC6A5A);
      color: #fff;
      border: none; border-radius: 12px;
      padding: 8px 12px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <img src="../assets/logofemflowterracota.png" class="logo" alt="FemFlow">
    <div>
      <div class="tagline">Carregando perfil...</div>
      <small id="licencaStatus"></small>
    </div>
  </header>

  <video autoplay muted playsinline controls poster="../assets/videos/cover_welcome.jpg">
    <source src="../assets/videos/boasvindas.mp4" type="video/mp4">
    Seu navegador não suporta vídeo.
  </video>

  <h2 class="section-title">Meus Programas</h2>
  <div id="meusProgramas" class="catalogo-container"></div>

  <h2 class="section-title">Catálogo FemFlow</h2>
  <div id="catalogo" class="catalogo-container"></div>

  <script src="scripts/femflow-core.js"></script>
  <script>
  async function initHome(){
    const id = FEMFLOW.read("femflow_id");
    if(!id){ window.location.href="login.html"; return; }

    try {
      const perfil = await FEMFLOW.get({ action:"validar", id });
      if(perfil.status !== "ok"){
        FEMFLOW.toast("Conta não encontrada. Faça a anamnese.");
        localStorage.removeItem("femflow_id");
        window.location.href = "anamnese.html";
        return;
      }

      document.querySelector(".tagline").innerHTML =
        `🌸 Bem-vinda, <b>${perfil.nome}</b> — Fase <b>${perfil.fase}</b>`;
      document.getElementById("licencaStatus").textContent =
        perfil.licenca ? "Licença Ativa ✅" : "Sem licença 🔒";

      // Renderiza programa ativo se licenciado
      const progDiv = document.getElementById("meusProgramas");
      if(perfil.licenca){
        const card = document.createElement("div");
        card.className = "plano-card";
        card.innerHTML = `
          <img src="../assets/capas/${perfil.enfase||'geral'}.jpg" alt="Meu Programa">
          <h4>${perfil.nivel.toUpperCase()} • ${perfil.enfase||'Geral'}</h4>
          <p>Dia ${perfil.diaCiclo} do ciclo</p>
          <button onclick="window.location.href='${perfil.link_planilha}'">Abrir Programa</button>
        `;
        progDiv.appendChild(card);
      }

      // Renderiza catálogo padrão (Hotmart)
      const catDiv = document.getElementById("catalogo");
      const produtos = [
        { titulo:"30 Dias Glúteo", img:"../assets/capas/gluteo.jpg", hotmart:"https://pay.hotmart.com/XXXX1", preco:"R$129" },
        { titulo:"Transição 15", img:"../assets/capas/transicao15.jpg", hotmart:"https://pay.hotmart.com/XXXX2", preco:"R$79" },
        { titulo:"Performance Feminina", img:"../assets/capas/performance.jpg", hotmart:"https://pay.hotmart.com/XXXX3", preco:"R$149" }
      ];
      produtos.forEach(p=>{
        const c=document.createElement("div"); c.className="plano-card";
        c.innerHTML=`<img src="${p.img}" alt="${p.titulo}">
          <h4>${p.titulo}</h4><p>${p.preco}</p>
          <button onclick="window.open('${p.hotmart}','_blank')">Ver / Comprar</button>`;
        catDiv.appendChild(c);
      });

    } catch (err){
      console.error(err);
      FEMFLOW.toast("Erro ao carregar perfil. Verifique conexão.");
    }
  }

  initHome();
  </script>
</body>
</html>
