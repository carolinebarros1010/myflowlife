<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico de Treinos · MaleFlow</title>
  <link rel="stylesheet" href="assets/style-maleflow.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    th { background: #f3f7f6; }
    .page { max-width: 960px; margin: auto; }
    canvas { margin-top: 40px; }
  </style>
</head>
<body>
  <main class="page">
    <h1>📊 Histórico de Treinos</h1>
    <div id="historico"></div>
    <canvas id="graficoCargas" height="180"></canvas>
  </main>

  <script type="module">
    import { db } from './js/firebase.js';
    import { detectarUsuario } from './js/firebase.js';
    import { collection, getDocs, doc } from 'https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js';

    const pesosPorExercicio = {};

    async function carregarHistorico(uid) {
      const ciclosRef = collection(db, `usuarios/${uid}/ciclos`);
      const ciclosSnap = await getDocs(ciclosRef);
      const container = document.getElementById("historico");

      if (ciclosSnap.empty) {
        container.innerHTML = '<p>Nenhum treino registrado ainda.</p>';
        return;
      }

      for (const cicloDoc of ciclosSnap.docs) {
        const cicloId = cicloDoc.id;
        const diasRef = collection(db, `usuarios/${uid}/ciclos/${cicloId}/dias`);
        const diasSnap = await getDocs(diasRef);

        if (!diasSnap.empty) {
          const tabela = document.createElement('table');
          const cabecalho = document.createElement('thead');
          cabecalho.innerHTML = `<tr><th colspan="5">Ciclo: ${cicloId}</th></tr><tr><th>Dia</th><th>Exercício</th><th>Peso (kg)</th><th>Data</th><th>PSE</th></tr>`;
          tabela.appendChild(cabecalho);

          const corpo = document.createElement('tbody');

          for (const diaDoc of diasSnap.docs) {
            const diaId = diaDoc.id;
            const data = diaDoc.data();
            const pse = data?.pse?.valor || '-';

            Object.entries(data).forEach(([key, val]) => {
              if (key === "pse") return;
              const nome = val.nome || key;
              const peso = parseFloat(val.peso || 0);
              const dataStr = val?.registradoEm?.toDate?.().toLocaleDateString?.() || '-';
              const pseTexto = typeof pse === 'number' ? `${pse} (${interpretaPSE(pse)})` : pse;

              corpo.innerHTML += `<tr><td>${diaId}</td><td>${nome}</td><td>${peso}</td><td>${dataStr}</td><td>${pseTexto}</td></tr>`;

              if (!pesosPorExercicio[nome]) pesosPorExercicio[nome] = [];
              pesosPorExercicio[nome].push(peso);
            });
          }

          tabela.appendChild(corpo);
          container.appendChild(tabela);
        }
      }
      desenharGrafico();
    }

    function interpretaPSE(valor) {
      if (valor <= 4) return "leve";
      if (valor <= 7) return "moderado";
      return "intenso";
    }

    function desenharGrafico() {
      const ctx = document.getElementById('graficoCargas').getContext('2d');
      const datasets = Object.entries(pesosPorExercicio).map(([nome, pesos], i) => ({
        label: nome,
        data: pesos,
        fill: false,
        tension: 0.3,
        borderWidth: 2
      }));

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({length: Math.max(...Object.values(pesosPorExercicio).map(arr => arr.length))}, (_, i) => `#${i+1}`),
          datasets
        },
        options: {
          plugins: { legend: { position: 'top' } },
          responsive: true,
          scales: { y: { beginAtZero: true, title: { display: true, text: 'Peso (kg)' } } }
        }
      });
    }

    detectarUsuario(user => {
      if (user) {
        carregarHistorico(user.uid);
      } else {
        document.getElementById("historico").innerHTML = '<p>Você precisa estar logado para ver seu histórico.</p>';
      }
    });
  </script>
</body>
</html>
