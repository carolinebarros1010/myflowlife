<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro · MaleFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style-maleflow.css" />
  <style>
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      margin: 60px auto;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: #1d4d44;
    }
    label {
      display: block;
      margin-bottom: 0.8rem;
      font-weight: bold;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #bbb;
      border-radius: 8px;
    }
    button {
      background: #1d4d44;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #163c35;
    }
  </style>
</head>
<body>
  <div class="card" id="formPerfil" style="display:none">
    <h1>Cadastro Inicial · MaleFlow</h1>
    <label for="nome">Nome completo:</label>
    <input type="text" id="nome" placeholder="Ex: Ricardo Silva" />

    <label for="registro">ID de Registro:</label>
    <input type="text" id="registro" placeholder="Ex: MF-0925" />

    <label for="experiencia">Qual seu nível de experiência com treinos?</label>
    <select id="experiencia">
      <option value="iniciante">Sou iniciante</option>
      <option value="intermediario">Já treino há um tempo</option>
      <option value="avancado">Tenho prática avançada</option>
    </select>

    <label for="local">Onde você pretende treinar?</label>
    <select id="local">
      <option value="academia">Academia tradicional</option>
      <option value="casa">Casa com equipamentos</option>
      <option value="funcional">Espaço funcional</option>
    </select>

    <button onclick="salvarCadastro()">Salvar Cadastro</button>
  </div>

 <script type="module">
  import { db } from './js/firebase.js';
  import { doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js';
  import { detectarUsuario } from './js/firebase.js';

  const next = new URLSearchParams(window.location.search).get("next") || "index.html";

  async function salvarCadastro() {
    detectarUsuario(async user => {
      if (!user) {
        alert("Você precisa estar logado.");
        return;
      }

      const nome = document.getElementById("nome").value.trim();
      const registro = document.getElementById("registro").value.trim();
      const nivel = document.getElementById("experiencia").value;
      const local = document.getElementById("local").value;

      if (!nome || !registro) {
        alert("Preencha todos os campos.");
        return;
      }

      const ref = doc(db, `usuarios/${user.uid}`);
      await setDoc(ref, {
        nome,
        registro,
        nivel,               // necessário para redirecionamento
        esporteAtual: "jiujitsu", // padrão inicial
        local,
        atualizadoEm: new Date()
      }, { merge: true });

      alert("Cadastro salvo com sucesso!");
      window.location.href = next;
    });
  }

  window.salvarCadastro = salvarCadastro;

  detectarUsuario(async user => {
    if (!user) return;
    const ref = doc(db, `usuarios/${user.uid}`);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : null;
    if (data?.nome && data?.registro) {
      window.location.href = next;
    } else {
      document.getElementById('formPerfil').style.display = 'block';
    }
  });
</script>

</body>
</html>
